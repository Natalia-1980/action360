<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Налоговые базы РФ — тренажер карточек</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .card-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .side-arrow {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.8rem;
            font-weight: bold;
            color: #1e3c72;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
            user-select: none;
        }

        .side-arrow:active {
            background: #eef2ff;
            transform: scale(0.94);
        }

        .flashcard {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            flex: 1;
            transition: min-height 0.2s;
        }

        .card-inner {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Вторая карточка — максимально компактная, без лишних отступов */
        .compact {
            padding: 0.8rem 1rem;
        }
        .compact .deduct-block {
            margin-top: 0.2rem;
            padding-top: 0.2rem;
        }
        .compact .rate-pills {
            margin: 0.2rem 0;
        }
        .compact .income-desc {
            margin-bottom: 0.1rem;
            line-height: 1.3;
        }
        .compact .tabs {
            margin-bottom: 0.5rem;
        }
        .compact .subheader {
            margin-bottom: 0.4rem;
        }

        /* Первая и третья — текст по центру вертикально */
        .centered {
            justify-content: center;
        }
        .centered .tabs-content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .badge-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .tax-type {
            font-weight: 700;
            font-size: 1rem;
            color: #1e3c72;
        }

        .code-badge {
            background: #eef2ff;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #1e3c72;
        }

        .subheader {
            font-size: 0.7rem;
            color: #5b6e8c;
            margin-bottom: 0.6rem;
            padding-bottom: 0.2rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 0.4rem 0.9rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #5b6e8c;
            cursor: pointer;
        }

        .tab-btn.active {
            color: #1e3c72;
            background: #eef2ff;
            border-bottom: 2px solid #1e3c72;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .rate-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.5rem 0;
        }

        .rate-pill {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid #cbd5e1;
        }

        .income-desc {
            font-size: 0.75rem;
            color: #2c3e50;
            line-height: 1.4;
        }

        .deduct-block {
            margin-top: 0.5rem;
            padding-top: 0.3rem;
            border-top: 1px solid #edf2f7;
        }

        .deduct-badge {
            display: inline-block;
            font-size: 0.7rem;
            background: #e6f7ec;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: #2c6e2f;
            font-weight: 500;
            margin-right: 0.5rem;
        }

        .no-deduct {
            background: #ffe8e6;
            color: #b91c1c;
        }

        .deduct-text {
            font-size: 0.7rem;
            color: #2c3e50;
        }

        .counter {
            text-align: center;
            font-size: 0.75rem;
            background: rgba(255,255,240,0.8);
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            display: inline-block;
            margin: 0 auto 0.8rem;
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 0.45rem;
            margin: 0.5rem 0 0.2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #cbd5e1;
            border-radius: 10px;
        }

        .dot.active {
            background: #2a5298;
            width: 18px;
        }

        footer {
            text-align: center;
            font-size: 0.65rem;
            color: #7e8b9f;
            margin-top: 1rem;
        }

        @media (max-width: 550px) {
            .side-arrow {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
            .tab-btn {
                padding: 0.3rem 0.6rem;
                font-size: 0.65rem;
            }
            .compact {
                padding: 0.6rem 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="card-container">
    <div style="display: flex; justify-content: center;">
        <div class="counter" id="cardCounter">1 / 3</div>
    </div>

    <div class="card-row">
        <div class="side-arrow" id="prevArrow">←</div>
        <div class="flashcard" id="flashcard">
            <div class="card-inner" id="cardInner"></div>
        </div>
        <div class="side-arrow" id="nextArrow">→</div>
    </div>
    
    <div class="progress-dots" id="progressDots"></div>
    <footer>Налоговые базы РФ — тренажер</footer>
</div>

<script>
    const cardsData = [
        {
            title: "Первая и вторая шкала, частично прогрессивные",
            code: "п.6,6.1,6.2 ст.210",
            sub: "",
            layout: "centered",
            tabs: [
                {
                    name: "Инвестиционные доходы",
                    desc: "Дивиденды, продажа имущества, страхование",
                    rates: ["до 2,4 млн руб. → 13%", "свыше 2,4 млн руб. → 15%"],
                    deduct: "Некоторые виды вычетов, например имущественные вычеты по ст.220 НК"
                },
                {
                    name: "СВО, надбавки",
                    desc: "Выплаты участникам СВО, северные надбавки, районные коэффициенты",
                    rates: ["до 5 млн руб. → 13%", "свыше 5 млн руб. → 15%"],
                    deduct: "Вычетов нет, но остаток вычета с основной базы можно перенести"
                }
            ]
        },
        {
            title: "Третья шкала, 5-уровневая прогрессивная",
            code: "",
            sub: "сумма баз из п.2.1 ст.210 НК",
            layout: "compact",
            tabs: [
                {
                    name: "Основная база",
                    desc: "Зарплата, отпускные, больничные, ГПХ",
                    rates: ["до 2,4 млн→13%", "2,4–5 млн→15%", "5–20 млн→18%", "20–50 млн→20%", "свыше 50 млн→22%"],
                    deduct: "Стандартные, социальные, имущественные вычеты по ст.218-220 НК"
                },
                {
                    name: "Другие доходы",
                    desc: "Выигрыши в азартных играх и лотереях, КИК, криптовалюта",
                    rates: ["до 2,4 млн→13%", "2,4–5 млн→15%", "5–20 млн→18%", "20–50 млн→20%", "свыше 50 млн→22%"],
                    deduct: "Вычеты по ст.218-220 НК не предоставляются"
                }
            ]
        },
        {
            title: "Базы с плоскими ставками",
            code: "",
            sub: "доходы по ставкам из п.2,5,6 ст.224 НК",
            layout: "centered",
            tabs: [
                {
                    name: "Ставка 35%",
                    desc: "35% с суммы свыше 4 тыс. руб.",
                    rates: [],
                    customIncome: "Выигрыши и призы в конкурсах, играх (сверх лимита), матвыгода, плата за средства пайщиков",
                    deduct: "Вычеты по ст.218-220 НК не применяются"
                },
                {
                    name: "Ставка 9%",
                    desc: "9%",
                    rates: [],
                    customIncome: "Проценты по облигациям с ипотечным покрытием",
                    deduct: "Вычеты не предусмотрены"
                },
                {
                    name: "Ставка 30%",
                    desc: "30%",
                    rates: [],
                    customIncome: "Доходы по ценным бумагам на счетах депо",
                    deduct: "Вычеты по ст.218-220 НК не применяются"
                }
            ]
        }
    ];

    let currentCard = 0;
    let activeTab = 0;
    const totalCards = cardsData.length;

    const cardInner = document.getElementById('cardInner');
    const flashcardElement = document.getElementById('flashcard');
    const counterSpan = document.getElementById('cardCounter');
    const dotsContainer = document.getElementById('progressDots');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');

    // Измеряем высоту второй карточки (компактной)
    function getCompactCardHeight() {
        const compactCard = cardsData[1];
        const tempDiv = document.createElement('div');
        tempDiv.style.position = 'absolute';
        tempDiv.style.top = '-9999px';
        tempDiv.style.left = '-9999px';
        tempDiv.style.width = '500px';
        tempDiv.style.backgroundColor = 'white';
        tempDiv.style.borderRadius = '2rem';
        tempDiv.style.padding = '0.8rem 1rem';
        document.body.appendChild(tempDiv);
        
        // Строим компактную карточку
        let html = `
            <div class="badge-row">
                <span class="tax-type">${compactCard.title}</span>
                ${compactCard.code ? `<span class="code-badge">${compactCard.code}</span>` : ''}
            </div>
            ${compactCard.sub ? `<div class="subheader">${compactCard.sub}</div>` : ''}
            <div class="tabs">
                ${compactCard.tabs.map((_, i) => `<button class="tab-btn">tab</button>`).join('')}
            </div>
        `;
        // Берём самую высокую вкладку
        let maxHeight = 0;
        compactCard.tabs.forEach(tab => {
            let ratesHtml = '';
            if (tab.rates && tab.rates.length) {
                ratesHtml = `<div class="rate-pills">${tab.rates.map(r => `<span class="rate-pill">${r}</span>`).join('')}</div>`;
            }
            let customHtml = tab.customIncome ? `<div class="income-desc" style="margin-top:0.3rem">${tab.customIncome}</div>` : '';
            const tabHtml = html + `
                <div>
                    <div class="income-desc">${tab.desc}</div>
                    ${customHtml}
                    ${ratesHtml}
                    <div class="deduct-block">
                        <span class="deduct-badge">Вычеты</span>
                        <span class="deduct-text">${tab.deduct}</span>
                    </div>
                </div>
            `;
            tempDiv.innerHTML = tabHtml;
            const height = tempDiv.offsetHeight;
            if (height > maxHeight) maxHeight = height;
        });
        
        document.body.removeChild(tempDiv);
        return maxHeight;
    }

    const targetHeight = getCompactCardHeight();

    function renderCard(index) {
        const card = cardsData[index];
        if (!card) return;

        cardInner.className = `card-inner ${card.layout}`;
        
        let html = `
            <div class="badge-row">
                <span class="tax-type">${card.title}</span>
                ${card.code ? `<span class="code-badge">${card.code}</span>` : ''}
            </div>
            ${card.sub ? `<div class="subheader">${card.sub}</div>` : ''}
            <div class="tabs">
        `;
        
        card.tabs.forEach((tab, i) => {
            html += `<button class="tab-btn ${i === activeTab ? 'active' : ''}" data-tab="${i}">${tab.name}</button>`;
        });
        html += `</div><div class="tabs-content-wrapper">`;
        
        card.tabs.forEach((tab, i) => {
            let ratesHtml = '';
            if (tab.rates && tab.rates.length) {
                ratesHtml = `<div class="rate-pills">${tab.rates.map(r => `<span class="rate-pill">${r}</span>`).join('')}</div>`;
            }
            let customHtml = tab.customIncome ? `<div class="income-desc" style="margin-top:0.3rem">${tab.customIncome}</div>` : '';
            html += `
                <div class="tab-content ${i === activeTab ? 'active' : ''}">
                    <div class="income-desc">${tab.desc}</div>
                    ${customHtml}
                    ${ratesHtml}
                    <div class="deduct-block">
                        <span class="deduct-badge ${tab.deduct.includes('нет') || tab.deduct.includes('не применяются') || tab.deduct.includes('не предоставляются') ? 'no-deduct' : ''}">Вычеты</span>
                        <span class="deduct-text">${tab.deduct}</span>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        
        cardInner.innerHTML = html;
        
        // Устанавливаем единую высоту (как у второй карточки)
        if (targetHeight > 0) {
            flashcardElement.style.minHeight = targetHeight + 'px';
        }
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                activeTab = parseInt(btn.dataset.tab);
                renderCard(currentCard);
            });
        });
        
        counterSpan.innerText = `${index+1} / ${totalCards}`;
        updateDots(index);
    }

    function updateDots(active) {
        dotsContainer.innerHTML = cardsData.map((_, i) => `<div class="dot ${i === active ? 'active' : ''}"></div>`).join('');
    }

    prevArrow.addEventListener('click', () => {
        if (currentCard > 0) {
            currentCard--;
            activeTab = 0;
            renderCard(currentCard);
        }
    });
    
    nextArrow.addEventListener('click', () => {
        if (currentCard < totalCards - 1) {
            currentCard++;
            activeTab = 0;
            renderCard(currentCard);
        }
    });

    renderCard(0);
</script>
</body>
</html>
