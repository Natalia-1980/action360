<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Тренажер: что ищет ИАС КБ в отчетности</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #eef2f7;
            padding: 12px 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .trainer-card {
            max-width: 780px;
            width: 100%;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table-wrapper {
            padding: 0.8rem 0.8rem 0.4rem 0.8rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .trainer-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            min-width: 550px;
        }

        .trainer-table thead tr {
            background: #eef3fa;
            border-bottom: 2px solid #cbdde6;
        }

        .trainer-table th {
            text-align: left;
            padding: 0.7rem 0.6rem;
            font-weight: 700;
            color: #1f5575;
            font-size: 0.75rem;
        }

        .trainer-table td {
            padding: 0.7rem 0.6rem;
            border-bottom: 1px solid #e2edf2;
            vertical-align: middle;
            background-color: #ffffff;
        }

        .indicator-name {
            font-weight: 800;
            font-size: 0.85rem;
            color: #0d3f52;
            display: inline-block;
            background: #f0f6fc;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            margin-bottom: 4px;
        }

        .indicator-desc {
            font-size: 0.65rem;
            color: #5b7e92;
            line-height: 1.3;
            margin-top: 4px;
        }

        .risk-select, .signal-select {
            width: 100%;
            min-width: 130px;
            padding: 0.5rem 0.5rem;
            border-radius: 30px;
            border: 1.5px solid #cbdde6;
            background-color: white;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.7rem;
            color: #1e4a6b;
            cursor: pointer;
            transition: all 0.15s;
        }

        .risk-select:focus, .signal-select:focus {
            outline: none;
            border-color: #2c7cb6;
            box-shadow: 0 0 0 2px rgba(44,124,182,0.2);
        }

        .action-panel {
            padding: 0.7rem 0.8rem 1rem 0.8rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
            border-top: 1px solid #e0edf3;
            background: #fefefe;
        }

        .score-badge {
            background: #eef2f7;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.7rem;
            color: #1f6390;
            white-space: nowrap;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background: #f0f4f8;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: inherit;
            color: #1a4f6e;
            transition: 0.1s;
            border: 1px solid #cbdae3;
        }

        button.primary {
            background: #1f6e93;
            color: white;
            border: none;
        }

        button.primary:hover {
            background: #0e577a;
            transform: scale(0.96);
        }

        button:hover:not(.primary) {
            background: #e2eaf0;
        }

        .feedback-area {
            margin: 0.5rem 0.8rem 0.9rem 0.8rem;
            background: #f9fbfd;
            border-radius: 20px;
            padding: 0.7rem 0.9rem;
            font-size: 0.7rem;
            border-left: 4px solid #2c7cb6;
            transition: 0.1s;
        }

        .feedback-item {
            border-bottom: 1px solid #e2edf2;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .feedback-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        @media (max-width: 550px) {
            .trainer-table th, .trainer-table td {
                padding: 0.5rem 0.4rem;
            }
            .risk-select, .signal-select {
                min-width: 100px;
                font-size: 0.65rem;
                padding: 0.4rem 0.4rem;
            }
            .indicator-name {
                font-size: 0.75rem;
            }
            .btn-group button {
                padding: 0.35rem 0.8rem;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
<div class="trainer-card">
    <div class="table-wrapper">
        <table class="trainer-table" id="trainerTable">
            <thead>
                <tr>
                    <th>Показатель</th>
                    <th>Что ищет ИАС КБ</th>
                    <th>Риск</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- данные через js -->
            </tbody>
        </table>
    </div>

    <div class="action-panel">
        <div class="score-badge" id="scoreDisplay">0/5</div>
        <div class="btn-group">
            <button id="checkBtn" class="primary">Проверить</button>
            <button id="resetBtn">Сброс</button>
            <button id="sampleBtn">Эталон</button>
        </div>
    </div>
    <div class="feedback-area" id="feedbackMsg">
        Выберите что ищет ИАС КБ и риск для каждого показателя.
    </div>
</div>

<script>
    // Данные из скриншота (все "ё" заменены на "е")
    const indicators = [
        {
            id: 0,
            name: "Валюта баланса",
            description: "стр. 1150",
            correctSignal: "Резкий скачок активов без роста выручки (или наоборот)",
            correctRisk: "Скачок вверх — вывод денег через покупку ОС; скачок вниз — вывод активов перед банкротством"
        },
        {
            id: 1,
            name: "Дебиторская задолженность",
            description: "стр. 1230",
            correctSignal: "Просрочка более 12 месяцев",
            correctRisk: "Рост дебиторки — подмена реальной отгрузки «бумажным» долгом"
        },
        {
            id: 2,
            name: "Рентабельность",
            description: "падение ниже среднеотраслевого уровня",
            correctSignal: "Падение ниже среднеотраслевого уровня дохода",
            correctRisk: "Снижение издержек на зарплатах или выплатах"
        },
        {
            id: 3,
            name: "Незакрытые авансы",
            description: "авансы выданные без закрытия поставок",
            correctSignal: "Долги по авансам выданным без закрытия поставок",
            correctRisk: "Имитация предоплаты для создания «формального» движения денег и последующего вывода"
        },
        {
            id: 4,
            name: "Отчет о финрезультатах",
            description: "стр. 2110 с листом 2 декларации по прибыли",
            correctSignal: "Сравнение с декларацией по прибыли — стр. 2110 с листом 2",
            correctRisk: "Занижение выручки"
        }
    ];

    // Варианты для выпадающих списков (что ищет ИАС КБ)
    const signalOptions = [
        "Резкий скачок активов без роста выручки (или наоборот)",
        "Просрочка более 12 месяцев",
        "Падение ниже среднеотраслевого уровня дохода",
        "Долги по авансам выданным без закрытия поставок",
        "Сравнение с декларацией по прибыли — стр. 2110 с листом 2"
    ];

    // Варианты для рисков
    const riskOptions = [
        "Скачок вверх — вывод денег через покупку ОС; скачок вниз — вывод активов перед банкротством",
        "Рост дебиторки — подмена реальной отгрузки «бумажным» долгом",
        "Снижение издержек на зарплатах или выплатах",
        "Имитация предоплаты для создания «формального» движения денег и последующего вывода",
        "Занижение выручки"
    ];

    // Состояние выбранных значений
    let userSignals = ["", "", "", "", ""];
    let userRisks = ["", "", "", "", ""];

    function renderTable() {
        const tbody = document.getElementById("tableBody");
        if (!tbody) return;
        tbody.innerHTML = "";
        
        indicators.forEach((item, idx) => {
            const row = tbody.insertRow();
            
            // Ячейка с названием и описанием
            const cellName = row.insertCell(0);
            cellName.innerHTML = `
                <div class="indicator-name">${escapeHtml(item.name)}</div>
                <div class="indicator-desc">${escapeHtml(item.description)}</div>
            `;
            
            // Ячейка выбора "что ищет ИАС КБ"
            const cellSignal = row.insertCell(1);
            const selectSignal = document.createElement("select");
            selectSignal.className = "signal-select";
            selectSignal.setAttribute("data-idx", idx);
            
            const defaultSignal = document.createElement("option");
            defaultSignal.value = "";
            defaultSignal.textContent = "— выберите —";
            defaultSignal.disabled = true;
            defaultSignal.selected = (userSignals[idx] === "");
            selectSignal.appendChild(defaultSignal);
            
            signalOptions.forEach(opt => {
                const option = document.createElement("option");
                option.value = opt;
                option.textContent = opt;
                if (userSignals[idx] === opt) option.selected = true;
                selectSignal.appendChild(option);
            });
            
            selectSignal.addEventListener("change", (e) => {
                userSignals[idx] = e.target.value;
                updateScoreIndicator();
            });
            cellSignal.appendChild(selectSignal);
            
            // Ячейка выбора риска
            const cellRisk = row.insertCell(2);
            const selectRisk = document.createElement("select");
            selectRisk.className = "risk-select";
            selectRisk.setAttribute("data-idx", idx);
            
            const defaultRisk = document.createElement("option");
            defaultRisk.value = "";
            defaultRisk.textContent = "— выберите —";
            defaultRisk.disabled = true;
            defaultRisk.selected = (userRisks[idx] === "");
            selectRisk.appendChild(defaultRisk);
            
            riskOptions.forEach(opt => {
                const option = document.createElement("option");
                option.value = opt;
                option.textContent = opt;
                if (userRisks[idx] === opt) option.selected = true;
                selectRisk.appendChild(option);
            });
            
            selectRisk.addEventListener("change", (e) => {
                userRisks[idx] = e.target.value;
                updateScoreIndicator();
            });
            cellRisk.appendChild(selectRisk);
        });
        
        updateScoreIndicator();
    }
    
    function updateScoreIndicator() {
        let filledPairs = 0;
        for (let i = 0; i < indicators.length; i++) {
            if (userSignals[i] && userRisks[i]) filledPairs++;
        }
        const scoreSpan = document.getElementById("scoreDisplay");
        if (scoreSpan) {
            scoreSpan.innerHTML = `${filledPairs}/5`;
        }
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function checkAnswers() {
        let correctCount = 0;
        const details = [];
        
        for (let i = 0; i < indicators.length; i++) {
            const item = indicators[i];
            const selectedSignal = userSignals[i] || "";
            const selectedRisk = userRisks[i] || "";
            
            const isSignalCorrect = (selectedSignal === item.correctSignal);
            const isRiskCorrect = (selectedRisk === item.correctRisk);
            const isFullCorrect = (isSignalCorrect && isRiskCorrect);
            if (isFullCorrect) correctCount++;
            
            details.push({
                name: item.name,
                fullCorrect: isFullCorrect,
                correctSignal: item.correctSignal,
                correctRisk: item.correctRisk
            });
        }
        
        let feedbackHtml = `<div style="font-weight:700; margin-bottom:8px;">Результат: ${correctCount} из 5 верно</div>`;
        feedbackHtml += `<div style="display:flex; flex-direction:column; gap:8px; font-size:0.7rem;">`;
        details.forEach(d => {
            const mark = d.fullCorrect ? "✅" : "❌";
            feedbackHtml += `
                <div class="feedback-item">
                    <div><strong>${escapeHtml(d.name)}</strong> ${mark}</div>
                    <div>Что ищет ИАС КБ: ${escapeHtml(d.correctSignal)}</div>
                    <div>Риск: ${escapeHtml(d.correctRisk)}</div>
                </div>
            `;
        });
        feedbackHtml += `</div>`;
        
        const feedbackDiv = document.getElementById("feedbackMsg");
        if (feedbackDiv) {
            feedbackDiv.innerHTML = feedbackHtml;
            feedbackDiv.style.borderLeftColor = correctCount === 5 ? "#2b8c5e" : "#f3a261";
        }
        
        const scoreSpan = document.getElementById("scoreDisplay");
        if (scoreSpan) {
            scoreSpan.innerHTML = `${correctCount}/5`;
        }
    }
    
    function resetAll() {
        userSignals = ["", "", "", "", ""];
        userRisks = ["", "", "", "", ""];
        renderTable();
        const feedbackDiv = document.getElementById("feedbackMsg");
        if (feedbackDiv) {
            feedbackDiv.innerHTML = "Все поля сброшены. Выберите признак и риск для каждого показателя.";
            feedbackDiv.style.borderLeftColor = "#2c7cb6";
        }
        updateScoreIndicator();
        const scoreSpan = document.getElementById("scoreDisplay");
        if (scoreSpan) scoreSpan.innerHTML = "0/5";
    }
    
    function fillSample() {
        for (let i = 0; i < indicators.length; i++) {
            userSignals[i] = indicators[i].correctSignal;
            userRisks[i] = indicators[i].correctRisk;
        }
        renderTable();
        const feedbackDiv = document.getElementById("feedbackMsg");
        if (feedbackDiv) {
            feedbackDiv.innerHTML = "✅ Таблица заполнена верными ответами. Нажмите «Проверить» — будет 5/5.";
            feedbackDiv.style.borderLeftColor = "#48a86c";
        }
        updateScoreIndicator();
        const scoreSpan = document.getElementById("scoreDisplay");
        if (scoreSpan) scoreSpan.innerHTML = "5/5";
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        renderTable();
        
        const checkBtn = document.getElementById("checkBtn");
        const resetBtn = document.getElementById("resetBtn");
        const sampleBtn = document.getElementById("sampleBtn");
        
        if (checkBtn) checkBtn.addEventListener("click", checkAnswers);
        if (resetBtn) resetBtn.addEventListener("click", resetAll);
        if (sampleBtn) sampleBtn.addEventListener("click", fillSample);
    });
</script>
</body>
</html>
