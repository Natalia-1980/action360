<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налоговые периоды · визуализатор</title>
    <!-- Flatpickr для календаря -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            max-width: 650px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0,0,0,0.15);
            padding: 2rem 1.8rem;
            border: 1px solid #dee6f0;
        }

        /* Переключатель режимов */
        .mode-switch {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: #f0f5fc;
            border-radius: 60px;
            padding: 0.4rem;
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.7rem 0.5rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            color: #2a4d70;
            cursor: pointer;
            transition: 0.1s;
        }

        .mode-btn.active {
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #1a344c;
            font-weight: 600;
        }

        /* Блок с правилами для активной вкладки */
        .rules-panel {
            background: #f0f7fe;
            border-radius: 20px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #c7daf5;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .rules-title {
            font-weight: 600;
            color: #0d2f4e;
            margin-bottom: 0.5rem;
        }

        .rules-list {
            list-style: none;
            padding-left: 0;
        }
        .rules-list li {
            margin-bottom: 0.3rem;
            padding-left: 1.2rem;
            position: relative;
        }
        .rules-list li::before {
            content: "•";
            color: #2e7ab3;
            font-weight: bold;
            position: absolute;
            left: 0.2rem;
        }

        /* Календарный блок */
        .calendar-panel {
            background: #f9fcff;
            border-radius: 28px;
            padding: 1.5rem;
            border: 1px solid #d2e0f0;
            margin-bottom: 0.5rem;
        }

        .date-selector {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .date-label {
            font-weight: 500;
            color: #1e3b5c;
            min-width: 120px;
        }

        .date-input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 40px;
            font-size: 0.95rem;
            min-width: 150px;
            background: white;
        }

        .period-result {
            background: #e6f0fe;
            border-radius: 20px;
            padding: 1.2rem;
            margin: 1rem 0 0.5rem;
        }

        .period-title {
            font-weight: 600;
            color: #0a2942;
            margin-bottom: 0.5rem;
        }

        .period-dates {
            font-size: 1.2rem;
            font-weight: 400;
            color: #1d4b77;
        }

        .period-hint {
            font-size: 0.9rem;
            color: #4d688b;
            margin-top: 0.5rem;
            font-style: italic;
        }

        .rule-badge {
            display: inline-block;
            background: #2e7ab3;
            color: white;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }

        @media (max-width: 500px) {
            .card { padding: 1.2rem; }
            .date-selector { flex-direction: column; align-items: flex-start; }
            .date-input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Переключатель: регистрация / ликвидация -->
        <div class="mode-switch" id="modeSwitch">
            <button class="mode-btn active" data-mode="registration">🆕 Регистрация</button>
            <button class="mode-btn" data-mode="liquidation">⚰️ Ликвидация</button>
        </div>

        <!-- Динамический блок с правилами для текущего режима -->
        <div class="rules-panel" id="rulesPanel">
            <div class="rules-title">📌 Правила при регистрации</div>
            <ul class="rules-list">
                <li>если до конца квартала <strong>10 и более дней</strong> — первый период до конца этого квартала.</li>
                <li>если <strong>менее 10 дней</strong> — первый период до конца следующего квартала.</li>
            </ul>
        </div>

        <!-- Панель с календарем и результатом -->
        <div class="calendar-panel" id="calendarPanel">
            <div class="date-selector" id="dateSelector">
                <span class="date-label" id="dateLabel">Дата регистрации:</span>
                <input type="text" class="date-input" id="dateInput" placeholder="Выберите дату">
            </div>
            <div class="period-result" id="periodResult">
                <div class="period-title" id="periodTitle">Первый налоговый период</div>
                <div class="period-dates" id="periodDates">—</div>
                <div class="period-hint" id="periodHint"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            let currentMode = 'registration';
            const dateInput = document.getElementById('dateInput');
            const periodTitle = document.getElementById('periodTitle');
            const periodDates = document.getElementById('periodDates');
            const periodHint = document.getElementById('periodHint');
            const dateLabel = document.getElementById('dateLabel');
            const rulesPanel = document.getElementById('rulesPanel');
            const modeBtns = document.querySelectorAll('.mode-btn');

            // Инициализация flatpickr
            const fp = flatpickr(dateInput, {
                locale: 'ru',
                dateFormat: 'd.m.Y',
                defaultDate: '18.02.2026',
                allowInput: true,
                onChange: function(selectedDates, dateStr, instance) {
                    updatePeriod(dateStr, currentMode);
                }
            });

            // Функция обновления панели правил
            function updateRulesPanel(mode) {
                if (mode === 'registration') {
                    rulesPanel.innerHTML = `
                        <div class="rules-title">📌 Правила при регистрации</div>
                        <ul class="rules-list">
                            <li>если до конца квартала <strong>10 и более дней</strong> — первый период до конца этого квартала.</li>
                            <li>если <strong>менее 10 дней</strong> — первый период до конца следующего квартала.</li>
                        </ul>
                    `;
                } else {
                    rulesPanel.innerHTML = `
                        <div class="rules-title">📌 Правила при ликвидации</div>
                        <ul class="rules-list">
                            <li><strong>Последний период</strong> — с начала квартала до даты ликвидации.</li>
                        </ul>
                    `;
                }
            }

            // Переключение режима
            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMode = btn.dataset.mode;
                    
                    // Меняем подписи
                    if (currentMode === 'registration') {
                        dateLabel.textContent = 'Дата регистрации:';
                        periodTitle.textContent = 'Первый налоговый период';
                    } else {
                        dateLabel.textContent = 'Дата ликвидации (запись в ЕГРЮЛ):';
                        periodTitle.textContent = 'Последний налоговый период';
                    }
                    
                    // Обновляем панель правил
                    updateRulesPanel(currentMode);
                    
                    // Обновить результат с текущей датой
                    updatePeriod(dateInput.value, currentMode);
                });
            });

            // Вспомогательные функции
            function getQuarterEnd(date) {
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                if (month <= 3) return new Date(year, 2, 31);
                if (month <= 6) return new Date(year, 5, 30);
                if (month <= 9) return new Date(year, 8, 30);
                return new Date(year, 11, 31);
            }

            function getQuarterStart(date) {
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                if (month <= 3) return new Date(year, 0, 1);
                if (month <= 6) return new Date(year, 3, 1);
                if (month <= 9) return new Date(year, 6, 1);
                return new Date(year, 9, 1);
            }

            function formatDate(date) {
                const d = date.getDate().toString().padStart(2, '0');
                const m = (date.getMonth() + 1).toString().padStart(2, '0');
                return `${d}.${m}`;
            }

            function formatDateFull(date) {
                const d = date.getDate().toString().padStart(2, '0');
                const m = (date.getMonth() + 1).toString().padStart(2, '0');
                const y = date.getFullYear();
                return `${d}.${m}.${y}`;
            }

            function updatePeriod(dateStr, mode) {
                if (!dateStr) {
                    periodDates.textContent = '—';
                    periodHint.textContent = '';
                    return;
                }

                const parts = dateStr.split('.');
                if (parts.length !== 3) return;
                
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                const eventDate = new Date(year, month, day);
                
                if (isNaN(eventDate.getTime())) return;

                if (mode === 'registration') {
                    const quarterEnd = getQuarterEnd(eventDate);
                    // Разница в днях (округлённо)
                    const diffTime = quarterEnd - eventDate;
                    const daysToQuarterEnd = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    let startDate, endDate;
                    let rule = '';

                    // Проверяем, меньше ли 10 дней до конца квартала (включительно)
                    if (daysToQuarterEnd < 10) {
                        // Менее 10 дней до конца квартала
                        const nextQuarterEnd = getQuarterEnd(new Date(year, month + 3, day));
                        startDate = eventDate;
                        endDate = nextQuarterEnd;
                        rule = 'менее 10 дней до конца квартала → период до конца следующего квартала';
                    } else {
                        // 10 и более дней
                        startDate = eventDate;
                        endDate = quarterEnd;
                        rule = '10 и более дней до конца квартала → период до конца этого квартала';
                    }

                    periodDates.textContent = `${formatDate(startDate)} — ${formatDateFull(endDate)}`;
                    periodHint.innerHTML = `<span class="rule-badge">правило</span> ${rule}`;

                } else {
                    // Ликвидация
                    const quarterStart = getQuarterStart(eventDate);
                    periodDates.textContent = `${formatDateFull(quarterStart)} — ${formatDateFull(eventDate)}`;
                    periodHint.innerHTML = `<span class="rule-badge">правило</span> с начала квартала до даты ликвидации`;
                }
            }

            // Установить начальное состояние
            updatePeriod('18.02.2026', 'registration');
        })();
    </script>
</body>
</html>
