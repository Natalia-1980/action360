<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>НДФЛ: источники дохода</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .trainer-card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.2);
            padding: 1.2rem 1rem 1rem;
            border: 1px solid #d0dceb;
            height: auto;
            display: flex;
            flex-direction: column;
        }

        /* Заголовок тренажера */
        .main-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e3b5c;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: -0.3px;
            border-bottom: 3px solid #c7daf0;
            padding-bottom: 0.5rem;
        }

        .task-switcher {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #e6ecf5;
            padding-bottom: 0.3rem;
            flex-wrap: wrap;
        }
        .task-btn {
            flex: 1 1 auto;
            background: transparent;
            border: none;
            padding: 0.5rem 0.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #4f658d;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.1s;
            min-width: 110px;
        }
        .task-btn.active {
            background: #e1ecfe;
            color: #1e3b5c;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,40,80,0.1);
        }

        .carousel-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.5rem 0 0.8rem;
        }

        .card-wrapper {
            width: 100%;
            overflow: hidden;
        }

        .card-slide {
            display: flex;
            transition: transform 0.2s ease-in-out;
        }

        .card-item {
            flex: 0 0 100%;
            padding: 0 0rem;
            box-sizing: border-box;
        }

        .card-compact {
            background: #ffffff;
            border-radius: 28px;
            border: 2px solid #dbe6f2;
            padding: 1rem 1rem 0.8rem;
            box-shadow: 0 10px 16px -8px rgba(0,35,70,0.12);
            width: 100%;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b263e;
        }

        .card-scenario {
            background: #f5faff;
            border-radius: 20px;
            padding: 0.7rem 1rem;
            border-left: 5px solid #2e7ab3;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #04335b;
        }

        .question-text {
            font-weight: 600;
            color: #021c30;
            margin-bottom: 0.7rem;
            font-size: 0.9rem;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0.5rem 0 0.8rem;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f3f9ff;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            border: 2px solid transparent;
            transition: 0.1s;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .option:hover {
            background: #e3f0fd;
            border-color: #8fb7da;
        }
        .option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1e6eb5;
            margin: 0;
            flex-shrink: 0;
        }
        .option label {
            font-size: 0.85rem;
            color: #02243b;
            width: 100%;
            cursor: pointer;
        }

        .feedback-compact {
            background: #f2f8fd;
            border-radius: 18px;
            padding: 0.7rem 1rem;
            border: 1px solid #b9d3f0;
            margin: 0.5rem 0 0.2rem;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .feedback-compact.correct {
            background: #e2f3de;
            color: #176b2c;
            border-color: #5cb377;
        }
        .feedback-compact.incorrect {
            background: #ffeae5;
            color: #b13e3e;
            border-color: #e09b9b;
        }

        .check-mini {
            background: white;
            border: 2px solid #1a5d8f;
            border-radius: 60px;
            padding: 0.5rem 1.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a5d8f;
            cursor: pointer;
            box-shadow: 0 3px 0 #b0c6dd;
            transition: 0.1s;
            width: fit-content;
            margin: 0.5rem 0 0.2rem;
            align-self: flex-end;
        }
        .check-mini:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b0c6dd;
        }
        .check-mini:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .carousel-arrows {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            margin-bottom: 0.2rem;
        }
        .arrow-btn {
            background: white;
            border: 2px solid #2a5f8a;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #2a5f8a;
            cursor: pointer;
            box-shadow: 0 3px 0 #b3c9e0;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .arrow-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b3c9e0;
        }
        .arrow-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .counter {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1e3b5c;
            background: #e6f0fa;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
        }

        .reset-area {
            display: flex;
            justify-content: center;
            margin-top: 0.3rem;
        }
        .reset-link {
            background: transparent;
            border: none;
            color: #2a5f8a;
            font-size: 0.8rem;
            text-decoration: underline dotted;
            cursor: pointer;
            padding: 0.5rem;
        }

        .footnote {
            text-align: center;
            margin-top: 0.5rem;
            color: #4f658d;
            font-size: 0.7rem;
            border-top: 1px dashed #cbd6e4;
            padding-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="trainer-card" id="trainerContainer"></div>

    <script>
        (function() {
            // ----- 6 карточек на основе материала урока с измененными вариантами -----
            const cardsData = [
                // ТЕМА: Источник дохода (Российский/Иностранный)
                { tab: 'source', title: '🌍 Программист в Турции',
                  scenario: 'Программист Иван на удаленке работает на российский стартап. Трудовой договор подписан с российской компанией. Сам Иван находится в Турции и не выезжал в Россию.',
                  question: 'Как классифицируется доход Ивана?',
                  options: [
                      { text: 'Доход от источников в России', value: 'russian' },
                      { text: 'Доход от иностранных источников', value: 'foreign' },
                      { text: 'Источник выплаты определяет налоговая', value: 'tax_office' }
                  ],
                  correct: 'russian',
                  explanation: 'Верно: Если физлицо дистанционно трудится на российского работодателя по трудовому договору, доход считается российским.' },

                { tab: 'source', title: '👩‍💼 Директор в Лондоне',
                  scenario: 'Елена — член совета директоров российской компании. Она находится в Лондоне и получает вознаграждение через английский банк.',
                  question: 'Как классифицируется её доход?',
                  options: [
                      { text: 'Иностранный доход', value: 'foreign' },
                      { text: 'Российский доход', value: 'russian' },
                      { text: 'За классификацией дохода следует обратиться в Минфин', value: 'minfin' }
                  ],
                  correct: 'russian',
                  explanation: 'Верно: Если физлицо входит в совет директоров российской компании, доход всегда считается российским, даже если оно за границей.' },

                { tab: 'source', title: '⚽ Футболист в Испании',
                  scenario: 'Матвей играет за испанский футбольный клуб. Он живет в Испании, тренируется там и получает зарплату от клуба.',
                  question: 'Как классифицируется доход Матвея?',
                  options: [
                      { text: 'Российский доход, так как он гражданин России', value: 'russian' },
                      { text: 'Иностранный доход, поскольку трудится за границей', value: 'foreign' }
                  ],
                  correct: 'foreign',
                  explanation: 'Верно: Если человек физически трудится на территории другого государства, его доход считается иностранным.' },

                // ТЕМА: Освобождение от налога (родственники)
                { tab: 'family', title: '💍 Подарок от мужа',
                  scenario: 'Светлана получила от своего супруга в подарок дорогой автомобиль.',
                  question: 'Должна ли Светлана платить НДФЛ со стоимости подарка?',
                  options: [
                      { text: 'Да, это ее доход', value: 'pay' },
                      { text: 'Нет, подарки от супруга не облагаются', value: 'nopay' }
                  ],
                  correct: 'nopay',
                  explanation: 'Верно: Доход от операций с близкими родственниками (супругом) не облагается НДФЛ.' },

                { tab: 'family', title: '🏠 Аренда от брата',
                  scenario: 'Ольга сдает свою квартиру родному брату. Они заключили договор аренды, и брат ежемесячно перечисляет ей плату.',
                  question: 'Облагается ли этот доход НДФЛ?',
                  options: [
                      { text: 'Да, облагается', value: 'pay' },
                      { text: 'Нет, не облагается', value: 'nopay' },
                      { text: 'Определяет налоговая', value: 'tax_office' }
                  ],
                  correct: 'pay',
                  explanation: 'Верно: Правило про родственников не работает, если заключен гражданско-правовой договор (например, аренды).' },

                { tab: 'family', title: '🎨 Дизайн для мамы',
                  scenario: 'Мама наняла сына-дизайнера для разработки логотипа. Заключили договор ГПХ, мама заплатила ему гонорар.',
                  question: 'Нужно ли сыну платить налог с гонорара?',
                  options: [
                      { text: 'Нет, это же мама', value: 'nopay' },
                      { text: 'Да, так как есть договор', value: 'pay' }
                  ],
                  correct: 'pay',
                  explanation: 'Верно: Освобождение не распространяется на доходы по трудовым и гражданско-правовым договорам, даже с родственниками.' },
            ];

            // состояние карточек
            let cardState = cardsData.map(() => ({
                disabled: false,
                selectedOption: null,
                feedbackText: '',
                feedbackClass: ''
            }));

            let currentTab = 'source';          // активный таб (source или family)
            let currentIndex = 0;                // индекс внутри таба

            const container = document.getElementById('trainerContainer');

            // получить индексы карточек текущего таба
            function getFilteredIndices() {
                return cardsData
                    .map((c, idx) => ({ idx, tab: c.tab }))
                    .filter(item => item.tab === currentTab)
                    .map(item => item.idx);
            }

            function render() {
                const indices = getFilteredIndices();          // массив исходных индексов
                const total = indices.length;
                // корректировка currentIndex
                if (currentIndex >= total) currentIndex = total - 1;
                if (currentIndex < 0) currentIndex = 0;
                const currentRealIdx = indices[currentIndex];  // реальный индекс в cardsData

                container.innerHTML = `
                    <div class="main-title">НДФЛ: источники дохода</div>

                    <div class="task-switcher">
                        <button class="task-btn ${currentTab === 'source' ? 'active' : ''}" id="tabSourceBtn">Источник дохода</button>
                        <button class="task-btn ${currentTab === 'family' ? 'active' : ''}" id="tabFamilyBtn">Доходы в семье</button>
                    </div>

                    <!-- карусель: одна карточка -->
                    <div class="carousel-container">
                        <div class="card-wrapper">
                            <div class="card-slide" style="transform: translateX(0%);">
                                <div class="card-item" id="carouselCard"></div>
                            </div>
                        </div>
                    </div>

                    <div class="carousel-arrows">
                        <button class="arrow-btn" id="prevCard" ${total <= 1 || currentIndex === 0 ? 'disabled' : ''}>←</button>
                        <span class="counter">${currentIndex+1} / ${total}</span>
                        <button class="arrow-btn" id="nextCard" ${total <= 1 || currentIndex === total-1 ? 'disabled' : ''}>→</button>
                    </div>

                    <div class="reset-area">
                        <button class="reset-link" id="resetAll">🔄 сбросить все ответы</button>
                    </div>
                    <div class="footnote">С какого дохода платить НДФЛ · ст. 208 НК</div>
                `;

                // отрисовать карточку с индексом currentRealIdx
                renderSingleCard(currentRealIdx);

                // обработчики табов
                document.getElementById('tabSourceBtn').addEventListener('click', () => {
                    currentTab = 'source';
                    currentIndex = 0;
                    render();
                });
                document.getElementById('tabFamilyBtn').addEventListener('click', () => {
                    currentTab = 'family';
                    currentIndex = 0;
                    render();
                });

                // стрелки карусели
                document.getElementById('prevCard')?.addEventListener('click', () => {
                    if (currentIndex > 0) {
                        currentIndex--;
                        render();
                    }
                });
                document.getElementById('nextCard')?.addEventListener('click', () => {
                    if (currentIndex < total - 1) {
                        currentIndex++;
                        render();
                    }
                });

                document.getElementById('resetAll').addEventListener('click', () => {
                    cardState = cardsData.map(() => ({
                        disabled: false,
                        selectedOption: null,
                        feedbackText: '',
                        feedbackClass: ''
                    }));
                    render();
                });
            }

            function renderSingleCard(realIdx) {
                const card = cardsData[realIdx];
                const state = cardState[realIdx];
                const containerDiv = document.getElementById('carouselCard');
                if (!containerDiv) return;

                let html = `
                    <div class="card-compact">
                        <div class="card-header">
                            <div class="card-title">${card.title}</div>
                        </div>
                        <div class="card-scenario">${card.scenario}</div>
                        <div class="question-text">${card.question}</div>
                        <div class="options" id="options-${realIdx}"></div>
                        <button class="check-mini" id="check-${realIdx}" ${state.disabled ? 'disabled' : ''}>Проверить</button>
                `;

                if (state.feedbackText) {
                    html += `<div class="feedback-compact ${state.feedbackClass}">${state.feedbackText}</div>`;
                }
                html += `</div>`; // закрыть card-compact

                containerDiv.innerHTML = html;

                // генерация radio внутри options
                const optionsDiv = document.getElementById(`options-${realIdx}`);
                if (optionsDiv) {
                    card.options.forEach((opt, optIdx) => {
                        const optDiv = document.createElement('div');
                        optDiv.className = 'option';

                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = `card_${realIdx}`;
                        radio.value = opt.value;
                        radio.id = `card_${realIdx}_opt_${optIdx}`;
                        radio.disabled = state.disabled;
                        if (state.selectedOption === opt.value) {
                            radio.checked = true;
                        }

                        radio.addEventListener('change', () => {
                            cardState[realIdx].selectedOption = opt.value;
                        });

                        const label = document.createElement('label');
                        label.htmlFor = radio.id;
                        label.textContent = opt.text;

                        optDiv.appendChild(radio);
                        optDiv.appendChild(label);
                        optionsDiv.appendChild(optDiv);
                    });
                }

                const checkBtn = document.getElementById(`check-${realIdx}`);
                if (checkBtn) {
                    checkBtn.addEventListener('click', () => {
                        const selected = cardState[realIdx].selectedOption;
                        if (!selected) {
                            alert('Выберите вариант ответа');
                            return;
                        }

                        let feedbackText = '';
                        let feedbackClass = '';
                        if (selected === card.correct) {
                            feedbackText = '✅ ' + card.explanation;
                            feedbackClass = 'correct';
                            cardState[realIdx].disabled = true;
                        } else {
                            feedbackText = '❌ Неправильно. Попробуйте ещё раз.';
                            feedbackClass = 'incorrect';
                        }

                        cardState[realIdx].feedbackText = feedbackText;
                        cardState[realIdx].feedbackClass = feedbackClass;

                        // обновить карточку
                        renderSingleCard(realIdx);
                    });
                }
            }

            render();
        })();
    </script>
</body>
</html>
