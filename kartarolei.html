<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Перераспределите проверку между отделами</title>
<style>
:root{
  --ink:#17332f;--text:#1f2927;--muted:#65716f;--line:#d7dedb;--soft:#f3f6f4;--soft2:#eef3f0;
  --accent:#0f6559;--accent-dark:#0a5148;--coral:#c75b4a;--coral-bg:#fff4f1;--white:#fff;--shadow:rgba(20,45,40,.06)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding:8px}
button,input,select{font:inherit}
button{touch-action:manipulation}
.trainer{width:100%;max-width:650px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px var(--shadow)}
.head{padding:21px 24px 17px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.head-copy{min-width:0}.reset-top{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:6px 0;white-space:nowrap}.reset-top:hover{color:var(--coral);text-decoration:underline}.reset-top:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:5px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
h1{font-size:21px;line-height:1.2;margin:0;color:var(--ink)}
.progress{padding:14px 24px 0}
.progress-top{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.progress-track{height:5px;background:#e8edeb;border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .2s ease}
.screen{display:none;padding:20px 24px 24px}.screen.active{display:block}
.group-card{background:var(--soft);border-radius:14px;padding:15px 16px;margin-bottom:14px}
.group-kicker{font-size:12px;color:var(--muted);margin-bottom:4px}.group-title{font-size:19px;line-height:1.2;font-weight:700;color:var(--ink);margin:0 0 5px}.group-sub{font-size:13.5px;line-height:1.42;color:#46504e;margin:0}
.setup-list{display:grid;gap:8px}.setup-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:#fff}
.setup-input{width:100%;border:0;outline:none;color:var(--text);background:transparent;font-size:14px}.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px 6px;border-radius:8px}.icon-btn:hover{background:var(--soft);color:var(--coral)}
.add-row{display:none;grid-template-columns:1fr auto auto;gap:7px;margin-top:9px}.add-row.show{display:grid}.text-input,.select{width:100%;min-height:38px;border:1px solid #cfd8d4;border-radius:9px;background:#fff;padding:8px 9px;color:var(--text);outline:none}.text-input:focus,.select:focus{border-color:#8eb8ae;box-shadow:0 0 0 3px rgba(15,101,89,.08)}
.link-btn{border:0;background:none;color:var(--accent);padding:7px 0;cursor:pointer;font-weight:700;font-size:13px;text-align:left}.link-btn:hover{text-decoration:underline}
.top-actions{display:flex;justify-content:flex-end;margin:-3px 0 8px}.mini-link{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 0}.mini-link:hover{color:var(--accent);text-decoration:underline}
.notice{margin:0 0 12px;padding:9px 11px;background:#f8faf9;border-radius:10px;font-size:12.5px;line-height:1.38;color:var(--muted)}

.departments{border-top:0}
.dept-carousel{position:relative;margin-top:10px}
.dept-slide{display:none;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.dept-slide.active{display:block}
.dept-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 14px;background:#f8faf9;border-bottom:1px solid var(--line)}
.dept-card-label{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.dept-card-title{font-size:16px;line-height:1.25;font-weight:700;color:var(--ink)}
.dept-card-count{font-size:11.5px;line-height:1.35;color:var(--muted);text-align:right;white-space:nowrap;padding-top:2px}
.dept-card-body{padding:10px 14px 12px}
.dept-card-body .dept-note{margin-top:2px}
.carousel-controls{display:grid;grid-template-columns:minmax(94px,auto) 1fr minmax(104px,auto);align-items:center;gap:10px;margin-top:10px}
.carousel-dots{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.carousel-dot{width:8px;height:8px;border:0;border-radius:999px;background:#cbd6d2;padding:0;cursor:pointer;transition:.15s}
.carousel-dot.active{width:20px;background:var(--accent)}
.carousel-dot:focus-visible{outline:2px solid rgba(15,101,89,.3);outline-offset:2px}
.carousel-prev{justify-self:start}
.carousel-done{justify-self:end}
.carousel-special .dept-card-head{background:#fbfcfb}
.carousel-special.unassigned-slide{border-style:dashed}
.carousel-special.excluded-slide{border-style:dashed}
.carousel-helper{font-size:11.5px;line-height:1.4;color:var(--muted);margin:0 0 7px}
@media(max-width:520px){.carousel-controls{grid-template-columns:auto 1fr auto;gap:7px}.carousel-controls .btn{min-width:0;padding-left:10px;padding-right:10px}.dept-card-head{padding:11px 12px}.dept-card-body{padding:9px 12px 11px}.dept-card-count{font-size:10.5px}}

details.dept{border-bottom:1px solid var(--line)}details.dept summary{list-style:none;cursor:pointer;padding:12px 2px;display:flex;align-items:center;gap:10px;user-select:none}details.dept summary::-webkit-details-marker{display:none}
.chev{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--soft2);color:var(--accent);font-size:13px;flex:0 0 auto;transition:transform .2s ease}details[open]>.dept-summary .chev{transform:rotate(90deg)}
.dept-name{font-size:14.5px;font-weight:700;color:var(--ink);min-width:0;flex:1}.dept-count{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dept-body{padding:0 0 10px 30px}.dept-note{font-size:12.5px;line-height:1.4;color:var(--muted);margin:0 0 8px}.inherited{font-size:12px;line-height:1.35;color:#596461;background:#f8faf9;border-radius:9px;padding:8px 9px;margin:0 0 9px}
.task-section{margin:8px 0 10px}.section-head{padding:0 0 6px;border-bottom:1px solid #dfe6e3}.section-title{font-size:12px;font-weight:700;color:var(--accent);line-height:1.3}.section-count{font-size:11px;font-weight:400;color:var(--muted);margin-left:5px}.section-tasks{padding:0}.task{padding:8px 0;border-bottom:1px solid #e8ecea}.task:last-child{border-bottom:0}.task-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.task-block{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--soft2);border-radius:999px;padding:4px 7px;margin-bottom:6px}.task-title{font-size:13.5px;line-height:1.38;margin:0;color:var(--text)}
.task-controls{display:flex;align-items:center;gap:7px;margin-top:6px}.transfer-select{flex:1;min-width:0;min-height:34px;border:1px solid #cfd8d4;border-radius:9px;background:#fff;padding:6px 8px;color:var(--text);font-size:12.5px}.remove-indicator{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11.5px;padding:6px 2px;white-space:nowrap}.remove-indicator:hover{color:var(--coral);text-decoration:underline}
.co-wrap{margin-top:4px}.co-trigger{border:0;background:none;padding:2px 0;color:var(--accent);font-size:11.5px;cursor:pointer}.co-box{display:none;margin-top:6px}.co-box.show{display:block}.co-select{width:100%;min-height:34px;border:1px solid #d5ddda;border-radius:8px;background:#fff;padding:6px 7px;font-size:12.5px}
.custom-tag{font-size:10.5px;color:#7b5a52;background:#fff2ee;border-radius:999px;padding:3px 6px;margin-left:5px}.level-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);background:#eef5f2;border:1px solid #d8e6e1;border-radius:999px;padding:3px 6px;margin:0 0 5px 5px}.remove-task{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11.5px;padding:4px}.remove-task:hover{color:var(--coral)}
.add-task-box{margin-top:10px;padding:10px;background:var(--soft);border-radius:10px;display:none}.add-task-box.show{display:block}.form-grid{display:grid;gap:8px}.form-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:8px}.picker-label{font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:-3px}.add-hint{margin:0;font-size:11.5px;line-height:1.4;color:var(--muted)}.select:disabled,.btn:disabled{opacity:.5;cursor:default}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:40px}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-dark)}.btn.secondary{background:var(--soft2);color:var(--ink)}.btn.secondary:hover{background:#e6ece9}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:12px;min-height:34px;padding:7px 10px}.btn:disabled{opacity:.45;cursor:default}
.dept-actions{margin-top:6px}.add-indicator-link{font-size:12px;padding:5px 0}
.special{margin-top:10px;border:1px dashed #cdd6d2;border-radius:12px;padding:0 10px}.special summary{padding:10px 0!important}.special .dept-body{padding-left:0}
.alert{display:none;margin-top:13px;padding:10px 12px;border-radius:10px;background:var(--coral-bg);color:#8b4438;font-size:12.5px;line-height:1.4}.alert.show{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.screen>.nav{position:sticky;bottom:0;z-index:30;background:rgba(255,255,255,.97);padding:10px 0 4px;border-top:1px solid var(--line);box-shadow:0 -8px 16px rgba(20,45,40,.05)}.nav .btn{min-width:120px}
.decision-grid{display:grid;gap:12px}.decision-card{border:1px solid var(--line);border-radius:12px;padding:13px}.decision-card label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:7px}.decision-hint{font-size:12px;line-height:1.4;color:var(--muted);margin:7px 0 0}
.final-summary{display:grid;gap:8px;margin:12px 0 0}.final-dept{border:1px solid var(--line);border-radius:11px;overflow:hidden}.final-dept summary{list-style:none;padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;color:var(--ink)}.final-dept summary::-webkit-details-marker{display:none}.final-list{margin:0;padding:0 24px 11px 30px;font-size:12.5px;line-height:1.45}.final-list li{margin:3px 0}.final-meta{font-size:12px;color:var(--muted);font-weight:400}
.download-box{margin-top:15px;padding:14px;background:var(--soft);border-radius:12px}.download-box .btn{width:100%}.restart{display:block;margin:13px auto 0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}

.modal-backdrop{position:fixed;inset:0;background:rgba(22,35,32,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-backdrop.show{display:flex}.modal-card{width:min(430px,100%);background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(17,34,30,.25);padding:20px}.modal-card h3{margin:0 0 8px;font-size:18px;color:var(--ink)}.modal-card p{margin:0;font-size:13.5px;line-height:1.5;color:#4d5a57}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:17px;flex-wrap:wrap}.modal-actions .btn{min-width:110px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(15px);background:#17332f;color:#fff;padding:10px 14px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.18s;z-index:1100;box-shadow:0 8px 24px rgba(17,34,30,.2)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.final-warning{margin:12px 0 0;padding:11px 12px;border-radius:10px;background:var(--coral-bg);color:#8b4438;font-size:12.5px;line-height:1.45}.final-task{margin:7px 0 0}.final-task b{font-weight:700}.final-docs{display:block;margin-top:2px;color:var(--muted);font-size:11.5px;line-height:1.4}.final-turnover{display:inline-block;margin-left:5px;font-size:10.5px;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 6px}

@media(max-width:520px){body{padding:0}.trainer{border-radius:0;border-left:0;border-right:0}.head,.screen,.progress{padding-left:16px;padding-right:16px}h1{font-size:20px}.dept-body{padding-left:24px}.task-actions{grid-template-columns:1fr}.nav .btn{flex:1;min-width:0}.add-row{grid-template-columns:1fr}.add-row .btn{width:100%}.task-top{grid-template-columns:1fr}.remove-indicator{justify-self:start}.task-controls{align-items:stretch}.transfer-select{width:100%}}
</style>
</head>
<body>
<div class="trainer" id="trainer">
  <div class="head"><div class="head-copy"><div class="eyebrow">Практика</div><h1>Перераспределите проверку между отделами</h1></div><button class="reset-top" type="button" id="resetTop" aria-label="Сбросить все изменения и начать заново">Сбросить изменения</button></div>
  <div class="progress" id="progressBox"><div class="progress-top"><span id="progressLabel"></span><span id="progressName"></span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
  <main id="screens"></main>
</div>
<div class="modal-backdrop" id="appModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="modal-actions" id="modalActions"></div></div></div>
<div class="toast" id="appToast" role="status" aria-live="polite"></div>

const newState=()=>({departments:defaultDepartments.map(x=>({...x})),assignments:Object.fromEntries(criteria.map(c=>[c.id,c.dept])),co:{},customTasks:[],levelOverrides:{},owner:'',ownerCustom:'',decision:'',decisionCustom:''});
const blankResetState=()=>({departments:defaultDepartments.map(x=>({...x})),assignments:{},co:{},customTasks:[],levelOverrides:{},owner:'',ownerCustom:'',decision:'',decisionCustom:''});
let state=newState();
let current=0;
let setupReturn=null;
const carouselFocus={0:'',1:'',2:''};
const screens=document.getElementById('screens'), progressLabel=document.getElementById('progressLabel'), progressName=document.getElementById('progressName'), progressFill=document.getElementById('progressFill');
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uid=prefix=>prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);

let modalPrimary=null,modalSecondary=null;
function showToast(text){const t=document.getElementById('appToast');if(!t)return;t.textContent=text;t.classList.add('show');clearTimeout(showToast._tm);showToast._tm=setTimeout(()=>t.classList.remove('show'),1800)}
function closeModal(){const m=document.getElementById('appModal');if(m)m.classList.remove('show');modalPrimary=null;modalSecondary=null}
function showModal({title,text,secondaryLabel='Отмена',primaryLabel='Продолжить',onSecondary=null,onPrimary=null,danger=false}){const m=document.getElementById('appModal'),mt=document.getElementById('modalTitle'),mp=document.getElementById('modalText'),ma=document.getElementById('modalActions');if(!m||!mt||!mp||!ma)return;mt.textContent=title;mp.textContent=text;ma.innerHTML=`<button class="btn secondary" type="button" id="modalSecondary">${esc(secondaryLabel)}</button><button class="btn primary" type="button" id="modalPrimary" ${danger?'style="background:#c95f4c"':''}>${esc(primaryLabel)}</button>`;modalSecondary=onSecondary;modalPrimary=onPrimary;m.classList.add('show');document.getElementById('modalPrimary')?.focus();document.getElementById('modalSecondary').onclick=()=>{const fn=modalSecondary;closeModal();if(fn)fn()};document.getElementById('modalPrimary').onclick=()=>{const fn=modalPrimary;closeModal();if(fn)fn()}}
function resetEverything(){state=blankResetState();setupReturn=null;current=0;save();render();show(0);showToast('Все назначения сброшены. Показатели перенесены в «Не распределено»')}
function unassignedTasks(level=2){return allTasks().filter(t=>applicable(t,level)&&!isExcluded(t.id)&&!state.assignments[t.id])}
function focusUnassigned(level){carouselFocus[level]='unassigned';render();show(level+1);requestAnimationFrame(()=>{activateCarousel(level,'unassigned');document.querySelector(`[data-carousel-level="${level}"]`)?.scrollIntoView({behavior:'smooth',block:'start'})})}

function load(){try{const raw=localStorage.getItem(storageKey);if(raw){const saved=JSON.parse(raw);state={...newState(),...saved}; if(!Array.isArray(state.departments)||!state.departments.length)state.departments=defaultDepartments.map(x=>({...x})); if(!Array.isArray(state.customTasks))state.customTasks=[]; if(!state.levelOverrides||typeof state.levelOverrides!=='object')state.levelOverrides={};}}catch(e){}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}
function deptName(id){return state.departments.find(d=>d.id===id)?.name||''}
function allTasks(){return [...criteria,...state.customTasks]}
function isExcluded(id){return state.assignments[id]==='excluded'}
function effectiveLevel(t){const v=state.levelOverrides?.[t.id];return Number.isInteger(v)?v:Number(t.level)}
function applicable(t,level){return effectiveLevel(t)<=level}
function turnoverFrom(level){return level===0?'все группы в установленном объеме':level===1?'средний и крупный':'крупный'}
function options(selected,exclude=''){
  let out='<option value="">Не распределено</option>';
  state.departments.forEach(d=>{if(d.id!==exclude)out+=`<option value="${esc(d.id)}" ${selected===d.id?'selected':''}>${esc(d.name)}</option>`});
  out+=`<option value="excluded" ${selected==='excluded'?'selected':''}>Не включать в чек-листы</option>`;
  return out;
}
function setupScreen(){
  return `<section class="screen" data-screen="0"><div class="group-card"><h2 class="group-title">Кто участвует в проверке</h2><p class="group-sub">Оставьте только участников вашей проверки. Названия можно изменить, новые подразделения — добавить.</p></div>
  <div class="setup-list" id="setupList">${state.departments.map(d=>`<div class="setup-row" data-dept-row="${esc(d.id)}"><input class="setup-input" data-dept-name="${esc(d.id)}" value="${esc(d.name)}" aria-label="Название подразделения"><button class="icon-btn" type="button" data-remove-dept="${esc(d.id)}" title="Убрать">✕</button></div>`).join('')}</div>
  <button class="link-btn" type="button" id="showAddDept">+ Добавить подразделение</button>
  <div class="add-row" id="addDeptRow"><input class="text-input" id="newDeptName" placeholder="Например, отдел качества"><button class="btn primary" type="button" id="saveDept">Добавить</button><button class="btn secondary" type="button" id="cancelDept">Отмена</button></div>
  <div class="alert" id="setupAlert"></div><div class="nav"><span></span><button class="btn primary" type="button" id="setupNext">${setupReturn!==null?'Сохранить и вернуться':'Дальше →'}</button></div></section>`;
}
function taskRow(t,primary,currentLevel,showBlock=true){
  const co=state.co[t.id]||''; const custom=t.custom===true;
  const excluded=primary==='excluded';
  return `<div class="task" data-task="${esc(t.id)}">
    <div class="task-top"><div>${showBlock?`<span class="task-block">${esc(t.block)}</span>`:''}${custom?'<span class="custom-tag">добавлено вами</span>':''}${effectiveLevel(t)<currentLevel?'<span class="level-tag">с предыдущего уровня</span>':''}<p class="task-title">${esc(t.title)}</p></div>
    ${excluded?'':`<button class="remove-indicator" type="button" data-exclude-task="${esc(t.id)}" title="Исключить показатель из чек-листов">Убрать из проверки</button>`}</div>
    <div class="task-controls"><select class="transfer-select" data-transfer="${esc(t.id)}" aria-label="Исполнитель показателя">${options(primary)}</select>${custom?`<button class="remove-task" type="button" data-remove-task="${esc(t.id)}" title="Удалить добавленный показатель">Удалить</button>`:''}</div>
    ${excluded?'':`<div class="co-wrap"><button class="co-trigger" type="button" data-toggle-co="${esc(t.id)}">${co?'Соисполнитель: '+esc(deptName(co)):'+ Добавить соисполнителя'}</button><div class="co-box ${co?'show':''}" data-co-box="${esc(t.id)}"><select class="co-select" data-co="${esc(t.id)}"><option value="">Без соисполнителя</option>${state.departments.filter(d=>d.id!==primary).map(d=>`<option value="${esc(d.id)}" ${co===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div></div>`}
  </div>`;
}
function sectionRows(fresh,d,level){
  const grouped=new Map();
  fresh.forEach(t=>{if(!grouped.has(t.block))grouped.set(t.block,[]);grouped.get(t.block).push(t)});
  return [...grouped.entries()].map(([block,items])=>`<div class="task-section"><div class="section-head"><div class="section-title">${esc(block)}<span class="section-count">${items.length}</span></div></div><div class="section-tasks">${items.map(t=>taskRow(t,d.id,level,false)).join('')}</div></div>`).join('');
}
function deptSlide(d,level){
  const tasks=allTasks().filter(t=>applicable(t,level)&&!isExcluded(t.id)&&state.assignments[t.id]===d.id);
  const fresh=tasks.filter(t=>effectiveLevel(t)===level);
  const secondary=allTasks().filter(t=>applicable(t,level)&&state.co[t.id]===d.id&&!isExcluded(t.id)).length;
  const key='dept:'+d.id;
  return `<div class="dept-slide" data-carousel-slide data-carousel-level="${level}" data-carousel-key="${esc(key)}"><div class="dept-card-head"><div><div class="dept-card-label">Подразделение</div><div class="dept-card-title">${esc(d.name)}</div></div><div class="dept-card-count">${tasks.length} показателей${fresh.length&&level>0?` · ${fresh.length} новых`:''}${secondary?` · ${secondary} соисп.`:''}</div></div><div class="dept-card-body">
  ${tasks.length?sectionRows(tasks,d,level):'<p class="dept-note">Показателей пока нет. Добавьте нужный из готового списка.</p>'}
  <div class="dept-actions"><button class="link-btn add-indicator-link" type="button" data-add-task="${esc(d.id)}">+ Добавить показатель</button></div>
  <div class="add-task-box" data-add-box="${esc(d.id)}"><div class="form-grid"><label class="picker-label">Блок</label><select class="select" data-add-block="${esc(d.id)}" data-add-level="${level}"><option value="">Выберите блок</option>${blocks.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}</select><label class="picker-label">Показатель</label><select class="select" data-add-indicator="${esc(d.id)}" data-add-level="${level}" disabled><option value="">Сначала выберите блок</option></select><p class="add-hint">В списке — показатели из матрицы проверки. Уже включенные в эту группу не дублируются.</p></div><div class="form-actions"><button class="btn secondary" type="button" data-cancel-task="${esc(d.id)}">Отмена</button><button class="btn primary" type="button" data-save-task="${esc(d.id)}" data-save-level="${level}" disabled>Добавить показатель</button></div></div>
  </div></div>`;
}
function unassignedSlide(level){
  const list=allTasks().filter(t=>applicable(t,level)&&!isExcluded(t.id)&&!state.assignments[t.id]);
  if(!list.length)return '';
  return `<div class="dept-slide carousel-special unassigned-slide" data-carousel-slide data-carousel-level="${level}" data-carousel-key="unassigned"><div class="dept-card-head"><div><div class="dept-card-label">Требует назначения</div><div class="dept-card-title">Не распределено</div></div><div class="dept-card-count">${list.length} показателей</div></div><div class="dept-card-body"><p class="carousel-helper">Назначьте исполнителя, чтобы эти проверки попали в чек-листы отделов.</p>${list.map(t=>taskRow(t,'',level)).join('')}</div></div>`;
}
function excludedSlide(level){
  const list=allTasks().filter(t=>applicable(t,level)&&isExcluded(t.id));
  if(!list.length)return '';
  return `<div class="dept-slide carousel-special excluded-slide" data-carousel-slide data-carousel-level="${level}" data-carousel-key="excluded"><div class="dept-card-head"><div><div class="dept-card-label">Отдельный список</div><div class="dept-card-title">Исключенные из проверки</div></div><div class="dept-card-count">${list.length} показателей</div></div><div class="dept-card-body"><p class="carousel-helper">Если показатель снова нужен, назначьте ему исполнителя.</p>${list.map(t=>taskRow(t,'excluded',level)).join('')}</div></div>`;
}
function carouselItems(level){
  const items=[];
  if(allTasks().some(t=>applicable(t,level)&&!isExcluded(t.id)&&!state.assignments[t.id]))items.push('unassigned');
  state.departments.forEach(d=>items.push('dept:'+d.id));
  if(allTasks().some(t=>applicable(t,level)&&isExcluded(t.id)))items.push('excluded');
  return items;
}
function carouselDots(level,items,active){
  return items.map((key,i)=>`<button class="carousel-dot ${key===active?'active':''}" type="button" data-carousel-go="${esc(key)}" data-carousel-level="${level}" aria-label="Перейти к карточке ${i+1}"></button>`).join('');
}
function groupScreen(level){
  const items=carouselItems(level);
  let active=carouselFocus[level];
  if(!items.includes(active))active=items[0]||'';
  carouselFocus[level]=active;
  const slides=`${unassignedSlide(level)}${state.departments.map(d=>deptSlide(d,level)).join('')}${excludedSlide(level)}`;
  return `<section class="screen" data-screen="${level+1}"><div class="group-card"><h2 class="group-title">${groups[level].name}</h2><p class="group-sub">${groups[level].sub}</p></div>
  <div class="top-actions"><button class="mini-link" type="button" data-edit-depts="${level+1}">✎ Изменить подразделения</button></div>
  ${level>0?`<p class="notice">Назначения предыдущей группы уже сохранены. Оставьте их как есть или при необходимости передайте другому отделу либо исключите показатель из проверки. Новые показатели отмечены внутри подразделений.</p>`:''}
  <div class="dept-carousel" data-carousel-level="${level}">${slides}<div class="carousel-controls"><button class="btn secondary carousel-prev" type="button" data-carousel-prev="${level}">← Назад</button><div class="carousel-dots">${carouselDots(level,items,active)}</div><button class="btn primary carousel-done" type="button" data-carousel-done="${level}">Готово →</button></div></div>
  <div class="alert" id="groupAlert-${level}"></div></section>`;
}
function ownerScreen(){
  return `<section class="screen" data-screen="4"><div class="group-card"><h2 class="group-title">Кто отвечает за общий результат и кто принимает решение</h2><p class="group-sub">Укажите должности: кто собирает результаты проверки и кто принимает итоговое решение по контрагенту.</p></div><div class="decision-grid">
  <div class="decision-card"><label for="ownerCustom">Ответственный за результаты проверки</label><input class="text-input" id="ownerCustom" value="${esc(state.ownerCustom)}" placeholder="Например, руководитель службы безопасности"><p class="decision-hint">Собирает результаты отделов, сопоставляет выводы и готовит общий отчет по проверке.</p></div>
  <div class="decision-card"><label for="decisionCustom">Кто принимает итоговое решение</label><input class="text-input" id="decisionCustom" value="${esc(state.decisionCustom)}" placeholder="Например, финансовый директор"><p class="decision-hint">Укажите должность лица, которое решает: работать с контрагентом, работать с условиями или отказаться от сделки.</p></div></div>

}
function taskMapForDept(d){
  return allTasks().filter(t=>!isExcluded(t.id)&&(state.assignments[t.id]===d.id||state.co[t.id]===d.id)).map(t=>({...t,secondary:state.assignments[t.id]!==d.id}));
}
function finalScreen(){
  const used=state.departments.map(d=>({d,tasks:taskMapForDept(d)})).filter(x=>x.tasks.length);
  const un=unassignedTasks(2);
  const deptHtml=used.map(({d,tasks})=>{const min=Math.min(...tasks.map(t=>effectiveLevel(t)));return `<details class="final-dept"><summary><span>${esc(d.name)}</span><span class="final-meta">${tasks.length} · ${esc(turnoverFrom(min))}</span></summary><ul class="final-list">${tasks.map(t=>`<li class="final-task"><b>☐ ${esc(t.title)}</b>${t.secondary?' — соисполнитель':''}<span class="final-turnover">${esc(turnoverFrom(effectiveLevel(t)))}</span><span class="final-docs">Документы / материалы: ${esc(t.docs||'подтверждающие материалы по внутреннему регламенту')}</span></li>`).join('')}</ul></details>`}).join('');
  const unHtml=un.length?`<details class="final-dept"><summary><span>Не распределено</span><span class="final-meta">${un.length}</span></summary><ul class="final-list">${un.map(t=>`<li class="final-task"><b>${esc(t.title)}</b><span class="final-turnover">${esc(turnoverFrom(effectiveLevel(t)))}</span><span class="final-docs">Документы / материалы: ${esc(t.docs||'подтверждающие материалы по внутреннему регламенту')}</span></li>`).join('')}</ul></details>`:'';
  return `<section class="screen" data-screen="5"><div class="group-card"><div class="group-kicker">Готово</div><h2 class="group-title">Чек-листы для отделов готовы</h2><p class="group-sub">Для каждого выбранного отдела собран свой перечень проверок. В одном файле отделы получат только те показатели, за которые отвечают.</p></div>
  <div class="decision-card" style="margin-bottom:12px"><div style="font-size:13px;line-height:1.55"><b>Ответственный за результаты проверки:</b> ${esc(state.ownerCustom.trim())}<br><b>Кто принимает итоговое решение:</b> ${esc(state.decisionCustom.trim())}</div></div>
  ${un.length?`<div class="final-warning">Остались нераспределенные показатели: <b>${un.length}</b>. Они не попадут в чек-листы отделов, пока вы не назначите исполнителей.</div>`:''}<div class="final-summary">${deptHtml}${unHtml}</div>
  <div class="download-box"><button class="btn primary" type="button" id="downloadBtn">Скачать чек-листы в Word</button></div><button class="restart" type="button" id="restartBtn">Начать заново</button></section>`;
}
function render(openKeys=[],scrollY=null){
  screens.innerHTML=setupScreen()+groups.map((_,i)=>groupScreen(i)).join('')+ownerScreen()+finalScreen();bind();show(current);
  requestAnimationFrame(()=>{[0,1,2].forEach(level=>activateCarousel(level,carouselFocus[level],false));if(scrollY!==null)window.scrollTo(0,scrollY)});
}
function show(idx){current=idx;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',Number(s.dataset.screen)===idx));const names=['Подразделения','Незначительный оборот','Средний оборот','Крупный оборот','Ответственный и решение','Чек-листы'];progressLabel.textContent=`Шаг ${idx+1} из 6`;progressName.textContent=names[idx];progressFill.style.width=`${((idx+1)/6)*100}%`;window.scrollTo(0,0)}
function preserve(extraOpen=''){return {open:[],y:window.scrollY}}
function activateCarousel(level,key,scroll=false){
  const wrap=document.querySelector(`.dept-carousel[data-carousel-level="${level}"]`);if(!wrap)return;
  const slides=[...wrap.querySelectorAll('[data-carousel-slide]')];if(!slides.length)return;
  let target=slides.find(s=>s.dataset.carouselKey===key)||slides[0];carouselFocus[level]=target.dataset.carouselKey;
  slides.forEach(s=>s.classList.toggle('active',s===target));
  wrap.querySelectorAll('[data-carousel-go]').forEach(dot=>dot.classList.toggle('active',dot.dataset.carouselGo===target.dataset.carouselKey));
  if(scroll)wrap.scrollIntoView({behavior:'smooth',block:'start'});
}
function currentCarouselInfo(level){
  const wrap=document.querySelector(`.dept-carousel[data-carousel-level="${level}"]`);if(!wrap)return null;
  const slides=[...wrap.querySelectorAll('[data-carousel-slide]')];const idx=slides.findIndex(s=>s.classList.contains('active'));return {wrap,slides,idx:idx<0?0:idx};
}
function validateDepartments(){
  state.departments.forEach(d=>{const el=document.querySelector(`[data-dept-name="${CSS.escape(d.id)}"]`);if(el)d.name=el.value.trim()});
  const alert=document.getElementById('setupAlert');
  if(!state.departments.length){alert.textContent='Оставьте или добавьте хотя бы одно подразделение.';alert.classList.add('show');return false}
  if(state.departments.some(d=>!d.name)){alert.textContent='Заполните названия подразделений.';alert.classList.add('show');return false}
  const norm=state.departments.map(d=>d.name.toLowerCase());if(new Set(norm).size!==norm.length){alert.textContent='Названия подразделений должны различаться.';alert.classList.add('show');return false}
  return true;
}
function validateGroup(level){return unassignedTasks(level)}
function availableCriteria(block,level){
  return criteria.filter(t=>t.block===block&&(isExcluded(t.id)||!state.assignments[t.id]||effectiveLevel(t)>level));
}
function indicatorOptions(block,level){
  if(!block)return '<option value="">Сначала выберите блок</option>';
  const list=availableCriteria(block,level);
  if(!list.length)return '<option value="">Все показатели этого блока уже включены</option>';
  return '<option value="">Выберите показатель</option>'+list.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('');
}
function addKnownCriterion(deptId,level){
  const indicator=document.querySelector(`[data-add-indicator="${CSS.escape(deptId)}"]`);
  const id=indicator?.value||''; const task=criteria.find(t=>t.id===id); if(!task)return;
  carouselFocus[level]='dept:'+deptId;state.assignments[id]=deptId; state.levelOverrides[id]=Number(level); delete state.co[id]; save();
  const y=window.scrollY;render([],y);
}
function bind(){
  const resetTop=document.getElementById('resetTop');if(resetTop)resetTop.onclick=()=>showModal({title:'Сбросить изменения?',text:'Все назначения, изменения и добавленные подразделения будут удалены. Показатели останутся в конструкторе, но вернутся в «Не распределено», чтобы вы могли распределить их заново.',secondaryLabel:'Отмена',primaryLabel:'Сбросить изменения',danger:true,onPrimary:resetEverything});
  document.querySelectorAll('[data-carousel-go]').forEach(b=>b.onclick=()=>activateCarousel(Number(b.dataset.carouselLevel),b.dataset.carouselGo,true));
  document.querySelectorAll('[data-carousel-prev]').forEach(b=>b.onclick=()=>{const level=Number(b.dataset.carouselPrev),info=currentCarouselInfo(level);if(!info)return;if(info.idx>0){activateCarousel(level,info.slides[info.idx-1].dataset.carouselKey,true)}else{show(level)}});
  document.querySelectorAll('[data-carousel-done]').forEach(b=>b.onclick=()=>{const level=Number(b.dataset.carouselDone),info=currentCarouselInfo(level);if(!info)return;if(info.idx<info.slides.length-1){activateCarousel(level,info.slides[info.idx+1].dataset.carouselKey,true);return}const un=validateGroup(level);if(un.length){showModal({title:'Остались нераспределенные показатели',text:`Не распределено: ${un.length}. Перейти дальше? Эти показатели сохранятся и будут показаны как нераспределенные.`,secondaryLabel:'Распределить',primaryLabel:'Перейти',onSecondary:()=>focusUnassigned(level),onPrimary:()=>{save();show(level+2)}});return}save();show(level+2)});
  document.querySelectorAll('[data-dept-name]').forEach(inp=>inp.addEventListener('input',e=>{const d=state.departments.find(x=>x.id===e.target.dataset.deptName);if(d){d.name=e.target.value;save()}}));
  document.querySelectorAll('[data-remove-dept]').forEach(btn=>btn.addEventListener('click',()=>{if(state.departments.length<=1){const a=document.getElementById('setupAlert');a.textContent='Нужно оставить хотя бы одно подразделение.';a.classList.add('show');return}const id=btn.dataset.removeDept;state.departments=state.departments.filter(d=>d.id!==id);Object.keys(state.assignments).forEach(k=>{if(state.assignments[k]===id)state.assignments[k]=''});Object.keys(state.co).forEach(k=>{if(state.co[k]===id)state.co[k]=''});if(state.owner===id)state.owner='';save();render()}));
  const showAdd=document.getElementById('showAddDept'),addRow=document.getElementById('addDeptRow');if(showAdd)showAdd.onclick=()=>{addRow.classList.add('show');document.getElementById('newDeptName').focus()};
  const cancel=document.getElementById('cancelDept');if(cancel)cancel.onclick=()=>{addRow.classList.remove('show');document.getElementById('newDeptName').value=''};
  const saveDept=document.getElementById('saveDept');if(saveDept)saveDept.onclick=()=>{const n=document.getElementById('newDeptName').value.trim();if(!n)return;state.departments.push({id:uid('dept'),name:n});save();render()};
  const setupNext=document.getElementById('setupNext');if(setupNext)setupNext.onclick=()=>{if(!validateDepartments())return;save();const target=setupReturn!==null?setupReturn:1;setupReturn=null;render();show(target)};
  document.querySelectorAll('[data-edit-depts]').forEach(b=>b.onclick=()=>{setupReturn=Number(b.dataset.editDepts);show(0);render()});
  document.querySelectorAll('[data-transfer]').forEach(sel=>sel.addEventListener('change',e=>{const slide=e.target.closest('[data-carousel-slide]');const level=Number(slide?.dataset.carouselLevel??0);if(slide)carouselFocus[level]=slide.dataset.carouselKey;const id=e.target.dataset.transfer;const target=e.target.value;state.assignments[id]=target;if(state.co[id]===target)state.co[id]='';save();const y=window.scrollY;render([],y)}));
  document.querySelectorAll('[data-toggle-co]').forEach(b=>b.onclick=()=>{const box=document.querySelector(`[data-co-box="${CSS.escape(b.dataset.toggleCo)}"]`);if(box)box.classList.toggle('show')});
  document.querySelectorAll('[data-co]').forEach(sel=>sel.addEventListener('change',e=>{const slide=e.target.closest('[data-carousel-slide]');const level=Number(slide?.dataset.carouselLevel??0);if(slide)carouselFocus[level]=slide.dataset.carouselKey;state.co[e.target.dataset.co]=e.target.value;save();const y=window.scrollY;render([],y)}));
  document.querySelectorAll('[data-exclude-task]').forEach(b=>b.onclick=()=>{const slide=b.closest('[data-carousel-slide]');const level=Number(slide?.dataset.carouselLevel??0);if(slide)carouselFocus[level]=slide.dataset.carouselKey;const id=b.dataset.excludeTask;state.assignments[id]='excluded';delete state.co[id];save();const y=window.scrollY;render([],y)});
  document.querySelectorAll('[data-add-task]').forEach(b=>b.onclick=()=>{const box=document.querySelector(`[data-add-box="${CSS.escape(b.dataset.addTask)}"]`);if(box){box.classList.add('show');box.querySelector('[data-add-block]')?.focus()}});
  document.querySelectorAll('[data-cancel-task]').forEach(b=>b.onclick=()=>{const box=document.querySelector(`[data-add-box="${CSS.escape(b.dataset.cancelTask)}"]`);if(box)box.classList.remove('show')});
  document.querySelectorAll('[data-add-block]').forEach(sel=>sel.onchange=()=>{const deptId=sel.dataset.addBlock;const level=Number(sel.dataset.addLevel);const indicator=document.querySelector(`[data-add-indicator="${CSS.escape(deptId)}"]`);const saveBtn=document.querySelector(`[data-save-task="${CSS.escape(deptId)}"]`);if(indicator){indicator.innerHTML=indicatorOptions(sel.value,level);indicator.disabled=!sel.value||availableCriteria(sel.value,level).length===0;}if(saveBtn)saveBtn.disabled=true;});
  document.querySelectorAll('[data-add-indicator]').forEach(sel=>sel.onchange=()=>{const saveBtn=document.querySelector(`[data-save-task="${CSS.escape(sel.dataset.addIndicator)}"]`);if(saveBtn)saveBtn.disabled=!sel.value;});
  document.querySelectorAll('[data-save-task]').forEach(b=>b.onclick=()=>addKnownCriterion(b.dataset.saveTask,Number(b.dataset.saveLevel)));
  document.querySelectorAll('[data-remove-task]').forEach(b=>b.onclick=()=>{const slide=b.closest('[data-carousel-slide]');const level=Number(slide?.dataset.carouselLevel??0);if(slide)carouselFocus[level]=slide.dataset.carouselKey;const id=b.dataset.removeTask;state.customTasks=state.customTasks.filter(t=>t.id!==id);delete state.assignments[id];delete state.co[id];save();const y=window.scrollY;render([],y)});
  document.querySelectorAll('[data-prev-screen]').forEach(b=>b.onclick=()=>show(Math.max(0,Number(b.dataset.prevScreen)-1)));
  const ownerCustom=document.getElementById('ownerCustom');if(ownerCustom)ownerCustom.oninput=e=>{state.ownerCustom=e.target.value;save()};
  const decisionCustom=document.getElementById('decisionCustom');if(decisionCustom)decisionCustom.oninput=e=>{state.decisionCustom=e.target.value;save()};
  const build=document.getElementById('buildMap');if(build)build.onclick=()=>{const a=document.getElementById('ownerAlert');const owner=state.ownerCustom.trim();const dec=state.decisionCustom.trim();if(!owner||!dec){a.textContent='Укажите должность ответственного и должность руководителя, который принимает итоговое решение.';a.classList.add('show');return}const un=unassignedTasks(2);if(un.length){showModal({title:'Остались нераспределенные показатели',text:`Не распределено: ${un.length}. Они не попадут в чек-листы отделов, пока вы не назначите исполнителей. Можно вернуться к распределению или собрать чек-листы сейчас.`,secondaryLabel:'Распределить',primaryLabel:'Собрать чек-листы',onSecondary:()=>focusUnassigned(2),onPrimary:()=>{save();render();show(5)}});return}save();render();show(5)};
  const dl=document.getElementById('downloadBtn');if(dl)dl.onclick=downloadWord;
  const restart=document.getElementById('restartBtn');if(restart)restart.onclick=()=>showModal({title:'Начать заново?',text:'Все изменения и назначения будут удалены.',secondaryLabel:'Отмена',primaryLabel:'Начать заново',danger:true,onPrimary:resetEverything});
}
function downloadWord(){
  const owner=state.ownerCustom.trim();
  const decision=state.decisionCustom.trim();
  const used=state.departments.map(d=>({d,tasks:taskMapForDept(d)})).filter(x=>x.tasks.length);
  const un=unassignedTasks(2);

  function groupTasksByBlock(tasks){
    const grouped=new Map();
    tasks.forEach(t=>{
      const block=t.block||'Без блока';
      if(!grouped.has(block))grouped.set(block,[]);
      grouped.get(block).push(t);
    });
    const ordered=[...grouped.keys()].sort((a,b)=>{
      const ai=blocks.indexOf(a), bi=blocks.indexOf(b);
      if(ai!==-1&&bi!==-1)return ai-bi;
      if(ai!==-1)return -1;
      if(bi!==-1)return 1;
      return a.localeCompare(b,'ru');
    });
    return ordered.map(block=>({
      block,
      tasks:grouped.get(block).slice().sort((a,b)=>{
        const lv=effectiveLevel(a)-effectiveLevel(b);
        if(lv!==0)return lv;
        return String(a.title||'').localeCompare(String(b.title||''),'ru');
      })
    }));
  }

  function checklistTable(tasks){
    const grouped=groupTasksByBlock(tasks);
    const rows=grouped.map(group=>{
      const rowspan=group.tasks.length;
      return group.tasks.map((t,i)=>`<tr><td class="check">☐</td>${i===0?`<td class="block" rowspan="${rowspan}">${esc(group.block)}</td>`:''}<td class="what">${esc(t.title)}${t.secondary?' <i>(соисполнитель)</i>':''}</td><td class="turn">${esc(turnoverFrom(effectiveLevel(t)))}</td><td class="docs">${esc(t.docs||'подтверждающие материалы по внутреннему регламенту')}</td></tr>`).join('');
    }).join('');
    return `<table><thead><tr><th class="check">✓</th><th class="block">Блок</th><th class="what">Что проверить</th><th class="turn">При каком обороте</th><th class="docs">Документы / материалы</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function deptPage(deptName,tasks,index,isUnassigned=false){
    const cls='dept-page'+(index>0?' pagebreak':'')+(isUnassigned?' unassigned':'');
    return `<section class="${cls}"><div class="dept-label">${isUnassigned?'Не распределено':esc(deptName)}</div><p class="dept-lead">${isUnassigned?'Показатели без назначенного исполнителя':'Чек-лист отдела по проверке контрагентов'}</p>${checklistTable(tasks)}</section>`;
  }

  const sections=used.map(({d,tasks},idx)=>deptPage(d.name,tasks,idx,false)).join('');
  const unSection=un.length?deptPage('Не распределено',un,used.length,true):'';

  const doc=`<!doctype html><html><head><meta charset="utf-8"><style>
  @page{size:landscape;margin:13mm}
  body{font-family:Arial,sans-serif;color:#202523;font-size:9.3pt}
  .cover{page-break-after:always}
  .over{font-size:9pt;margin-bottom:4px;color:#5f6763}
  .title{font-size:16pt;font-weight:700;color:#202523;margin:0 0 10px}
  .roles{margin:0 0 14px;padding:9px 11px;background:#f1f2f3;border:1px solid #d7ddd5}
  .roles p{margin:3px 0}
  .dept-label{font-size:14pt;font-weight:700;margin:0 0 3px;color:#202523}
  .dept-lead{margin:0 0 8px;color:#5f6763}
  .dept-page{margin-top:0}
  .pagebreak{page-break-before:always}
  table{border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:10px;page-break-inside:auto}
  thead{display:table-header-group}
  tr{page-break-inside:avoid;page-break-after:auto}
  th{background:#f1f2f3;color:#202523;text-align:left;font-weight:700;border:1px solid #d7ddd5;padding:5px 6px}
  td{vertical-align:top;border:1px solid #d7ddd5;padding:5px 6px;line-height:1.25}
  th.check,td.check{width:4%;text-align:center;font-size:13pt}
  th.block,td.block{width:18%}
  th.what,td.what{width:24%}
  th.turn,td.turn{width:16%}
  th.docs,td.docs{width:38%}
  td.block{font-weight:700;background:#fafbfa;vertical-align:top}
  .unassigned .dept-label,.unassigned .dept-lead{color:#9a3c2e}
  </style></head><body>
  <section class="cover"><div class="over">Приложение к регламенту проверки</div>
  <div class="title">Чек-листы для отделов по проверке контрагентов</div>
  <div class="roles"><p><b>Ответственный за результаты проверки:</b> ${esc(owner)}</p><p><b>Кто принимает итоговое решение:</b> ${esc(decision)}</p></div></section>
  ${sections}${unSection}
  </body></html>`;
  const blob=new Blob(['\ufeff',doc],{type:'application/msword;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='Чек-листы_отделов_по_проверке_контрагентов.doc';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000)
}
document.getElementById('appModal')?.addEventListener('click',e=>{if(e.target.id==='appModal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

load();render();
})();
