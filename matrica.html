<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Матрица проверки контрагентов по обороту</title>
<style>
  :root{
    --ink:#132a2b;--muted:#5a706f;--line:#d7ddd5;--paper:#fffef9;--bg:#f4f2eb;
    --teal:#0b6b61;--teal-dark:#064a44;--mint:#dcefe7;--mint-2:#eef7f3;--warn:#a44b2f;
    --warn-bg:#fff1ec;--shadow:0 18px 44px rgba(19,42,43,.12)
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font:13px/1.34 Inter,Arial,sans-serif;color:var(--ink)}
  .shell{max-width:650px;margin:0 auto;padding:8px}
  .app{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .head{padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffef9 0%,#f7f5ef 100%)}
  .eyebrow{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--mint);color:var(--teal-dark);font-size:10px;font-weight:800}
  h1{margin:8px 0 6px;font-size:22px;line-height:1.1}
  .lead{margin:0;color:var(--muted)}
  .period{margin-top:10px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:8px 10px}
  .period label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
  .period input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit}
  .body{padding:10px 14px 14px}
  .toolbar{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 11px;font:inherit;font-weight:800;cursor:pointer}
  .btn.ready{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.download{background:var(--mint);border-color:#c8ddd3;color:var(--teal-dark)}
  .btn:disabled{opacity:.48;cursor:not-allowed}
  .status{display:none;margin:0 0 9px;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:700}
  .status.show{display:block}
  .status.ok{background:var(--mint);color:var(--teal-dark)}
  .status.error{background:var(--warn-bg);color:var(--warn)}
  .accordion{display:grid;gap:7px}
  details.row{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:visible}
  details.row[open]{box-shadow:0 9px 22px rgba(19,42,43,.07)}
  details.row summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:7px}
  details.row summary::-webkit-details-marker{display:none}
  .summary-left{display:flex;align-items:center;gap:9px;min-width:0}
  .num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-weight:800;flex:0 0 auto;font-size:11px}
  .sum-title{font-size:15px;font-weight:800;line-height:1.06}
  .sum-sub{font-size:10px;color:var(--muted);margin-top:2px}
  .summary-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .meta{font-size:10px;color:var(--muted);background:var(--mint-2);padding:5px 7px;border-radius:999px;white-space:nowrap}
  .arrow{font-size:17px;color:var(--muted);transition:transform .18s ease}
  details.row[open] .arrow{transform:rotate(180deg)}
  .panel{padding:0 10px 10px;border-top:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:.85fr 1.55fr .9fr;gap:7px;padding-top:8px}
  .cell{border:1px solid var(--line);border-radius:10px;background:#fffefc;padding:7px;min-width:0}
  .cell h3{margin:0 0 6px;font-size:12px;line-height:1.18}
  .range-wrap{display:grid;gap:7px}
  .range-2{grid-template-columns:1fr 1fr}
  .fld label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px}
  .fld input,.cell textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;background:#fff}
  .cell textarea{min-height:66px;resize:vertical}
  .suffix{margin-top:4px;font-size:10px;color:var(--muted)}
  .picker{position:relative}
  .pick-btn{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;text-align:left;display:flex;justify-content:space-between;gap:5px;align-items:center;font-weight:700;cursor:pointer}
  .pick-btn small{font-weight:600;color:var(--muted);font-size:9px}
  .menu{position:static;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:9px;display:none;overflow:hidden}
  .picker.open .menu{display:block}
  .menu-head{padding:7px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px}
  .menu-head b{font-size:11px}
  .close-mini{border:none;background:var(--mint);color:var(--teal-dark);border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800;cursor:pointer}
  .menu-list{max-height:250px;overflow:auto;padding:4px 7px}
  .option{display:flex;gap:7px;align-items:flex-start;padding:5px 2px;border-bottom:1px solid #edf1ee;font-size:11px;line-height:1.22}
  .option:last-child{border-bottom:none}
  .option input{margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:var(--mint);color:var(--teal-dark);font-size:10px;font-weight:700}
  .chip button{border:none;background:transparent;color:var(--teal-dark);font-size:14px;line-height:1;cursor:pointer;padding:0}
  .hint{margin-top:4px;font-size:10px;color:var(--muted)}
  .invalid{border-color:var(--warn)!important;box-shadow:0 0 0 2px rgba(164,75,47,.10)}
  .invalid-block{border-color:var(--warn)!important;background:var(--warn-bg)!important}
  #pdfReport{position:fixed;left:-100000px;top:0;width:1000px;background:#fff;color:#132a2b;padding:0;z-index:-1}
  @media(max-width:720px){
    .grid{grid-template-columns:1fr}
    .summary-right{justify-content:flex-start}
    details.row summary{align-items:flex-start;flex-direction:column}
    .summary-left,.summary-right{width:100%}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="app">
    <div class="head">
      <span class="eyebrow">Итог урока</span>
      <h1>Матрица проверки контрагентов по обороту</h1>
      <p class="lead">Заполните диапазоны оборота, выберите нужные показатели и укажите периодичность проверки.</p>
      <div class="period" id="periodBlock">
        <label for="periodBase">Оборот с контрагентом за период</label>
        <input id="periodBase" type="text" placeholder="впишите период">
      </div>
    </div>
    <div class="body">
      <div class="toolbar">
        <button class="btn ready" id="readyBtn" type="button">Матрица готова</button>
        <button class="btn download" id="downloadBtn" type="button" disabled>Скачать матрицу в PDF</button>
      </div>
      <div class="status" id="statusBox" role="status" aria-live="polite"></div>
      <div class="accordion" id="accordion"></div>
    </div>
  </div>
</div>
<div id="pdfReport" aria-hidden="true"></div>
<script>
"use strict";
const criteria = [
  'Статус контрагента',
  'Достоверность сведений в ЕГРЮЛ и адрес',
  'Полномочия подписанта и представителя',
  'Руководитель: дисквалификация и ограничения',
  'Участники: ограничения на участие в юрлицах',
  'Налоговая и бухгалтерская отчетность',
  'Налоговые долги',
  'Налоговые нарушения и блокировки счетов',
  'Исполнительные производства',
  'Выписка ФНС с результатами оценки',
  'Налоговая нагрузка',
  'Выручка, активы и финансовые показатели',
  'Сотрудники и квалификация',
  'Ресурсы: площадка, оборудование, сырье, мощности',
  'Обычные расходы контрагента',
  'Опыт, деловая история и присутствие на рынке',
  'Причина выбора контрагента',
  'Обязательные разрешения на деятельность и товар',
  'Посредники и другие участники сделки',
  'Платеж третьему лицу',
  'Пояснения по крупному авансу, цене, бартеру и зачету',
  'Возможность исполнить объем работ или поставки в срок',
  'Фактические исполнители и доступ на объект',
  'Источник происхождения товара',
  'Право поставщика распоряжаться товаром',
  'Место хранения и прямая отгрузка',
  'Перевозчик и маршрут товара',
  'Документы, даты и участники сделки',
  'Результат работ или услуг',
  'Реакция компании на нарушение договора',
  'Плановое обновление проверки',
  'Внеплановое обновление проверки'
];
const rows = [
  {id:1,title:'До',kind:'to',open:true},
  {id:2,title:'От ... до',kind:'fromto',open:false},
  {id:3,title:'От ... до',kind:'fromto',open:false},
  {id:4,title:'Свыше',kind:'from',open:false}
];
const state = Object.fromEntries(rows.map(r=>[r.id,{criteria:[]}]))
let matrixReady=false;
const root=document.getElementById('accordion');
const readyBtn=document.getElementById('readyBtn');
const downloadBtn=document.getElementById('downloadBtn');
const statusBox=document.getElementById('statusBox');

function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function rangeInputs(row){
  if(row.kind==='to')return `<div class="range-wrap"><div class="fld"><label>До</label><input type="text" data-role="to" placeholder="сумма"></div></div><div class="suffix">руб.</div>`;
  if(row.kind==='from')return `<div class="range-wrap"><div class="fld"><label>Свыше</label><input type="text" data-role="from" placeholder="сумма"></div></div><div class="suffix">руб.</div>`;
  return `<div class="range-wrap range-2"><div class="fld"><label>От</label><input type="text" data-role="from" placeholder="сумма"></div><div class="fld"><label>До</label><input type="text" data-role="to" placeholder="сумма"></div></div><div class="suffix">руб.</div>`;
}
function renderRow(row){
  return `<details class="row" data-id="${row.id}" ${row.open?'open':''}><summary><div class="summary-left"><span class="num">${row.id}</span><div><div class="sum-title">${row.title}</div><div class="sum-sub">Диапазон оборота и состав проверки</div></div></div><div class="summary-right"><span class="meta js-meta">показатели не выбраны</span><span class="arrow">⌄</span></div></summary><div class="panel"><div class="grid"><div class="cell range-cell"><h3>Оборот с контрагентом</h3>${rangeInputs(row)}</div><div class="cell criteria-cell"><h3>Какие показатели проверяем</h3><div class="picker" data-picker="${row.id}"><button type="button" class="pick-btn" data-open="${row.id}"><span>Выберите показатели</span><small>отметьте нужные</small></button><div class="menu"><div class="menu-head"><b>Выберите показатели</b><button type="button" class="close-mini" data-close="${row.id}">Готово</button></div><div class="menu-list">${criteria.map(item=>`<label class="option"><input type="checkbox" data-row="${row.id}" value="${esc(item)}"><span>${esc(item)}</span></label>`).join('')}</div></div></div><div class="chips" id="chips-${row.id}"><span class="hint">Пока ничего не выбрано</span></div></div><div class="cell periodicity-cell"><h3>Периодичность проверки</h3><textarea placeholder="впишите периодичность"></textarea></div></div></div></details>`;
}
root.innerHTML=rows.map(renderRow).join('');

function refreshChips(rowId){
  const box=document.getElementById(`chips-${rowId}`);const list=state[rowId].criteria;const meta=root.querySelector(`details[data-id="${rowId}"] .js-meta`);
  meta.textContent=list.length?`выбрано ${list.length}`:'показатели не выбраны';
  box.innerHTML=list.length?list.map(item=>`<span class="chip">${esc(item)} <button type="button" data-remove="${rowId}" data-value="${esc(item)}">×</button></span>`).join(''):'<span class="hint">Пока ничего не выбрано</span>';
  markChanged();syncHeight();
}
function setCheckboxes(rowId){const selected=new Set(state[rowId].criteria);root.querySelectorAll(`input[type="checkbox"][data-row="${rowId}"]`).forEach(cb=>cb.checked=selected.has(cb.value));}
function closeAllMenus(exceptId=''){root.querySelectorAll('.picker').forEach(p=>{if(p.dataset.picker!==String(exceptId))p.classList.remove('open')});}
function showStatus(text,type){statusBox.textContent=text;statusBox.className=`status show ${type}`;syncHeight();}
function markChanged(){
  if(!matrixReady)return;
  matrixReady=false;downloadBtn.disabled=true;showStatus('После изменений снова нажмите «Матрица готова».','error');
}
function clearValidation(){document.querySelectorAll('.invalid,.invalid-block').forEach(el=>el.classList.remove('invalid','invalid-block'));}
function rowData(row){
  const el=root.querySelector(`details[data-id="${row.id}"]`);
  return {row,el,from:(el.querySelector('[data-role="from"]')||{}).value?.trim()||'',to:(el.querySelector('[data-role="to"]')||{}).value?.trim()||'',periodicity:el.querySelector('textarea').value.trim(),criteria:state[row.id].criteria.slice()};
}
function collectData(){return {period:document.getElementById('periodBase').value.trim(),rows:rows.map(rowData)};}
function rowHasAnyData(item){return Boolean(item.from||item.to||item.periodicity||item.criteria.length)}
function validate(){
  clearValidation();const data=collectData();const errors=[];let first=null;
  const activeRows=data.rows.filter(rowHasAnyData);
  if(!data.period){document.getElementById('periodBase').classList.add('invalid');document.getElementById('periodBlock').classList.add('invalid-block');errors.push('укажите период расчета оборота');first=document.getElementById('periodBase');}
  if(!activeRows.length){
    const firstRow=data.rows[0];firstRow.el.open=true;firstRow.el.querySelector('.range-cell').classList.add('invalid-block');firstRow.el.querySelector('.criteria-cell').classList.add('invalid-block');firstRow.el.querySelector('.periodicity-cell').classList.add('invalid-block');errors.push('заполните хотя бы одну строку матрицы');if(!first)first=firstRow.el;
  }
  activeRows.forEach(item=>{
    const missingRange=(item.row.kind==='to'&&!item.to)||(item.row.kind==='from'&&!item.from)||(item.row.kind==='fromto'&&(!item.from||!item.to));
    if(missingRange){item.el.querySelector('.range-cell').classList.add('invalid-block');item.el.querySelectorAll('.range-cell input').forEach(i=>{if(!i.value.trim())i.classList.add('invalid')});errors.push(`заполните диапазон в строке ${item.row.id}`);if(!first)first=item.el;}
    if(!item.criteria.length){item.el.querySelector('.criteria-cell').classList.add('invalid-block');errors.push(`выберите показатели в строке ${item.row.id}`);if(!first)first=item.el;}
    if(!item.periodicity){item.el.querySelector('.periodicity-cell').classList.add('invalid-block');item.el.querySelector('textarea').classList.add('invalid');errors.push(`укажите периодичность в строке ${item.row.id}`);if(!first)first=item.el;}
  });
  if(errors.length){
    if(first?.tagName==='DETAILS')first.open=true;else first?.closest('details.row')&&(first.closest('details.row').open=true);
    showStatus(`Матрица пока не готова: ${errors[0]}.`,'error');setTimeout(()=>first?.scrollIntoView({behavior:'smooth',block:'center'}),50);return null;
  }
  return {...data,rows:activeRows};
}

root.addEventListener('click',e=>{
  const openBtn=e.target.closest('[data-open]');if(openBtn){const id=openBtn.dataset.open;const picker=root.querySelector(`.picker[data-picker="${id}"]`);const willOpen=!picker.classList.contains('open');closeAllMenus();if(willOpen)picker.classList.add('open');syncHeight();return;}
  const closeBtn=e.target.closest('[data-close]');if(closeBtn){root.querySelector(`.picker[data-picker="${closeBtn.dataset.close}"]`).classList.remove('open');syncHeight();return;}
  const rem=e.target.closest('[data-remove]');if(rem){const rowId=rem.dataset.remove;state[rowId].criteria=state[rowId].criteria.filter(v=>v!==rem.dataset.value);setCheckboxes(rowId);refreshChips(rowId);return;}
  if(!e.target.closest('.picker'))closeAllMenus();
});
root.addEventListener('change',e=>{
  const cb=e.target.closest('input[type="checkbox"][data-row]');if(!cb)return;const rowId=cb.dataset.row;let list=state[rowId].criteria.slice();
  if(cb.checked){if(!list.includes(cb.value))list.push(cb.value)}else list=list.filter(v=>v!==cb.value);
  state[rowId].criteria=list;refreshChips(rowId);
});
document.addEventListener('input',e=>{if(e.target.matches('input,textarea')){e.target.classList.remove('invalid');e.target.closest('.invalid-block')?.classList.remove('invalid-block');markChanged();syncHeight();}});
root.querySelectorAll('details.row').forEach(d=>d.addEventListener('toggle',()=>requestAnimationFrame(syncHeight)));

readyBtn.addEventListener('click',()=>{
  closeAllMenus();const data=validate();if(!data)return;
  matrixReady=true;downloadBtn.disabled=false;root.querySelectorAll('details.row').forEach(d=>d.open=false);showStatus('Матрица готова. Теперь скачайте ее в PDF.','ok');
});
downloadBtn.addEventListener('click',async()=>{
  if(!matrixReady){showStatus('Сначала нажмите «Матрица готова».','error');return;}
  const data=validate();if(!data){matrixReady=false;downloadBtn.disabled=true;return;}
  downloadBtn.disabled=true;downloadBtn.textContent='Создаем PDF...';
  try{await createPdf(data);showStatus('PDF скачан.','ok')}catch(error){console.error(error);showStatus('Не удалось создать PDF. Обновите страницу и попробуйте еще раз.','error')}
  finally{downloadBtn.disabled=false;downloadBtn.textContent='Скачать матрицу в PDF'}
});

function wrapText(ctx,text,maxWidth){
  const words=String(text).split(/\s+/);const lines=[];let line='';
  for(const word of words){const test=line?`${line} ${word}`:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}
  if(line)lines.push(line);return lines;
}
function newPage(){
  const canvas=document.createElement('canvas');canvas.width=1240;canvas.height=1754;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textBaseline='top';return {canvas,ctx,y:70};
}
function drawWrapped(page,text,x,maxWidth,font,lineHeight,color='#132a2b'){
  page.ctx.font=font;page.ctx.fillStyle=color;const lines=wrapText(page.ctx,text,maxWidth);for(const line of lines){page.ctx.fillText(line,x,page.y);page.y+=lineHeight}return lines.length;
}
function ensureSpace(pages,page,needed){if(page.y+needed<=1680)return page;pages.push(page);return newPage();}
function buildCanvasPages(data){
  const pages=[];let page=newPage();const margin=72;const width=1096;
  drawWrapped(page,'Матрица проверки контрагентов по обороту',margin,width,'bold 36px Arial',45,'#132a2b');page.y+=8;
  drawWrapped(page,`Оборот с контрагентом за период: ${data.period}`,margin,width,'24px Arial',31,'#4e6565');page.y+=20;
  data.rows.forEach((item,index)=>{
    page=ensureSpace(pages,page,150);page.ctx.strokeStyle='#d7ddd5';page.ctx.lineWidth=2;page.ctx.beginPath();page.ctx.moveTo(margin,page.y);page.ctx.lineTo(margin+width,page.y);page.ctx.stroke();page.y+=18;
    const range=item.row.kind==='to'?`До ${item.to} руб.`:item.row.kind==='from'?`Свыше ${item.from} руб.`:`От ${item.from} до ${item.to} руб.`;
    drawWrapped(page,`${index+1}. ${range}`,margin,width,'bold 28px Arial',36,'#0b6b61');page.y+=8;
    drawWrapped(page,'Какие показатели проверяем',margin,width,'bold 22px Arial',29,'#132a2b');page.y+=4;
    for(const criterion of item.criteria){page=ensureSpace(pages,page,44);drawWrapped(page,`• ${criterion}`,margin+16,width-16,'21px Arial',28,'#132a2b')}
    page.y+=8;page=ensureSpace(pages,page,80);drawWrapped(page,'Периодичность проверки',margin,width,'bold 22px Arial',29,'#132a2b');page.y+=4;drawWrapped(page,item.periodicity,margin+16,width-16,'21px Arial',28,'#132a2b');page.y+=18;
  });
  pages.push(page);return pages.map(p=>p.canvas);
}
function dataUrlToBytes(dataUrl){const binary=atob(dataUrl.split(',')[1]);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes;}
function asciiBytes(str){return new TextEncoder().encode(str)}
function concatBytes(parts){const total=parts.reduce((n,p)=>n+p.length,0);const out=new Uint8Array(total);let offset=0;for(const part of parts){out.set(part,offset);offset+=part.length}return out;}
function buildPdfFromJpegs(images,width,height){
  const pageW=595.28,pageH=841.89;const objectCount=2+images.length*3;const objects=new Array(objectCount+1);const kids=[];
  images.forEach((img,i)=>{const pageObj=3+i*3,imageObj=pageObj+1,contentObj=pageObj+2;kids.push(`${pageObj} 0 R`);objects[pageObj]=asciiBytes(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im${i+1} ${imageObj} 0 R >> >> /Contents ${contentObj} 0 R >>`);objects[imageObj]=concatBytes([asciiBytes(`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`),img,asciiBytes('\nendstream')]);const content=`q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im${i+1} Do\nQ`;objects[contentObj]=asciiBytes(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`)});
