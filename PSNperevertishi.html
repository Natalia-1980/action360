<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ПСН: карточки-перевертыши</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #cbdbe6 0%, #b8c4d4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
        }

        /* компактный фрейм, ширина 380px — удобно на телефоне */
        .frame {
            width: 380px;
            max-width: 94vw;
            background: #eef2f7;
            border-radius: 36px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .carousel-container {
            padding: 18px 16px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* карточка-перевертыш — высота автоматическая, но фикс для удобства */
        .flip-card {
            background-color: transparent;
            width: 100%;
            height: auto;
            min-height: 340px;
            perspective: 1200px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            min-height: 340px;
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
            border-radius: 28px;
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.2);
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .front, .back {
            position: absolute;
            width: 100%;
            min-height: 340px;
            backface-visibility: hidden;
            border-radius: 28px;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            top: 0;
            left: 0;
        }

        /* лицевая сторона */
        .front {
            background: white;
            border: 1px solid rgba(70, 110, 140, 0.15);
            background: linear-gradient(135deg, #ffffff 0%, #fefefe 100%);
        }

        .front h3 {
            font-size: 0.8rem;
            letter-spacing: 1.2px;
            color: #2c6280;
            border-bottom: 1.5px solid #e2ecf5;
            padding-bottom: 8px;
            width: 100%;
            text-align: center;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .question-text {
            font-size: 1rem;
            line-height: 1.42;
            color: #1e3a5f;
            font-weight: 500;
            text-align: left;
            width: 100%;
            margin: 8px 0;
        }

        .tap-hint {
            margin-top: 18px;
            font-size: 0.6rem;
            color: #7f8fa4;
            background: #eff3f9;
            padding: 4px 12px;
            border-radius: 40px;
            display: inline-block;
            align-self: center;
            font-weight: 500;
        }

        /* оборотная сторона */
        .back {
            background: linear-gradient(125deg, #1f405e 0%, #0f2a3e 100%);
            color: #f5faff;
            transform: rotateY(180deg);
            justify-content: center;
            text-align: left;
        }

        .answer-title {
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(255, 210, 110, 0.25);
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            margin-bottom: 14px;
            width: fit-content;
            letter-spacing: 0.5px;
        }

        .answer-text {
            font-size: 0.85rem;
            line-height: 1.45;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: 20px;
            margin: 6px 0;
            font-weight: 450;
        }

        /* навигация компактная */
        .carousel-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 4px 0 6px;
        }

        .nav-btn {
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            color: #1e4a6e;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:active {
            transform: scale(0.94);
            background: white;
        }

        .counter-badge {
            background: #1e3c72;
            color: white;
            padding: 4px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* прогресс и управление — компактно */
        .progress-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(255, 250, 235, 0.7);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 50px;
            margin-top: 4px;
        }

        .progress-text {
            font-weight: 600;
            color: #1e3a5f;
            font-size: 0.7rem;
        }

        .reset-btn {
            background: #ffffffcc;
            border: none;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.65rem;
            color: #1e3c72;
            transition: 0.1s;
        }

        .reset-btn:active {
            background: white;
            transform: scale(0.96);
        }

        .complete-message {
            text-align: center;
            background: #2a7f6e;
            color: white;
            padding: 5px 10px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 0.65rem;
            margin-top: 8px;
        }

        footer {
            text-align: center;
            font-size: 0.55rem;
            margin-top: 10px;
            color: #4c6f8c;
        }

        /* адаптация для совсем узких */
        @media (max-width: 420px) {
            .frame {
                width: 100%;
            }
            .front, .back {
                padding: 18px 14px;
            }
            .question-text {
                font-size: 0.95rem;
            }
            .answer-text {
                font-size: 0.8rem;
                padding: 12px;
            }
            .flip-card, .flip-card-inner, .front, .back {
                min-height: 320px;
            }
        }
    </style>
</head>
<body>
<div class="frame">
    <div class="carousel-container">
        <!-- карточка-перевертыш -->
        <div class="flip-card" id="flipCard">
            <div class="flip-card-inner">
                <div class="front">
                    <h3>вопрос</h3>
                    <div class="question-text" id="questionText">загрузка...</div>
                    <div class="tap-hint">👆 нажми → перевернуть</div>
                </div>
                <div class="back">
                    <div class="answer-title">ответ</div>
                    <div class="answer-text" id="answerText"></div>
                </div>
            </div>
        </div>

        <!-- навигация -->
        <div class="carousel-nav">
            <button class="nav-btn" id="prevBtn">←</button>
            <span class="counter-badge" id="cardCounter">1 / 10</span>
            <button class="nav-btn" id="nextBtn">→</button>
        </div>

        <!-- прогресс и кнопки -->
        <div class="progress-section">
            <span class="progress-text" id="progressLabel">📘 изучено: 0 / 10</span>
            <div style="display: flex; gap: 6px;">
                <button class="reset-btn" id="resetProgressBtn">сброс</button>
                <button class="reset-btn" id="shuffleBtn">перемешать</button>
            </div>
        </div>
        <div id="completeMessageContainer"></div>
        <footer>переворачивайте и листайте карточки</footer>
    </div>
</div>

<script>
    // --- карточки: правила изменения физических показателей (ПСН) ---
    // все вопросы и ответы приведены к строчному стилю (без капса в заголовках)
    const cardsData = [
        {
            question: "уменьшилось количество торговых точек, помещений или транспорта. что делать и в какой срок?",
            answer: "подать заявление на новый патент (взамен старого) + заявление о пересчете. срок: 10 рабочих дней со дня уменьшения. налог пересчитают за фактический срок действия старого патента."
        },
        {
            question: "увеличилось число сотрудников, налог зависит от их количества. варианты действий?",
            answer: "1) оформить новый патент взамен старого (старый пересчитают). 2) купить дополнительный патент — два патента одновременно. ограничение: общая численность по всем патентам ≤ 15 человек."
        },
        {
            question: "увеличилось количество сотрудников, но налог на патенте не зависит от их числа. нужно ли переоформлять патент?",
            answer: "нет, переоформлять не требуется. если физический показатель не влияет на налог, изменения не влекут пересчета."
        },
        {
            question: "что будет, если ип при увеличении показателей (налог зависит от них) не оформит новый патент и не совмещает псн с другими режимами?",
            answer: "доходы сверх показателей старого патента облагаются по осно. придется сдавать декларации по ндфл и ндс."
        },
        {
            question: "у ип патент с 1 января по 31 декабря на 3 помещения. в марте одно продали. когда подать заявление на пересчет?",
            answer: "в течение 10 рабочих дней с даты продажи. налог пересчитают: с 1 января до даты продажи — по 3 помещениям, после — по 2."
        },
        {
            question: "какие документы подать при уменьшении физических показателей (сотрудников, объектов)?",
            answer: "1) заявление на новый патент (взамен старого). 2) заявление в произвольной форме о пересчете налога по старому патенту."
        },
        {
            question: "при подаче заявления на новый патент взамен старого (увеличение показателей) что нужно указать обязательно?",
            answer: "номер и дату выдачи старого патента — это позволяет налоговой пересчитать ранее выданный патент."
        },
        {
            question: "можно ли при увеличении численности сотрудников оставить старый патент и купить дополнительный? какое ограничение?",
            answer: "да, можно. будут два патента. ограничение: общая численность по всем патентам ≤ 15 человек."
        },
        {
            question: "как налоговая пересчитывает стоимость патента при уменьшении показателей (меньше транспорта)?",
            answer: "налог пересчитывают исходя из фактического срока действия старого патента: с даты начала до даты уменьшения показателей. остаток — по новому патенту."
        },
        {
            question: "ип совмещает псн + усн, увеличил физический показатель (налог зависит от него), но не оформил новый патент. куда отнести «лишние» доходы?",
            answer: "доходы сверх патента можно учитывать в рамках усн (если соблюдаются лимиты). если псн без совмещения — доходы попадают на осно."
        }
    ];

    // --- состояние ---
    let currentCardsOrder = [...cardsData];
    let studiedStatus = new Array(currentCardsOrder.length).fill(false);
    let flippedStatus = new Array(currentCardsOrder.length).fill(false);
    let currentIndex = 0;

    // dom
    const flipCardEl = document.getElementById('flipCard');
    const questionText = document.getElementById('questionText');
    const answerText = document.getElementById('answerText');
    const cardCounterSpan = document.getElementById('cardCounter');
    const progressLabel = document.getElementById('progressLabel');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetProgressBtn = document.getElementById('resetProgressBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const completeMessageContainer = document.getElementById('completeMessageContainer');

    function updateProgressUI() {
        const studiedCount = studiedStatus.filter(v => v === true).length;
        const total = currentCardsOrder.length;
        progressLabel.innerText = `📘 изучено: ${studiedCount} / ${total}`;
        if (studiedCount === total && total > 0) {
            completeMessageContainer.innerHTML = '<div class="complete-message">🎉 все правила изучены! 🎉</div>';
        } else {
            completeMessageContainer.innerHTML = '';
        }
    }

    function updateCardDisplay() {
        const card = currentCardsOrder[currentIndex];
        questionText.innerText = card.question;
        answerText.innerText = card.answer;
        cardCounterSpan.innerText = `${currentIndex + 1} / ${currentCardsOrder.length}`;
        
        if (flippedStatus[currentIndex]) {
            flipCardEl.classList.add('flipped');
        } else {
            flipCardEl.classList.remove('flipped');
        }
    }

    function markCurrentAsStudied() {
        if (!studiedStatus[currentIndex]) {
            studiedStatus[currentIndex] = true;
            updateProgressUI();
        }
    }

    function toggleFlip() {
        flippedStatus[currentIndex] = !flippedStatus[currentIndex];
        if (flippedStatus[currentIndex]) {
            markCurrentAsStudied();
        }
        updateCardDisplay();
    }

    function nextCard() {
        flippedStatus[currentIndex] = false;
        currentIndex = (currentIndex + 1) % currentCardsOrder.length;
        flippedStatus[currentIndex] = false;
        updateCardDisplay();
    }

    function prevCard() {
        flippedStatus[currentIndex] = false;
        currentIndex = (currentIndex - 1 + currentCardsOrder.length) % currentCardsOrder.length;
        flippedStatus[currentIndex] = false;
        updateCardDisplay();
    }

    function resetProgress() {
        for (let i = 0; i < studiedStatus.length; i++) {
            studiedStatus[i] = false;
            flippedStatus[i] = false;
        }
        updateProgressUI();
        updateCardDisplay();
    }

    function shuffleCards() {
        const items = currentCardsOrder.map((card, idx) => ({
            card: card,
            studied: studiedStatus[idx],
            flipped: false
        }));
        for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
        }
        currentCardsOrder = items.map(item => item.card);
        studiedStatus = items.map(item => item.studied);
        flippedStatus = new Array(currentCardsOrder.length).fill(false);
        currentIndex = 0;
        updateProgressUI();
        updateCardDisplay();
    }

    // обработчики
    flipCardEl.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFlip();
    });
    prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        prevCard();
    });
    nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        nextCard();
    });
    resetProgressBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetProgress();
    });
    shuffleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        shuffleCards();
    });

    // инициализация
    function init() {
        currentCardsOrder = [...cardsData];
        studiedStatus = new Array(currentCardsOrder.length).fill(false);
        flippedStatus = new Array(currentCardsOrder.length).fill(false);
        currentIndex = 0;
        updateProgressUI();
        updateCardDisplay();
    }
    init();
</script>
</body>
</html>
