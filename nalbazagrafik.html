<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Налоговые базы РФ — тренажер карточек</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1rem;
            color: #0a1c2f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* строка: стрелка + карточка + стрелка */
        .card-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        /* стрелки-кнопки сбоку */
        .side-arrow {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.8rem;
            font-weight: bold;
            color: #1e3c72;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
            user-select: none;
        }

        .side-arrow:active {
            background: #eef2ff;
            transform: scale(0.94);
        }

        .flashcard {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            flex: 1;
        }

        .card-inner {
            padding: 1.2rem 1rem;
        }

        .badge-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.7rem;
        }

        .tax-type {
            font-weight: 700;
            font-size: 1rem;
            color: #1e3c72;
            line-height: 1.3;
        }

        .code-badge {
            background: #eef2ff;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #1e3c72;
            font-family: monospace;
        }

        .rate-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.7rem 0;
        }

        .rate-pill {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 0.25rem 0.85rem;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            font-family: monospace;
        }

        .desc {
            font-size: 0.8rem;
            color: #2c3e50;
            margin: 0.5rem 0 0.3rem;
            line-height: 1.4;
        }

        .deduct-badge {
            display: inline-block;
            font-size: 0.7rem;
            background: #e6f7ec;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            color: #2c6e2f;
            font-weight: 500;
            margin-right: 0.5rem;
        }

        .no-deduct {
            background: #ffe8e6;
            color: #b91c1c;
        }

        .extra-note {
            font-size: 0.7rem;
            color: #5b6e8c;
            margin-top: 0.6rem;
            border-top: 1px solid #edf2f7;
            padding-top: 0.6rem;
        }

        .counter {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: #4b5565;
            background: rgba(255,255,240,0.8);
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            display: inline-block;
            margin: 0 auto 0.8rem;
            width: fit-content;
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 0.45rem;
            margin: 0.5rem 0 0.2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #cbd5e1;
            border-radius: 10px;
            transition: 0.2s;
        }

        .dot.active {
            background: #2a5298;
            width: 18px;
        }

        footer {
            text-align: center;
            font-size: 0.65rem;
            color: #7e8b9f;
            margin-top: 1rem;
        }

        @media (max-width: 550px) {
            body {
                padding: 0.75rem;
            }
            .card-inner {
                padding: 1rem 0.9rem;
            }
            .tax-type {
                font-size: 0.9rem;
            }
            .side-arrow {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
            .card-row {
                gap: 0.3rem;
            }
        }
    </style>
</head>
<body>
<div class="card-container">
    <div style="display: flex; justify-content: center; margin-bottom: 0.5rem;">
        <div class="counter" id="cardCounter">1 / 7</div>
    </div>

    <!-- строка: левая стрелка + карточка + правая стрелка -->
    <div class="card-row">
        <div class="side-arrow" id="prevArrow">←</div>
        <div class="flashcard" id="flashcard">
            <div class="card-inner" id="cardInner">
                <!-- содержимое будет вставлено JS -->
            </div>
        </div>
        <div class="side-arrow" id="nextArrow">→</div>
    </div>
    
    <div class="progress-dots" id="progressDots"></div>
    <footer>Тренажер: виды налоговых баз, ставки и вычеты по НК РФ</footer>
</div>

<script>
    // массив карточек — все "ё" заменены на "е"
    const cards = [
        {
            title: "Инвестиционные доходы",
            code: "п.6,6.1,6.2 ст.210",
            rates: ["до 2,4 млн руб. → 13%", "свыше 2,4 млн руб. → 15%"],
            description: "Дивиденды, доходы от продажи имущества, выплаты по договорам страхования.",
            deductStatus: "вычеты возможны",
            deductText: "Некоторые виды вычетов: имущественные вычеты по ст.220 НК при продаже имущества.",
            extra: ""
        },
        {
            title: "Выплаты участникам СВО, северные надбавки, районные коэффициенты",
            code: "п.6.2 ст.210",
            rates: ["до 5 млн руб. → 13%", "свыше 5 млн руб. → 15%"],
            description: "Специальные выплаты, северные надбавки и районные коэффициенты.",
            deductStatus: "вычетов нет",
            deductText: "Как правило, вычетов нет, но остаток вычета с основной базы можно перенести (абз.2 п.6.2 ст.210 НК).",
            extra: ""
        },
        {
            title: "Основная база (зарплата, отпускные, больничные, ГПД и др.)",
            code: "+ вычеты ст.218-220",
            rates: [
                "до 2,4 млн руб. → 13%",
                "2,4–5 млн руб. → 15%",
                "5–20 млн руб. → 18%",
                "20–50 млн руб. → 20%",
                "свыше 50 млн руб. → 22%"
            ],
            description: "Зарплата, отпускные, больничные, выплаты по договорам ГПХ и другие доходы.",
            deductStatus: "вычеты применяются",
            deductText: "Стандартные, социальные, имущественные вычеты по ст.218-220 НК.",
            extra: ""
        },
        {
            title: "Другие доходы (азартные игры, лотереи, КИК, цифровая валюта, инвест.товарищество)",
            code: "без вычетов",
            rates: [
                "до 2,4 млн руб. → 13%",
                "2,4–5 млн руб. → 15%",
                "5–20 млн руб. → 18%",
                "20–50 млн руб. → 20%",
                "свыше 50 млн руб. → 22%"
            ],
            description: "Выигрыши в азартных играх и лотереях, доходы участников инвестиционного товарищества, прибыль КИК, доходы в виде цифровой валюты.",
            deductStatus: "вычетов нет",
            deductText: "Вычеты по ст.218-220 НК не предоставляются.",
            extra: ""
        },
        {
            title: "Ставка 35%",
            code: "п.2 ст.224",
            rates: ["35%"],
            description: "Любые выигрыши и призы в конкурсах, играх и других мероприятиях в целях рекламы (сверх лимита), материальная выгода от экономии на процентах по займам, плата за использование средств пайщиков.",
            deductStatus: "вычетов нет",
            deductText: "Налоговые вычеты по ст.218-220 не применяются.",
            extraNote: "Выигрыши и призы сверх 4 тыс. руб. облагаются по ставке 35%."
        },
        {
            title: "Ставка 9%",
            code: "п.5 ст.224",
            rates: ["9%"],
            description: "Проценты по облигациям с ипотечным покрытием.",
            deductStatus: "вычетов нет",
            deductText: "Вычеты не предусмотрены.",
            extra: ""
        },
        {
            title: "Ставка 30%",
            code: "п.6 ст.224",
            rates: ["30%"],
            description: "Доходы по ценным бумагам на счетах депо.",
            deductStatus: "вычетов нет",
            deductText: "Вычеты по ст.218-220 НК не применяются.",
            extra: ""
        }
    ];

    let currentIndex = 0;
    const totalCards = cards.length;

    const cardInner = document.getElementById('cardInner');
    const counterSpan = document.getElementById('cardCounter');
    const dotsContainer = document.getElementById('progressDots');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');

    function renderCard(index) {
        const card = cards[index];
        if (!card) return;

        let ratesHtml = '';
        card.rates.forEach(rate => {
            ratesHtml += `<span class="rate-pill">${rate}</span>`;
        });

        let deductClass = (card.deductStatus === 'вычетов нет' || card.deductStatus === 'вычеты не применяются') ? 'no-deduct' : '';
        let deductLabel = card.deductStatus;
        
        let extraHtml = '';
        if (card.extraNote) {
            extraHtml = `<div class="extra-note">⚡ ${card.extraNote}</div>`;
        } else if (card.extra && card.extra !== '') {
            extraHtml = `<div class="extra-note">${card.extra}</div>`;
        }

        const descriptionText = card.description ? card.description : '';
        
        const html = `
            <div class="badge-row">
                <span class="tax-type">${card.title}</span>
                <span class="code-badge">${card.code}</span>
            </div>
            <div class="rate-pills">
                ${ratesHtml}
            </div>
            <div class="desc">
                ${descriptionText}
            </div>
            <div style="margin-top: 0.6rem;">
                <span class="deduct-badge ${deductClass}">${deductLabel}</span>
                <span style="font-size: 0.75rem; color: #2c3e50;">${card.deductText}</span>
            </div>
            ${extraHtml}
        `;
        cardInner.innerHTML = html;
        counterSpan.innerText = `${index+1} / ${totalCards}`;
        updateDots(index);
    }

    function updateDots(activeIdx) {
        if (!dotsContainer) return;
        let dotsHtml = '';
        for (let i = 0; i < totalCards; i++) {
            dotsHtml += `<div class="dot ${i === activeIdx ? 'active' : ''}"></div>`;
        }
        dotsContainer.innerHTML = dotsHtml;
    }

    function nextCard() {
        if (currentIndex < totalCards - 1) {
            currentIndex++;
            renderCard(currentIndex);
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCard(currentIndex);
        }
    }

    // обработчики стрелок
    prevArrow.addEventListener('click', prevCard);
    nextArrow.addEventListener('click', nextCard);

    // свайп для мобильных
    let touchStartX = 0;
    let touchEndX = 0;
    const flashcard = document.getElementById('flashcard');
    
    flashcard.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});
    
    flashcard.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const deltaX = touchEndX - touchStartX;
        if (deltaX < -40) {
            nextCard();
        } else if (deltaX > 40) {
            prevCard();
        }
    }, {passive: true});

    // инициализация
    renderCard(0);
</script>
</body>
</html>
