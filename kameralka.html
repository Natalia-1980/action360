<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Камеральная проверка | Льготы и документы</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #eef2f7 0%, #d4dfe9 100%);
            font-family: 'Inter', sans-serif;
            padding: 0.6rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            max-width: 460px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 1.1rem;
            overflow: hidden;
            box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.12);
        }

        .main-header {
            background: #0b2b38;
            padding: 0.5rem 0.9rem;
            color: white;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.3rem;
        }
        .title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .badge {
            background: #ffb347;
            color: #1e2a36;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.5rem;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e2eaf0;
            background: #ffffff;
            padding: 0 0.5rem;
            gap: 0.3rem;
        }
        .tab-btn {
            background: transparent;
            border: none;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.6rem 0.2rem 0.45rem 0.2rem;
            cursor: pointer;
            color: #4b6f82;
            transition: 0.2s;
            position: relative;
            white-space: nowrap;
        }
        .tab-btn.active {
            color: #1f6e4a;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1f6e4a;
            border-radius: 2px;
        }
        .tab-content {
            display: none;
            padding: 0.65rem 0.65rem 0.9rem 0.65rem;
            background: #ffffff;
        }
        .tab-content.active-tab {
            display: block;
        }

        .section {
            margin-bottom: 0.7rem;
            border-radius: 0.7rem;
            overflow: hidden;
            border: 1px solid #e9edf2;
        }
        .section-header {
            padding: 0.35rem 0.6rem;
            font-weight: 700;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f4f7fb;
        }
        .section-header.decl {
            background: #e8f3ed;
            color: #1f6e4a;
            border-bottom: 1px solid #cde3d4;
        }
        .section-header.request {
            background: #fef3e8;
            color: #b45f1b;
            border-bottom: 1px solid #f3e0ce;
        }
        .checklist {
            list-style: none;
            padding: 0.4rem 0.6rem 0.5rem 0.6rem;
            background: #ffffff;
        }
        .checklist li {
            margin-bottom: 0.4rem;
            font-size: 0.68rem;
            line-height: 1.3;
            display: flex;
            gap: 5px;
            align-items: flex-start;
            word-break: break-word;
        }
        .checklist li::before {
            content: "•";
            font-weight: 800;
            font-size: 0.75rem;
            flex-shrink: 0;
            color: #5a6e7c;
        }
        .decl-list li::before {
            content: "📄";
            color: #2b7a4b;
            font-size: 0.7rem;
        }
        .request-list li::before {
            content: "🔍";
            color: #e67e22;
            font-size: 0.7rem;
        }
        .subnote {
            font-size: 0.58rem;
            background: #f8f9fc;
            padding: 0.25rem 0.6rem;
            border-radius: 18px;
            color: #2c5a6e;
            margin-top: 0.4rem;
            display: inline-block;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.45rem 0.7rem 0.6rem 0.7rem;
            background: #ffffff;
            border-top: 1px solid #e5edf2;
        }
        .nav-btn {
            background: #1f566b;
            border: none;
            color: white;
            font-size: 0.9rem;
            width: 28px;
            height: 28px;
            border-radius: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .dots-group {
            display: flex;
            gap: 4px;
            background: #eff3f8;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
        }
        .dot {
            width: 5px;
            height: 5px;
            background: #b9cedb;
            border-radius: 5px;
            transition: 0.2s;
            cursor: pointer;
        }
        .dot.active {
            background: #1f566b;
            width: 16px;
        }
        .counter {
            font-size: 0.55rem;
            font-weight: 600;
            color: #2a5f6e;
        }
        .industry-name-line {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f0f4f9;
            padding: 0.25rem 0.6rem;
            border-radius: 28px;
            margin-bottom: 0.7rem;
            font-weight: 700;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="main-header">
            <div class="title"><span>📋</span> Камеральная проверка</div>
            <div class="badge">льготы и документы</div>
        </div>
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" data-tab="industry">🏭 Отраслевые</button>
            <button class="tab-btn" data-tab="territory">🗺️ Территориальные</button>
        </div>
        <div id="industryTab" class="tab-content active-tab"></div>
        <div id="territoryTab" class="tab-content"></div>
        <div class="nav-bar" id="navBar"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // ОТРАСЛЕВЫЕ ДАННЫЕ (полные формулировки, компактная верстка)
    // --------------------------------------------------------------
    const industries = [
        {
            name: "ИТ-компании",
            icon: "💻",
            submitList: [
                "Декларацию по налогу на прибыль или НДС (в зависимости от режима)",
                "Реестр по форме КНД 1155127 при льготе по НДС в разделе 7"
            ],
            requestList: [
                "Выписку из реестра аккредитованных ИТ-компаний Минцифры",
                "Договоры с заказчиками на ИТ-услуги, ИТ-продукты (разработка ПО, внедрение, сопровождение, консультации)",
                "Акты выполненных работ и оказанных услуг к договорам",
                "Счета-фактуры и УПД",
                "Расшифровку доходов по субсчетам бухучета (например, 90.1 с аналитикой)",
                "Сведения о продуктах в реестре российского ПО (наименование, номер, доход)",
                "Соглашение с вузом (для крупных ИТ-компаний с выручкой от 1 млрд руб.)"
            ]
        },
        {
            name: "Радиоэлектронная промышленность",
            icon: "📡",
            submitList: [
                "Декларацию по налогу на прибыль",
                "Бухгалтерскую отчетность, РСВ"
            ],
            requestList: [
                "Выписку из ГИПС",
                "Расчет доли доходов от деятельности, договоры, акты, счета-фактуры, УПД",
                "Патенты на изобретения, полезные модели, конструкторскую и технологическую документацию",
                "Протоколы испытаний, результаты разработок, договоры на разработку и проектирование",
                "Трудовые договоры инженеров-разработчиков, штатное расписание, должностные инструкции"
            ]
        },
        {
            name: "Медицина",
            icon: "🏥",
            submitList: [
                "Вместе с годовой декларацией по прибыли — форму КНД 1150022 (доля доходов, численность штата, численность медиков)",
                "Декларацию по НДС с разделом 7 (код операции 1010211)",
                "Электронный реестр по форме КНД 1155127 при льготе по НДС"
            ],
            requestList: [
                "Копии лицензий на медицинскую деятельность",
                "Договоры, акты, подтверждающие доходы от меддеятельности",
                "Штатное расписание, трудовые договоры, приказы, сертификаты специалистов, свидетельства об аккредитации",
                "Данные об отсутствии операций с векселями и ПФИ",
                "Для освобождения от НДС: протоколы врачебных комиссий, направления, медицинские карты",
                "Договоры и акты с пациентами (медицинская терминология), документы по ОМС",
                "Регистрационные удостоверения на медицинские изделия",
                "Пояснения или реестр подтверждающих документов в электронной форме"
            ]
        },
        {
            name: "Образование",
            icon: "🎓",
            submitList: [
                "Заявление на ставку 0% (за месяц до начала налогового периода)",
                "Сведения о дате выдачи и регистрационном номере лицензии",
                "По итогам года — форму КНД 1150022 (доля доходов, численность штата)",
                "Декларацию по НДС с разделом 7 (код 1010245) и электронный реестр по форме КНД 1155127"
            ],
            requestList: [
                "Копию лицензии на образовательную деятельность",
                "Договоры, акты, подтверждающие доходы от образовательной деятельности",
                "Штатное расписание, трудовые договоры, приказы",
                "Данные об отсутствии операций с векселями и ПФИ",
                "Документы, подтверждающие включение вида деятельности в Перечень №917",
                "Для НДС: договоры с формулировками образовательных услуг, программы обучения",
                "Акты, реестры обучающихся, журналы занятий, отчеты",
                "Документы по раздельному учету"
            ]
        },
        {
            name: "Общепит",
            icon: "🍽️",
            submitList: [
                "Декларацию по НДС: титульный лист, раздел 1 с прочерками, раздел 7",
                "В разделе 7 — код 1011214, стоимость услуг, данные по покупкам без НДС",
                "При восстановлении НДС — раздел 3 и приложение 1"
            ],
            requestList: [
                "Выписку из ЕГРЮЛ или ЕГРИП с кодом ОКВЭД 56",
                "Бухгалтерскую справку-расчет: доходы и удельный вес от общепита за прошлый год",
                "Регистры налогового учета",
                "РСВ и бухгалтерскую справку о среднемесячных выплатах сотрудникам",
                "Скриншот из ЕМИСС со среднеотраслевой зарплатой в общепите",
                "Реестр по форме КНД 1155127 в электронном виде",
                "Пояснения, договоры, акты, документы по раздельному учету"
            ]
        }
    ];

    // --------------------------------------------------------------
    // ТЕРРИТОРИАЛЬНЫЕ ДАННЫЕ (полные формулировки, компактно)
    // --------------------------------------------------------------
    const territories = [
        {
            name: "ТОР и СПВ",
            icon: "🏭",
            submitList: [
                "Пониженные ставки налога на прибыль — код «03» в Листе 02 и приложениях по реквизиту «Признак налогоплательщика (код)»",
                "Расчет капвложений, расходов на НИОКР, а также сумм преференций на 31 декабря прошлого года (срок — не позднее 25 марта текущего года)"
            ],
            requestList: [
                "Бухотчетность с отметкой налоговиков",
                "Акты налоговых проверок",
                "Платежные документы на инвестиции (поручения, выписки банка)",
                "Договоры с контрагентами, допсоглашения или выписки из них",
                "Акты о приемке выполненных работ и услуг",
                "Штатное расписание с приказами о приеме на работу",
                "Для объектов капстроительства — заключение госэкспертизы проектной документации",
                "Для СПВ дополнительно: приказ о создании новых рабочих мест, список сотрудников на новых местах, копии трудовых договоров, копия соглашения с АО «КРДВ» с перечнем рабочих мест"
            ]
        },
        {
            name: "ОЭЗ",
            icon: "🏗️",
            submitList: [
                "Стандартные отчеты + раздельный учет доходов и расходов в ОЭЗ и за ее пределами",
                "Расчет пропорции — не менее 90% дохода от основного вида деятельности"
            ],
            requestList: [
                "Документы о деятельности резидента за период проверки",
                "Документы о выполнении обязательств по соглашению (создание рабочих мест, объем капвложений и др.)",
                "Регистры налогового и бухучета, бухотчетность, расшифровки строк декларации",
                "Документы о соблюдении пропорции по доходам"
            ]
        },
        {
            name: "Сколково",
            icon: "⚡",
            submitList: [
                "Годовую отчетность в Фонд: данные о НИОКР, результатах, коммерциализации, финансовом состоянии. Приложения: бухотчетность, копии ключевых договоров, актов, патенты или заявки на ИС",
                "Квартальные и полугодовые отчеты с ключевыми показателями, промежуточными результатами НИОКР, численностью персонала, финансовыми показателями",
                "При ставке 0% после прекращения освобождения — декларацию по налогу на прибыль",
                "Декларацию по налогу на имущество (при наличии объектов)"
            ],
            requestList: [
                "К годовой отчетности: технический отчет о НИОКР, лабораторные журналы, исходный код, фото прототипов",
                "Бухотчетность, документы для проверки доходных и расходных операций",
                "Договоры для проверки связи с инновационным проектом",
                "Документы об отсутствии перепродажи товаров, работ или услуг",
                "Документацию на доработку объекта коммерциализации (для ИТ — скриншоты с новым функционалом ПО)",
                "Договоры займа",
                "Пояснения об агентской деятельности и расходную базу при привлечении подрядчиков"
            ]
        }
    ];

    let currentIndustryIdx = 0;
    let currentTerritoryIdx = 0;
    const industryTab = document.getElementById("industryTab");
    const territoryTab = document.getElementById("territoryTab");
    const navBar = document.getElementById("navBar");

    function renderIndustryTab() {
        const ind = industries[currentIndustryIdx];
        const headerHtml = `<div class="industry-name-line"><span>${ind.icon}</span> <span>${ind.name}</span></div>`;
        let submitHtml = '', requestHtml = '';
        if (ind.submitList.length) {
            submitHtml = `<div class="section"><div class="section-header decl">📋 Представляют в ИФНС</div><ul class="checklist decl-list">${ind.submitList.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
        }
        if (ind.requestList.length) {
            requestHtml = `<div class="section"><div class="section-header request">🔍 Могут запросить дополнительно на камеральной проверке</div><ul class="checklist request-list">${ind.requestList.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
        }
        industryTab.innerHTML = headerHtml + submitHtml + requestHtml + `<div class="subnote">💡 Налоговая вправе запросить любые документы, подтверждающие право на льготу (п.6 ст.88 НК).</div>`;
        updateIndustryDots();
    }

    function updateIndustryDots() {
        const dotsContainer = document.getElementById("industryDots");
        if (!dotsContainer) {
            navBar.innerHTML = `<button class="nav-btn" id="prevIndustryBtn">←</button><div style="display:flex;align-items:center;gap:6px;"><div class="dots-group" id="industryDots"></div><span class="counter" id="industryCounter"></span></div><button class="nav-btn" id="nextIndustryBtn">→</button>`;
            document.getElementById("prevIndustryBtn")?.addEventListener("click", () => { currentIndustryIdx = (currentIndustryIdx - 1 + industries.length) % industries.length; renderIndustryTab(); });
            document.getElementById("nextIndustryBtn")?.addEventListener("click", () => { currentIndustryIdx = (currentIndustryIdx + 1) % industries.length; renderIndustryTab(); });
        }
        const dots = document.getElementById("industryDots");
        const counter = document.getElementById("industryCounter");
        if (dots) {
            dots.innerHTML = industries.map((_, i) => `<div class="dot ${i === currentIndustryIdx ? 'active' : ''}" data-idx="${i}"></div>`).join('');
            if (counter) counter.innerText = `${currentIndustryIdx+1}/${industries.length}`;
            document.querySelectorAll("#industryDots .dot").forEach(dot => {
                dot.addEventListener("click", (e) => {
                    const idx = parseInt(e.currentTarget.getAttribute("data-idx"));
                    if (!isNaN(idx) && idx !== currentIndustryIdx) { currentIndustryIdx = idx; renderIndustryTab(); }
                });
            });
        }
    }

    function renderTerritoryTab() {
        const terr = territories[currentTerritoryIdx];
        const headerHtml = `<div class="industry-name-line"><span>${terr.icon}</span> <span>${terr.name}</span></div>`;
        const submitHeader = (terr.name === "Сколково") ? "Представляют в ИФНС и Фонд" : "Представляют в ИФНС";
        let submitHtml = '', requestHtml = '';
        if (terr.submitList.length) {
            submitHtml = `<div class="section"><div class="section-header decl">📋 ${submitHeader}</div><ul class="checklist decl-list">${terr.submitList.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
        }
        if (terr.requestList.length) {
            requestHtml = `<div class="section"><div class="section-header request">🔍 Могут запросить дополнительно на камеральной проверке</div><ul class="checklist request-list">${terr.requestList.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
        }
        territoryTab.innerHTML = headerHtml + submitHtml + requestHtml + `<div class="subnote">⚠️ Ведите раздельный учет операций по льготной территории и храните все подтверждающие документы.</div>`;
        updateTerritoryDots();
    }

    function updateTerritoryDots() {
        const dotsContainer = document.getElementById("territoryDots");
        if (!dotsContainer) return;
        const counter = document.getElementById("territoryCounter");
        dotsContainer.innerHTML = territories.map((_, i) => `<div class="dot ${i === currentTerritoryIdx ? 'active' : ''}" data-idx="${i}"></div>`).join('');
        if (counter) counter.innerText = `${currentTerritoryIdx+1}/${territories.length}`;
        document.querySelectorAll("#territoryDots .dot").forEach(dot => {
            dot.addEventListener("click", (e) => {
                const idx = parseInt(e.currentTarget.getAttribute("data-idx"));
                if (!isNaN(idx) && idx !== currentTerritoryIdx) { currentTerritoryIdx = idx; renderTerritoryTab(); }
            });
        });
    }

    function setActiveTab(tabId) {
        const industryDiv = document.getElementById("industryTab");
        const territoryDiv = document.getElementById("territoryTab");
        const btns = document.querySelectorAll(".tab-btn");
        btns.forEach(btn => btn.classList.toggle("active", btn.getAttribute("data-tab") === tabId));
        if (tabId === "industry") {
            industryDiv.classList.add("active-tab");
            territoryDiv.classList.remove("active-tab");
            navBar.innerHTML = `<button class="nav-btn" id="prevIndustryBtn">←</button><div style="display:flex;align-items:center;gap:6px;"><div class="dots-group" id="industryDots"></div><span class="counter" id="industryCounter"></span></div><button class="nav-btn" id="nextIndustryBtn">→</button>`;
            document.getElementById("prevIndustryBtn")?.addEventListener("click", () => { currentIndustryIdx = (currentIndustryIdx - 1 + industries.length) % industries.length; renderIndustryTab(); });
            document.getElementById("nextIndustryBtn")?.addEventListener("click", () => { currentIndustryIdx = (currentIndustryIdx + 1) % industries.length; renderIndustryTab(); });
            renderIndustryTab();
        } else {
            industryDiv.classList.remove("active-tab");
            territoryDiv.classList.add("active-tab");
            navBar.innerHTML = `<button class="nav-btn" id="prevTerritoryBtn">←</button><div style="display:flex;align-items:center;gap:6px;"><div class="dots-group" id="territoryDots"></div><span class="counter" id="territoryCounter"></span></div><button class="nav-btn" id="nextTerritoryBtn">→</button>`;
            document.getElementById("prevTerritoryBtn")?.addEventListener("click", () => { currentTerritoryIdx = (currentTerritoryIdx - 1 + territories.length) % territories.length; renderTerritoryTab(); });
            document.getElementById("nextTerritoryBtn")?.addEventListener("click", () => { currentTerritoryIdx = (currentTerritoryIdx + 1) % territories.length; renderTerritoryTab(); });
            renderTerritoryTab();
        }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => setActiveTab(btn.getAttribute("data-tab")));
    });
    setActiveTab("industry");
</script>
</body>
</html>
