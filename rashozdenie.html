<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Камеральная проверка | Расхождения БУ и НУ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #eef2f5;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .main-tabs {
            display: flex;
            gap: 0;
            background: #fafbfd;
            border-bottom: 1px solid #e2e6ea;
            padding: 0 16px;
        }
        .main-tab {
            padding: 14px 20px;
            font-size: 0.83rem;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #6c7a8a;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .main-tab.active {
            color: #2a4058;
            border-bottom: 2px solid #7a8c9e;
        }
        .two-columns {
            display: flex;
        }
        .sidebar {
            width: 220px;
            background: #fafbfd;
            border-right: 1px solid #e8ecef;
            padding: 12px 0;
            flex-shrink: 0;
        }
        .cat-list {
            display: flex;
            flex-direction: column;
        }
        .cat-item {
            padding: 10px 14px;
            font-size: 0.83rem;
            font-weight: 500;
            cursor: pointer;
            color: #5a6e7e;
            background: transparent;
            border: none;
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .cat-item:hover {
            background: #edf0f4;
        }
        .cat-item.active {
            background: #e8edf2;
            color: #2a4058;
            font-weight: 600;
            border-left: 3px solid #7a8c9e;
        }
        .cat-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: #dce2e8;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #5a6e7e;
            flex-shrink: 0;
        }
        .cat-item.active .cat-number {
            background: #7a8c9e;
            color: white;
        }
        .content-area {
            flex: 1;
            padding: 16px;
            background: white;
            min-width: 0;
        }
        .info-card {
            background: #fafbfc;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #e2e6ea;
        }
        .desc-text {
            font-size: 0.83rem;
            line-height: 1.6;
            color: #4a5b6e;
        }
        .desc-text .main-point {
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .desc-text .main-point strong {
            color: #2a4058;
            font-weight: 700;
        }
        .desc-text .sub-list {
            list-style: none;
            padding-left: 24px;
            margin-top: 4px;
            margin-bottom: 6px;
        }
        .desc-text .sub-list li {
            padding-left: 16px;
            position: relative;
            margin-bottom: 4px;
        }
        .desc-text .sub-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #7a8c9e;
            font-weight: 700;
        }
        .example-block {
            margin-top: 12px;
            padding: 12px 16px;
            background: #f0f4f8;
            border-radius: 8px;
            border-left: 3px solid #7a8c9e;
        }
        .example-block strong {
            color: #2a4058;
            font-weight: 600;
        }
        .example-block .formula {
            margin-top: 6px;
            padding-left: 8px;
            font-size: 0.8rem;
        }
        .desc-text strong {
            font-weight: 600;
            color: #2a4058;
        }
        .sub-tabs {
            display: flex;
            gap: 4px;
            background: #f5f7fa;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .sub-tab {
            padding: 6px 16px;
            font-size: 0.78rem;
            font-weight: 600;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #6c7a8a;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .sub-tab.active {
            background: white;
            color: #2a4058;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .sub-tab:hover {
            background: #e8edf2;
        }
        .compare-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 0.78rem;
        }
        .compare-table th {
            background: #e8edf2;
            color: #2a4058;
            font-weight: 600;
            padding: 8px 10px;
            text-align: left;
            border: 1px solid #dce2e8;
        }
        .compare-table td {
            padding: 8px 10px;
            border: 1px solid #dce2e8;
            vertical-align: top;
            color: #4a5b6e;
        }
        .compare-table tr:nth-child(even) td {
            background: #f5f7fa;
        }
        .table-caption {
            font-weight: 600;
            margin-bottom: 6px;
            color: #2a4058;
        }
        @media (max-width: 600px) {
            .sidebar { width: 140px; }
            .cat-item { font-size: 0.7rem; padding: 8px 10px; }
            .content-area { padding: 10px; }
            .main-tab { padding: 10px 14px; font-size: 0.75rem; }
        }
        @media (max-width: 480px) {
            .two-columns { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e2e6ea; }
            .cat-list { flex-direction: row; flex-wrap: wrap; }
            .cat-item { width: auto; padding: 8px 14px; }
            .cat-item.active { border-left: none; border-bottom: 3px solid #7a8c9e; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-tabs">
        <button class="main-tab active" data-main-tab="zones">Основные расхождения</button>
        <button class="main-tab" data-main-tab="top">Топ причин для запроса от инспекции</button>
    </div>

    <div id="zonesPanel" class="two-columns">
        <div class="sidebar" id="zonesSidebar"></div>
        <div class="content-area">
            <div id="zonesSubTabs" class="sub-tabs"></div>
            <div id="zonesContent"></div>
        </div>
    </div>

    <div id="topPanel" class="two-columns" style="display: none;">
        <div class="sidebar">
            <div class="cat-list" id="topSidebar"></div>
        </div>
        <div class="content-area">
            <div id="topContent"></div>
        </div>
    </div>
</div>

<script>
    const zonesData = {
        revenue: {
            name: "Учет выручки",
            number: "1",
            group: "Доходы",
            description: `
                <div class="main-point"><strong>1.</strong> В целом даты учета в бухучете и налоговом учете совпадают: для товара — дата перехода права собственности, для работ — дата акта, для услуг — дата оказания услуг.</div>
                <div class="main-point"><strong>2.</strong> Разницы возникают в отдельных случаях:</div>
                <ul class="sub-list">
                    <li>продажа недвижимости: в БУ выручку учтут на дату регистрации перехода права собственности в ЕГРН, в налоговом — на дату передачи покупателю по акту;</li>
                    <li>переход права собственности после оплаты: в БУ выручку учитывают после перехода права, в НУ — на дату, когда передали товар.</li>
                </ul>
                <div class="example-block">
                    <strong>Пример:</strong> Здание торгового центра передали покупателю по акту 10 июня. Право собственности покупатель зарегистрировал в ЕГРН 25 июня. В бухучете компания признает выручку 25 июня (п. 6 ПБУ 9/99), а для налога на прибыль — 10 июня (п. 3 ст. 271 НК, ст. 491 ГК).
                </div>
            `
        },
        longtermContracts: {
            name: "Длительные договоры",
            number: "2",
            group: "Доходы",
            description: `
                <div class="main-point"><strong>1.</strong> Для длительных договоров БУ требует признавать выручку по степени готовности.</div>
                <div class="main-point"><strong>2.</strong> В НУ выручку плательщик признает:</div>
                <ul class="sub-list">
                    <li>при кассовом методе — только после оплаты;</li>
                    <li>при методе начисления, если нет поэтапной сдачи работ, компания сама распределяет выручку между налоговыми периодами в течение срока действия договора либо равномерно, либо пропорционально доле фактических расходов.</li>
                </ul>
                <div class="main-point"><strong>3.</strong> Временные разницы в учете выручки → расхождение в декларации и ОФР.</div>
                <div class="example-block">
                    <strong>Пример:</strong> Компания выполняет договор на разработку архитектурного проекта 4 месяца — с 1 ноября 2026 по 28 февраля 2027. Поэтапной сдачи нет. Стоимость договора — 600 000 руб. План расходов — 300 000 руб. В 2026 расходы составили 100 000 руб., в 2027 — 200 000 руб. В налоговом учете компания учитывает выручку равномерно, в бухучете — по мере готовности, в размере расходов.
                    <div class="formula">
                        <strong>В бухучете компания признает:</strong><br>
                        2026: 600 000 × (100 000 / 300 000) = 200 000 руб.<br>
                        2027: 600 000 × (200 000 / 300 000) = 400 000 руб.
                    </div>
                    <div class="formula">
                        <strong>В налоговом учете компания признает:</strong><br>
                        2026: 600 000 / 4 × 2 = 300 000 руб.<br>
                        2027: 600 000 / 4 × 2 = 300 000 руб.
                    </div>
                </div>
            `
        },
        expenses: {
            name: "Учет расходов",
            number: "1",
            group: "Расходы",
            description: `
                НК позволяет учесть не все расходы в расчете налоговой базы (ст. 250–270 НК). Если расход учтен в БУ, но не учтен в НУ — возникают постоянные разницы.
                <div class="example-block">
                    <strong>Пример:</strong> в БУ компания списала в расходы всю сумму на деловую встречу с клиентами. А в налоговом учете только по нормативу — 4% от ФОТ. Будет постоянная разница.
                </div>
            `
        },
        amortization: {
            name: "Амортизация",
            number: "1",
            group: "Расходы",
            description: `
                <div class="table-caption">Расхождения в бухучете и налоговом учете:</div>
                <table class="compare-table">
                    <thead>
                        <tr>
                            <th>Критерий</th>
                            <th>Бухгалтерский учет</th>
                            <th>Налоговый учет</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Методы амортизации</strong></td>
                            <td>Линейный, уменьшаемого остатка, по сумме чисел лет, пропорционально объему продукции</td>
                            <td>Линейный и нелинейный</td>
                        </tr>
                        <tr>
                            <td><strong>Коэффициенты</strong></td>
                            <td>Повышающие — по отдельным ОС</td>
                            <td>Повышающие и понижающие</td>
                        </tr>
                        <tr>
                            <td><strong>Амортизационная премия</strong></td>
                            <td>Не предусмотрена</td>
                            <td>10–30% стоимости ОС можно списать единовременно</td>
                        </tr>
                        <tr>
                            <td><strong>СПИ</strong></td>
                            <td>Устанавливается самостоятельно</td>
                            <td>Привязан к Классификатору ОС</td>
                        </tr>
                        <tr>
                            <td><strong>Начало/приостановление амортизации</strong></td>
                            <td>Не приостанавливается</td>
                            <td>Приостанавливается при реконструкции свыше 12 месяцев</td>
                        </tr>
                        <tr>
                            <td><strong>Переоценка ОС</strong></td>
                            <td>Допускается</td>
                            <td>Не допускается</td>
                        </tr>
                        <tr>
                            <td><strong>Инвестиционный вычет</strong></td>
                            <td>Не предусмотрен</td>
                            <td>Предусмотрен</td>
                        </tr>
                    </tbody>
                </table>
            `
        },
        reserves: {
            name: "Резервы",
            number: "1",
            group: "Расходы",
            description: `
                В бухучете создавать резервы обязательно (п. 3 ПБУ 8/2010), в налоговом учете — нет. Это приводит к постоянным разницам, которые увеличивают налог на прибыль.<br><br>
                <div class="table-caption">Особый интерес — резерв по сомнительным долгам:</div>
                <table class="compare-table">
                    <thead>
                        <tr>
                            <th>Критерий</th>
                            <th>Бухгалтерский учет</th>
                            <th>Налоговый учет</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Основание для создания</strong></td>
                            <td>При любой непогашенной задолженности</td>
                            <td>Только по задолженности покупателей и заказчиков</td>
                        </tr>
                        <tr>
                            <td><strong>Сумма резерва</strong></td>
                            <td>Сумма задолженности полностью</td>
                            <td>Зависит от срока просрочки:<br>
                                • свыше 90 дней — 100%<br>
                                • от 45 до 90 дней — 50%<br>
                                • до 45 дней — 0%
                            </td>
                        </tr>
                        <tr>
                            <td><strong>Лимит</strong></td>
                            <td>Не зависит от выручки</td>
                            <td>Не превышает 10% от выручки за отчетный период</td>
                        </tr>
                    </tbody>
                </table>
            `
        }
    };

    const topData = {
        amortization: {
            name: "Амортизация",
            number: "1",
            description: `Амортизационная премия в налоговом учете позволяет списать 10–30% стоимости ОС в первый год эксплуатации. В БУ такого механизма нет, расхождения привлекают внимание налоговиков.
            <ul class="sub-list">
                <li>Расходы в НУ выше, чем в БУ → подозрение в завышении амортизационных отчислений</li>
                <li>ФНС запросит на камералке: карточки по ОС, расчеты СПИ, ликвидационной стоимости</li>
            </ul>`
        },
        doubtful: {
            name: "Резервы по сомнительным долгам",
            number: "2",
            description: `БУ требует создавать резерв по всей сомнительной задолженности. Налоговый учет ограничивает резерв 10% от выручки. В НУ размер резерва зависит от срока просрочки. Разница в расходах — частый повод для запроса.
            <ul class="sub-list">
                <li>В БУ расход больше, чем в НУ → вопрос о необоснованном завышении резерва</li>
                <li>ФНС проверяет: не превышен ли лимит 10% от выручки в НУ</li>
                <li>ФНС запросит на камералке: договоры, акты сверки, подтверждение сомнительности долгов</li>
            </ul>`
        },
        estimated: {
            name: "Оценочные обязательства",
            number: "3",
            description: `ПБУ 8/2010 обязывает создавать резервы предстоящих расходов (отпуска, гарантия). НК признает такие расходы только после их фактического возникновения. Это расхождение ФНС видит сразу.
            <ul class="sub-list">
                <li>Расходы в БУ без аналога в НУ → запрос об обосновании резерва</li>
                <li>ФНС требует пояснить, почему налоговая база занижена за счет резервов</li>
                <li>ФНС запросит на камералке: расчет резерва и первичные документы</li>
            </ul>`
        },
        losses: {
            name: "Убытки",
            number: "4",
            description: `Убыток в БУ компания отражает единовременно в периоде, когда возник. В НУ действует механизм переноса убытков на будущее с ограничением 50% от прибыли (ст. 283 НК).
            <ul class="sub-list">
                <li>Прибыль в БУ ≠ прибыль в НУ из-за неперенесенного убытка → сигнал для углубленной проверки</li>
                <li>ФНС видит расхождение через ИАС КБ и контрольные соотношения</li>
                <li>ФНС запросит на камералке: пояснения и регистры налогового учета по переносу убытков</li>
            </ul>`
        },
        longterm: {
            name: "Выручка по длительным договорам",
            number: "5",
            description: `Для налогового учета длительным признают договор, который начинается и заканчивается в разных налоговых периодах и не предусматривает поэтапной сдачи работ. Налоговый кодекс обязывает распределять выручку между периодами выполнения работ.<br><br>
            В бухучете компания выбирает способ самостоятельно: признает выручку по мере готовности работ при условии надежной оценки выполнения на каждую отчетную дату либо откладывает признание до полного завершения договора.
            <ul class="sub-list">
                <li>Временные разницы в признании выручки → расхождение в декларации и ОФР</li>
                <li>ФНС запросит: договоры, акты с условиями перехода права собственности</li>
            </ul>`
        }
    };

    let activeMainTab = 'zones';
    let activeGroup = 'Доходы';
    let activeSubCat = 'revenue';
    let activeTopCat = 'amortization';

    function buildZonesSidebar() {
        const sidebar = document.getElementById('zonesSidebar');
        const groups = [...new Set(Object.values(zonesData).map(item => item.group))];
        let html = '';
        for (const g of groups) {
            const activeClass = (g === activeGroup) ? 'active' : '';
            const groupNumber = (g === 'Доходы') ? '1' : '2';
            html += `<button class="cat-item ${activeClass}" data-group="${g}">
                        <span class="cat-number">${groupNumber}</span>
                        <span>${g}</span>
                    </button>`;
        }
        sidebar.innerHTML = html;
        sidebar.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', () => {
                activeGroup = btn.dataset.group;
                const keys = getKeysForGroup(activeGroup);
                activeSubCat = keys.length > 0 ? keys[0] : null;
                buildZonesSidebar();
                renderSubTabsAndContent();
            });
        });
    }

    function getKeysForGroup(group) {
        return Object.keys(zonesData).filter(key => zonesData[key].group === group);
    }

    function getSubTabsForGroup(group) {
        const keys = getKeysForGroup(group);
        return keys.map(key => ({
            key: key,
            name: zonesData[key].name,
            number: zonesData[key].number
        }));
    }

    function renderSubTabsAndContent() {
        const subTabsContainer = document.getElementById('zonesSubTabs');
        const contentDiv = document.getElementById('zonesContent');

        const subTabs = getSubTabsForGroup(activeGroup);
        if (subTabs.length === 0) {
            subTabsContainer.innerHTML = '';
            contentDiv.innerHTML = `<div class="info-card"><div class="desc-text">Нет подвкладок для этой группы</div></div>`;
            return;
        }

        if (!subTabs.some(t => t.key === activeSubCat)) {
            activeSubCat = subTabs[0].key;
        }

        let subHtml = '';
        for (const tab of subTabs) {
            const activeClass = (tab.key === activeSubCat) ? 'active' : '';
            subHtml += `<button class="sub-tab ${activeClass}" data-key="${tab.key}">${tab.name}</button>`;
        }
        subTabsContainer.innerHTML = subHtml;

        subTabsContainer.querySelectorAll('.sub-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                activeSubCat = btn.dataset.key;
                renderSubTabsAndContent();
            });
        });

        const zone = zonesData[activeSubCat];
        if (zone) {
            contentDiv.innerHTML = `
                <div class="info-card">
                    <div class="desc-text">${zone.description}</div>
                </div>
            `;
        } else {
            contentDiv.innerHTML = `<div class="info-card"><div class="desc-text">Выберите подраздел</div></div>`;
        }
    }

    function buildTopSidebar() {
        const sidebar = document.getElementById('topSidebar');
        sidebar.innerHTML = Object.entries(topData).map(([key, val]) => 
            `<button class="cat-item ${key === activeTopCat ? 'active' : ''}" data-cat="${key}">
                <span class="cat-number">${val.number}</span>
                <span>${val.name}</span>
            </button>`
        ).join('');
        sidebar.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', () => {
                activeTopCat = btn.dataset.cat;
                refreshTop();
            });
        });
    }

    function refreshTop() {
        const top = topData[activeTopCat];
        const contentDiv = document.getElementById('topContent');
        contentDiv.innerHTML = `
            <div class="info-card">
                <div class="desc-text">${top.description}</div>
            </div>
        `;
        document.querySelectorAll('#topSidebar .cat-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === activeTopCat);
        });
    }

    function switchMainTab(tabId) {
        activeMainTab = tabId;
        document.querySelectorAll('.main-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mainTab === tabId);
        });
        const zonesPanel = document.getElementById('zonesPanel');
        const topPanel = document.getElementById('topPanel');
        if (tabId === 'zones') {
            zonesPanel.style.display = 'flex';
            topPanel.style.display = 'none';
            buildZonesSidebar();
            renderSubTabsAndContent();
        } else {
            zonesPanel.style.display = 'none';
            topPanel.style.display = 'flex';
            refreshTop();
        }
    }

    function init() {
        buildZonesSidebar();
        renderSubTabsAndContent();
        buildTopSidebar();
        refreshTop();

        document.querySelectorAll('.main-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                switchMainTab(btn.dataset.mainTab);
            });
        });
    }

    init();
</script>
</body>
</html>
