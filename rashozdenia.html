<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Камеральная проверка | Расхождения БУ и НУ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #eef2f5;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .main-tabs {
            display: flex;
            gap: 0;
            background: #f5f7fa;
            border-bottom: 1px solid #e2e6ea;
            padding: 0 16px;
        }
        .main-tab {
            padding: 12px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #6c7a8a;
            transition: 0.2s;
        }
        .main-tab.active {
            color: #4a5b6e;
            border-bottom: 2px solid #7a8c9e;
        }
        .two-columns {
            display: flex;
        }
        .sidebar {
            width: 220px;
            background: #fafbfd;
            border-right: 1px solid #e8ecef;
            padding: 12px 0;
            flex-shrink: 0;
        }
        .cat-list {
            display: flex;
            flex-direction: column;
        }
        .cat-item {
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            color: #5a6e7e;
            background: transparent;
            border: none;
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .cat-item:hover {
            background: #edf0f4;
        }
        .cat-item.active {
            background: #e8edf2;
            color: #4a5b6e;
            font-weight: 600;
            border-left: 3px solid #7a8c9e;
        }
        .cat-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            background: #dce2e8;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #5a6e7e;
        }
        .cat-item.active .cat-number {
            background: #7a8c9e;
            color: white;
        }
        .content-area {
            flex: 1;
            padding: 12px;
            background: white;
            min-width: 0;
        }
        .info-card {
            background: #fafbfc;
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #e2e6ea;
        }
        .desc-text {
            font-size: 0.72rem;
            line-height: 1.5;
            color: #4a5b6e;
            margin-bottom: 12px;
        }
        .norm-block {
            background: #f0f2f5;
            padding: 8px 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.68rem;
            color: #5a6e80;
            border-left: 3px solid #9aabbb;
        }
        .norm-block strong {
            color: #4a5b6e;
            font-weight: 600;
        }
        .checklist {
            list-style: none;
        }
        .checklist li {
            margin-bottom: 8px;
            font-size: 0.72rem;
            line-height: 1.4;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            color: #4a5b6e;
        }
        .checklist li:last-child {
            margin-bottom: 0;
        }
        .checklist li::before {
            content: "●";
            font-size: 0.65rem;
            color: #9aabbb;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-tabs">
        <button class="main-tab active" data-main-tab="zones">Основные расхождения</button>
        <button class="main-tab" data-main-tab="top">Топ причин для запроса от инспекции</button>
    </div>

    <div id="zonesPanel" class="two-columns">
        <div class="sidebar">
            <div class="cat-list" id="zonesSidebar"></div>
        </div>
        <div class="content-area">
            <div id="zonesContent"></div>
        </div>
    </div>

    <div id="topPanel" class="two-columns" style="display: none;">
        <div class="sidebar">
            <div class="cat-list" id="topSidebar"></div>
        </div>
        <div class="content-area">
            <div id="topContent"></div>
        </div>
    </div>
</div>

<script>
    const zonesData = {
        income: {
            name: "Признание доходов",
            number: "1",
            description: "Разный момент признания выручки в бухгалтерском и налоговом учете приводит к автоматическим расхождениям, которые ФНС видит через контрольные соотношения. В бухучете действует метод начисления. В налоговом учете возможны два метода: начисления и кассовый. С 2026 года компании могут применять новый стандарт ФСБУ 9/2025 'Доходы' (обязателен с 2027).",
            fns: [
                "Расхождение между выручкой в бухгалтерской отчетности и доходами в декларации",
                "При камеральной проверке запросят пояснения и регистры налогового учета",
                "Разный момент признания при методе начисления в НУ и в БУ"
            ],
            norm: "БУ: ПБУ 9/99 (действует), с 2026 добровольно ФСБУ 9/2025, с 2027 обязателен. НУ: ст. 271–273 НК — метод начисления или кассовый метод (ст. 273 НК). Контрольные соотношения ФНС: выручка в БУ ≈ доходы в декларации."
        },
        expenses: {
            name: "Признание расходов",
            number: "2",
            description: "Налоговый кодекс содержит закрытые перечни расходов, уменьшающих налогооблагаемую прибыль. Расходы, учтенные в бухгалтерском учете, но не предусмотренные ст. 252–270 НК, формируют постоянные разницы. Готовится проект нового ФСБУ по учету расходов.",
            fns: [
                "Расходы, учтенные в БУ, но не предусмотренные закрытым перечнем НК",
                "Нормируемые расходы (представительские, реклама, проценты) — сверх норм не принимаются в НУ",
                "Запрос обоснования экономической целесообразности расходов"
            ],
            norm: "БУ: ПБУ 10/99 — принцип соответствия, приоритет экономического содержания. НУ: закрытые перечни ст. 252–270 НК. Нормируемые расходы: ст. 264 НК (представительские — 4% от ФОТ, реклама — 1% от выручки)."
        },
        amortization: {
            name: "Амортизация",
            number: "3",
            description: "Разные суммы амортизации в каждом периоде — классический пример временных разниц. Амортизационная премия в налоговом учете делает расход в первые годы выше, чем в бухгалтерском.",
            fns: [
                "Разные суммы амортизации в каждом периоде → временные разницы",
                "Амортизационная премия в НУ делает расход в первые годы выше, чем в БУ",
                "ФНС запросит регистры учета ОС, расчеты амортизации и пояснения по СПИ"
            ],
            norm: "БУ: ФСБУ 6/2020 — произвольный срок полезного использования, ликвидационная стоимость вычитается из амортизируемой базы. НУ: классификация амортизационных групп по Постановлению Правительства № 1. Амортизационная премия — ст. 258 НК (10% / 30%)."
        },
        reserves: {
            name: "Резервы",
            number: "4",
            description: "В бухгалтерском учете создание резервов по сомнительным долгам — обязанность. В налоговом — право, а не обязанность, к тому же с лимитом 10% от выручки. Это приводит к постоянным разницам.",
            fns: [
                "В БУ расход есть (резерв создан обязательно), в НУ — нет либо ограничен",
                "Постоянные разницы → ПНО, увеличивающее текущий налог",
                "Запрос подтверждения сомнительности долгов и расчета резерва"
            ],
            norm: "БУ: обязательное формирование резервов по сомнительным долгам (ПБУ 21/2008). НУ: создание резерва — право, а не обязанность (ст. 266 НК). Лимит в НУ: 10% от выручки отчетного периода."
        },
        longtermContracts: {
            name: "Длительные договоры",
            number: "5",
            description: "Для длительных договоров (строительство, поставка, услуги на длительный срок) бухгалтерский учет требует признавать выручку по степени завершенности. Налоговый учет использует иные правила. При кассовом методе — только после оплаты, при методе начисления — в момент перехода права собственности.",
            fns: [
                "Временные разницы в признании выручки → расхождение в декларации и ОФР",
                "При методе начисления: если право собственности переходит по оплате и продавец контролирует товары — выручка в момент оплаты",
                "Отсутствие контроля за отгруженными товарами → выручка в момент отгрузки",
                "ФНС запрашивает договоры, акты, условия перехода права собственности"
            ],
            norm: "БУ: ПБУ 2/2008 (строительство) или общий порядок. С 2026 добровольно ФСБУ 9/2025 — доходы по степени завершенности. НУ: ст. 271-273 НК. При методе начисления — дата перехода права собственности (ст. 223 ГК). При кассовом методе — дата оплаты. Для длительных циклов — равномерное распределение расходов."
        }
    };

    const topData = {
        amortization: {
            name: "Амортизация",
            number: "1",
            description: "Амортизационная премия в налоговом учете позволяет списать 10% или 30% стоимости ОС в первый год эксплуатации. В бухгалтерском учете такого механизма нет, что создает значительные расхождения и привлекает внимание налоговиков.",
            fns: [
                "Расходы в НУ выше, чем в БУ → подозрение в завышении амортизационных отчислений",
                "ФНС анализирует: амортизационная премия в НУ, но отсутствие аналога в БУ",
                "Запрос документов по основным средствам, расчетов СПИ и ликвидационной стоимости"
            ],
            norm: "БУ: ФСБУ 6/2020 — более длительный СПИ или ненулевая ликвидационная стоимость → амортизация ниже. НУ: амортизационная премия 10/30% в первый год (ст.258 НК) → расход резко выше. Постановление Правительства № 1 — классификация ОС по амортизационным группам."
        },
        doubtful: {
            name: "Резервы по сомнительным долгам",
            number: "2",
            description: "Бухгалтерский учет требует создавать резерв по всей сомнительной задолженности. Налоговый учет ограничивает резерв 10% от выручки. Разница в расходах — частый повод для запроса.",
            fns: [
                "В БУ расход больше, чем в НУ → вопрос о необоснованном завышении резерва",
                "ФНС проверяет: не превышен ли лимит 10% от выручки в НУ",
                "Запрос документов: договоры, акты сверки, подтверждение сомнительности долгов"
            ],
            norm: "БУ: обязан создавать резерв по всей сомнительной задолженности (ПБУ 21/2008). НУ: лимит — 10% выручки за период (ст. 266 НК). Создание резерва в НУ — право, а не обязанность."
        },
        estimated: {
            name: "Оценочные обязательства",
            number: "3",
            description: "ПБУ 8/2010 обязывает создавать резервы предстоящих расходов (отпуска, гарантия). Налоговый кодекс признает такие расходы только после их фактического возникновения. Это расхождение ФНС видит сразу.",
            fns: [
                "Расходы в БУ без аналога в НУ → запрос об обосновании резерва",
                "ФНС требует пояснить, почему налоговая база занижена за счет резервов",
                "При камеральной проверке — требование представить расчет резерва и первичные документы"
            ],
            norm: "БУ: резерв на отпуска, гарантийный ремонт — обязательны при ПБУ 8/2010. НУ: признается только фактически начисленный отпуск. Ст. 324.1 НК — особенности учета резерва предстоящих расходов на оплату отпусков."
        },
        losses: {
            name: "Убытки",
            number: "4",
            description: "Убыток в бухгалтерском учете отражается единовременно в периоде возникновения. В налоговом учете действует механизм переноса убытков на будущее (ст. 283 НК) с ограничением 50% от прибыли. Разница — сигнал для проверки.",
            fns: [
                "Прибыль в БУ ≠ прибыль в НУ из-за неперенесенного убытка → сигнал для углубленной проверки",
                "ФНС видит расхождение через АСК НДС-2 и контрольные соотношения",
                "Запрос пояснений и регистров налогового учета по переносу убытков"
            ],
            norm: "БУ: убыток отражается в периоде возникновения (единовременно в ОФР). НУ: перенос убытка на будущее согласно ст. 283 НК. Ограничение: 50% от налогооблагаемой прибыли периода. Разницы регулируются ПБУ 18/02."
        },
        longterm: {
            name: "Выручка по длительным договорам",
            number: "5",
            description: "Для длительных договоров бухгалтерский учет требует признавать выручку по степени завершенности. Налоговый учет использует иные правила. При кассовом методе — только после оплаты, при методе начисления — в момент перехода права собственности или по оплате, если это предусмотрено договором.",
            fns: [
                "Временные разницы в признании выручки → расхождение в декларации и ОФР",
                "При методе начисления: если право собственности переходит по оплате и продавец контролирует товары — выручка в момент оплаты",
                "Отсутствие контроля за отгруженными товарами → выручка в момент отгрузки",
                "ФНС запрашивает договоры, акты, условия перехода права собственности"
            ],
            norm: "БУ: ПБУ 2/2008 (строительство) или общий порядок. С 2026 добровольно ФСБУ 9/2025. НУ: ст. 271-273 НК. При методе начисления — дата перехода права собственности (ст. 223 ГК). При кассовом методе — дата оплаты. Для длительных циклов — равномерное распределение расходов."
        }
    };

    let activeMainTab = 'zones';
    let activeZoneCat = 'income';
    let activeTopCat = 'amortization';

    function buildZonesSidebar() {
        const sidebar = document.getElementById('zonesSidebar');
        sidebar.innerHTML = Object.entries(zonesData).map(([key, val]) => 
            `<button class="cat-item ${key === activeZoneCat ? 'active' : ''}" data-cat="${key}">
                <span class="cat-number">${val.number}</span>
                <span>${val.name}</span>
            </button>`
        ).join('');
        sidebar.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', () => {
                activeZoneCat = btn.dataset.cat;
                refreshZones();
            });
        });
    }

    function buildTopSidebar() {
        const sidebar = document.getElementById('topSidebar');
        sidebar.innerHTML = Object.entries(topData).map(([key, val]) => 
            `<button class="cat-item ${key === activeTopCat ? 'active' : ''}" data-cat="${key}">
                <span class="cat-number">${val.number}</span>
                <span>${val.name}</span>
            </button>`
        ).join('');
        sidebar.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', () => {
                activeTopCat = btn.dataset.cat;
                refreshTop();
            });
        });
    }

    function refreshZones() {
        const zone = zonesData[activeZoneCat];
        const contentDiv = document.getElementById('zonesContent');
        
        contentDiv.innerHTML = `
            <div class="info-card">
                <div class="desc-text">${zone.description}</div>
                <ul class="checklist">${zone.fns.map(item => `<li>${item}</li>`).join('')}</ul>
                <div class="norm-block">
                    <strong>Нормативная база</strong><br>${zone.norm}
                </div>
            </div>
        `;
        
        document.querySelectorAll('#zonesSidebar .cat-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === activeZoneCat);
        });
    }

    function refreshTop() {
        const top = topData[activeTopCat];
        const contentDiv = document.getElementById('topContent');
        
        contentDiv.innerHTML = `
            <div class="info-card">
                <div class="desc-text">${top.description}</div>
                <ul class="checklist">${top.fns.map(item => `<li>${item}</li>`).join('')}</ul>
                <div class="norm-block">
                    <strong>Нормативная база</strong><br>${top.norm}
                </div>
            </div>
        `;
        
        document.querySelectorAll('#topSidebar .cat-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === activeTopCat);
        });
    }

    function switchMainTab(tabId) {
        activeMainTab = tabId;
        document.querySelectorAll('.main-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mainTab === tabId);
        });
        
        const zonesPanel = document.getElementById('zonesPanel');
        const topPanel = document.getElementById('topPanel');
        
        if (tabId === 'zones') {
            zonesPanel.style.display = 'flex';
            topPanel.style.display = 'none';
            refreshZones();
        } else {
            zonesPanel.style.display = 'none';
            topPanel.style.display = 'flex';
            refreshTop();
        }
    }

    function init() {
        buildZonesSidebar();
        buildTopSidebar();
        
        document.querySelectorAll('.main-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                switchMainTab(btn.dataset.mainTab);
            });
        });
        
        refreshZones();
    }
    
    init();
</script>
</body>
</html>
