<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Камеральная проверка | Расхождения БУ и НУ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #eef2f5;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .main-tabs {
            display: flex;
            gap: 0;
            background: #f5f7fa;
            border-bottom: 1px solid #e2e6ea;
            padding: 0 16px;
        }
        .main-tab {
            padding: 12px 20px;
            font-size: 0.83rem;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #6c7a8a;
            transition: 0.2s;
        }
        .main-tab.active {
            color: #4a5b6e;
            border-bottom: 2px solid #7a8c9e;
        }
        .two-columns {
            display: flex;
        }
        .sidebar {
            width: 220px;
            background: #fafbfd;
            border-right: 1px solid #e8ecef;
            padding: 12px 0;
            flex-shrink: 0;
        }
        .cat-list {
            display: flex;
            flex-direction: column;
        }
        .cat-item {
            padding: 8px 12px;
            font-size: 0.83rem;
            font-weight: 500;
            cursor: pointer;
            color: #5a6e7e;
            background: transparent;
            border: none;
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .cat-item:hover {
            background: #edf0f4;
        }
        .cat-item.active {
            background: #e8edf2;
            color: #4a5b6e;
            font-weight: 600;
            border-left: 3px solid #7a8c9e;
        }
        .cat-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #dce2e8;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #5a6e7e;
            flex-shrink: 0;
        }
        .cat-item.active .cat-number {
            background: #7a8c9e;
            color: white;
        }
        .content-area {
            flex: 1;
            padding: 14px;
            background: white;
            min-width: 0;
        }
        .info-card {
            background: #fafbfc;
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #e2e6ea;
        }
        .desc-text {
            font-size: 0.83rem;
            line-height: 1.35;
            color: #4a5b6e;
            margin-bottom: 12px;
        }
        .desc-text ol, .desc-text ul {
            list-style: none;
            padding-left: 0;
        }
        .desc-text ol li, .desc-text ul li {
            margin-bottom: 2px;
            padding-left: 18px;
            position: relative;
        }
        .desc-text ol {
            counter-reset: item;
        }
        .desc-text ol li {
            counter-increment: item;
            padding-left: 26px;
        }
        .desc-text ol li::before {
            content: counter(item) ".";
            position: absolute;
            left: 0;
            color: #7a8c9e;
            font-weight: 600;
        }
        .desc-text ul li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #7a8c9e;
            font-weight: 700;
        }
        .example-block {
            margin-top: 6px;
            padding: 8px 12px;
            background: #edf1f5;
            border-radius: 8px;
            border-left: 3px solid #7a8c9e;
        }
        .example-block strong {
            color: #3a4b5e;
            font-weight: 600;
        }
        .norm-block {
            background: #f0f2f5;
            padding: 10px 12px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.83rem;
            line-height: 1.35;
            color: #5a6e80;
            border-left: 3px solid #9aabbb;
        }
        .norm-block strong {
            color: #4a5b6e;
            font-weight: 600;
        }
        .checklist {
            list-style: none;
        }
        .checklist li {
            margin-bottom: 4px;
            font-size: 0.83rem;
            line-height: 1.35;
            display: flex;
            gap: 8px;
            align-items: flex-start;
            color: #4a5b6e;
            padding-left: 0;
        }
        .checklist li:last-child {
            margin-bottom: 0;
        }
        .checklist li::before {
            content: "●";
            font-size: 0.75rem;
            color: #9aabbb;
            flex-shrink: 0;
        }
        .mt-1 { margin-top: 6px; }
        .desc-text strong {
            font-weight: 600;
            color: #3a4b5e;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="main-tabs">
        <button class="main-tab active" data-main-tab="zones">Основные расхождения</button>
        <button class="main-tab" data-main-tab="top">Топ причин для запроса от инспекции</button>
    </div>

    <div id="zonesPanel" class="two-columns">
        <div class="sidebar">
            <div class="cat-list" id="zonesSidebar"></div>
        </div>
        <div class="content-area">
            <div id="zonesContent"></div>
        </div>
    </div>

    <div id="topPanel" class="two-columns" style="display: none;">
        <div class="sidebar">
            <div class="cat-list" id="topSidebar"></div>
        </div>
        <div class="content-area">
            <div id="topContent"></div>
        </div>
    </div>
</div>

<script>
    const zonesData = {
        income: {
            name: "Признание доходов",
            number: "1",
            description: `<ol>
                <li>Сейчас по ПБУ 9/99 в бухучете компания признает выручку, когда выполнила свои обязательства по договору или по мере готовности.</li>
                <li>С 2027 года по ФСБУ 9/2025 придется соблюдать еще ряд условий, чтобы признать доход в БУ.</li>
                <li>В налоговом учете — два метода: начисления — признаете выручку, когда отгрузили товар, подписали акт работ; кассовый — фиксируете выручку, когда деньги поступили на счет или в кассу.</li>
                <li>Налоговая прибыль > бухгалтерской — ВВР и ОНА. В будущем эта разница уменьшит сумму налога к уплате. Налоговая прибыль < бухгалтерской — НВР и ОНО. В будущем компания заплатит больше налога.</li>
            </ol>
            <div class="example-block">
                <strong>Пример:</strong> по договору право собственности переходит при оплате, а контроль над товаром — при отгрузке. В БУ выручку признают на дату перехода контроля, в НУ — на дату перехода права собственности. Если эти даты не совпадают — возникает временная разница.
            </div>`,
            fns: [],
            norm: "БУ: ПБУ 9/99, с 2026 добровольно ФСБУ 9/2025, с 2027 обязателен. НУ: ст. 271–273 НК — метод начисления или кассовый метод. Контрольные соотношения ФНС: выручка в БУ ≈ доходы в декларации."
        },
        expenses: {
            name: "Признание расходов",
            number: "2",
            description: `НК позволяет учесть не все расходы в расчете налоговой базы. Если расход учтен в БУ, но не учтен в НУ из-за требований ст. 252–270 НК, — возникают постоянные разницы и ПНР.
            <div class="example-block">
                <strong>Пример:</strong> в БУ компания списала в расходы всю сумму на деловую встречу с клиентами. А в налоговом учете только по нормативу — 4% от ФОТ. Будет постоянная разница + ПНР.
            </div>`,
            fns: [],
            norm: "БУ: ПБУ 10/99 — принцип соответствия, приоритет экономического содержания. С 2027 действует ФСБУ 10/2026 «Расходы». НУ: закрытые перечни ст. 252–270 НК. Нормируемые расходы: ст. 264 НК (представительские — 4% от ФОТ, реклама — 1% от выручки)."
        },
        amortization: {
            name: "Амортизация",
            number: "3",
            description: `Правила в БУ и НУ не совпадают. Разницы создадут:
            <ul>
                <li>Разные методы амортизации.</li>
                <li>Коэффициенты — в НУ действуют и повышающие и понижающие.</li>
                <li>Амортизационная премия — НУ разрешает единовременно списать часть стоимости ОС в расходы, а БУ — нет.</li>
                <li>СПИ — в БУ надо установить срок самостоятельно, а НУ привязывает к Классификации ОС, сроки могут отличаться.</li>
                <li>Первоначальная стоимость — перечень затрат может отличаться.</li>
                <li>Начало и прекращение — в НУ амортизацию приостанавливают при реконструкции свыше 12 месяцев.</li>
                <li>Переоценка — в БУ возможна переоценка ОС.</li>
                <li>Инвествычет — есть только в НУ.</li>
            </ul>`,
            fns: [],
            norm: "БУ: ФСБУ 6/2020 — произвольный срок полезного использования, ликвидационная стоимость вычитается из амортизируемой базы. НУ: классификация амортизационных групп по Постановлению Правительства № 1. Амортизационная премия — ст. 258 НК (10% / 30%)."
        },
        reserves: {
            name: "Резервы",
            number: "4",
            description: `В БУ создавать резервы обязательно, в НУ — нет. Это приводит к постоянным разницам и ПНО, который увеличивает текущий налог.<br><br>
            <strong>Особый интерес — резерв по сомнительным долгам:</strong>
            <ul>
                <li>В БУ резерв создают при любой непогашенной задолженности. В НУ — только по задолженности покупателей и заказчиков.</li>
                <li>В НУ размер резерва зависит от срока просрочки: свыше 90 дней — 100%, от 45 до 90 дней — 50%, до 45 дней — 0%.</li>
                <li>Сумма резерва в НУ не превышает 10% от выручки за отчетный период.</li>
            </ul>`,
            fns: [],
            norm: "БУ — ПБУ 21/2008, НУ — ст. 266 НК."
        },
        longtermContracts: {
            name: "Длительные договоры",
            number: "5",
            description: `Для длительных договоров БУ требует признавать выручку по степени завершенности. В НУ выручку плательщик признает при кассовом методе — только после оплаты, при методе начисления — в момент перехода права собственности.
            <ul>
                <li>Временные разницы в признании выручки → расхождение в декларации и ОФР.</li>
                <li>При методе начисления: если право собственности переходит по оплате и продавец контролирует товары — выручка в момент оплаты.</li>
                <li>Отсутствие контроля за отгруженными товарами → выручка в момент отгрузки.</li>
            </ul>`,
            fns: [],
            norm: "БУ: ПБУ 2/2008. С 2026 добровольно ФСБУ 9/2025 — доходы по степени завершенности. НУ: ст. 271-273 НК. Для длительных циклов — равномерное распределение расходов."
        }
    };

    const topData = {
        amortization: {
            name: "Амортизация",
            number: "1",
            description: `Амортизационная премия в налоговом учете позволяет списать 10–30% стоимости ОС в первый год эксплуатации. В БУ такого механизма нет, расхождения привлекают внимание налоговиков.
            <ul>
                <li>Расходы в НУ выше, чем в БУ → подозрение в завышении амортизационных отчислений</li>
                <li>ФНС запросит на камералке: карточки по ОС, расчеты СПИ, ликвидационной стоимости</li>
            </ul>`,
            fns: []
        },
        doubtful: {
            name: "Резервы по сомнительным долгам",
            number: "2",
            description: `БУ требует создавать резерв по всей сомнительной задолженности. Налоговый учет ограничивает резерв 10% от выручки. В НУ размер резерва зависит от срока просрочки. Разница в расходах — частый повод для запроса.
            <ul>
                <li>В БУ расход больше, чем в НУ → вопрос о необоснованном завышении резерва</li>
                <li>ФНС проверяет: не превышен ли лимит 10% от выручки в НУ</li>
                <li>ФНС запросит на камералке: договоры, акты сверки, подтверждение сомнительности долгов</li>
            </ul>`,
            fns: []
        },
        estimated: {
            name: "Оценочные обязательства",
            number: "3",
            description: `ПБУ 8/2010 обязывает создавать резервы предстоящих расходов (отпуска, гарантия). НК признает такие расходы только после их фактического возникновения. Это расхождение ФНС видит сразу.
            <ul>
                <li>Расходы в БУ без аналога в НУ → запрос об обосновании резерва</li>
                <li>ФНС требует пояснить, почему налоговая база занижена за счет резервов</li>
                <li>ФНС запросит на камералке: расчет резерва и первичные документы</li>
            </ul>`,
            fns: []
        },
        losses: {
            name: "Убытки",
            number: "4",
            description: `Убыток в БУ компания отражает единовременно в периоде, когда возник. В НУ действует механизм переноса убытков на будущее с ограничением 50% от прибыли (ст. 283 НК).
            <ul>
                <li>Прибыль в БУ ≠ прибыль в НУ из-за неперенесенного убытка → сигнал для углубленной проверки</li>
                <li>ФНС видит расхождение через ИАС КБ и контрольные соотношения</li>
                <li>ФНС запросит на камералке: пояснения и регистры налогового учета по переносу убытков</li>
            </ul>`,
            fns: []
        },
        longterm: {
            name: "Выручка по длительным договорам",
            number: "5",
            description: `Для налогового учета длительным признают договор, который начинается и заканчивается в разных налоговых периодах и не предусматривает поэтапной сдачи работ. Налоговый кодекс обязывает распределять выручку между периодами выполнения работ.<br><br>
            В бухучете компания выбирает способ самостоятельно: признает выручку по мере готовности работ при условии надежной оценки выполнения на каждую отчетную дату либо откладывает признание до полного завершения договора.
            <ul>
                <li>Временные разницы в признании выручки → расхождение в декларации и ОФР</li>
                <li>ФНС запросит: договоры, акты с условиями перехода права собственности</li>
            </ul>`,
            fns: []
        }
    };

    let activeMainTab = 'zones';
    let activeZoneCat = 'income';
    let activeTopCat = 'amortization';

    function buildZonesSidebar() {
        const sidebar = document.getElementById('zonesSidebar');
        sidebar.innerHTML = Object.entries(zonesData).map(([key, val]) => 
            `<button class="cat-item ${key === activeZoneCat ? 'active' : ''}" data-cat="${key}">
                <span class="cat-number">${val.number}</span>
                <span>${val.name}</span>
            </button>`
        ).join('');
        sidebar.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', () => {
                activeZoneCat = btn.dataset.cat;
                refreshZones();
            });
        });
    }

    function buildTopSidebar() {
        const sidebar = document.getElementById('topSidebar');
        sidebar.innerHTML = Object.entries(topData).map(([key, val]) => 
            `<button class="cat-item ${key === activeTopCat ? 'active' : ''}" data-cat="${key}">
                <span class="cat-number">${val.number}</span>
                <span>${val.name}</span>
            </button>`
        ).join('');
        sidebar.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', () => {
                activeTopCat = btn.dataset.cat;
                refreshTop();
            });
        });
    }

    function refreshZones() {
        const zone = zonesData[activeZoneCat];
        const contentDiv = document.getElementById('zonesContent');
        
        contentDiv.innerHTML = `
            <div class="info-card">
                <div class="desc-text">${zone.description}</div>
                <div class="norm-block">
                    <strong>Нормативная база</strong><br>${zone.norm}
                </div>
            </div>
        `;
        
        document.querySelectorAll('#zonesSidebar .cat-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === activeZoneCat);
        });
    }

    function refreshTop() {
        const top = topData[activeTopCat];
        const contentDiv = document.getElementById('topContent');
        
        contentDiv.innerHTML = `
            <div class="info-card">
                <div class="desc-text">${top.description}</div>
            </div>
        `;
        
        document.querySelectorAll('#topSidebar .cat-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === activeTopCat);
        });
    }

    function switchMainTab(tabId) {
        activeMainTab = tabId;
        document.querySelectorAll('.main-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mainTab === tabId);
        });
        
        const zonesPanel = document.getElementById('zonesPanel');
        const topPanel = document.getElementById('topPanel');
        
        if (tabId === 'zones') {
            zonesPanel.style.display = 'flex';
            topPanel.style.display = 'none';
            refreshZones();
        } else {
            zonesPanel.style.display = 'none';
            topPanel.style.display = 'flex';
            refreshTop();
        }
    }

    function init() {
        buildZonesSidebar();
        buildTopSidebar();
        
        document.querySelectorAll('.main-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                switchMainTab(btn.dataset.mainTab);
            });
        });
        
        refreshZones();
    }
    
    init();
</script>
</body>
</html>
