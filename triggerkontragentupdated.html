<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Самоаудит проверки контрагентов</title>
  <style>
    :root{
      --ink:#202523;
      --muted:#68706c;
      --line:#d9ddda;
      --paper:#ffffff;
      --bg:#f5f5f2;
      --soft:#f1f2ef;
      --soft-2:#e8ebe8;
      --red:#a94235;
      --red-bg:#fff0ed;
      --green:#315f40;
      --green-bg:#eaf4ed;
      --gray:#555b60;
      --gray-bg:#f1f2f3;
      --shadow:0 8px 24px rgba(32,37,35,.08);
    }
    *{box-sizing:border-box}
    html{width:100%;max-width:650px;margin:0 auto;background:var(--bg)}
    body{width:100%;max-width:650px;margin:0 auto;min-width:320px;background:var(--bg);color:var(--ink);font:15px/1.42 Inter,"Segoe UI",Arial,sans-serif}
    button{font:inherit;color:inherit;cursor:pointer}
    button:focus-visible{outline:3px solid rgba(32,37,35,.18);outline-offset:3px}
    .shell{width:100%;max-width:650px;margin:0 auto;padding:10px 8px 28px}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
    .screen-pad{padding:18px}
    h1,h2,h3{font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}
    h1{font-size:25px;line-height:1.12;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
    h2{font-size:19px;line-height:1.2;margin:0 0 8px;font-weight:800}
    h3{font-size:16px;line-height:1.3;margin:0;font-weight:760}
    p{margin:0 0 10px}
    .lead{font-size:14px;color:var(--muted)}
    .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .btn{min-height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-weight:760;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btn:hover{background:var(--soft)}
    .btn.primary,.btn.danger{background:var(--ink);border-color:var(--ink);color:#fff}
    .btn.primary:hover,.btn.danger:hover{background:#000;border-color:#000}
    .btn:disabled{opacity:.38;cursor:not-allowed}
    .progress-wrap{padding:10px 14px;border-bottom:1px solid var(--line)}
    .progress{height:5px;background:var(--soft-2);border-radius:99px;overflow:hidden;margin:0 0 4px}
    .progress span{display:block;height:100%;background:var(--ink);transition:width .2s}
    .progressline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}

    /* Main stages: one horizontal level. */
    .stage-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line);background:#fff}
    .stage-tab{border:0;border-right:1px solid var(--line);background:#fff;padding:11px 8px;text-align:center;font-size:12px;font-weight:800;line-height:1.2;min-height:48px}
    .stage-tab:last-child{border-right:0}
    .stage-tab:hover{background:var(--soft)}
    .stage-tab.active{background:var(--ink);color:#fff}
    .stage-tab.done:not(.active){box-shadow:inset 0 -3px 0 var(--ink)}
    .stage-num,.stage-copy small{display:none}
    .stage-copy b{font-size:12px;line-height:1.2}

    .work{padding:14px}
    .section-layout{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:start}
    .section-layout.right{grid-template-columns:minmax(0,1fr) 118px}
    .section-layout.right .section-tabs{grid-column:2}
    .section-layout.right .question-area{grid-column:1;grid-row:1}
    .section-tabs{display:grid;gap:4px;padding:0;margin:0;background:transparent}
    .section-tab{width:100%;border:0;border-left:3px solid transparent;background:transparent;padding:9px 8px;text-align:left;color:var(--muted);font-size:12px;font-weight:760;line-height:1.18;border-radius:0 7px 7px 0}
    .section-tab:hover{background:var(--soft)}
    .section-tab.active{border-left-color:var(--ink);background:var(--soft);color:var(--ink)}
    .section-layout.right .section-tab{border-left:0;border-right:3px solid transparent;text-align:right;border-radius:7px 0 0 7px}
    .section-layout.right .section-tab.active{border-right-color:var(--ink)}
    .question-area{min-width:0}

    .criterion{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
    .criterion-head{display:flex;align-items:flex-start;gap:9px}
    .number{width:25px;height:25px;flex:0 0 auto;border-radius:50%;background:var(--soft-2);color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:800}
    .impact{margin:10px 0 0;padding:10px 11px;border-left:3px solid #c8cdca;background:#f3f4f2;color:#5f6763;font-size:12.5px;line-height:1.42}
    .when{margin:8px 0 0;color:var(--muted);font-size:12.5px;line-height:1.38}
    .when b{color:var(--ink)}
    .hint-link{margin:9px 0 0;border:0;background:transparent;color:var(--ink);padding:0;font-size:12px;font-weight:760;text-decoration:underline;text-underline-offset:3px}
    .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
    .option{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 8px;text-align:center;font-size:12px;font-weight:760;line-height:1.2}
    .option:hover{background:var(--soft)}
    .option.selected.checked{background:var(--green-bg);border-color:#8eae97;color:var(--green)}
    .option.selected.not_checked{background:var(--red-bg);border-color:#d78175;color:var(--red)}
    .option.selected.unknown{background:var(--gray-bg);border-color:#c5c9cc;color:var(--gray)}
    .card-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
    .card-nav span{color:var(--muted);font-size:11px;text-align:center}
    .work-footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

    .result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
    .metric{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}
    .metric strong{font-size:22px;display:block;line-height:1.1}
    .metric span{font-size:11px;color:var(--muted)}
    .metric.good{border-color:#8eae97;background:var(--green-bg)}
    .metric.gap{border-color:var(--red);background:var(--red-bg)}
    .metric.unknown{border-color:#c5c9cc;background:var(--gray-bg)}
    .result-section{margin-top:14px}
    .result-section>h2{font-size:18px;margin-bottom:8px}
    .gap-list{display:grid;gap:6px}
    .gap-card{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
    .gap-card summary{list-style:none;padding:10px 11px;cursor:pointer;font-weight:780;font-size:13px}
    .gap-card summary::-webkit-details-marker{display:none}
    .gap-card summary::after{content:"＋";float:right;color:var(--muted)}
    .gap-card[open] summary::after{content:"−"}
    .gap-body{border-top:1px solid var(--line);padding:9px 11px 10px}
    .gap-body ul{margin:0;padding-left:18px}
    .gap-body li{margin:4px 0;font-size:12.5px}
    .status-word{font-weight:800}
    .status-word.gap{color:var(--red)}
    .status-word.unknown{color:var(--gray)}
    .consequences{display:grid;gap:6px}
    .consequence-card{border-radius:9px;padding:11px;border-left:3px solid #c8cdca;background:#f3f4f2}
    .consequence-card h3{font-size:14px;margin-bottom:4px}
    .consequence-card p{margin:0;color:#5f6763;font-size:12.5px}
    .empty{padding:14px;border:1px dashed #aeb5b1;border-radius:9px;text-align:center;color:var(--muted);font-size:12.5px}
    .toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:#fff;padding:9px 11px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:30;font-size:12px}
    .toast.show{opacity:1;transform:none}
    .modal{position:fixed;inset:0;background:rgba(32,37,35,.48);display:grid;place-items:center;padding:18px;z-index:40}
    .modal.hidden{display:none}
    .modal-card{background:var(--paper);border-radius:12px;max-width:500px;width:100%;padding:18px;box-shadow:var(--shadow)}
    .modal-card h2{font-size:19px}
    .modal-card p{color:var(--muted);font-size:13px}
    .print-report{display:none}

    @media(max-width:560px){
      .shell{padding:5px 4px 24px}.screen-pad{padding:14px}h1{font-size:22px}
      .stage-tab{font-size:11px;padding:9px 5px;min-height:45px}
      .work{padding:10px}
      .section-layout,.section-layout.right{grid-template-columns:96px minmax(0,1fr);gap:8px}
      .section-layout.right{grid-template-columns:minmax(0,1fr) 96px}
      .section-tab{font-size:11px;padding:8px 6px}
      .options{grid-template-columns:1fr}
      .result-grid{grid-template-columns:1fr}
      .card-nav{align-items:stretch}.card-nav .btn{flex:1;padding-inline:6px}
    }

    @media print{
      @page{size:A4;margin:13mm}
      body{background:#fff;color:#202523;font:10.5pt/1.35 Arial,sans-serif}
      body>*:not(.print-report){display:none!important}
      .print-report{display:block!important}
      .print-report h1{font:700 20pt/1.15 Arial,sans-serif;margin:0 0 4mm;color:#202523}
      .print-meta{margin:0 0 6mm;color:#68706c}
      .print-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;margin:0 0 7mm}
      .print-summary div{border:1px solid #d9ddda;border-radius:2mm;padding:3mm}
      .print-summary div:nth-child(1){border-color:#8eae97;background:#eaf4ed;color:#315f40}
      .print-summary div:nth-child(2){border-color:#a94235;background:#f7e8e5;color:#a94235}
      .print-summary div:nth-child(3){border-color:#aeb5b1;background:#ecefed;color:#59615d}
      .print-summary b{display:block;font-size:16pt}
      .print-section{font:700 14pt/1.25 Arial,sans-serif;color:#202523;margin:7mm 0 3mm;border-bottom:1px solid #202523;padding-bottom:2mm}
      .print-group{break-inside:avoid;margin:0 0 4mm}
      .print-group h3{font:700 11.5pt/1.3 Arial,sans-serif;margin:0 0 2mm}
      .print-group ul{margin:0;padding-left:5mm}
      .print-status{font-weight:700}
      .print-status.gap{color:#a94235}
      .print-status.unknown{color:#59615d}
      .print-consequence{break-inside:avoid;border-left:3px solid #c8cdca;background:#f3f4f2;padding:3mm;margin:0 0 3mm;color:#5f6763}
      .print-consequence b{display:block;margin-bottom:1mm;color:#202523}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" id="app" aria-live="polite"></section>
  </main>
  <section class="print-report" id="printReport" aria-hidden="true"></section>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal hidden" id="hintModal" role="dialog" aria-modal="true" aria-labelledby="hintTitle">
    <div class="modal-card"><h2 id="hintTitle">Что проверяем</h2><p id="hintText"></p><div class="btnrow"><button class="btn primary" data-action="close-hint">Понятно</button></div></div>
  </div>
  <div class="modal hidden" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
    <div class="modal-card"><h2 id="resetTitle">Начать заново?</h2><p>Тренажер удалит ответы. Отменить это действие не получится.</p><div class="btnrow"><button class="btn" data-action="cancel-reset">Отмена</button><button class="btn danger" data-action="confirm-reset">Удалить ответы</button></div></div>
  </div>
  <script>
  (() => {
    "use strict";
    const STORAGE_KEY="counterparty_signals_check_v2";
    const LEGACY_KEY="counterparty_signals_check_v1";
    const statuses={checked:{label:"Проверяем",short:"Проверяем",kind:"good"},not_checked:{label:"Не проверяем",short:"Не проверяем",kind:"gap"},unknown:{label:"Не знаю, проверяем ли",short:"Не знаю, проверяем ли",kind:"unknown"}};
    const stages=[
      {id:"counterparty",title:"Проверяем контрагента",desc:"С кем компания работает и способен ли контрагент вести заявленную деятельность?",sections:["status","tax","resources","chain"]},
      {id:"transaction",title:"Проверяем сделку",desc:"Может ли контрагент исполнить конкретный договор и чем компания подтвердит исполнение?",sections:["capability","evidence"]},
      {id:"review",title:"Обновляем проверку",desc:"Когда обновлять сведения планово и после существенных изменений?",sections:["planned","event"]}
    ];
    const sections=[
      {id:"status",stage:"counterparty",tab:"Статус",title:"Статус и полномочия",desc:"Статус компании, адрес, руководитель, участники и полномочия представителей"},
      {id:"tax",stage:"counterparty",tab:"Налоги",title:"Налоги и финансы",desc:"Отчетность, долги, ограничения и соответствие масштаба бизнеса будущей сделке"},
      {id:"resources",stage:"counterparty",tab:"Ресурсы",title:"Ресурсы и деловая история",desc:"Люди, площадки, оборудование, опыт, причина выбора и обязательные разрешения"},
      {id:"chain",stage:"counterparty",tab:"Цепочка",title:"Цепочка и расчеты",desc:"Посредники, другие участники и платежи третьим лицам"},
      {id:"capability",stage:"transaction",tab:"Условия",title:"Условия и исполнители",desc:"Особые условия, объем, срок и фактические исполнители"},
      {id:"evidence",stage:"transaction",tab:"Доказательства",title:"Товар и доказательства",desc:"Источник товара, хранение, перевозка, документы и результат"},
      {id:"planned",stage:"review",tab:"Плановая",title:"Плановая проверка",desc:"Как часто компания обновляет сведения о действующих контрагентах"},
      {id:"event",stage:"review",tab:"Внеплановая",title:"Внеплановая проверка",desc:"Какие изменения запускают повторную проверку"}
    ];
    const questions = [
      {
        id:"lifecycle",section:"status",label:"Статус, ликвидация и банкротство",
        question:"Компания проверяет, действует ли контрагент, не находится ли в стадии ликвидации или банкротства?",
        hint:"Проверьте ЕГРЮЛ, Федресурс и картотеку арбитражных дел: действующий статус, ликвидацию, заявление о банкротстве и стадию процедуры.",
        consequence:"Контрагент не исполнит договор, не вернет аванс, выдаст недостоверные документы. Если компания не проверит статус контрагента, ей будет сложно доказать ФНС, что в период сделки контрагент работал и мог исполнить обязательства.",
        when:"до сделки, при продлении договора и после сообщения о ликвидации или банкротстве"
      },
      {
        id:"reliable_address",section:"status",label:"Достоверность сведений и адрес",
        question:"Компания проверяет достоверность сведений в ЕГРЮЛ и фактическое присутствие контрагента по адресу?",
        hint:"Проверьте запись о недостоверности, массовый адрес, расхождение юридического и фактического адресов, документы на помещение и фактическое присутствие.",
        consequence:"Компания не установит, где контрагент работает и кто им управляет. ФНС учтет недостоверный адрес вместе с другими противоречиями, обвинит контрагента в недобросовестности, а компанию — в недостаточной осмотрительности. Налоговая снимет вычеты НДС и расходы по налогу на прибыль.",
        when:"до первой сделки, при изменении адреса и при обновлении сведений"
      },
      {
        id:"representatives",section:"status",label:"Полномочия и взаимодействие",
        question:"Компания проверяет полномочия тех, кто ведет переговоры и подписывает документы от имени контрагента, и сохраняет подтверждение взаимодействия с ними?",
        hint:"Сверьте руководителя с ЕГРЮЛ. Проверьте доверенность, приказ, решение, срок и объем полномочий. Сохраните переписку, коммерческие предложения, протоколы встреч и другие следы взаимодействия.",
        consequence:"Если контрагент не подтвердит полномочия, взаимодействие с контрагентом, переписка и первичка не докажут, что условия сделки согласовывал и документы подписывал представитель контрагента. ФНС решит, что сделки не было, и снимет вычеты НДС и расходы по налогу на прибыль.",
        when:"до согласования существенных условий и подписания документов"
      },
      {
        id:"director_limits",section:"status",label:"Ограничения руководителя",
        question:"Компания проверяет руководителя контрагента в реестре дисквалифицированных лиц и наличие ограничений на управление компанией?",
        hint:"Проверьте реестр дисквалифицированных лиц и ограничения на управление юридическими лицами.",
        consequence:"Если документы подписал дисквалифицированный руководитель, ФНС в совокупности с другими фактами решит, что контрагент недобросовестный. Снимет вычеты НДС и расходы по налогу на прибыль.",
        when:"до сделки и при смене руководителя"
      },
      {
        id:"participant_limits",section:"status",label:"Ограничения участников",
        question:"Компания проверяет ограничения участников на участие в юридических лицах?",
        hint:"Проверьте ограничения участников на создание юридических лиц и участие в них.",
        consequence:"Компания пропустит признак номинального владения или формального управления. ФНС в совокупности с иными обстоятельствами усомнится, что контрагент ведет самостоятельный бизнес. Обвинит компанию в том, что она получила необоснованную налоговую выгоду.",
        when:"до сделки и при смене участников"
      },
      {
        id:"reporting_debt",section:"tax",label:"Отчетность и налоговые долги",
        question:"Компания проверяет, сдает ли контрагент налоговую и бухгалтерскую отчетность и есть ли у него налоговые долги?",
        hint:"Установите, сдана ли налоговая и бухгалтерская отчетность, какие периоды пропущены, есть ли недоимка, пени и штрафы.",
        consequence:"Финансово нестабильный контрагент сорвет сделку. Если отчетность не подтверждает масштаб деятельности, компания не сможет доказать, что именно этот контрагент исполнил договор. Налоговый долг может привести к взысканиям и блокировке счетов. Контрагенту не хватит денег на исполнение договора, и он сорвет сделку.",
        when:"до сделки и при плановом обновлении сведений"
      },
      {
        id:"breaches_blocks",section:"tax",label:"Нарушения и блокировки счетов",
        question:"Компания проверяет налоговые нарушения и блокировки счетов контрагента?",
        hint:"Проверьте сведения о налоговых правонарушениях, их повторяемость и решения о приостановлении операций по счетам.",
        consequence:"Повторные существенные нарушения могут привести к взысканию денег и блокировке счетов. Из-за блокировки деньги застрянут на счете контрагента, он не рассчитается с поставщиками и исполнителями и сорвет сделку. Компания потеряет аванс, нарушит свои обязательства перед заказчиками и заплатит неустойку. Вдобавок получит претензии от ФНС.",
        when:"до аванса или существенной оплаты и при обновлении сведений"
      },
      {
        id:"enforcement",section:"tax",label:"Исполнительные производства",
        question:"Компания проверяет исполнительные производства и сопоставляет долги с масштабом бизнеса и суммой сделки?",
        hint:"Сопоставьте сумму, предмет, остаток и динамику исполнительных производств с выручкой и ценой договора.",
        consequence:"Приставы могут взыскать деньги или имущество, которые нужны контрагенту для исполнения договора. Компания рискует не получить товар, работу, услугу или возврат аванса. Для ФНС это один из сигналов недобросовестности контрагента.",
        when:"до сделки и при плановом обновлении сведений"
      },
      {

    const blankState=()=>({screen:"work",stage:"counterparty",section:"status",index:0,answers:{},updated:null});
    let state=loadState();if(state.screen==="start"){state.screen="work";state.stage="counterparty";state.section="status";state.index=0}let toastTimer;
    function loadState(){
      try{
        const current=JSON.parse(localStorage.getItem(STORAGE_KEY));
        if(current&&current.answers)return {...blankState(),...current,answers:current.answers||{}};
        const legacy=JSON.parse(localStorage.getItem(LEGACY_KEY));
        if(legacy&&legacy.answers)return {...blankState(),screen:"work",answers:legacy.answers||{}};
      }catch(error){}
      return blankState();
    }
    function saveState(){state.updated=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(error){}}
    function clearState(){try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(LEGACY_KEY)}catch(error){}}
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function sectionById(id){return sections.find(s=>s.id===id)}
    function stageById(id){return stages.find(s=>s.id===id)}
    function sectionQuestions(id){return questions.filter(q=>q.section===id)}
    function answeredCount(){return questions.filter(q=>state.answers[q.id]).length}
    function answeredSection(id){return sectionQuestions(id).filter(q=>state.answers[q.id]).length}
    function sectionDone(id){const list=sectionQuestions(id);return list.length>0&&list.every(q=>state.answers[q.id])}
    function stageQuestions(id){const stage=stageById(id);return questions.filter(q=>stage.sections.includes(q.section))}
    function stageDone(id){const list=stageQuestions(id);return list.length>0&&list.every(q=>state.answers[q.id])}
    function answeredStage(id){return stageQuestions(id).filter(q=>state.answers[q.id]).length}
    function stats(){const out={checked:0,not_checked:0,unknown:0};questions.forEach(q=>{if(state.answers[q.id])out[state.answers[q.id]]++});return out}
    function progressMarkup(){const n=answeredCount(),total=questions.length;return `<div class="progress"><span style="width:${n/total*100}%"></span></div><div class="progressline"><span>${n} из ${total} вопросов</span></div>`}
    function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1800)}
    function reportHeight(){const height=Math.ceil(Math.max(document.body.scrollHeight,document.documentElement.scrollHeight));if(window.parent!==window)window.parent.postMessage({type:"counterparty-signals-height",height},"*")}
    function render(preserve=false){const y=window.scrollY;document.getElementById("app").innerHTML=state.screen==="results"?resultScreen():workScreen();requestAnimationFrame(()=>{if(preserve)window.scrollTo(0,y);reportHeight()})}
    function startScreen(){const has=answeredCount()>0;return `<div class="screen-pad"><h1>Самоаудит проверки контрагентов</h1>${has?progressMarkup():""}<div class="btnrow"><button class="btn primary" data-action="${has?"continue":"begin"}">${has?"Продолжить":"Начать"}</button>${has?`<button class="btn" data-action="results">Посмотреть результат</button><button class="btn danger" data-action="reset">Начать заново</button>`:""}</div></div>`}
    function firstIncompleteSection(stageId){const stage=stageById(stageId);return stage.sections.find(id=>!sectionDone(id))||stage.sections[0]}
    function firstIncompleteIndex(sectionId){const list=sectionQuestions(sectionId);const i=list.findIndex(q=>!state.answers[q.id]);return i<0?0:i}
    function completionDestination(sectionId){
      const section=sectionById(sectionId),stage=stageById(section.stage);
      const sectionIndex=stage.sections.indexOf(sectionId);
      if(sectionIndex<stage.sections.length-1){
        return {action:"next-section",id:stage.sections[sectionIndex+1],label:"Следующая группа →"};
      }
      const stageIndex=stages.findIndex(item=>item.id===stage.id);
      if(stageIndex<stages.length-1){
        return {action:"next-stage",id:stages[stageIndex+1].id,label:"Следующий этап →"};
      }
      return {action:"results",id:"",label:"Посмотреть результат"};
    }
    function workScreen(){
      const stage=stageById(state.stage)||stages[0];
      if(!state.stage){state.stage=stage.id}
      if(!stage.sections.includes(state.section)){state.section=firstIncompleteSection(stage.id)}
      const section=sectionById(state.section)||sectionById(stage.sections[0]);
      const list=sectionQuestions(section.id);state.index=Math.max(0,Math.min(state.index,list.length-1));const q=list[state.index];
      const isLastQuestion=state.index===list.length-1;
      const destination=isLastQuestion?completionDestination(section.id):null;
      const currentAnswered=!!state.answers[q.id];
      const nextButton=isLastQuestion
        ? `<button class="btn ${currentAnswered?"primary":""}" data-action="${destination.action}" ${destination.id?`data-id="${destination.id}"`:""} ${currentAnswered?"":"disabled"}>${destination.label}</button>`
        : `<button class="btn" data-action="next" ${currentAnswered?"":"disabled"}>Следующий →</button>`;
      const stageNav=`<nav class="stage-nav" aria-label="Этапы проверки">${stages.map((s,i)=>`<button class="stage-tab ${state.stage===s.id?"active":""} ${stageDone(s.id)?"done":""}" data-action="stage" data-id="${s.id}"><span class="stage-copy"><b>${esc(s.title)}</b></span></button>`).join("")}</nav>`;
      const tabs=`<nav class="section-tabs" aria-label="Разделы">${stage.sections.map(id=>{const s=sectionById(id);return `<button class="section-tab ${section.id===id?"active":""}" data-action="section" data-id="${id}">${esc(s.tab)}</button>`}).join("")}</nav>`;
      const question=`<div class="question-area"><article class="criterion"><div class="criterion-head"><span class="number">${state.index+1}</span><h3>${esc(q.question)}</h3></div><p class="impact">${esc(q.consequence)}</p><p class="when"><b>Когда проверять:</b> ${esc(q.when)}.</p><button class="hint-link" data-action="hint" data-id="${q.id}">Что проверяем</button><div class="options">${Object.entries(statuses).map(([id,s])=>`<button class="option ${id} ${state.answers[q.id]===id?"selected":""}" data-action="answer" data-id="${q.id}" data-status="${id}">${esc(s.label)}</button>`).join("")}</div></article><div class="card-nav"><button class="btn" data-action="previous" ${state.index===0?"disabled":""}>← Назад</button><span>${state.index+1} из ${list.length}</span>${nextButton}</div><div class="work-footer"><button class="btn" data-action="results">Результат</button><button class="btn danger" data-action="reset">Начать заново</button></div></div>`;
      return `<div class="progress-wrap">${progressMarkup()}</div>${stageNav}<section class="work"><div class="section-layout">${tabs}${question}</div></section>`;
    }
    function gapsBySection(){return sections.map(s=>({...s,items:sectionQuestions(s.id).filter(q=>state.answers[q.id]==="not_checked"||state.answers[q.id]==="unknown")})).filter(s=>s.items.length)}
    function activeConsequences(){const ids=new Set(questions.filter(q=>state.answers[q.id]==="not_checked"||state.answers[q.id]==="unknown").map(q=>q.id));return consequences.filter(c=>c.questionIds.some(id=>ids.has(id)))}
    function resultScreen(){const total=stats(),gaps=gapsBySection(),risks=activeConsequences(),complete=answeredCount()===questions.length;return `<div class="screen-pad">${progressMarkup()}<h1 style="font-size:32px;margin-top:23px">Краткая карта проверки</h1><div class="result-grid"><div class="metric good"><strong>${total.checked}</strong><span>проверяем</span></div><div class="metric gap"><strong>${total.not_checked}</strong><span>не проверяем</span></div><div class="metric unknown"><strong>${total.unknown}</strong><span>не знаем</span></div></div><section class="result-section"><h2>Где есть пробелы</h2>${gaps.length?`<div class="gap-list">${gaps.map(s=>`<details class="gap-card"><summary>${esc(s.title)} — ${s.items.length}</summary><div class="gap-body"><ul>${s.items.map(q=>`<li><span class="status-word ${state.answers[q.id]==="unknown"?"unknown":"gap"}">${state.answers[q.id]==="unknown"?"Не знаю, проверяем ли":"Не проверяем"}:</span> ${esc(q.label)}</li>`).join("")}</ul></div></details>`).join("")}</div>`:`<div class="empty">По текущим ответам пробелов нет.</div>`}</section><section class="result-section"><h2>К чему могут привести пробелы</h2>${risks.length?`<div class="consequences">${risks.map(r=>`<article class="consequence-card"><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p></article>`).join("")}</div>`:`<div class="empty">Риски появятся, если компания не проверяет признак или не знает, проверяет ли его.</div>`}</section><div class="btnrow"><button class="btn primary" data-action="print">Скачать краткую карту в PDF</button><button class="btn" data-action="back-work">Вернуться к вопросам</button></div></div>`}
    function buildPrintReport(){const total=stats(),gaps=gapsBySection(),risks=activeConsequences();document.getElementById("printReport").innerHTML=`<h1>Краткая карта пробелов в проверке контрагентов</h1><div class="print-meta">Дата: ${esc(new Date().toLocaleDateString("ru-RU"))}</div><div class="print-summary"><div><b>${total.checked}</b>Проверяем</div><div><b>${total.not_checked}</b>Не проверяем</div><div><b>${total.unknown}</b>Не знаю, проверяем ли</div></div><h2 class="print-section">Где есть пробелы</h2>${gaps.length?gaps.map(s=>`<div class="print-group"><h3>${esc(s.title)}</h3><ul>${s.items.map(q=>`<li><span class="print-status ${state.answers[q.id]==="unknown"?"unknown":"gap"}">${state.answers[q.id]==="unknown"?"Не знаю, проверяем ли":"Не проверяем"}:</span> ${esc(q.label)}</li>`).join("")}</ul></div>`).join(""):`<p>По текущим ответам пробелов нет.</p>`}<h2 class="print-section">К чему могут привести пробелы</h2>${risks.length?risks.map(r=>`<div class="print-consequence"><b>${esc(r.title)}</b>${esc(r.text)}</div>`).join(""):`<p>По текущим ответам риски не выявлены.</p>`}`}
    function continueFromProgress(){const stage=stages.find(s=>!stageDone(s.id))||stages[0];state.stage=stage.id;state.section=firstIncompleteSection(stage.id);state.index=firstIncompleteIndex(state.section);state.screen="work"}
    document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
      if(a==="begin"){state.screen="work";state.stage=stages[0].id;state.section=firstIncompleteSection(state.stage);state.index=firstIncompleteIndex(state.section)}
      else if(a==="continue"){continueFromProgress()}
      else if(a==="stage"){state.stage=b.dataset.id;state.section=firstIncompleteSection(state.stage);state.index=firstIncompleteIndex(state.section);state.screen="work"}
      else if(a==="section"){state.section=b.dataset.id;state.stage=sectionById(state.section).stage;state.index=firstIncompleteIndex(state.section)}
      else if(a==="answer"){state.answers[b.dataset.id]=b.dataset.status;saveState();render(true);return}
      else if(a==="previous"){state.index=Math.max(0,state.index-1)}
      else if(a==="next"){state.index=Math.min(sectionQuestions(state.section).length-1,state.index+1)}
      else if(a==="next-section"){state.section=b.dataset.id;state.stage=sectionById(state.section).stage;state.index=firstIncompleteIndex(state.section)}
      else if(a==="next-stage"){state.stage=b.dataset.id;state.section=firstIncompleteSection(state.stage);state.index=firstIncompleteIndex(state.section)}
      else if(a==="results"){state.screen="results"}
      else if(a==="back-work"){state.screen="work"}
      else if(a==="hint"){const q=questions.find(q=>q.id===b.dataset.id);document.getElementById("hintText").textContent=q.hint;document.getElementById("hintModal").classList.remove("hidden");return}
      else if(a==="close-hint"){document.getElementById("hintModal").classList.add("hidden");return}
      else if(a==="print"){buildPrintReport();toast("В окне печати выберите «Сохранить как PDF»");setTimeout(()=>window.print(),160);return}
      else if(a==="reset"){document.getElementById("resetModal").classList.remove("hidden");return}
      else if(a==="cancel-reset"){document.getElementById("resetModal").classList.add("hidden");return}
      else if(a==="confirm-reset"){clearState();state=blankState();document.getElementById("resetModal").classList.add("hidden");render();toast("Ответы удалены");return}
      saveState();render();
    });
    document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("hintModal").classList.add("hidden");document.getElementById("resetModal").classList.add("hidden")}});
    document.getElementById("hintModal").addEventListener("click",e=>{if(e.target.id==="hintModal")e.currentTarget.classList.add("hidden")});
    document.getElementById("resetModal").addEventListener("click",e=>{if(e.target.id==="resetModal")e.currentTarget.classList.add("hidden")});
    if("ResizeObserver" in window){const ro=new ResizeObserver(()=>requestAnimationFrame(reportHeight));ro.observe(document.documentElement)}
    window.addEventListener("load",reportHeight);render();
  })();
  </script>
</body>
</html>
