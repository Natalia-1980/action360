<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Выручка · задачник</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            max-width: 650px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 2rem 1.8rem;
            border: 1px solid #dee6f0;
            max-height: 90vh;
            overflow-y: auto;
        }

        .progress {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .step {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #e9f0fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: #1e3b5c;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .step.active {
            background: #1e3b5c;
            color: white;
        }
        .step.completed {
            background: #2b8c4a;
            color: white;
        }

        .task-container {
            background: #f9fcff;
            border-radius: 28px;
            padding: 1.5rem;
            border: 1px solid #d2e0f0;
            margin-bottom: 1rem;
        }

        .task-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #0a2942;
            margin-bottom: 1.2rem;
            white-space: pre-line;
        }

        .answers-area {
            margin: 1rem 0;
        }
        .answer-option {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            border: 2px solid #d8e2f2;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.95rem;
            margin-bottom: 0.6rem;
        }
        .answer-option:hover {
            background: #f0f7ff;
            border-color: #8da9cc;
        }
        .answer-option.selected {
            background: #e1ecfe;
            border-color: #1e6bb8;
        }
        .answer-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #1e6bb8;
        }

        .button-row {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }
        .btn {
            background: white;
            border: 2px solid #1e3b5c;
            border-radius: 40px;
            padding: 0.5rem 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3b5c;
            cursor: pointer;
            box-shadow: 0 2px 0 #b0c4dd;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b0c4dd;
        }

        .feedback {
            background: #f2f8fd;
            border-radius: 18px;
            padding: 1rem;
            border: 2px solid #b9d3f0;
            margin-top: 1rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .feedback.correct {
            border-color: #2b8c4a;
            background: #eefaee;
        }
        .feedback.incorrect {
            border-color: #b13e3e;
            background: #fff2f2;
        }

        .status-list {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #2c4e6e;
            border-top: 1px solid #d8e2f2;
            padding-top: 0.8rem;
        }
        .status-item {
            margin: 0.3rem 0;
        }
        .status-answered {
            color: #2b8c4a;
            font-weight: 500;
        }
        .status-not-answered {
            color: #8fa0b5;
        }

        .nav-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        .nav-btn {
            background: white;
            border: 2px solid #1e3b5c;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3b5c;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .final-message {
            text-align: center;
            margin-top: 1rem;
            font-size: 1rem;
            color: #2b8c4a;
        }

        @media (max-width: 500px) {
            .card { padding: 1.2rem; }
            .progress { gap: 0.5rem; }
            .step { width: 32px; height: 32px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="progress" id="progressContainer"></div>
        <div id="taskContainer" class="task-container"></div>
        <div class="nav-buttons">
            <button class="nav-btn" id="nextBtn" disabled>Далее →</button>
        </div>
        <div id="finalMessage" class="hidden final-message"></div>
    </div>

    <script>
        (function() {
            const tasks = [
                {
                    text: "Задача 1. Скидки\n\nООО «ТоргСнаб» заключило договор поставки с постоянным клиентом. Цена за единицу товара — 10 000 руб. (без НДС). В договоре предусмотрено:\n• если клиент купит от 100 до 199 единиц — ретро-скидка 5% от всей суммы поставки за квартал;\n• если 200 и более единиц — скидка 10%.\nНа отчетную дату (31 марта) клиент уже купил 150 единиц товара. Остаток квартала — апрель–июнь. Прогнозы отдела продаж:\n• вероятность, что клиент докупит до 199 ед. (итого 150–199) — 70%;\n• вероятность, что клиент превысит план и купит 200+ ед. — 30%.\nУчётной политикой ООО «ТоргСнаб» для таких договоров установлен способ оценки будущей скидки: «наиболее вероятное значение» (подп. «б» п. 28 ФСБУ 9/2025).\nКакую сумму выручки нужно признать по итогам первого квартала за уже отгруженные 150 единиц?",
                    options: [
                        "а) 1 500 000 руб.",
                        "б) 1 425 000 руб.",
                        "в) 1 350 000 руб."
                    ],
                    correct: 1,
                    explanation: "<strong>Правильный ответ: б) 1 425 000 руб.</strong><br><br><strong>Шаг 1.</strong> Без скидки: 150 ед. × 10 000 = 1 500 000 руб.<br><br><strong>Шаг 2.</strong> Наиболее вероятный объём за квартал: 150–199 ед. (вероятность 70%, больше, чем 30%). Скидка при таком объёме: 5%.<br><br><strong>Шаг 3.</strong> Выручка = 1 500 000 × (100% − 5%) = 1 500 000 × 0,95 = 1 425 000 руб."
                },
                {
                    text: "Задача 2. Отсрочка\n\nАО «МашТех» 1 апреля 2026 года отгрузило оборудование покупателю. Договорная цена (номинал) — 12 000 000 руб. (без НДС). Оплата происходит не сразу, а через 2 года — 1 апреля 2028 года. Рыночная ставка процента для аналогичных отсрочек — 10% годовых. Учётной политикой АО «МашТех» предусмотрено, что упрощение из п. 31 ФСБУ 9/2025 не применяется, так как отсрочка превышает 12 месяцев и имеет коммерческое содержание.\nКакую сумму выручки нужно признать 1 апреля 2026 года?",
                    options: [
                        "а) 12 000 000 руб. (вся договорная сумма, так как отсрочка всё равно будет оплачена)",
                        "б) 10 909 091 руб. (дисконтирование по простой ставке: 12 млн / 1,10)",
                        "в) 9 917 355 руб. (дисконтирование по сложной ставке: 12 млн / 1,10²)"
                    ],
                    correct: 2,
                    explanation: "<strong>Правильный ответ: в) 9 917 355 руб.</strong><br><br><strong>Шаг 1.</strong> Выручка при длительной отсрочке (более 12 месяцев) определяется не по номиналу договора, а путём дисконтирования будущего платежа по рыночной ставке.<br><br><strong>Шаг 2.</strong> Поскольку отсрочка составляет 2 года, используем формулу сложных процентов:<br>Выручка = 12 000 000 / (1 + 0,10)² = 12 000 000 / 1,21 = 9 917 355 руб.<br><br><strong>Шаг 3.</strong> Разница между номиналом (12 млн) и дисконтированной суммой (9 917 355 руб.) — это проценты за отсрочку, которые будут признаваться в составе прочих доходов в 2026, 2027 и 2028 годах до момента оплаты."
                }
            ];

            let currentTask = 0;
            let answered = new Array(tasks.length).fill(false);
            let selectedAnswers = new Array(tasks.length).fill(null);

            const taskContainer = document.getElementById('taskContainer');
            const nextBtn = document.getElementById('nextBtn');
            const progressContainer = document.getElementById('progressContainer');
            const finalMessage = document.getElementById('finalMessage');

            function updateProgress() {
                let html = '';
                for (let i = 0; i < tasks.length; i++) {
                    let statusClass = '';
                    if (i === currentTask && !answered[currentTask]) statusClass = 'active';
                    else if (answered[i]) statusClass = 'completed';
                    html += `<div class="step ${statusClass}">${i+1}</div>`;
                }
                progressContainer.innerHTML = html;
            }

            function renderCurrentTask() {
                const task = tasks[currentTask];
                
                let optionsHtml = '';
                task.options.forEach((opt, idx) => {
                    const isSelected = (selectedAnswers[currentTask] === idx);
                    const selectedClass = isSelected ? 'selected' : '';
                    optionsHtml += `
                        <div class="answer-option ${selectedClass}" data-opt-index="${idx}">
                            <input type="radio" name="taskOption" value="${idx}" id="opt${idx}" ${isSelected ? 'checked' : ''}>
                            <label for="opt${idx}">${opt}</label>
                        </div>
                    `;
                });

                let statusHtml = '<div class="status-list"><strong>Статус задач:</strong><br>';
                for (let i = 0; i < tasks.length; i++) {
                    const isAnswered = answered[i];
                    const statusText = isAnswered ? '✅ Решена' : '○ Не решена';
                    const statusClass = isAnswered ? 'status-answered' : 'status-not-answered';
                    statusHtml += `<div class="status-item"><span class="${statusClass}">${statusText}</span> — Задача ${i+1}</div>`;
                }
                statusHtml += '</div>';

                const html = `
                    <div class="task-text">${task.text}</div>
                    <div class="answers-area">
                        ${optionsHtml}
                    </div>
                    <div class="button-row">
                        <button class="btn" id="checkBtn">Проверить</button>
                    </div>
                    <div id="feedback" class="feedback hidden"></div>
                    ${statusHtml}
                `;

                taskContainer.innerHTML = html;

                // Обработчики для выбора ответа
                document.querySelectorAll('.answer-option').forEach(opt => {
                    opt.addEventListener('click', function(e) {
                        document.querySelectorAll('.answer-option').forEach(o => o.classList.remove('selected'));
                        this.classList.add('selected');
                        const radio = this.querySelector('input[type="radio"]');
                        radio.checked = true;
                        selectedAnswers[currentTask] = parseInt(this.dataset.optIndex);
                    });
                });

                document.getElementById('checkBtn').addEventListener('click', () => {
                    if (answered[currentTask]) return;
                    checkAnswer();
                });

                updateProgress();
            }
            
            function checkAnswer() {
                const task = tasks[currentTask];
                const selected = selectedAnswers[currentTask];
                
                if (selected === null) {
                    alert('Выберите вариант ответа');
                    return;
                }
                
                const isCorrect = (selected === task.correct);
                answered[currentTask] = true;
                
                const feedbackDiv = document.getElementById('feedback');
                feedbackDiv.classList.remove('hidden', 'correct', 'incorrect');
                feedbackDiv.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
                feedbackDiv.innerHTML = task.explanation;
                
                updateProgress();
                
                if (currentTask < tasks.length - 1) {
                    nextBtn.disabled = false;
                } else {
                    nextBtn.textContent = 'Завершить';
                    nextBtn.disabled = false;
                }
            }
            
            nextBtn.addEventListener('click', () => {
                if (currentTask < tasks.length - 1) {
                    currentTask++;
                    renderCurrentTask();
                    nextBtn.disabled = true;
                } else {
                    taskContainer.classList.add('hidden');
                    nextBtn.classList.add('hidden');
                    finalMessage.classList.remove('hidden');
                    finalMessage.innerHTML = '✅ Все задачи решены! Спасибо за работу!';
                }
            });
            
            renderCurrentTask();
        })();
    </script>
</body>
</html>
