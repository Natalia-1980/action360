<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Тренажёр: ЭТрН · Чат с водителем</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            padding: 12px;
        }

        .messenger {
            max-width: 700px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .chat-header {
            background: #FFFFFF;
            padding: 10px 16px 8px 16px;
            border-bottom: 1px solid rgba(100, 160, 210, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #95CAFA, #7bb5df);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .chat-info h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #1a2c3e;
        }
        .chat-info h2 span {
            font-weight: 500;
            background: #ecf7ff;
            padding: 1px 6px;
            border-radius: 30px;
            font-size: 0.6rem;
            margin-left: 6px;
        }
        .chat-info p {
            font-size: 0.68rem;
            color: #5e7a93;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .online-dot {
            width: 6px;
            height: 6px;
            background: #2fc96b;
            border-radius: 6px;
        }

        .messages-area {
            background: #FEFEFE;
            padding: 12px 14px 8px 14px;
            min-height: 360px;
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            max-width: 88%;
        }
        .client-message { align-self: flex-start; }
        .client-message .bubble {
            background: #F1F5F9;
            border-radius: 16px 16px 16px 6px;
            border: 1px solid #e2ecf5;
        }
        .user-message { align-self: flex-end; }
        .user-message .bubble {
            background: #ECF5FC;
            border-radius: 16px 16px 6px 16px;
            border: 1px solid #cde0ef;
        }
        .bubble {
            padding: 7px 12px;
            font-size: 0.82rem;
            line-height: 1.4;
            color: #1e2e3c;
        }
        .message-meta {
            font-size: 0.6rem;
            margin-top: 3px;
            margin-left: 8px;
            margin-right: 8px;
            color: #8da0b2;
            display: flex;
            gap: 6px;
        }
        .client-message .message-meta { justify-content: flex-start; }
        .user-message .message-meta { justify-content: flex-end; }

        .options-panel {
            background: #FFFFFF;
            border-top: 1px solid #e9eff5;
            padding: 10px 14px 10px;
        }
        .options-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            color: #5e7a93;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .options-title::before { content: "⚡"; font-size: 11px; }
        .options-grid { display: flex; flex-direction: column; gap: 7px; }
        .option-btn {
            width: 100%;
            background: transparent;
            border: 1.5px solid #cde2f5;
            border-radius: 20px;
            padding: 7px 12px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            text-align: left;
            color: #1e2f3e;
            cursor: pointer;
            transition: all 0.15s;
            background: #FFFFFF;
            line-height: 1.3;
        }
        .option-btn:hover {
            background: #F4FAFF;
            border-color: #9bc6ec;
        }
        .options-disabled .option-btn {
            opacity: 0.55;
            cursor: default;
            pointer-events: none;
        }

        .analysis-card {
            margin: 6px 14px 12px 14px;
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 0.74rem;
            line-height: 1.4;
        }
        .analysis-card.correct {
            background-color: #e8f5e9;
            border-left: 4px solid #2c9b5e;
            color: #155724;
        }
        .analysis-card.wrong {
            background-color: #ffeaea;
            border-left: 4px solid #dc3545;
            color: #8b2c2c;
        }
        .feedback-footnote {
            margin-top: 6px;
            font-size: 0.65rem;
            text-align: center;
            color: #9ab3cc;
            border-top: 1px solid #ecf3f9;
            padding-top: 7px;
        }
        .reset-button-container {
            padding: 8px 14px 12px 14px;
            background: #FFFFFF;
            border-top: 1px solid #ecf3f9;
            text-align: center;
        }
        .reset-chat {
            background: #f8fafd;
            border: 1px solid #cde2f5;
            border-radius: 32px;
            padding: 5px 14px;
            font-size: 0.73rem;
            font-weight: 500;
            font-family: inherit;
            color: #22668d;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .reset-chat:hover {
            background: #eef5fc;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-track { background: #ECF3F9; border-radius: 6px; }
        .messages-area::-webkit-scrollbar-thumb { background: #95CAFA; border-radius: 6px; }

        @media (max-width: 500px) {
            .message { max-width: 94%; }
            .option-btn { padding: 5px 10px; font-size: 0.73rem; }
            .bubble { font-size: 0.76rem; padding: 6px 10px; }
            .messages-area { padding: 10px 12px; }
        }
    </style>
</head>
<body>
<div class="messenger" id="messengerApp">
    <div class="chat-header">
        <div class="avatar">🚛</div>
        <div class="chat-info">
            <h2>Сергей <span>водитель</span></h2>
            <p><span class="online-dot"></span> в рейсе</p>
        </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="options-panel" id="optionsPanel">
        <div class="options-title">Ваш ответ</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="feedback-footnote" id="footnoteMsg">Выберите вариант ответа</div>
    </div>

    <div id="analysisContainer"></div>

    <div class="reset-button-container">
        <button class="reset-chat" id="resetChatBtn">⟳ Начать диалог заново</button>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // ПОШАГОВЫЙ СЦЕНАРИЙ: ЭТрН — ЧАТ С ВОДИТЕЛЕМ
    // --------------------------------------------------------------
    const messagesContainer = document.getElementById('messagesArea');
    const optionsContainerDiv = document.getElementById('optionsContainer');
    const optionsPanel = document.getElementById('optionsPanel');
    const footnoteEl = document.getElementById('footnoteMsg');
    const analysisDiv = document.getElementById('analysisContainer');

    let currentState = {
        locked: false
    };

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addMessage(text, sender = 'user') {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender === 'client' ? 'client-message' : 'user-message'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        const metaSpan = document.createElement('div');
        metaSpan.className = 'message-meta';
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (sender === 'client') metaSpan.innerText = `Сергей · ${timeStr}`;
        else metaSpan.innerText = `Вы · ${timeStr}`;
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(metaSpan);
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
        return messageDiv;
    }

    function clearOptions() { optionsContainerDiv.innerHTML = ''; }
    function disableOptions(disabled = true) {
        if (disabled) optionsPanel.classList.add('options-disabled');
        else optionsPanel.classList.remove('options-disabled');
    }

    function showAnalysis(text, type = 'wrong') {
        analysisDiv.innerHTML = '';
        const card = document.createElement('div');
        card.className = `analysis-card ${type === 'correct' ? 'correct' : 'wrong'}`;
        card.innerHTML = `<strong>${type === 'correct' ? '✅ Верное решение' : '❌ Разбор ошибки'}</strong><br>${text}`;
        analysisDiv.appendChild(card);
        scrollToBottom();
    }

    function clearAnalysis() { analysisDiv.innerHTML = ''; }

    function finishWithAnalysis(analysisText, isCorrect = false) {
        currentState.locked = true;
        disableOptions(true);
        clearOptions();
        showAnalysis(analysisText, isCorrect ? 'correct' : 'wrong');
        footnoteEl.innerHTML = '✅ Диалог завершён. Нажмите «Начать заново», чтобы пройти сценарий ещё раз.';
    }

    function createButton(text, onClick) {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = text;
        btn.addEventListener('click', () => {
            if (currentState.locked) return;
            onClick();
        });
        optionsContainerDiv.appendChild(btn);
    }

    // --------------------------------------------------------------
    // СТАРТ: водитель на погрузке
    function startDialog() {
        addMessage('Привет! Я на погрузке, ЭТрН нужно подписать, а интернет пропал. Что делать?', 'client');
        showFirstChoice();
    }

    // --------------------------------------------------------------
    // ПЕРВЫЙ ВЫБОР (Сценарий 1)
    function showFirstChoice() {
        clearOptions();
        createButton('Остановить погрузку и ждать интернет', () => {
            addMessage('Остановить погрузку и ждать интернет', 'user');
            // Неправильный ответ
            setTimeout(() => {
                addMessage('Так, но у нас график, не могу ждать долго.', 'client');
                setTimeout(() => {
                    finishWithAnalysis(
                        'Останавливать погрузку не нужно — вы потеряете время. Система поддерживает офлайн-подписание с последующей синхронизацией. Нажмите «Подписать» в приложении, и подпись будет отправлена при появлении сети.',
                        false
                    );
                }, 500);
            }, 500);
        });
        createButton('Нажать «Подписать» — система подпишет при появлении сети, выезжать можно', () => {
            addMessage('Нажать «Подписать» — система подпишет при появлении сети, выезжать можно', 'user');
            // Правильный ответ
            setTimeout(() => {
                addMessage('Понял! Нажал. Поехали! Спасибо!', 'client');
                setTimeout(() => {
                    // Переход к следующему сценарию
                    addMessage('🚛 В пути. Еду по трассе, тут ГИБДД. Остановили, просят ЭТрН. Интернета нет. Что делать?', 'client');
                    showSecondChoice();
                }, 600);
            }, 500);
        });
        createButton('Оформить бумажную накладную', () => {
            addMessage('Оформить бумажную накладную', 'user');
            // Неправильный ответ
            setTimeout(() => {
                addMessage('Я слышал, что с 1 сентября бумажные уже нельзя...', 'client');
                setTimeout(() => {
                    finishWithAnalysis(
                        'С 1 сентября 2026 года бумажная накладная — нарушение. Используйте электронный документооборот даже при отсутствии интернета: нажмите «Подписать» в приложении. Подпись синхронизируется автоматически.',
                        false
                    );
                }, 500);
            }, 500);
        });
        footnoteEl.innerHTML = 'Водитель на погрузке, интернет пропал. Ваш ответ';
    }

    // --------------------------------------------------------------
    // ВТОРОЙ ВЫБОР (Сценарий 2 — ГИБДД)
    function showSecondChoice() {
        clearOptions();
        createButton('Сказать, что интернета нет, и попросить подождать', () => {
            addMessage('Сказать, что интернета нет, и попросить подождать', 'user');
            setTimeout(() => {
                addMessage('Инспектор сказал, что ждать не будет. Говорит, что должен быть QR-код.', 'client');
                setTimeout(() => {
                    finishWithAnalysis(
                        'Инспектор не будет ждать, пока появится интернет. QR-код кэшируется в приложении и доступен даже без сети, если вы открыли его до выезда. Откройте приложение → «Мои ЭТрН» → покажите QR-код.',
                        false
                    );
                }, 500);
            }, 500);
        });
        createButton('Открыть приложение, найти ЭТрН и показать QR-код', () => {
            addMessage('Открыть приложение, найти ЭТрН и показать QR-код', 'user');
            setTimeout(() => {
                addMessage('Да, QR-код есть! Инспектор отсканировал планшетом. Отпустили! Спасибо!', 'client');
                setTimeout(() => {
                    // Переход к следующему сценарию
                    addMessage('🏭 Приехал к получателю, а у них сбой системы, груз срочно нужно выгружать (ночь). Что делать?', 'client');
                    showThirdChoice();
                }, 600);
            }, 500);
        });
        createButton('Позвонить диспетчеру, чтобы тот продиктовал номер накладной', () => {
            addMessage('Позвонить диспетчеру, чтобы тот продиктовал номер накладной', 'user');
            setTimeout(() => {
                addMessage('Диспетчер сказал, что у него нет QR-кода. Инспектор недоволен.', 'client');
                setTimeout(() => {
                    finishWithAnalysis(
                        'У диспетчера может не быть доступа к вашему QR-коду, и это займёт время. QR-код хранится в вашем приложении и кэшируется. Откройте приложение и покажите его инспектору.',
                        false
                    );
                }, 500);
            }, 500);
        });
        footnoteEl.innerHTML = 'Остановка ГИБДД, интернета нет. Ваш ответ';
    }

    // --------------------------------------------------------------
    // ТРЕТИЙ ВЫБОР (Сценарий 3 — сбой у получателя)
    function showThirdChoice() {
        clearOptions();
        createButton('Позвонить диспетчеру получателя, попросить подписать через мобильное приложение', () => {
            addMessage('Позвонить диспетчеру получателя, попросить подписать через мобильное приложение', 'user');
            setTimeout(() => {
                addMessage('Диспетчер сказал, что мобильное приложение работает, он подписал через него. Спасибо!', 'client');
                // Переход к финальному сценарию
                setTimeout(() => {
                    addMessage('📄 Получатель, к которому я приехал, отказывается подписывать электронно. Говорит, нужна бумажная ТН. Что делать?', 'client');
                    showFourthChoice();
                }, 600);
            }, 500);
        });
        createButton('Уехать и вернуться утром', () => {
            addMessage('Уехать и вернуться утром', 'user');
            setTimeout(() => {
                addMessage('Утром получатель сказал, что груз уже не нужен — они купили у другого. Машина пустая, рейс сорван.', 'client');
                setTimeout(() => {
                    finishWithAnalysis(
                        'Уезжать без решения проблемы — риск возврата груза и претензий. Свяжитесь с диспетчером получателя и попросите подписать через мобильное приложение — оно часто работает даже при сбое основной системы.',
                        false
                    );
                }, 500);
            }, 500);
        });
        createButton('Выгрузить груз и уехать без подписи', () => {
            addMessage('Выгрузить груз и уехать без подписи', 'user');
            setTimeout(() => {
                addMessage('Получатель принял груз, но подписывать отказался. Теперь говорят, что мы не подтвердили доставку.', 'client');
                setTimeout(() => {
                    finishWithAnalysis(
                        'Без подписи или акта вы не сможете подтвердить факт выгрузки. Это приведёт к спорам и штрафам. Позвоните диспетчеру получателя, сообщите время прибытия и состояние груза. Если мобильного приложения нет — составьте акт о невозможности подписания и сфотографируйте груз.',
                        false
                    );
                }, 500);
            }, 500);
        });
        footnoteEl.innerHTML = 'Сбой системы у получателя, нужно срочно выгружать. Ваш ответ';
    }

    // --------------------------------------------------------------
    // ЧЕТВЁРТЫЙ ВЫБОР (Сценарий 4 — отказ от ЭТрН)
    function showFourthChoice() {
        clearOptions();
        createButton('Распечатать бумажную накладную, чтобы не спорить', () => {
            addMessage('Распечатать бумажную накладную, чтобы не спорить', 'user');
            setTimeout(() => {
                addMessage('Я распечатал, но наш диспетчер сказал, что это нарушение, могут быть штрафы.', 'client');
                setTimeout(() => {
                    finishWithAnalysis(
                        'Бумажная ТН с 1 сентября 2026 года — нарушение. Вы можете получить штраф. Объясните получателю, что электронный документооборот обязателен, и зафиксируйте отказ в приложении через кнопку «Отказ от приёмки» или «Оговорки».',
                        false
                    );
                }, 500);
            }, 500);
        });
        createButton('Объяснить, что бумажная ТН — нарушение, зафиксировать отказ в приложении, не уезжать без указания диспетчера', () => {
            addMessage('Объяснить, что бумажная ТН — нарушение, зафиксировать отказ в приложении, не уезжать без указания диспетчера', 'user');
            setTimeout(() => {
                addMessage('Ок, я объяснил, зафиксировал отказ в приложении. Диспетчер сказал ждать, сейчас решим. Спасибо за помощь!', 'client');
                setTimeout(() => {
                    // ФИНАЛ — правильный ответ
                    finishWithAnalysis(
                        'Верно! Спокойно объясните, что с 1 сентября 2026 года бумажные документы — нарушение закона. Зафиксируйте отказ в приложении через кнопку «Отказ от приёмки» или «Оговорки». Не уезжайте без указания диспетчера.',
                        true
                    );
                }, 500);
            }, 500);
        });
        createButton('Позвонить в ГИБДД и пожаловаться на получателя', () => {
            addMessage('Позвонить в ГИБДД и пожаловаться на получателя', 'user');
            setTimeout(() => {
                addMessage('В ГИБДД сказали, что это не их компетенция. Получатель смеётся и ждёт.', 'client');
                setTimeout(() => {
                    finishWithAnalysis(
                        'ГИБДД не занимается спорами по документообороту. Решайте вопрос через диспетчера и фиксацию отказа в приложении. Объясните получателю, что электронная подпись обязательна с 1 сентября 2026 года.',
                        false
                    );
                }, 500);
            }, 500);
        });
        footnoteEl.innerHTML = 'Получатель отказывается от электронной подписи. Ваш ответ';
    }

    // --------------------------------------------------------------
    // СБРОС
    function fullReset() {
        currentState = { locked: false };
        messagesContainer.innerHTML = '';
        clearAnalysis();
        disableOptions(false);
        startDialog();
    }

    // ИНИЦИАЛИЗАЦИЯ
    function init() {
        startDialog();
        const resetBtn = document.getElementById('resetChatBtn');
        if (resetBtn) resetBtn.addEventListener('click', fullReset);
    }

    init();
</script>
</body>
</html>
