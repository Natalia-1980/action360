<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ЭТрН · Чат-бот для водителя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 650px;
            max-width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 1.5rem 1.2rem;
            border: 1px solid #dee6f0;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1d3b5e;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-sub {
            font-size: 0.75rem;
            color: #5e7290;
            margin-bottom: 1.2rem;
            border-left: 3px solid #8da9cc;
            padding-left: 10px;
        }

        .chat-container {
            background: #f6faff;
            border-radius: 24px;
            border: 2px solid #e1eaf5;
            padding: 1.2rem;
            min-height: 380px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 6px;
            margin-bottom: 14px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #eef3fa;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #b9cee8;
            border-radius: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 12px;
            animation: fadeInMsg 0.25s ease;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            line-height: 1.45;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .bot .bubble {
            background: white;
            border: 1px solid #dce5f0;
            color: #1a324a;
            border-bottom-left-radius: 4px;
        }

        .user .bubble {
            background: #1e3b5c;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-avatar {
            width: 32px;
            height: 32px;
            background: #1e3b5c;
            color: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-right: 10px;
        }

        .message.bot .bubble strong {
            color: #1e6bb8;
        }

        .chat-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .chat-options .option-btn {
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1e3b5c;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .chat-options .option-btn:hover {
            background: #f0f7ff;
            border-color: #8da9cc;
            transform: translateY(-1px);
        }

        .chat-options .option-btn:active {
            transform: translateY(1px);
        }

        .chat-options .option-btn.correct-answer {
            border-color: #2b8c4a;
            background: #eefaee;
        }

        .chat-options .option-btn.wrong-answer {
            border-color: #b13e3e;
            background: #fff2f2;
        }

        .chat-options .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .explanation {
            border-radius: 16px;
            padding: 10px 14px;
            margin-top: 10px;
            font-size: 0.8rem;
            line-height: 1.4;
            border-left: 3px solid #8da9cc;
            background: #f2f8fd;
        }

        .explanation.correct {
            border-left-color: #2b8c4a;
            background: #eefaee;
        }

        .explanation.incorrect {
            border-left-color: #b13e3e;
            background: #fff2f2;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #b9cee8;
            border-radius: 30px;
            animation: typing 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .btn-reset {
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #5e7290;
            cursor: pointer;
            transition: 0.1s;
            font-family: inherit;
            margin-top: 8px;
            align-self: center;
        }

        .btn-reset:hover {
            background: #f0f7ff;
            border-color: #8da9cc;
            color: #1d3b5e;
        }

        .btn-reset:active {
            transform: scale(0.96);
        }

        .chat-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .progress-text {
            font-size: 0.7rem;
            color: #8da0bb;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-title">
        <span>💬</span> Чат-бот: действия водителя при отсутствии интернета
    </div>
    <div class="card-sub">
        Симулируем ситуации, в которых может оказаться водитель. Выберите правильное действие.
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- Сообщения будут добавляться сюда -->
        </div>

        <div id="optionsContainer">
            <!-- Кнопки вариантов ответа -->
        </div>

        <div class="chat-footer">
            <button class="btn-reset" id="resetBtn">⟳ Начать заново</button>
            <span class="progress-text" id="progressText">Вопрос 1 из 4</span>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // ДАННЫЕ СЦЕНАРИЕВ
    // --------------------------------------------------------------
    const scenarios = [
        {
            id: 1,
            question: "🚛 Вы на погрузке, нужно подписать ЭТрН, но интернет пропал. Ваши действия?",
            options: [
                "Остановить погрузку и ждать интернет",
                "Нажать «Подписать» — система подпишет при появлении сети, выезжать можно",
                "Оформить бумажную накладную"
            ],
            correct: 1,
            explanation: "Верно! При отсутствии интернета на погрузке нажмите «Подписать» или «Принять груз». Система покажет сообщение «Будет подписано при появлении сети». Выезжайте в рейс — данные синхронизируются автоматически, как только появится связь. QR-код кэшируется и будет доступен даже без интернета.",
            wrongExplanations: [
                "Останавливать погрузку не нужно — вы потеряете время. Система поддерживает офлайн-подписание с последующей синхронизацией.",
                "С 1 сентября 2026 года бумажная накладная — нарушение. Используйте электронный документооборот даже при отсутствии интернета: нажмите «Подписать» в приложении."
            ]
        },
        {
            id: 2,
            question: "🛑 Вас остановил инспектор ГИБДД в пути, интернета нет. Что делать?",
            options: [
                "Сказать, что интернета нет, и попросить подождать",
                "Открыть приложение, найти ЭТрН и показать QR-код",
                "Позвонить диспетчеру, чтобы тот продиктовал номер накладной"
            ],
            correct: 1,
            explanation: "Верно! QR-код кэшируется в приложении и доступен даже без интернета, если вы открыли его до выезда. Откройте приложение → «Мои ЭТрН» → покажите QR-код инспектору. Инспектор может отсканировать его планшетом и увидеть всю информацию о перевозке.",
            wrongExplanations: [
                "Инспектор не будет ждать, пока появится интернет. QR-код уже должен быть в приложении — он кэшируется.",
                "У диспетчера может не быть доступа к вашему QR-коду, и это займёт время. QR-код хранится в вашем приложении."
            ]
        },
        {
            id: 3,
            question: "🏭 Вы приехали к получателю, но у него сбой системы, а выгружать нужно срочно (ночь). Ваши действия?",
            options: [
                "Позвонить диспетчеру получателя, попросить подписать через мобильное приложение",
                "Уехать и вернуться утром",
                "Выгрузить груз и уехать без подписи"
            ],
            correct: 0,
            explanation: "Верно! Позвоните диспетчеру получателя, сообщите время прибытия и состояние груза. Попросите сотрудника склада подписать ЭТрН через мобильное приложение — оно часто работает даже при сбое основной системы. Если мобильного приложения нет — составьте акт о невозможности подписания, сфотографируйте груз. Утром получатель должен подписать ЭТрН с пометкой о времени выгрузки.",
            wrongExplanations: [
                "Уезжать без решения проблемы — риск возврата груза и претензий. Свяжитесь с диспетчером получателя.",
                "Без подписи или акта вы не сможете подтвердить факт выгрузки. Это приведёт к спорам и штрафам."
            ]
        },
        {
            id: 4,
            question: "📄 Получатель отказывается подписывать электронно и требует бумажную ТН. Ваши действия?",
            options: [
                "Распечатать бумажную накладную, чтобы не спорить",
                "Объяснить, что бумажная ТН — нарушение, зафиксировать отказ в приложении, не уезжать без указания диспетчера",
                "Позвонить в ГИБДД и пожаловаться на получателя"
            ],
            correct: 1,
            explanation: "Верно! Спокойно объясните, что с 1 сентября 2026 года бумажные документы — нарушение закона. Если настаивает — позвоните диспетчеру. Зафиксируйте отказ в приложении через кнопку «Отказ от приёмки» или «Оговорки». Не уезжайте без указания диспетчера — это может привести к возврату груза.",
            wrongExplanations: [
                "Бумажная ТН с 1 сентября 2026 года — нарушение. Вы можете получить штраф.",
                "ГИБДД не занимается спорами по документообороту. Решайте вопрос через диспетчера и фиксацию отказа в приложении."
            ]
        }
    ];

    // --------------------------------------------------------------
    // СОСТОЯНИЕ ЧАТА
    // --------------------------------------------------------------
    let currentIndex = 0;
    let isAnswered = false;
    let selectedIndex = null;
    let chatMessages = [];
    let isBotTyping = false;

    const chatMessagesEl = document.getElementById('chatMessages');
    const optionsContainer = document.getElementById('optionsContainer');
    const progressText = document.getElementById('progressText');

    // --------------------------------------------------------------
    // ФУНКЦИИ ОТРИСОВКИ
    // --------------------------------------------------------------

    function render() {
        renderMessages();
        renderOptions();
        updateProgress();
        if (chatMessagesEl) {
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        }
    }

    function renderMessages() {
        if (!chatMessagesEl) return;
        chatMessagesEl.innerHTML = '';

        chatMessages.forEach(msg => {
            const div = document.createElement('div');
            div.className = `message ${msg.type}`;
            if (msg.type === 'bot') {
                div.innerHTML = `
                    <div class="bot-avatar">🤖</div>
                    <div class="bubble">${msg.text}</div>
                `;
            } else {
                div.innerHTML = `
                    <div class="bubble">${msg.text}</div>
                `;
            }
            chatMessagesEl.appendChild(div);
        });

        if (isBotTyping) {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="bot-avatar">🤖</div>
                <div class="bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatMessagesEl.appendChild(typingDiv);
        }
    }

    function renderOptions() {
        if (!optionsContainer) return;
        optionsContainer.innerHTML = '';

        if (isBotTyping) {
            optionsContainer.innerHTML = '';
            return;
        }

        const scenario = scenarios[currentIndex];
        if (!scenario) {
            optionsContainer.innerHTML = `
                <div style="text-align:center; padding:10px; font-size:0.85rem; color:#1d3b5e;">
                    🎉 Вы прошли все сценарии! Нажмите «Начать заново», чтобы повторить.
                </div>
            `;
            return;
        }

        if (isAnswered) {
            const explanation = getExplanation(scenario, selectedIndex);
            const isCorrect = selectedIndex === scenario.correct;
            
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'chat-options';

            scenario.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.disabled = true;
                if (idx === scenario.correct) {
                    btn.classList.add('correct-answer');
                } else if (idx === selectedIndex && idx !== scenario.correct) {
                    btn.classList.add('wrong-answer');
                }
                optionsDiv.appendChild(btn);
            });

            optionsContainer.appendChild(optionsDiv);

            const explDiv = document.createElement('div');
            explDiv.className = `explanation ${isCorrect ? 'correct' : 'incorrect'}`;
            explDiv.innerHTML = `${isCorrect ? '✅ ' : '❌ '}${explanation}`;
            optionsContainer.appendChild(explDiv);

            if (currentIndex < scenarios.length - 1) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'option-btn';
                nextBtn.textContent = '➡️ Далее';
                nextBtn.style.marginTop = '8px';
                nextBtn.style.borderColor = '#1e3b5c';
                nextBtn.style.background = '#1e3b5c';
                nextBtn.style.color = 'white';
                nextBtn.addEventListener('click', () => {
                    if (isBotTyping) return;
                    currentIndex++;
                    isAnswered = false;
                    selectedIndex = null;
                    const nextScenario = scenarios[currentIndex];
                    if (nextScenario) {
                        addBotMessage(nextScenario.question);
                    } else {
                        addBotMessage('🎉 Поздравляю! Вы успешно прошли все сценарии. Теперь вы знаете, как действовать водителю при отсутствии интернета. Выберите «Начать заново», чтобы повторить материал.');
                    }
                    render();
                });
                optionsContainer.appendChild(nextBtn);
            } else {
                const finishBtn = document.createElement('button');
                finishBtn.className = 'option-btn';
                finishBtn.textContent = '🏁 Завершить';
                finishBtn.style.marginTop = '8px';
                finishBtn.style.borderColor = '#1e3b5c';
                finishBtn.style.background = '#1e3b5c';
                finishBtn.style.color = 'white';
                finishBtn.addEventListener('click', () => {
                    if (chatMessages.length > 0 && chatMessages[chatMessages.length - 1].text.includes('Поздравляю')) {
                        // уже есть
                    } else {
                        addBotMessage('🎉 Поздравляю! Вы успешно прошли все сценарии. Теперь вы знаете, как действовать водителю при отсутствии интернета. Нажмите «Начать заново», чтобы повторить материал.');
                        render();
                    }
                });
                optionsContainer.appendChild(finishBtn);
            }
            return;
        }

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'chat-options';

        scenario.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.addEventListener('click', () => {
                if (isAnswered || isBotTyping) return;
                handleAnswer(idx);
            });
            optionsDiv.appendChild(btn);
        });

        optionsContainer.appendChild(optionsDiv);
    }

    function updateProgress() {
        if (progressText) {
            const total = scenarios.length;
            const current = Math.min(currentIndex + 1, total);
            progressText.textContent = `Вопрос ${current} из ${total}`;
        }
    }

    function getExplanation(scenario, selectedIdx) {
        if (selectedIdx === scenario.correct) {
            return scenario.explanation;
        } else {
            return scenario.wrongExplanations[selectedIdx] || 'Неправильный ответ. Попробуйте запомнить правильное действие.';
        }
    }

    function handleAnswer(idx) {
        if (isAnswered || isBotTyping) return;
        const scenario = scenarios[currentIndex];
        if (!scenario) return;

        isAnswered = true;
        selectedIndex = idx;

        addUserMessage(scenario.options[idx]);

        const isCorrect = idx === scenario.correct;
        const explanation = getExplanation(scenario, idx);
        const icon = isCorrect ? '✅ ' : '❌ ';
        const extraText = isCorrect ? 'Верно!' : 'Неверно.';
        const botResponse = `${icon}${extraText}\n\n${explanation}`;
        addBotMessage(botResponse);

        render();
    }

    function addBotMessage(text) {
        chatMessages.push({ type: 'bot', text: text });
    }

    function addUserMessage(text) {
        chatMessages.push({ type: 'user', text: text });
    }

    function resetChat() {
        currentIndex = 0;
        isAnswered = false;
        selectedIndex = null;
        isBotTyping = false;
        chatMessages = [];

        // Единое приветственное сообщение
        addBotMessage('👋 Здравствуйте! Я помогу вам разобраться, как действовать водителю при работе с ЭТрН, если нет интернета или получатель не хочет подписывать электронную накладную. Отвечайте на вопросы. Поехали! 🚛');
        
        const firstScenario = scenarios[0];
        if (firstScenario) {
            addBotMessage(firstScenario.question);
        }

        render();
    }

    document.addEventListener('DOMContentLoaded', () => {
        resetChat();
        document.getElementById('resetBtn').addEventListener('click', resetChat);
    });
</script>
</body>
</html>
