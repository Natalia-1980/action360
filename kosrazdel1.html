<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Заполнение Раздела 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 650px;
            height: 750px;
            min-width: 650px;
            max-width: 650px;
            min-height: 750px;
            max-height: 750px;
            background: #ffffff;
            border-radius: 32px;
            padding: 24px 28px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.12);
            border: 1px solid #d0d7de;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            flex-grow: 0;
        }

        .header {
            margin-bottom: 16px;
        }

        .header h3 {
            font-weight: 700;
            font-size: 1rem;
            color: #1e2b39;
            padding-bottom: 8px;
            border-bottom: 2px solid #dce3ec;
        }

        .fields-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            width: 100%;
            flex: 1;
            align-content: start;
        }

        .field-full {
            grid-column: span 2;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #2f465a;
            letter-spacing: 0.2px;
            line-height: 1.3;
        }

        .field label .code {
            color: #6b7f92;
            font-weight: 600;
        }

        .field input {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 30px;
            padding: 8px 14px;
            min-height: 38px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1f2c38;
            width: 100%;
            outline: none;
            transition: all 0.15s;
            font-family: inherit;
        }

        .field input:focus {
            border-color: #2b4f6e;
            box-shadow: 0 0 0 3px rgba(43, 79, 110, 0.15);
        }

        .field input.correct {
            border: 3px solid #1f8b5a;
            background: #d4f0e3;
            font-weight: 700;
        }

        .field input.incorrect {
            border: 3px solid #c0392b;
            background: #fde8e5;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 14px 0 8px;
            flex-shrink: 0;
        }

        .btn {
            background: #e2e8f0;
            border: none;
            border-radius: 40px;
            padding: 8px 28px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1f2c38;
            border: 1px solid #bcc8d6;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .btn:hover {
            background: #d0dbe8;
        }

        .btn-primary {
            background: #2b4f6e;
            color: white;
            border-color: #1f3a5f;
        }

        .btn-primary:hover {
            background: #1f3a5f;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .feedback {
            background: #f0f4fa;
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid #c8d4e2;
            color: #1f2c38;
            margin-top: 8px;
            line-height: 1.6;
            min-height: 50px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .feedback .error-list {
            margin-top: 4px;
            padding-left: 16px;
            color: #a93226;
        }

        .feedback .error-list li {
            list-style-type: disc;
        }

        .feedback .success {
            color: #1a7a4a;
        }

        @media (max-width: 700px) {
            .container {
                width: 100%;
                height: 100vh;
                min-width: unset;
                max-width: unset;
                min-height: unset;
                max-height: unset;
                border-radius: 0;
                padding: 16px;
            }
            .fields-grid { grid-template-columns: 1fr; }
            .field-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3>Заполните Раздел 1</h3>
    </div>

    <div class="fields-grid">
        <!-- Строка 010 -->
        <div class="field">
            <label><span class="code">010</span> Код по ОКТМО</label>
            <input type="text" id="input-oktmo" data-expected="45377000">
        </div>

        <!-- Строка 020 -->
        <div class="field">
            <label><span class="code">020</span> КБК</label>
            <input type="text" id="input-kbk" data-expected="182 1 04 01000 01 1000 110">
        </div>

        <!-- Строка 030 -->
        <div class="field field-full">
            <label><span class="code">030</span> Сумма налога, исчисленная к уплате в бюджет</label>
            <input type="text" id="input-total" data-expected="880000">
        </div>

        <!-- Строка 031 -->
        <div class="field field-full">
            <label><span class="code">031</span> в т.ч. по приобретенным товарам</label>
            <input type="text" id="input-acquired" data-expected="880000">
        </div>

        <!-- Строка 040 -->
        <div class="field field-full">
            <label><span class="code">040</span> Стоимость товаров, не подлежащих налогообложению</label>
            <input type="text" id="input-exempt" data-expected="—">
        </div>

        <!-- Строка 050 -->
        <div class="field field-full">
            <label><span class="code">050</span> Сумма налога резидентом СЭЗ</label>
            <input type="text" id="input-sez" data-expected="—">
        </div>

        <!-- Строка 060 -->
        <div class="field field-full">
            <label><span class="code">060</span> Сумма обеспечительного платежа (из ДОПП)</label>
            <input type="text" id="input-security" data-expected="1000000">
        </div>

        <!-- Строка 070 -->
        <div class="field field-full">
            <label><span class="code">070</span> Сумма налога к доплате</label>
            <input type="text" id="input-payable" data-expected="—">
        </div>

        <!-- Строка 080 -->
        <div class="field field-full">
            <label><span class="code">080</span> Превышение обеспечительного платежа</label>
            <input type="text" id="input-overpay" data-expected="120000">
        </div>
    </div>

    <div class="actions">
        <button class="btn" id="resetBtn">Сброс</button>
        <button class="btn btn-primary" id="checkBtn">Проверить</button>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    (function() {
        var inputs = document.querySelectorAll('input');
        var resetBtn = document.getElementById('resetBtn');
        var checkBtn = document.getElementById('checkBtn');
        var feedback = document.getElementById('feedback');

        var fieldLabels = {
            'input-oktmo': '010 ОКТМО',
            'input-kbk': '020 КБК',
            'input-total': '030 Исчисленный налог',
            'input-acquired': '031 По приобретенным',
            'input-exempt': '040 Необлагаемые',
            'input-sez': '050 СЭЗ',
            'input-security': '060 Обеспечительный платеж',
            'input-payable': '070 К доплате',
            'input-overpay': '080 Превышение'
        };

        var expectedDisplay = {
            'input-oktmo': '45377000',
            'input-kbk': '182 1 04 01000 01 1000 110',
            'input-total': '880 000',
            'input-acquired': '880 000',
            'input-exempt': 'прочерк (—)',
            'input-sez': 'прочерк (—)',
            'input-security': '1 000 000',
            'input-payable': 'прочерк (—)',
            'input-overpay': '120 000'
        };

        // Сброс
        resetBtn.addEventListener('click', function() {
            inputs.forEach(function(input) {
                input.value = '';
                input.classList.remove('correct', 'incorrect');
            });
            feedback.innerHTML = '';
        });

        // Проверка
        checkBtn.addEventListener('click', function() {
            var correctCount = 0;
            var totalFields = inputs.length;
            var errors = [];

            inputs.forEach(function(input) {
                var expected = input.getAttribute('data-expected');
                var actual = input.value.trim();

                var normalize = function(s) {
                    if (s === '') return '';
                    return String(s).replace(/\s+/g, '').toLowerCase();
                };

                var normActual = normalize(actual);
                var normExpected = normalize(expected);

                var isDash = function(s) {
                    return s === '—' || s === '-' || s === '–';
                };

                var isExpectedDash = isDash(expected);
                var isActualDash = isDash(actual);

                var isCorrect = false;

                if (isExpectedDash && isActualDash) {
                    isCorrect = true;
                } else if ((expected === '' || expected === null || expected === undefined) && actual === '') {
                    isCorrect = true;
                } else if (!isExpectedDash && !isActualDash && expected !== '' && actual !== '') {
                    isCorrect = (normActual === normExpected);
                } else {
                    isCorrect = false;
                }

                input.classList.remove('correct', 'incorrect');
                if (isCorrect) {
                    correctCount++;
                    input.classList.add('correct');
                } else {
                    input.classList.add('incorrect');
                    var label = fieldLabels[input.id] || input.id;
                    var display = expectedDisplay[input.id] || expected;
                    errors.push(label + ' — правильно: ' + display);
                }
            });

            if (correctCount === totalFields) {
                feedback.innerHTML = '<div class="success"><strong>Отлично!</strong> Все поля Раздела 1 заполнены верно.</div>';
            } else {
                var errorHtml = errors.map(function(e) { return '<li>' + e + '</li>'; }).join('');
                feedback.innerHTML = '<div style="font-weight:600;">Верно: <strong>' + correctCount + '</strong> из <strong>' + totalFields + '</strong></div><div style="margin-top:6px;">Исправьте ошибки:</div><ul class="error-list">' + errorHtml + '</ul>';
            }
        });

        // Очистка при нажатии Escape
        inputs.forEach(function(input) {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    this.value = '';
                    this.classList.remove('correct', 'incorrect');
                }
            });
        });

    })();
</script>

</body>
</html>
