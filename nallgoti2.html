<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налоговые льготы · тренажёр-сортер</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }

        .card {
            width: 700px;
            max-width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.08);
            padding: 1.5rem 1.5rem 1.8rem 1.5rem;
            border: 1px solid #e0e4e9;
        }

        /* карусельная область — уменьшена */
        .carousel-area {
            background: #fafbfc;
            border-radius: 20px;
            padding: 0.9rem 0.8rem;
            margin-bottom: 1.8rem;
            border: 1px solid #dee4ea;
        }

        .carousel-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7e8b9c;
            margin-bottom: 0.6rem;
            margin-left: 0.2rem;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .carousel-btn {
            background: #c0c0c0;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2b2b2b;
            cursor: pointer;
            transition: 0.08s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .carousel-btn:hover:not(:disabled) {
            background: #ababab;
            transform: scale(0.96);
        }
        .carousel-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* карточка льготы — компактнее */
        .tax-card {
            width: 260px;
            background: white;
            border: 2px solid #bcc9d9;
            border-radius: 16px;
            padding: 0.7rem 0.8rem;
            text-align: left;
            font-size: 0.78rem;
            line-height: 1.4;
            font-weight: 500;
            color: #111;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            cursor: grab;
            user-select: none;
        }

        .tax-card[draggable="true"]:hover {
            border-color: #8f9fb2;
            background: #fbfdff;
            transform: scale(1.01);
        }
        .tax-card:active {
            cursor: grabbing;
        }

        .card-source {
            font-size: 0.6rem;
            color: #5f6f82;
            margin-top: 0.4rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 0.4rem;
            font-family: monospace;
        }

        .carousel-counter {
            font-size: 0.75rem;
            color: #6b7d94;
            margin-top: 0.5rem;
            text-align: center;
        }

        .categories-row {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.3rem;
            justify-content: space-between;
        }

        .category-col {
            flex: 1;
            min-width: 0;
        }

        .category-header {
            background: white;
            border: 2px solid #dbe1e9;
            border-radius: 18px;
            padding: 0.6rem 0.2rem;
            text-align: center;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1f2a36;
            margin-bottom: 0.8rem;
            background: #f8fafd;
        }

        .dropzone-container {
            background: #f2f5f9;
            border: 2px dashed #b9c4d2;
            border-radius: 18px;
            min-height: 310px;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.7rem;
            overflow-y: auto;
            transition: background 0.1s, border-color 0.1s;
        }

        .dropzone-container::-webkit-scrollbar {
            width: 4px;
        }
        .dropzone-container::-webkit-scrollbar-track {
            background: #d4dbe3;
            border-radius: 4px;
        }
        .dropzone-container::-webkit-scrollbar-thumb {
            background: #a0abb8;
            border-radius: 4px;
        }

        .dropped-card {
            background: white;
            border: 2px solid #b1c0d2;
            border-radius: 14px;
            padding: 0.6rem;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .dropped-card:hover {
            background: #f0f4fa;
            transform: scale(0.99);
        }
        .dropped-text {
            font-size: 0.73rem;
            line-height: 1.4;
            color: #1f2a36;
            font-weight: 500;
        }
        .dropped-source {
            font-size: 0.56rem;
            color: #6f7e91;
            margin-top: 0.3rem;
            font-family: monospace;
        }

        .empty-message {
            color: #8d9aa8;
            text-align: center;
            padding: 1.5rem 0.3rem;
            font-size: 0.7rem;
            background: #eef2f7;
            border-radius: 14px;
        }

        .footer-controls {
            margin-top: 1.6rem;
            display: flex;
            justify-content: center;
            gap: 0.8rem;
        }
        .reset-btn, .check-btn {
            background: white;
            border: 2px solid #222;
            border-radius: 60px;
            padding: 0.5rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #111;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 3px 0 #e0e4ea;
        }
        .reset-btn:hover, .check-btn:hover {
            background: #f5f7f9;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #d0d8e2;
        }
        .reset-btn:active, .check-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #d0d8e2;
        }

        .dropzone-container.error-flash {
            background: #f0c0c0 !important;
            border-color: #c93a3a !important;
            transition: 0.1s;
        }

        .dropzone-container.success-flash {
            background: #d0ecd0 !important;
            border-color: #2b8c4a !important;
            transition: 0.15s;
        }

        .correct-highlight {
            border: 2px solid #2b8c4a !important;
            background: #f0faf2 !important;
        }
        .incorrect-highlight {
            border: 2px solid #c93a3a !important;
            background: #fff6f6 !important;
        }
    </style>
</head>
<body>
<div class="card">
    <!-- заголовок полностью убран -->

    <div class="carousel-area">
        <div class="carousel-label">ЛЬГОТА (листай и перетаскивай)</div>
        <div class="carousel-container">
            <button class="carousel-btn" id="prevTaxBtn">←</button>
            <div id="activeTaxCard" class="tax-card" draggable="true"></div>
            <button class="carousel-btn" id="nextTaxBtn">→</button>
        </div>
        <div class="carousel-counter" id="taxCounter">0 / 0</div>
    </div>

    <!-- НОВЫЙ ПОРЯДОК КОЛОНОК: федеральные → региональные → местные -->
    <div class="categories-row">
        <div class="category-col">
            <div class="category-header">⚖️ федеральные</div>
            <div class="dropzone-container" id="federalContainer"></div>
        </div>
        <div class="category-col">
            <div class="category-header">🌍 региональные</div>
            <div class="dropzone-container" id="regionalContainer"></div>
        </div>
        <div class="category-col">
            <div class="category-header">🏘️ местные</div>
            <div class="dropzone-container" id="localContainer"></div>
        </div>
    </div>

    <div class="footer-controls">
        <button class="reset-btn" id="resetBtn">⟳ Сбросить все</button>
        <button class="check-btn" id="checkBtn">✓ Проверить</button>
    </div>
</div>

<script>
    // ---------- ДАННЫЕ: все льготы (без иконок в тексте, оставлен только смысл) ----------
    const benefitsDB = [
        { text: "Образовательные организации на обеспечении местного бюджета не платят земельный налог", source: "п. 4.2 Решения Беломорского городского поселения от 17.11.2016 №131", level: "local" },
        { text: "Организации школьного питания платят земельный налог в размере 25% от ставки по виду разрешенного использования", source: "п. 4 Решение Ростовской-на-Дону городской Думы от 18.08.2020 № 915", level: "local" },
        { text: "Организации с автопарком не менее 300 грузовых автомобилей с мощностью двигателя свыше 250 л.с. освобождаются от уплаты транспортного налога в размере 25% суммы налога", source: "п 1.3 ст.7 Закона Ростовской области от 10.05.2012 № 843-ЗС", level: "regional" },
        { text: "Резиденты ОЭЗ не уплачивают транспортный налог с грузовых автомобилей", source: "п. 2 ст. 26.10 Закона Московской области от 24.11.2004 № 151/2004-ОЗ", level: "regional" },
        { text: "Организации не платят налог на имущество в течение 10 лет на комплекс по обращению с отходами производства и потребления", source: "ст.26.28 Закона Московской области от 24.11.2004 № 151/2004-ОЗ", level: "regional" },
        { text: "Организации общественного транспорта не платят налог на имущество", source: "ст.11.1 Закона Санкт-Петербурга от 14.07.1995 № 81-11", level: "regional" },
        { text: "Владельцы лицензий на недропользование применяют ставку налога на прибыль 20% по доходам от недропользования", source: "подп.1.7 п. 1 ст. 284 НК", level: "federal" },
        { text: "Правообладатели исключительных прав при реализации российского ПО и баз данных не платят НДС", source: "подп. 26 п. 2 ст. 149 НК", level: "federal" },
        { text: "Компании при реализации детской мебели платят НДС по ставке 10%", source: "п. 2 ст.164 НК", level: "federal" },
        { text: "Малый и средний бизнес молочной промышленности платит страховые взносы по тарифу 7,6%", source: "п.13.2 ст 427 НК", level: "federal" },
        { text: "Участники специального административного района на территориях Калининградской области платят вознаграждения членам экипажа судов из РОРС", source: "подп.16 п. 1 ст. 427 НК", level: "federal" }
    ];

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    let pendingBenefits = shuffleArray([...benefitsDB]);
    let columns = { local: [], regional: [], federal: [] };
    let currentIndex = 0;

    // DOM (обновлено: федеральный контейнер теперь #federalContainer)
    const activeTaxCard = document.getElementById('activeTaxCard');
    const prevBtn = document.getElementById('prevTaxBtn');
    const nextBtn = document.getElementById('nextTaxBtn');
    const taxCounter = document.getElementById('taxCounter');
    const containers = {
        federal: document.getElementById('federalContainer'),
        regional: document.getElementById('regionalContainer'),
        local: document.getElementById('localContainer')
    };
    const resetBtn = document.getElementById('resetBtn');
    const checkBtn = document.getElementById('checkBtn');

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    function renderColumns() {
        // порядок отображения колонок: федеральные, региональные, местные — но в данных они отдельно
        for (const level of ['federal', 'regional', 'local']) {
            const container = containers[level];
            const items = columns[level];
            container.innerHTML = '';
            
            if (items.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-message';
                emptyDiv.innerText = '⬅️ Перетащите льготу';
                container.appendChild(emptyDiv);
            } else {
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'dropped-card';
                    card.addEventListener('click', () => returnToPending(level, item));
                    card.innerHTML = `
                        <div class="dropped-text">${escapeHtml(item.text)}</div>
                        <div class="dropped-source">📌 ${escapeHtml(item.source)}</div>
                    `;
                    container.appendChild(card);
                });
            }
        }
    }

    function updateCarousel() {
        if (pendingBenefits.length === 0) {
            activeTaxCard.innerHTML = `✅ все льготы распределены<br><span style="font-size:0.7rem;">нажмите «Проверить»</span>`;
            activeTaxCard.style.background = '#f0f4f9';
            activeTaxCard.style.border = '2px solid #a0b8cf';
            activeTaxCard.removeAttribute('draggable');
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            taxCounter.textContent = `0 / ${benefitsDB.length} (все распределены)`;
            return;
        }

        if (currentIndex >= pendingBenefits.length) currentIndex = pendingBenefits.length - 1;
        if (currentIndex < 0) currentIndex = 0;

        const benefit = pendingBenefits[currentIndex];
        activeTaxCard.innerHTML = `
            <div>${escapeHtml(benefit.text)}</div>
            <div class="card-source">📌 ${escapeHtml(benefit.source)}</div>
        `;
        activeTaxCard.setAttribute('draggable', 'true');
        activeTaxCard.style.background = 'white';
        activeTaxCard.style.border = '2px solid #bcc9d9';

        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = (currentIndex === pendingBenefits.length - 1);

        const placedCount = benefitsDB.length - pendingBenefits.length;
        taxCounter.textContent = `${placedCount + 1} / ${benefitsDB.length} (осталось ${pendingBenefits.length})`;
    }

    function returnToPending(level, item) {
        const idx = columns[level].findIndex(i => i.text === item.text);
        if (idx !== -1) {
            columns[level].splice(idx, 1);
            pendingBenefits.push(item);
            currentIndex = pendingBenefits.length - 1;
            fullRender();
        }
    }

    // Drag & Drop с проверкой уровня
    activeTaxCard.addEventListener('dragstart', (e) => {
        if (pendingBenefits.length === 0) {
            e.preventDefault();
            return;
        }
        e.dataTransfer.setData('text/plain', JSON.stringify({ index: currentIndex }));
        e.dataTransfer.effectAllowed = 'move';
        activeTaxCard.style.opacity = '0.6';
    });
    activeTaxCard.addEventListener('dragend', () => {
        activeTaxCard.style.opacity = '1';
    });

    function setupDropZones() {
        // для каждого уровня: федеральный, региональный, местный
        const levels = ['federal', 'regional', 'local'];
        for (const level of levels) {
            const container = containers[level];
            
            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            });
            
            container.addEventListener('drop', (e) => {
                e.preventDefault();
                if (pendingBenefits.length === 0) return;
                
                const rawData = e.dataTransfer.getData('text/plain');
                if (!rawData) return;
                let dragInfo;
                try { dragInfo = JSON.parse(rawData); } catch(err) { return; }
                const idx = dragInfo.index;
                if (idx === undefined || idx >= pendingBenefits.length) return;
                
                const benefit = pendingBenefits[idx];
                if (!benefit) return;
                
                // проверка соответствия уровня
                if (benefit.level !== level) {
                    container.classList.add('error-flash');
                    setTimeout(() => container.classList.remove('error-flash'), 500);
                    return; // ❌ не перемещаем
                }
                
                // ✅ верно — перемещаем
                pendingBenefits.splice(idx, 1);
                columns[level].push(benefit);
                
                if (idx < currentIndex) currentIndex--;
                else if (idx === currentIndex) {
                    if (currentIndex >= pendingBenefits.length && pendingBenefits.length > 0) {
                        currentIndex = pendingBenefits.length - 1;
                    }
                    if (pendingBenefits.length === 0) currentIndex = 0;
                }
                if (currentIndex < 0) currentIndex = 0;
                
                fullRender();
                
                container.classList.add('success-flash');
                setTimeout(() => container.classList.remove('success-flash'), 300);
            });
        }
    }

    function checkResults() {
        // убираем старые подсветки
        for (const level of ['federal', 'regional', 'local']) {
            const cards = containers[level].querySelectorAll('.dropped-card');
            cards.forEach(card => {
                card.classList.remove('correct-highlight', 'incorrect-highlight');
            });
        }
        
        let allCorrect = true;
        let totalPlaced = 0;
        
        for (const level of ['federal', 'regional', 'local']) {
            const items = columns[level];
            totalPlaced += items.length;
            const cards = containers[level].querySelectorAll('.dropped-card');
            
            items.forEach((item, idx) => {
                const isCorrect = (item.level === level);
                if (isCorrect) {
                    if (cards[idx]) cards[idx].classList.add('correct-highlight');
                } else {
                    if (cards[idx]) cards[idx].classList.add('incorrect-highlight');
                    allCorrect = false;
                }
            });
        }
        
        if (totalPlaced < benefitsDB.length) {
            alert(`❗ Осталось распределить ${benefitsDB.length - totalPlaced} льгот(ы). Заполните все колонки.`);
            return;
        }
        
        if (allCorrect) {
            alert('🎉 Поздравляем! Все льготы распределены абсолютно верно!');
        } else {
            alert('⚠️ Некоторые льготы размещены неверно. Неправильные подсвечены красным.');
        }
    }

    function resetGame() {
        pendingBenefits = shuffleArray([...benefitsDB]);
        columns = { local: [], regional: [], federal: [] };
        currentIndex = 0;
        fullRender();
    }

    function fullRender() {
        renderColumns();
        updateCarousel();
    }

    // Кнопки карусели
    prevBtn.addEventListener('click', () => {
        if (pendingBenefits.length > 0 && currentIndex > 0) {
            currentIndex--;
            updateCarousel();
        }
    });
    nextBtn.addEventListener('click', () => {
        if (pendingBenefits.length > 0 && currentIndex < pendingBenefits.length - 1) {
            currentIndex++;
            updateCarousel();
        }
    });

    resetBtn.addEventListener('click', resetGame);
    checkBtn.addEventListener('click', checkResults);
    
    document.body.addEventListener('dragover', (e) => e.preventDefault());
    document.body.addEventListener('drop', (e) => e.preventDefault());

    setupDropZones();
    fullRender();
</script>
</body>
</html>
