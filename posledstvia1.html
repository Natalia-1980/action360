<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Памятка | Последствия несоблюдения условий</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #e6e9ef;
            font-family: 'Inter', sans-serif;
            padding: 0.8rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrapper {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
        }
        .header {
            background: #3a4a55;
            padding: 0.7rem 1rem;
            color: white;
        }
        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .badge {
            background: #6c7a89;
            color: #ffffff;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            font-size: 0.55rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 0.2rem;
        }
        /* вкладки */
        .tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            background: #ffffff;
            padding: 0 0.5rem;
            gap: 0.5rem;
        }
        .tab-btn {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.7rem 0.3rem 0.5rem 0.3rem;
            cursor: pointer;
            color: #4a5b68;
            transition: 0.2s;
            position: relative;
        }
        .tab-btn.active {
            color: #1f6e4a;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1f6e4a;
            border-radius: 2px;
        }
        .tab-content {
            display: none;
            background: #ffffff;
        }
        .tab-content.active-tab {
            display: block;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem 0.7rem 0.8rem;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        .nav-btn {
            background: #5a6e7c;
            border: none;
            color: white;
            font-size: 0.9rem;
            width: 30px;
            height: 30px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            transition: 0.15s;
        }
        .nav-btn:hover {
            background: #3a4a55;
        }
        .dots-group {
            display: flex;
            gap: 5px;
            background: #eef2f6;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #b9c4ce;
            border-radius: 6px;
            transition: 0.2s;
            cursor: pointer;
        }
        .dot.active {
            background: #5a6e7c;
            width: 18px;
        }
        .counter {
            font-size: 0.6rem;
            font-weight: 600;
            color: #5a6e7c;
        }
        .tab-pane-content {
            padding: 1rem 0.9rem;
            background: #ffffff;
        }
        .section {
            margin-bottom: 1rem;
            border-left: 3px solid #bc6f4c;
            padding-left: 0.8rem;
        }
        .section-title {
            font-weight: 800;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            color: #b45f1b;
        }
        .list {
            list-style: none;
            padding-left: 0;
        }
        .list li {
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            line-height: 1.35;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .list li::before {
            content: "⚠️";
            font-weight: 800;
            font-size: 0.7rem;
        }
        .subnote {
            font-size: 0.65rem;
            background: #fef0e8;
            padding: 0.35rem 0.7rem;
            border-radius: 20px;
            margin-top: 0.5rem;
            color: #b45f1b;
        }
        .territory-name {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #eef2f6;
            padding: 0.35rem 0.7rem;
            border-radius: 30px;
            margin-bottom: 0.8rem;
            font-weight: 700;
            font-size: 0.8rem;
            color: #2c3e47;
        }
        hr {
            margin: 0.8rem 0;
            border: none;
            height: 1px;
            background: #e2e8f0;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="header">
            <h1>⚠️ Последствия несоблюдения условий</h1>
            <div class="badge">территориальные и отраслевые льготы</div>
        </div>
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" data-tab="territorial">🗺️ Территориальные</button>
            <button class="tab-btn" data-tab="industry">🏭 Отраслевые</button>
        </div>
        <div id="territorialTab" class="tab-content active-tab"></div>
        <div id="industryTab" class="tab-content"></div>
        <div class="nav-bar" id="navBar"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // ТЕРРИТОРИАЛЬНЫЕ ДАННЫЕ (ТОР, ОЭЗ, СПВ, Сколково)
    // --------------------------------------------------------------
    const territorialData = [
        {
            name: "ТОР",
            icon: "🏭",
            items: [
                "Исключение из реестра через суд (ст.15 №473-ФЗ) → потеря льгот задним числом.",
                "Доначисление налога на прибыль (20%) и страховых взносов (30% вместо 7,6%) с начала года.",
                "Расторжение договора аренды земли, изъятие участков.",
                "5-летний мораторий на повторную заявку.",
                "Для моногородов: запрет на статус, если компания является градообразующей."
            ]
        },
        {
            name: "ОЭЗ",
            icon: "🏗️",
            items: [
                "Расторжение соглашения (ст.20 №116-ФЗ) → потеря статуса.",
                "Уплата неуплаченных налогов за весь период + штраф 20-40% (ст.122 НК).",
                "Лишение льгот, если сэкономленные налоги > реальных инвестиций.",
                "Для портовых ОЭЗ — принудительное освобождение территории.",
                "Доля доходов от основного вида < 90% → потеря пониженных ставок."
            ]
        },
        {
            name: "СПВ",
            icon: "🚢",
            items: [
                "Расторжение соглашения по иску КРДВ (ст.13 №212-ФЗ).",
                "Потеря налоговых льгот: налог на прибыль 0% первые 5 лет, земельный налог 0% 3 года.",
                "Взыскание штрафа, изъятие земельных участков.",
                "Для резидентов после 1.04.2026: при нарушении соотношения капвложений и налоговой экономии (ТВмакс) → утрата пониженных тарифов взносов.",
                "Новые резиденты имеют 3-летний переходный период без проверки соотношения."
            ]
        },
        {
            name: "Сколково",
            icon: "⚡",
            items: [
                "Исключение из реестра участников → потеря льгот (налог 0%, НДС, взносы 14%).",
                "Превышение выручки 1 млрд руб. + прибыли 300 млн руб. → потеря льгот с начала года.",
                "5-летний мораторий на повторную заявку.",
                "Возврат грантов при невыполнении условий."
            ]
        },
        {
            name: "Риски по ст. 56.1 НК",
            icon: "⚠️",
            items: [
                "Налоговая вправе отказать в льготах, если компания 2+ раза за 3 года не сдавала бухотчетность.",
                "Контроль соотношения: капвложения / налоговая экономия (ТВмакс). Если экономия превышает инвестиции → доначисления.",
                "Расчет ТВмакс сдается до 25 марта. Несдача расчета → приостановление льгот.",
                "Переходный период: для новых резидентов (после 1 апреля 2026) проверки начнутся через 3 года.",
                "Для старых резидентов (до 1 апреля 2026) новые критерии не применяются."
            ]
        }
    ];

    // --------------------------------------------------------------
    // ОТРАСЛЕВЫЕ ДАННЫЕ (ИТ, РЭП, Медицина, Образование, Общепит)
    // --------------------------------------------------------------
    const industryData = [
        {
            name: "ИТ-компании",
            icon: "💻",
            items: [
                "Утрата аккредитации → потеря права на пониженную ставку налога на прибыль (5%) и страховых взносов (15%).",
                "Налоговая может запросить документы на камералке: договоры, акты, расшифровки доходов, выписки из реестра.",
                "Доля профильных доходов < 70% → потеря льгот.",
                "Среднемесячная зарплата сотрудников за 3 месяца < средней по региону → риск исключения из реестра аккредитованных организаций.",
                "Несвоевременное подтверждение аккредитации (до 1 июня) → исключение из реестра."
            ]
        },
        {
            name: "Радиоэлектронная промышленность (РЭП)",
            icon: "📡",
            items: [
                "Исключение из реестра РЭП Минпромторга → потеря льготы по налогу на прибыль.",
                "Доля профильных доходов < 70% → утрата права на пониженные ставки.",
                "Отсутствие экспертного заключения ФГБУ «ВНИИР» → отказ во включении в реестр.",
                "Несоответствие вида деятельности перечню (проектирование, разработка, производство ЭКБ) → исключение из реестра."
            ]
        },
        {
            name: "Медицина",
            icon: "🏥",
            items: [
                "Отсутствие лицензии → штраф до 50 тыс. руб. (ст.14.1 КоАП) или уголовная ответственность (ст.171 УК).",
                "Штат < 15 чел. или доля аккредитованных врачей < 50% → потеря нулевой ставки по налогу на прибыль.",
                "Доля доходов от медицины+образования+НИОКР < 90% → потеря льгот.",
                "Отсутствие раздельного учета → риск доначисления НДС.",
                "Росздравнадзор может провести проверку и приостановить лицензию при нарушении требований."
            ]
        },
        {
            name: "Образование",
            icon: "🎓",
            items: [
                "Отсутствие лицензии → штраф до 50 тыс. руб. (ст.14.1 КоАП).",
                "Штат < 15 сотрудников → потеря нулевой ставки по налогу на прибыль.",
                "Доля доходов от льготной деятельности < 90% → утрата права на ставку 0%.",
                "Операции с векселями и производными финансовыми инструментами → запрет на применение льготы.",
                "Утрата права на льготу → повторное применение не ранее чем через 5 лет (кроме добровольного отказа или перехода с УСН)."
            ]
        },
        {
            name: "Общепит",
            icon: "🍽️",
            items: [
                "Нарушение санитарных норм (СанПиН 2.3/2.4.3590-20) → штраф до 50 тыс. руб. или приостановление деятельности до 90 суток.",
                "Доход за предыдущий год > 60 млн руб. (для НДС-льготы) или > 2 млрд руб. (для статуса МСП) → потеря льгот.",
                "Доля дохода от общепита < 70% → утрата права на освобождение от НДС и пониженные взносы.",
                "Для численности 251-1500 чел.: зарплата за предыдущий год < среднеотраслевой → потеря льгот.",
                "Исключение из реестра МСП → утрата пониженных тарифов страховых взносов.",
                "Отсутствие медицинских книжек у персонала → штраф до 10 тыс. руб."
            ]
        }
    ];

    let currentTerritorialIdx = 0;
    let currentIndustryIdx = 0;
    let activeTab = "territorial";

    const territorialTab = document.getElementById("territorialTab");
    const industryTab = document.getElementById("industryTab");
    const navBar = document.getElementById("navBar");

    function renderTerritorialTab() {
        const t = territorialData[currentTerritorialIdx];
        const itemsHtml = t.items.map(item => `<li>${item}</li>`).join('');
        const html = `
            <div class="tab-pane-content">
                <div class="territory-name"><span>${t.icon}</span> ${t.name}</div>
                <div class="section">
                    <div class="section-title">⚖️ Риски и санкции при нарушении</div>
                    <ul class="list">${itemsHtml}</ul>
                </div>
                <div class="subnote">🔍 Храните подтверждающие документы 5 лет. При камеральной проверке ИФНС запросит расчет ТВмакс, договоры, акты, штатное расписание.</div>
            </div>
        `;
        territorialTab.innerHTML = html;
    }

    function renderIndustryTab() {
        const ind = industryData[currentIndustryIdx];
        const itemsHtml = ind.items.map(item => `<li>${item}</li>`).join('');
        const html = `
            <div class="tab-pane-content">
                <div class="territory-name"><span>${ind.icon}</span> ${ind.name}</div>
                <div class="section">
                    <div class="section-title">⚠️ Риски и санкции</div>
                    <ul class="list">${itemsHtml}</ul>
                </div>
                <div class="subnote">🔍 Регулярно проверяйте соответствие критериям льгот. При камеральной проверке ИФНС запросит подтверждающие документы.</div>
            </div>
        `;
        industryTab.innerHTML = html;
    }

    function updateTerritorialDots() {
        const dotsContainer = document.getElementById("territorialDots");
        if (!dotsContainer) return;
        dotsContainer.innerHTML = territorialData.map((_, i) => `<div class="dot ${i === currentTerritorialIdx ? 'active' : ''}" data-idx="${i}"></div>`).join('');
        document.querySelectorAll("#territorialDots .dot").forEach(dot => {
            dot.addEventListener("click", (e) => {
                const idx = parseInt(e.currentTarget.getAttribute("data-idx"));
                if (!isNaN(idx) && idx !== currentTerritorialIdx) {
                    currentTerritorialIdx = idx;
                    renderTerritorialTab();
                    updateTerritorialDots();
                    const counter = document.getElementById("territorialCounter");
                    if (counter) counter.innerText = `${currentTerritorialIdx+1}/${territorialData.length}`;
                }
            });
        });
        const counter = document.getElementById("territorialCounter");
        if (counter) counter.innerText = `${currentTerritorialIdx+1}/${territorialData.length}`;
    }

    function updateIndustryDots() {
        const dotsContainer = document.getElementById("industryDots");
        if (!dotsContainer) return;
        dotsContainer.innerHTML = industryData.map((_, i) => `<div class="dot ${i === currentIndustryIdx ? 'active' : ''}" data-idx="${i}"></div>`).join('');
        document.querySelectorAll("#industryDots .dot").forEach(dot => {
            dot.addEventListener("click", (e) => {
                const idx = parseInt(e.currentTarget.getAttribute("data-idx"));
                if (!isNaN(idx) && idx !== currentIndustryIdx) {
                    currentIndustryIdx = idx;
                    renderIndustryTab();
                    updateIndustryDots();
                    const counter = document.getElementById("industryCounter");
                    if (counter) counter.innerText = `${currentIndustryIdx+1}/${industryData.length}`;
                }
            });
        });
        const counter = document.getElementById("industryCounter");
        if (counter) counter.innerText = `${currentIndustryIdx+1}/${industryData.length}`;
    }

    function setActiveTab(tabId) {
        activeTab = tabId;
        const btns = document.querySelectorAll(".tab-btn");
        btns.forEach(btn => {
            if (btn.getAttribute("data-tab") === tabId) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
        if (tabId === "territorial") {
            territorialTab.classList.add("active-tab");
            industryTab.classList.remove("active-tab");
            navBar.innerHTML = `
                <button class="nav-btn" id="prevTerritorialBtn">←</button>
                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="dots-group" id="territorialDots"></div>
                    <span class="counter" id="territorialCounter"></span>
                </div>
                <button class="nav-btn" id="nextTerritorialBtn">→</button>
            `;
            document.getElementById("prevTerritorialBtn")?.addEventListener("click", () => {
                currentTerritorialIdx = (currentTerritorialIdx - 1 + territorialData.length) % territorialData.length;
                renderTerritorialTab();
                updateTerritorialDots();
            });
            document.getElementById("nextTerritorialBtn")?.addEventListener("click", () => {
                currentTerritorialIdx = (currentTerritorialIdx + 1) % territorialData.length;
                renderTerritorialTab();
                updateTerritorialDots();
            });
            renderTerritorialTab();
            updateTerritorialDots();
        } else {
            territorialTab.classList.remove("active-tab");
            industryTab.classList.add("active-tab");
            navBar.innerHTML = `
                <button class="nav-btn" id="prevIndustryBtn">←</button>
                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="dots-group" id="industryDots"></div>
                    <span class="counter" id="industryCounter"></span>
                </div>
                <button class="nav-btn" id="nextIndustryBtn">→</button>
            `;
            document.getElementById("prevIndustryBtn")?.addEventListener("click", () => {
                currentIndustryIdx = (currentIndustryIdx - 1 + industryData.length) % industryData.length;
                renderIndustryTab();
                updateIndustryDots();
            });
            document.getElementById("nextIndustryBtn")?.addEventListener("click", () => {
                currentIndustryIdx = (currentIndustryIdx + 1) % industryData.length;
                renderIndustryTab();
                updateIndustryDots();
            });
            renderIndustryTab();
            updateIndustryDots();
        }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const tabId = btn.getAttribute("data-tab");
            setActiveTab(tabId);
        });
    });

    setActiveTab("territorial");
</script>
</body>
</html>
