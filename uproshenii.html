<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упрощенный порядок · тренажер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .card {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            border: 1px solid #dee6f0;
        }

        .main-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e3b5c;
            text-align: center;
            margin-bottom: 0.6rem;
            border-bottom: 2px solid #c7daf0;
            padding-bottom: 0.3rem;
        }

        .content-panel {
            background: #f9fcff;
            border-radius: 16px;
            padding: 0.8rem;
            border: 1px solid #d2e0f0;
        }

        .deduction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.4rem;
            margin-bottom: 0.8rem;
        }

        .deduction-item {
            background: #f0f7fe;
            border-radius: 30px;
            padding: 0.3rem 0.6rem;
            border: 2px solid #c7daf5;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
            font-weight: 600;
            color: #0d2f4e;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .deduction-item:hover {
            background: #e3f0fd;
            border-color: #8fb7da;
        }

        .deduction-item.selected {
            background: #d4e4fc;
            border-color: #2e7ab3;
            box-shadow: 0 2px 8px rgba(0, 60, 120, 0.1);
        }

        .details-section {
            background: #e6f0fe;
            border-radius: 16px;
            padding: 0.8rem;
            margin-top: 0.3rem;
        }

        .details-title {
            font-weight: 700;
            color: #1d4b77;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .details-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            padding: 0.4rem;
            background: white;
            border-radius: 12px;
            border: 1px solid #b6cbe5;
        }

        .details-label {
            font-weight: 600;
            color: #1d4b77;
            min-width: 120px;
            font-size: 0.8rem;
            padding-left: 0.3rem;
        }

        .dropzone {
            flex: 1;
            min-width: 180px;
            min-height: 36px;
            background: #f9fcff;
            border: 2px dashed #8fb7da;
            border-radius: 12px;
            padding: 0.3rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            align-items: center;
            transition: 0.1s;
        }

        .dropzone.filled {
            background: #e9ecf0;
            border-color: #8f9fb0;
            border-style: solid;
        }

        .dropzone.drag-over {
            background: #d4e4fc;
            border-color: #2e7ab3;
        }

        .drop-item {
            background: white;
            border: 2px solid #2e7ab3;
            border-radius: 30px;
            padding: 0.15rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1d4b77;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            cursor: default;
            line-height: 1.3;
        }

        .drop-item .remove {
            color: #b16262;
            font-weight: 700;
            cursor: pointer;
            padding: 0 0.2rem;
            font-size: 0.9rem;
        }

        .drop-item .remove:hover {
            color: #a13e3e;
        }

        .options-panel {
            background: white;
            border-radius: 16px;
            padding: 0.6rem;
            margin-top: 0.5rem;
            border: 1px solid #c7daf5;
        }

        .options-title {
            font-weight: 600;
            color: #0d2f4e;
            margin-bottom: 0.4rem;
            font-size: 0.8rem;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .option-btn {
            background: #f0f7fe;
            border: 2px solid #8fb7da;
            border-radius: 30px;
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1d4b77;
            cursor: grab;
            transition: 0.1s;
            user-select: none;
        }

        .option-btn:active {
            cursor: grabbing;
            opacity: 0.8;
        }

        .option-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
            cursor: not-allowed;
        }

        .check-btn {
            background: #2e7ab3;
            border: none;
            border-radius: 30px;
            padding: 0.4rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            margin-top: 0.5rem;
            width: 100%;
            transition: 0.1s;
        }

        .check-btn:hover {
            background: #1d5d8f;
        }

        .check-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .result-message {
            margin-top: 0.5rem;
            padding: 0.4rem;
            border-radius: 12px;
            font-size: 0.8rem;
            text-align: center;
        }

        .result-message.correct {
            background: #e2f3de;
            color: #176b2c;
            border: 1px solid #5cb377;
        }

        .result-message.incorrect {
            background: #ffeae5;
            color: #b13e3e;
            border: 1px solid #e09b9b;
        }

        .rule-badge {
            display: inline-block;
            background: #2e7ab3;
            color: white;
            border-radius: 30px;
            padding: 0.1rem 0.6rem;
            font-size: 0.6rem;
        }

        @media (max-width: 700px) {
            .details-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .dropzone {
                width: 100%;
            }
            .deduction-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="card" id="app"></div>

    <script>
        (function() {
            const app = document.getElementById('app');

            // Данные о вычетах (короткие названия)
            const deductions = [
                { id: 'property', name: 'Покупка недвижимости' },
                { id: 'property_percent', name: 'Проценты по ипотеке' },
                { id: 'education', name: 'Обучение' },
                { id: 'medical', name: 'Лечение' },
                { id: 'sport', name: 'Спорт' },
                { id: 'pension', name: 'Пенсионные взносы' },
                { id: 'investment', name: 'ИИС' },
                { id: 'savings', name: 'Долгосрочные сбережения' }
            ];

            // Правильные ответы для каждого вычета
            const correctAnswers = {
                property: {
                    source: ['Росреестр', 'банки'],
                    limit: '2 000 000 рублей',
                    features: 'сведения предоставят налогенты и банки, если участвуют в обмене информацией с ФНС'
                },
                property_percent: {
                    source: ['банки'],
                    limit: '3 000 000 рублей',
                    features: 'сведения предоставят налогенты и банки, если участвуют в обмене информацией с ФНС'
                },
                education: {
                    source: ['образовательные организации'],
                    limit: '150 000 рублей',
                    features: 'поставщики услуг передадут справку об оплате при наличии заявления от физлица'
                },
                medical: {
                    source: ['медицинские организации'],
                    limit: '150 000 рублей',
                    features: 'поставщики услуг передадут справку об оплате при наличии заявления от физлица'
                },
                sport: {
                    source: ['спортивные организации'],
                    limit: '150 000 рублей',
                    features: 'поставщики услуг передадут справку об оплате при наличии заявления от физлица'
                },
                pension: {
                    source: ['НПФ', 'страховые организации'],
                    limit: '150 000 рублей',
                    features: 'поставщики услуг передадут справку об оплате при наличии заявления от физлица'
                },
                investment: {
                    source: ['брокеры', 'управляющие компании'],
                    limit: 'до 400 000 рублей',
                    features: 'Вычет дадут в сумме средств, внесенных на ИИС на основании сведений от брокера'
                },
                savings: {
                    source: ['НПФ', 'брокеры'],
                    limit: 'до 400 000 рублей',
                    features: 'Вычет дадут на основании сведений о уплаченных взносах от НПФ'
                }
            };

            // Все возможные варианты для перетаскивания (источники)
            const allOptions = [
                'Росреестр', 'банки', 'образовательные организации', 
                'медицинские организации', 'спортивные организации',
                'НПФ', 'страховые организации', 'брокеры', 'управляющие компании'
            ];

            // Варианты для лимитов
            const limitOptions = [
                '2 000 000 рублей', '3 000 000 рублей', '150 000 рублей', 'до 400 000 рублей'
            ];

            // Варианты для особенностей
            const featuresOptions = [
                'сведения предоставят налогенты и банки, если участвуют в обмене информацией с ФНС',
                'поставщики услуг передадут справку об оплате при наличии заявления от физлица',
                'Вычет дадут в сумме средств, внесенных на ИИС на основании сведений от брокера',
                'Вычет дадут на основании сведений о уплаченных взносах от НПФ'
            ];

            let selectedDeduction = deductions[0];
            
            // Состояние для текущего вычета
            let currentState = {
                source: [],
                limit: '',
                features: ''
            };

            // Функция сброса состояния для выбранного вычета
            function resetState() {
                currentState = {
                    source: [],
                    limit: '',
                    features: ''
                };
            }

            // Проверка, использован ли уже вариант источника
            function isOptionUsed(option) {
                return currentState.source.includes(option);
            }

            function render() {
                const correct = correctAnswers[selectedDeduction.id];
                
                // Проверка, все ли поля заполнены
                const isComplete = currentState.source.length > 0 && currentState.limit && currentState.features;

                // Проверка правильности
                let isCorrect = false;
                if (isComplete) {
                    // Сравниваем источники (массивы)
                    const sourcesMatch = arraysEqual(
                        currentState.source.sort(), 
                        correct.source.slice().sort()
                    );
                    const limitMatch = currentState.limit === correct.limit;
                    const featuresMatch = currentState.features === correct.features;
                    isCorrect = sourcesMatch && limitMatch && featuresMatch;
                }

                function arraysEqual(a, b) {
                    if (a.length !== b.length) return false;
                    for (let i = 0; i < a.length; i++) {
                        if (a[i] !== b[i]) return false;
                    }
                    return true;
                }

                app.innerHTML = `
                    <div class="main-title">Упрощенный порядок вычетов по НДФЛ</div>
                    
                    <div class="content-panel">
                        <div style="margin-bottom:0.3rem;">
                            <span class="rule-badge">выберите вычет</span>
                        </div>
                        
                        <div class="deduction-grid">
                            ${deductions.map(d => `
                                <div class="deduction-item ${selectedDeduction.id === d.id ? 'selected' : ''}" data-id="${d.id}">
                                    ${d.name}
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="details-section">
                            <div class="details-title">
                                <span>📋 ${selectedDeduction.name}</span>
                            </div>
                            
                            <!-- Строка: Кто передает данные -->
                            <div class="details-row">
                                <span class="details-label">Кто передает данные:</span>
                                <div class="dropzone ${currentState.source.length > 0 ? 'filled' : ''}" id="dropzone-source">
                                    ${currentState.source.map(s => `
                                        <span class="drop-item">
                                            ${s}
                                            <span class="remove" data-remove="${s}">✕</span>
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <!-- Строка: Лимит -->
                            <div class="details-row">
                                <span class="details-label">Лимит:</span>
                                <div class="dropzone ${currentState.limit ? 'filled' : ''}" id="dropzone-limit">
                                    ${currentState.limit ? `<span class="drop-item">${currentState.limit}<span class="remove" data-remove="limit">✕</span></span>` : ''}
                                </div>
                            </div>
                            
                            <!-- Строка: Особенности -->
                            <div class="details-row">
                                <span class="details-label">Особенности:</span>
                                <div class="dropzone ${currentState.features ? 'filled' : ''}" id="dropzone-features">
                                    ${currentState.features ? `<span class="drop-item">${currentState.features}<span class="remove" data-remove="features">✕</span></span>` : ''}
                                </div>
                            </div>
                            
                            <!-- Панель с вариантами для перетаскивания -->
                            <div class="options-panel">
                                <div class="options-title">🎯 Перетащите правильные варианты:</div>
                                <div class="options-container" id="options-container">
                                    <div style="font-weight:600; width:100%; margin-top:0.1rem; font-size:0.7rem; color:#1d4b77;">Источники:</div>
                                    ${allOptions.map(opt => `
                                        <div class="option-btn ${isOptionUsed(opt) ? 'disabled' : ''}" draggable="${!isOptionUsed(opt)}" data-option="${opt}">
                                            ${opt}
                                        </div>
                                    `).join('')}
                                    
                                    <div style="font-weight:600; width:100%; margin-top:0.4rem; font-size:0.7rem; color:#1d4b77;">Лимиты:</div>
                                    ${limitOptions.map(opt => `
                                        <div class="option-btn ${currentState.limit ? 'disabled' : ''}" draggable="${!currentState.limit}" data-option="limit:${opt}">
                                            ${opt}
                                        </div>
                                    `).join('')}
                                    
                                    <div style="font-weight:600; width:100%; margin-top:0.4rem; font-size:0.7rem; color:#1d4b77;">Особенности:</div>
                                    ${featuresOptions.map(opt => `
                                        <div class="option-btn ${currentState.features ? 'disabled' : ''}" draggable="${!currentState.features}" data-option="features:${opt}">
                                            ${opt.length > 40 ? opt.substring(0,40)+'...' : opt}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <button class="check-btn" id="checkBtn" ${!isComplete ? 'disabled' : ''}>Проверить</button>
                            
                            ${isComplete ? `
                                <div class="result-message ${isCorrect ? 'correct' : 'incorrect'}">
                                    ${isCorrect ? '✅ Все верно!' : '❌ Неправильно. Попробуйте другую комбинацию.'}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;

                // Обработчики выбора вычета
                document.querySelectorAll('.deduction-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = item.dataset.id;
                        const found = deductions.find(d => d.id === id);
                        if (found) {
                            selectedDeduction = found;
                            resetState();
                            render();
                        }
                    });
                });

                // Drag & Drop
                const options = document.querySelectorAll('.option-btn[draggable="true"]');
                const dropzones = {
                    source: document.getElementById('dropzone-source'),
                    limit: document.getElementById('dropzone-limit'),
                    features: document.getElementById('dropzone-features')
                };

                options.forEach(opt => {
                    opt.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', opt.dataset.option);
                    });
                });

                Object.entries(dropzones).forEach(([key, zone]) => {
                    if (!zone) return;
                    
                    zone.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        zone.classList.add('drag-over');
                    });
                    zone.addEventListener('dragleave', () => {
                        zone.classList.remove('drag-over');
                    });
                    zone.addEventListener('drop', (e) => {
                        e.preventDefault();
                        zone.classList.remove('drag-over');
                        const data = e.dataTransfer.getData('text/plain');
                        
                        if (key === 'source') {
                            // Для источника добавляем в массив, если это источник
                            if (allOptions.includes(data) && !currentState.source.includes(data)) {
                                currentState.source.push(data);
                            }
                        } else if (key === 'limit' && data.startsWith('limit:')) {
                            currentState.limit = data.replace('limit:', '');
                        } else if (key === 'features' && data.startsWith('features:')) {
                            currentState.features = data.replace('features:', '');
                        }
                        render();
                    });
                });

                // Удаление элементов
                document.querySelectorAll('.remove').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const value = btn.dataset.remove;
                        if (value === 'limit' || value === 'features') {
                            currentState[value] = '';
                        } else {
                            // Удаляем из массива source
                            currentState.source = currentState.source.filter(s => s !== value);
                        }
                        render();
                    });
                });

                // Проверка
                document.getElementById('checkBtn')?.addEventListener('click', () => {
                    render();
                });
            }

            render();
        })();
    </script>
</body>
</html>
