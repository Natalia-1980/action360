<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Инфографика: обесценение и позиция ФНС</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #e6e9ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 20px;
    }
    .frame {
      width: 720px;
      max-width: 100%;
      background: #f7f8f9;
      border-radius: 40px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.25);
      padding: 24px 28px 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid #d0d5dc;
    }
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      margin-bottom: 4px;
    }
    .badge {
      background: #4a4f55;
      color: #f0f2f4;
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 0.3px;
      padding: 4px 18px;
      border-radius: 30px;
      background: #5a6068;
    }
    .slide-counter {
      font-weight: 500;
      color: #3d434a;
      background: #dde1e6;
      padding: 2px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: #d0d5dc;
      border-radius: 20px;
      margin: 10px 0 14px;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 4px;
      background: #6a7078;
      border-radius: 20px;
      width: 20%;
      transition: width 0.3s ease;
    }
    .slide-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 10px;
      scrollbar-width: thin;
    }
    .slide-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .slide-scroll::-webkit-scrollbar-thumb {
      background: #b0b6be;
      border-radius: 20px;
    }
    .slide-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #23272b;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .slide-sub {
      color: #4a5057;
      font-size: 0.95rem;
      font-weight: 400;
      border-left: 3px solid #8a9098;
      padding-left: 16px;
      background: #edf0f3;
      border-radius: 0 8px 8px 0;
      line-height: 1.3;
      margin-bottom: 14px;
      padding: 6px 16px;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 6px 0 10px;
    }
    .card {
      background: #f0f2f4;
      border-radius: 20px;
      padding: 14px 16px;
      border: 1px solid #d5d9df;
    }
    .card h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #2d3238;
      margin-bottom: 8px;
      border-bottom: 1px dashed #c5cad0;
      padding-bottom: 5px;
    }
    .card ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .card li {
      padding-left: 18px;
      position: relative;
      margin-bottom: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #3a3f45;
    }
    .card li::before {
      content: "—";
      color: #6a7078;
      font-weight: 600;
      position: absolute;
      left: 2px;
    }
    .highlight-badge {
      background: #d5d9df;
      padding: 1px 12px;
      border-radius: 20px;
      color: #2d3238;
      font-weight: 500;
      font-size: 0.7rem;
      display: inline-block;
      margin-right: 4px;
    }
    .chip-icon {
      display: inline-block;
      background: #6a7078;
      color: #f0f2f4;
      border-radius: 30px;
      padding: 0 12px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      line-height: 22px;
    }
    .info-block {
      background: #e8ebef;
      border-radius: 30px;
      padding: 8px 18px;
      border: 1px solid #d0d5dc;
      font-size: 0.88rem;
      color: #2d3238;
      margin: 6px 0 8px;
      font-weight: 450;
      line-height: 1.4;
    }
    .footer-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      margin-top: 2px;
      gap: 16px;
      padding: 6px 0 2px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #f0f2f4;
      border: 1px solid #c5cad0;
      padding: 8px 34px;
      border-radius: 40px;
      font-weight: 500;
      color: #3a3f45;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
      background: #edf0f3;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .btn-primary {
      background: #5a6068;
      border: 1px solid #5a6068;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }
    .btn-primary:hover {
      background: #4a4f55;
      border-color: #4a4f55;
    }
    .btn-outline:hover {
      background: #e2e6eb;
      border-color: #a8aeb6;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .fade-enter {
      animation: fadeSlide 0.4s ease;
    }
    @keyframes fadeSlide {
      0% { opacity: 0.5; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 680px) {
      .frame { padding: 16px; }
      .grid-2col { grid-template-columns: 1fr; gap: 12px; }
      .slide-title { font-size: 1.3rem; }
    }
    .risk-tag {
      display: inline-block;
      background: #d5d0cf;
      color: #3a3230;
      border-radius: 30px;
      padding: 1px 12px;
      font-size: 0.65rem;
      font-weight: 600;
      margin-right: 4px;
    }
    .case-block {
      background: #edf0f3;
      border-radius: 16px;
      padding: 12px 16px;
      border-left: 4px solid #6a7078;
      margin: 4px 0 8px;
    }
    .case-block .title {
      font-weight: 600;
      font-size: 0.9rem;
      color: #23272b;
    }
    .case-block .detail {
      font-size: 0.85rem;
      color: #3d434a;
      line-height: 1.4;
      margin-top: 2px;
    }
    .single-card {
      background: #f0f2f4;
      border-radius: 20px;
      padding: 14px 16px;
      border: 1px solid #d5d9df;
      margin-bottom: 8px;
    }
    .single-card h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #2d3238;
      margin-bottom: 8px;
      border-bottom: 1px dashed #c5cad0;
      padding-bottom: 5px;
    }
    .single-card ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .single-card li {
      padding-left: 18px;
      position: relative;
      margin-bottom: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #3a3f45;
    }
    .single-card li::before {
      content: "—";
      color: #6a7078;
      font-weight: 600;
      position: absolute;
      left: 2px;
    }
    .info-block ul {
      list-style: none;
      padding-left: 0;
      margin: 4px 0 0 0;
    }
    .info-block ul li {
      padding-left: 18px;
      position: relative;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #2d3238;
      margin-bottom: 2px;
    }
    .info-block ul li::before {
      content: "—";
      color: #6a7078;
      font-weight: 600;
      position: absolute;
      left: 2px;
    }
  </style>
</head>
<body>
<div class="frame">
  <div class="nav-header">
    <span class="badge">Обесценение · позиция ФНС</span>
    <span class="slide-counter" id="slideCounter">1 / 3</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width: 33%;"></div>
  </div>

  <div class="slide-scroll" id="slideScroll">
    <div id="slideContent" class="fade-enter"></div>
  </div>

  <div class="footer-actions">
    <div class="btn-group">
      <button class="btn btn-outline" id="prevBtn">Назад</button>
      <button class="btn btn-primary" id="nextBtn">Вперед</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const slides = [
      {
        title: 'Позиция ФНС: обесценение как инструмент занижения',
        subtitle: 'Главная уязвимость — субъективность оценки',
        content: `
          <div class="grid-2col">
            <div class="card">
              <h4>Аргумент ФНС</h4>
              <ul>
                <li>Обесценение может использоваться для искусственного занижения налоговой базы.</li>
                <li>Наличие или отсутствие признаков обесценения — крайне субъективная оценка.</li>
                <li>Инспекциям несложно найти эксперта с противоположным мнением.</li>
                <li><span class="highlight-badge">риск</span> этого достаточно для доначисления налога.</li>
              </ul>
            </div>
            <div class="card">
              <h4>Инструмент ФНС</h4>
              <ul>
                <li>После камеральной проверки — назначение независимых экспертиз стоимости активов.</li>
                <li>На основании экспертиз — отказ в признании обесценения.</li>
                <li>Спор переходит в плоскость противоречивых экспертных заключений.</li>
                <li><span class="chip-icon">ключ</span> суд назначает экспертизу при противоречиях.</li>
              </ul>
            </div>
          </div>
          <div class="info-block">Обесценение — всегда спор экспертиз. Без собственной методики и заключения независимого оценщика шансов на защиту нет.</div>
        `
      },
      {
        title: 'Риски и триггеры для ФНС',
        subtitle: 'На что обращает внимание инспекция',
        content: `
          <div class="single-card" style="border-left:4px solid #8a8f96;">
            <h4>Три налоговых риска</h4>
            <ul>
              <li><strong>Доначисление налога:</strong> необоснованная методика лишает права на снижение базы.</li>
              <li><strong>Штрафные санкции:</strong> по ст. 122 НК РФ — 20% от неуплаченной суммы, при умысле — 40%.</li>
              <li><strong>Противоречивые экспертизы:</strong> без собственной методики суд встает на сторону ФНС.</li>
            </ul>
          </div>
          <div class="single-card" style="border-left:4px solid #8a8f96;">
            <h4>Факторы, которые привлекают внимание ФНС</h4>
            <ul>
              <li>Отсутствие утвержденной методики теста на обесценение в учетной политике.</li>
              <li>Нарушение регулярности тестирования — пропуски отчетных дат.</li>
              <li>Обесценение дорогостоящих объектов без привлечения независимых оценщиков.</li>
            </ul>
          </div>
          <div class="info-block" style="background:#e4e7eb; border-color:#c5cad0;">
            <strong>Памятка:</strong> отсутствие документов = отсутствие защиты. ФНС использует любую возможность оспорить обесценение, если методика не утверждена или тестирование проведено формально.
          </div>
        `
      },
      {
        title: 'Дело ПАО «Россети Юг»',
        subtitle: 'Прецедент — постановление АС Поволжского округа от 20.05.2025 № Ф06-2353/2025',
        content: `
          <div class="case-block">
            <div class="title">Суть спора</div>
            <div class="detail">ИФНС доначислила налог на имущество за 2022 год, посчитав, что компания необоснованно учла обесценение активов при расчете налоговой базы.</div>
          </div>
          <div class="grid-2col" style="margin-top:4px;">
            <div class="card">
              <h4>Позиция налогоплательщика</h4>
              <ul>
                <li>Экспертные заключения ФНС противоречивы и вызывают сомнения.</li>
                <li>Компания ходатайствовала о назначении судебной экспертизы.</li>
                <li>Суд первой инстанции удовлетворил ходатайство.</li>
              </ul>
            </div>
            <div class="card">
              <h4>Итог в судах</h4>
              <ul>
                <li>Апелляция подтвердила: при противоречиях экспертиз их устраняет суд.</li>
                <li>Кассация (АС Поволжского округа) не нашла оснований для отмены.</li>
                <li>Спор перешел в стадию судебной экспертизы.</li>
              </ul>
            </div>
          </div>
          <div class="info-block" style="background:#e8ebef; border-color:#c5cad0;">
            <strong>Ключевые выводы:</strong>
            <ul>
              <li>Собственная методика и заключение независимого оценщика позволяют создать «противоречие экспертных мнений» и перенести разбирательство в суд.</li>
              <li>Без документов это сделать невозможно.</li>
            </ul>
          </div>
        `
      }
    ];

    let current = 0;
    const contentEl = document.getElementById('slideContent');
    const counterEl = document.getElementById('slideCounter');
    const progressEl = document.getElementById('progressFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function render(index) {
      const data = slides[index];
      contentEl.classList.remove('fade-enter');
      void contentEl.offsetWidth;
      contentEl.innerHTML = `
        <div class="slide-title">${data.title}</div>
        <div class="slide-sub">${data.subtitle}</div>
        ${data.content}
      `;
      contentEl.classList.add('fade-enter');

      counterEl.textContent = `${index+1} / ${slides.length}`;
      progressEl.style.width = `${((index+1)/slides.length)*100}%`;
      prevBtn.disabled = (index === 0);
      prevBtn.style.opacity = (index === 0) ? '0.4' : '1';
      nextBtn.textContent = 'Вперед';
    }

    function next() {
      if (current < slides.length - 1) {
        current++;
      } else {
        current = 0;
      }
      render(current);
    }

    function prev() {
      if (current > 0) {
        current--;
        render(current);
      }
    }

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        next();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prev();
      }
    });
    render(0);
  })();
</script>
</body>
</html>
