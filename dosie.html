<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Досье контрагента: судебные ситуации</title>
<style>
  :root{
    --bg:#f4f2eb;
    --card:#fffef9;
    --text:#202523;
    --muted:#5f6763;
    --line:#d7ddd5;
    --graphite:#202523;
    --neutral:#f1f2f3;
    --neutral-2:#f7f7f5;
    --success:#eaf4ed;
    --success-line:#bfd7c7;
    --red:#9a3c2e;
    --red-bg:#fff0ed;
    --shadow:0 14px 32px rgba(32,37,35,.09);
    --card-height:620px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
  body{min-height:100vh}
  .trainer{width:min(100%,650px);margin:0 auto;padding:22px 14px 26px}
  .stage{position:relative;width:min(100%,430px);margin:0 auto;padding:14px 0 0;min-height:calc(var(--card-height) + 58px);perspective:1500px}
  .ghost{position:absolute;left:50%;width:calc(100% - 24px);height:calc(var(--card-height) - 18px);border:1px solid var(--line);border-radius:34px;background:var(--neutral-2);transform-origin:center;pointer-events:none}
  .ghost.g2{top:30px;transform:translateX(-50%) scale(.965);opacity:.64}
  .ghost.g3{top:46px;transform:translateX(-50%) scale(.93);opacity:.34}
  .card-shell{position:relative;z-index:5;width:100%;height:var(--card-height);transition:transform .32s ease, opacity .32s ease}
  .card-shell.exit-left{transform:translateX(-34px) rotate(-1.5deg);opacity:0}
  .card-shell.exit-right{transform:translateX(34px) rotate(1.5deg);opacity:0}
  .card{position:relative;width:100%;height:var(--card-height);transform-style:preserve-3d;transition:transform .62s cubic-bezier(.2,.75,.25,1)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .back{transform:rotateY(180deg)}
  .phone-top{height:28px;display:flex;justify-content:center;align-items:flex-start;flex:0 0 auto}
  .notch{width:86px;height:5px;border-radius:999px;background:var(--graphite);margin-top:10px;opacity:.9}
  .content{padding:0 22px 20px;display:flex;flex-direction:column;flex:1}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .counter{font-size:13px;font-weight:700}.side-label{font-size:13px;color:var(--muted)}
  .situation{font-size:13px;line-height:1.4;margin:0 0 10px}.situation strong,.back-copy strong{font-weight:800;color:var(--text)}
  ul{margin:7px 0 10px;padding-left:19px}li{font-size:13px;line-height:1.35;margin:0 0 4px}
  .question{margin:4px 0 8px;font-size:13px;line-height:1.35;font-weight:800}
  .answers{display:grid;gap:4px;margin-top:1px}
  .answer{width:100%;display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:start;padding:6px 8px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--text);text-align:left;cursor:pointer;font:inherit;transition:border-color .16s ease, background .16s ease, transform .16s ease}
  .answer:hover{border-color:#aeb5b1;background:var(--neutral-2);transform:translateY(-1px)}
  .answer.selected.correct{border:2px solid #929a96;background:var(--neutral);padding:5px 7px;color:var(--text)}
  .answer.selected.wrong{border:2px solid #929a96;background:var(--neutral);padding:5px 7px;color:var(--text)}
  .answer.selected.correct .letter{background:#d9ddda;border-color:#929a96;color:var(--text)}
  .answer.selected.wrong .letter{background:#d9ddda;border-color:#929a96;color:var(--text)}
  .letter{width:21px;height:21px;border:1px solid #aeb5b1;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}
  .answer-text{font-size:13px;line-height:1.28;padding-top:1px}
  .action-row{margin-top:auto;padding-top:14px;display:flex;gap:8px}
  .primary,.secondary,.icon-btn{appearance:none;border:1px solid var(--line);border-radius:14px;cursor:pointer;font:inherit}
  .primary{flex:1;background:var(--graphite);border-color:var(--graphite);color:#fff;padding:11px 14px;font-size:13px;font-weight:750}.primary:hover:not(:disabled){background:#353c39;border-color:#353c39}.primary:disabled{opacity:.3;cursor:not-allowed}
  .secondary{background:var(--card);color:var(--text);padding:10px 13px;font-size:13px;font-weight:700}
  .back-copy{font-size:13px;line-height:1.4}.result{font-size:13px;font-weight:850;margin:0 0 10px}.back-copy p{margin:0 0 11px}
  .case{margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}.case p{margin:0 0 8px}.case strong{font-weight:850}
  .wrong-note{display:none;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--red-bg);border-color:#e5cbc3;color:var(--red);font-size:13px;line-height:1.4}.wrong-note.show{display:block}
  .side-nav{position:absolute;top:50%;z-index:12;transform:translateY(-50%)}
  .side-nav.prev{left:-58px}.side-nav.next{right:-58px}
  .nav{width:min(100%,430px);margin:14px auto 0;display:flex;align-items:center;justify-content:center}.nav-center{display:flex;justify-content:center;gap:7px}
  .dot{width:8px;height:8px;border:1px solid #929a96;border-radius:50%;background:transparent;cursor:pointer;padding:0}.dot.active{background:var(--graphite);border-color:var(--graphite)}
  .icon-btn{width:44px;height:44px;background:var(--card);color:var(--text);display:grid;place-items:center;font-size:26px;line-height:1;box-shadow:0 8px 20px rgba(32,37,35,.08)}
  .icon-btn:hover:not(:disabled){background:var(--neutral)}.icon-btn:disabled{opacity:.28;cursor:not-allowed}
  .hint{width:min(100%,430px);margin:10px auto 0;font-size:11.5px;line-height:1.35;color:var(--muted);text-align:center}
  @media (max-width:470px){.trainer{padding:14px 10px 22px}.stage{min-height:calc(var(--card-height) + 56px)}.content{padding:0 17px 18px}.side-nav.prev{left:8px}.side-nav.next{right:8px}.icon-btn{width:38px;height:38px;background:rgba(255,254,249,.94)}}
  @media (prefers-reduced-motion:reduce){.card,.card-shell,.answer{transition:none}}
</style>
</head>
<body>
<div class="trainer">
  <main class="stage" aria-live="polite">
    <button class="icon-btn side-nav prev" id="prevBtn" aria-label="Предыдущая карточка">‹</button>
    <button class="icon-btn side-nav next" id="nextBtn" aria-label="Следующая карточка">›</button>
    <div class="ghost g3"></div>
    <div class="ghost g2"></div>
    <div class="card-shell" id="cardShell"><article class="card" id="card"></article></div>
  </main>

  <nav class="nav" aria-label="Переход к карточке">
    <div class="nav-center" id="dots"></div>
  </nav>
</div>

<script>
const cards = [
  {
    front:`<p class="situation"><strong>Компания перед заключением договора поставки сырья собрала в досье:</strong></p><ul><li>учредительные документы и банковскую выписку с платежами по налогам, зарплате, лизингу, аренде, товарам и услугам;</li><li>подтверждение, что контрагент вовремя сдает отчетность и не имеет налоговой задолженности, — налоговые декларации, выписки и сведения из сервиса «Прозрачный бизнес»;</li><li>сведения об основных средствах, запасах и выручке — бухгалтерскую отчетность и выписки из сервиса «Прозрачный бизнес»;</li><li>сведения об адресе в ЕГРЮЛ и отсутствии контрагента в реестре недобросовестных поставщиков — выписку из ЕГРЮЛ и результаты проверки реестров.</li></ul><div class="question">Достаточно ли такого досье, чтобы подтвердить осмотрительность при выборе контрагента?</div>`,
    answers:["Да, компания проверила регистрацию, финансы, ресурсы, деятельность контрагента.","Нет, для досье надо собрать отчетность и банковские выписки за три года.","Досье вообще не нужно."],
    correct:0,
    back:`<p class="result">Правильный ответ: А.</p><p>Компания проверила статус контрагента. Она оценила его налоговую дисциплину, финансовое состояние, платежеспособность и ресурсы для ведения деятельности и сохранила результаты проверки.</p><div class="case"><p><strong>Судебная практика: постановление АС ЗСО от 18.01.2024 г. по делу № А75-3315/2023.</strong></p><p>Суд учел учредительные документы, банковскую выписку контрагента, его отчетность, наличие основных средств и запасов, миллиардную выручку, лизинг техники, отсутствие записей о недостоверности адреса и отсутствие в реестре недобросовестных поставщиков. Суд сделал вывод, что компания собрала достаточно доказательств благонадежности контрагента.</p></div>`
  },
  {
    front:`<p class="situation">Компания приобрела у четырех подрядчиков исследовательские работы, услуги по настройке и тестированию ИТ-оборудования.</p><p class="situation"><strong>По трем контрагентам компания собрала в досье:</strong></p><ul><li>учредительные документы, бухгалтерскую отчетность, сведения о сотрудниках, офисе, задолженности, судебных и исполнительных производствах;</li><li>договоры, технические задания, акты сдачи-приемки работ;</li><li>сведения о личных встречах с руководителями, деловую переписку;</li><li>документы о том, что компания действительно использовала результаты работ.</li></ul><p class="situation"><strong>По четвертому контрагенту компания собрала только учредительные документы.</strong> В досье нет документов о том, кто фактически выполнял работы, какими ресурсами располагал подрядчик и какой результат получила компания.</p><div class="question">Достаточно ли такого досье, чтобы подтвердить осмотрительность при выборе контрагентов и реальность сделок?</div>`,
    answers:["Да, по всем четырем контрагентам.","По трем контрагентам — да. По четвертому — нет.","Нет, ни по одному."],
    correct:1,
    back:`<p class="result">Правильный ответ: Б.</p><p>По трем контрагентам компания собрала надежные доказательства должной осмотрительности.</p><p>К выбору четвертого контрагента компания подошла формально. Если в досье будут только учредительные документы, ФНС обязательно придерется к такому контрагенту и доначислит НДС и налог на прибыль.</p><div class="case"><p><strong>Судебная практика: постановление АС МО от 25.03.2025 г. по делу № А40-10965/2024.</strong></p><p>Суд учел документы по трем контрагентам, по которым компания при выборе оценила коммерческую привлекательность сделки, деловую репутацию и платежеспособность контрагента, наличие у него необходимых ресурсов, а также риски неисполнения обязательств. Все это компания подтвердила документами. К выбору четвертого контрагента компания подошла формально, поэтому по нему сняли вычеты НДС и расходы по налогу на прибыль.</p></div>`
  },
  {
    front:`<p class="situation"><strong>Строительная компания перед заключением договоров с субподрядчиками и поставщиками собрала в досье:</strong></p><ul><li>выписки из ЕГРЮЛ, уставы и копии паспортов представителей;</li><li>договоры субподряда и поставки;</li><li>счета-фактуры и первичные документы;</li><li>акты КС-2 по строительным работам;</li><li>договоры и акты аренды строительной техники.</li></ul><div class="question">Достаточно ли такого досье, чтобы подтвердить осмотрительность при выборе контрагентов?</div>`,
    answers:["Да, договоров, первичных документов достаточно.","Нет, компания не собрала документы о выборе контрагентов и их способности исполнить договоры.","Да, проверять опыт, сотрудников и ресурсы подрядчика не нужно."],
    correct:1,
    back:`<p class="result">Правильный ответ: Б.</p><p>Компания не собрала документы о деловой репутации и опыте контрагентов, не зафиксировала, почему выбрала именно их, не сохранила переписку и контакты представителей. В досье также нет подтверждений, что у субподрядчиков были сотрудники, допуски и другие ресурсы для выполнения работ.</p><div class="case"><p><strong>Судебная практика: постановление АС ДО от 27.01.2025 г. по делу № А51-13087/2022.</strong></p><p>Суд указал, что выписки из ЕГРЮЛ, уставы, паспорта, договоры и первичные документы сами по себе не подтверждают осмотрительность. Компания не собрала экономическое обоснование выбора поставщиков, сведения об их репутации, переписку и другие доказательства реального взаимодействия.</p></div>`
  },
  {
    front:`<p class="situation"><strong>Строительная компания перед заключением договоров с подрядчиками и поставщиком собрала в досье:</strong></p><ul><li>свидетельства о регистрации и постановке на налоговый учет;</li><li>выписки из ЕГРЮЛ и уставы;</li><li>приказы о назначении руководителей;</li><li>документы о юридических адресах;</li><li>договоры субподряда и поставки;</li><li>товарно-транспортные накладные;</li><li>акты сверки;</li><li>соглашения о переводе долга;</li><li>письма контрагентов с просьбой перечислить оплату третьим лицам.</li></ul><div class="question">Достаточно ли такого досье, чтобы подтвердить осмотрительность и реальность сделок?</div>`,
    answers:["Да, чем больше документов собрано в досье, тем надежнее защита компании.","Да, так как есть договоры и документы по исполнению сделки.","Нет, документы должны подтверждать, кто вел переговоры, подписывал договор, исполнил сделку."],
    correct:2,
    back:`<p class="result">Правильный ответ: В.</p><p>Большое количество документов в досье не защитит компанию, если они не подтверждают, кто вел переговоры и подписывал документы, были ли ресурсы на выполнение договора и действительно ли этот контрагент выполнил договор.</p><div class="case"><p><strong>Судебная практика: постановление АС МО от 22.03.2024 г. по делу № А40-107159/2023.</strong></p><p>Налогоплательщик представил доказательства осмотрительности только в виде получения от контрагентов необходимых документов и ознакомления с общедоступной официальной информацией в ЕГРЮЛ. Такая проверка не подтверждает достаточную осмотрительность, поскольку сведения о регистрации компании сами по себе не доказывают, что контрагент способен исполнить договор.</p></div>`
  }
];
let current=0;
const state=cards.map(()=>({selected:null,flipped:false}));
let flipTimer=null, resizeTimer=null;
const card=document.getElementById('card'),shell=document.getElementById('cardShell'),dots=document.getElementById('dots'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
function frontMarkup(item,st,index){
  return `<section class="face front"><div class="phone-top"><div class="notch"></div></div><div class="content"><div class="meta"><span class="counter">${index+1} из ${cards.length}</span><span class="side-label">Ситуация</span></div>${item.front}<div class="answers">${item.answers.map((a,i)=>`<button class="answer ${answerClass(st,item,i)}" data-answer="${i}"><span class="letter">${String.fromCharCode(1040+i)}</span><span class="answer-text">${a}</span></button>`).join('')}</div></div></section>`;
}
function backMarkup(item,st,index){
  return `<section class="face back"><div class="phone-top"><div class="notch"></div></div><div class="content"><div class="meta"><span class="counter">${index+1} из ${cards.length}</span><span class="side-label">Разбор</span></div><div class="wrong-note ${st.selected!==null&&st.selected!==item.correct?'show':''}">Ваш вариант не совпал с оценкой суда. Посмотрите, каких доказательств не хватило.</div><div class="back-copy">${item.back}</div><div class="action-row"><button class="secondary" id="flipBackBtn">Вернуться к ситуации</button><button class="primary" id="backNextBtn">${index===cards.length-1?'К первой карточке':'Следующая карточка'}</button></div></div></section>`;
}
function measureUniformHeight(){
  const width = Math.min(shell.getBoundingClientRect().width || 430, 430);
  const probe = document.createElement('div');
  probe.style.cssText = `position:absolute;left:-9999px;top:0;width:${width}px;visibility:hidden;pointer-events:none;`;
  document.body.appendChild(probe);
  let maxHeight = 0;
  cards.forEach((item,i)=>{
    const st = state[i];
    [frontMarkup(item,st,i), backMarkup(item,st,i)].forEach(html=>{
      const wrap = document.createElement('div');
      wrap.innerHTML = html;
      const face = wrap.firstElementChild;
      face.style.position = 'relative';
      face.style.inset = 'auto';
      face.style.height = 'auto';
      face.style.minHeight = '0';
      face.style.transform = 'none';
      face.style.backfaceVisibility = 'visible';
      probe.appendChild(face);
      maxHeight = Math.max(maxHeight, Math.ceil(face.scrollHeight));
      probe.removeChild(face);
    });
  });
  document.body.removeChild(probe);
  const finalHeight = Math.max(560, Math.min(maxHeight + 8, 760));
  document.documentElement.style.setProperty('--card-height', `${finalHeight}px`);
}
function renderDots(){dots.innerHTML=cards.map((_,i)=>`<button class="dot ${i===current?'active':''}" aria-label="Карточка ${i+1}" data-i="${i}"></button>`).join('');dots.querySelectorAll('.dot').forEach(btn=>btn.addEventListener('click',()=>goTo(Number(btn.dataset.i))));}
function answerClass(st,item,i){if(st.selected!==i)return '';return `selected ${i===item.correct?'correct':'wrong'}`;}
function render(){
  const item=cards[current],st=state[current];
  card.className='card'+(st.flipped?' flipped':'');
  card.innerHTML = frontMarkup(item,st,current) + backMarkup(item,st,current);
  card.querySelectorAll('.answer').forEach(btn=>btn.addEventListener('click',()=>{
    if(flipTimer)clearTimeout(flipTimer);
    state[current].selected=Number(btn.dataset.answer);
    state[current].flipped=false;
    render();
    const chosenIndex=current;
    flipTimer=setTimeout(()=>{
      if(current!==chosenIndex)return;
      state[current].flipped=true;
      card.classList.add('flipped');
      flipTimer=null;
    },520);
  }));
  document.getElementById('flipBackBtn').addEventListener('click',()=>{if(flipTimer)clearTimeout(flipTimer);flipTimer=null;state[current].flipped=false;card.classList.remove('flipped');});
  document.getElementById('backNextBtn').addEventListener('click',()=>goTo(current===cards.length-1?0:current+1));
  prevBtn.disabled=current===0;nextBtn.disabled=current===cards.length-1;renderDots();
}
function goTo(index){if(index===current||index<0||index>=cards.length)return;if(flipTimer)clearTimeout(flipTimer);flipTimer=null;const cls=index>current?'exit-left':'exit-right';shell.classList.add(cls);setTimeout(()=>{current=index;shell.classList.remove('exit-left','exit-right');render();},220)}
prevBtn.addEventListener('click',()=>goTo(current-1));
nextBtn.addEventListener('click',()=>goTo(current+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&current<cards.length-1)goTo(current+1);if(e.key==='ArrowLeft'&&current>0)goTo(current-1)});
measureUniformHeight();
render();
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{measureUniformHeight();render();},100);
});
</script>
</body>
</html>
