<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Экзамен · налогообложение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .exam-wrapper {
            max-width: 1200px;
            width: 100%;
        }

        .register-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 2rem;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        .register-card input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 40px;
            font-size: 1rem;
            margin: 1rem 0;
        }

        .exam-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .question-card {
            flex: 2;
            min-width: 280px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 1.8rem;
            border: 1px solid #dee6f0;
        }

        .sidebar {
            flex: 1;
            min-width: 200px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 1.5rem;
            border: 1px solid #dee6f0;
            height: fit-content;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2ecfe;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .question-number {
            font-weight: 600;
            font-size: 1.2rem;
            color: #1a344c;
        }

        .timer {
            background: #f0f5fc;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #1e3b5c;
            border: 1px solid #c7daf5;
        }

        .question-text {
            font-size: 1rem;
            line-height: 1.5;
            color: #0a2942;
            margin-bottom: 1.5rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid #eef2f7;
        }

        .option-text {
            font-size: 0.95rem;
            color: #1e3b5c;
            line-height: 1.4;
        }

        .option-checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #1e6bb8;
            flex-shrink: 0;
            margin-left: 1rem;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .btn {
            background: white;
            border: 2px solid #1e3b5c;
            border-radius: 40px;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3b5c;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 2px 0 #b0c4dd;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b0c4dd;
        }

        .btn-primary {
            background: #1e3b5c;
            color: white;
            border-color: #0e2b44;
        }

        .sidebar-title {
            font-weight: 600;
            font-size: 1rem;
            color: #1a344c;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2ecfe;
        }

        .questions-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .q-num {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e9f0fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
        }

        .q-num.answered {
            background: #2b8c4a;
            color: white;
        }

        .q-num.current {
            background: #1e3b5c;
            color: white;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #1e6bb8;
        }

        .info-text {
            font-size: 0.8rem;
            color: #5e7290;
            margin-top: 0.5rem;
        }

        .progress-badge {
            font-size: 0.8rem;
            color: #2b8c4a;
            margin-top: 0.5rem;
        }

        .tab-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tab-btn {
            background: #f0f5fc;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2a4d70;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #1e3b5c;
            color: white;
        }

        .case-card {
            background: #f9fcff;
            border-radius: 24px;
            padding: 1.2rem;
            border: 2px solid #e1eaf5;
            margin-bottom: 1rem;
        }

        .case-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.8rem;
        }
        .case-table td, .case-table th {
            border: 1px solid #c7daf5;
            padding: 0.4rem;
            vertical-align: top;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {
            .exam-container {
                flex-direction: column;
            }
            .question-card, .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="exam-wrapper" id="app"></div>

<script>
    // --------------------------------------------------------------
    // ДАННЫЕ ЭКЗАМЕНА (25 вопросов части А + 4 кейса)

    const QUESTIONS = [
        { text: "Иван отвечает за электронный документооборот. Он забыл отправить декларацию по налогу на прибыль в последний день срока. Сдал ее только на следующий день. Налог не уплатил. На ЕНС — положительное сальдо. Оно превышает сумму налога к уплате. Выберите верные последствия ситуации.",
          options: [
            "За просрочку декларации организация заплатит штраф в размере 5% от суммы налога по декларации. Сумма не может превышать 30% налога и быть менее 1000 руб.",

        { text: "Выберите верные утверждения в отношении личного кабинета налогоплательщика и ЕНП:",

        { text: "В ООО “Стройка” идет выездная налоговая проверка... Выберите неверные утверждения касательно этого совета.",
          options: [
            "Если не представить документы, компания получит штраф.",
            "Если представить документы на стадии обжалования решения, это усилит позицию компании.",
            "НК дает ограниченный срок для того, чтобы представить документы.",
            "Если компания откажется представить документы в срок, налоговики проведут выемку документов."
          ], correct: [1], explanation: "Верно — 2. Совет юриста нарушает нормы НК. Кроме того, если компания последует этому совету, она нарушит принципы добросовестного и этичного поведения налогоплательщика. Это привлечет дополнительное внимание налоговиков. Такое поведение ослабит позицию компании: придется объяснять, почему не подали документы по требованию. А при обжаловании решения в налоговой или в суде эти документы, скорее всего, не примут — ни суд, ни вышестоящие налоговики не будут проводить повторные проверки.", type: "multiple" },
        { text: "Срок уплаты налога на прибыль за налоговый период – 28 марта выпадает на субботу. ООО “Альфа” уплатила 12 апреля налог в сумме 1 млн руб. Укажите срок уплаты налога и сумму пени за несвоевременную уплату. Примите ставку рефинансирования равной 15%. На ЕНС отсутствует положительное сальдо.",
          options: ["30 марта и 6 500 руб.", "30 марта и 5 342 руб.", "27 марта и 8 000 руб.", "27 марта и 6 575 руб."], correct: [0], explanation: "Верно — 1. Если крайний срок выпадает на выходной или праздник, он сдвигается на следующий рабочий день. В данном случае — 30 марта. Поскольку на ЕНС нет положительного сальдо, неуплаченный вовремя налог считается недоимкой. За каждый день просрочки начисляйте пеню — это процент от недоимки (п. 4 ст. 75 НК). Первые 30 дней просрочки ставка пени = 1/300 ключевой ставки ЦБ. Расчеты = 1 000 000 × 15% / 300 × 13 = 6 500 руб.", type: "single" }
    ];

            correct: [0,1],
            explanation: `Пояснение к вопросу ${i+1}.`,
            type: "multiple"
        });
    }

Компания оплатила курсы повышения квалификации по ведению учета по МСФО на сумму 50 000 рублей.

Согласно политике компании по поощрению персонала Мария получила на день рождение подарок рыночной стоимостью 70 000 руб. 
В составе делегации компании Мария ездила в командировку с 14 по 17 марта. Командировочные расходы составили: проживание в гостинице — 30 000 руб. билеты на поезд — 15 000 руб., суточные по локальному акту компании — 3 000 руб. в сутки.

Задание: Рассчитайте страховые взносы к уплате компанией с доходов Марии.`,
          tableType: "single",

          description: `Светлана работает дизайнером в ООО “Креативное”. Компания применяет ОСН.
Светлана использует все возможные вычеты, имея все необходимые документы. Заработная плата Светланы составляет 250 000 руб. в месяц.

        { id:3, title: "Кейс 3. НДС", 
          description: `ООО «Большой Рантье» (БР) и его подрядчики являются плательщиками НДС. БР владеет старым ангаром на земельном участке, который был разделен на две части.

заработная плата работников — 2 млн рублей (не превысила 100 000 руб. в месяц на человека);
затраты на материалы — 12 млн рублей;
для монтажа коммуникаций БР привлекло подрядчика, стоимость работ — 800 000 руб. Однако ввиду недоделок эти работы не были приняты, акт сдачи-приемки не подписан, счет-фактура не получен по состоянию на конец второго квартала 2026 года.`,
          tableType: "choice",
          fields: [
            { label: "НДС к уплате/возмещению за 1 квартал (выберите вариант)", type: "choice", options: [
                "1 223 200 руб. к уплате",
                "8 800 руб. к возмещению",
                "88 000 руб. к возмещению",
                "1 188 000 руб. к уплате"
            ], correctOpt: 1, points: 7 },
            { label: "НДС к начислению и вычету за 2 квартал (выберите вариант)", type: "choice", options: [
                "3 080 000 руб. и 3 080 000 руб.",
                "2 800 000 руб. и 0 руб.",
                "2 800 000 руб. и 2 800 000 руб.",
                "3 080 000 руб. и 2 640 000 руб."
            ], correctOpt: 0, points: 6 }
          ] },
        { id:4, title: "Кейс 4. Налог на прибыль", 
          description: `ООО "Логика М"(ЛогикаМ) торгует металлическими изделиями и оборудованием.
Учетная политика предусматривает применение амортизационной премии и амортизацию ОС нелинейным методом, одинаковые сроки полезного использования как для налогового, так и для бухгалтерского учета. Все суммы приведены с учетом НДС (где применимо). Все операции имели место в 2026 году.
1. К концу 2026 года ЛогикаМ имело задолженность перед покупателями по полученным авансам на 35 млн. рублей. В течение 2026 года было отгружено товаров на 364 млн. рублей покупателям, из которых на товары стоимостью 70 млн. руб покупателям право собственности было передано в 2026 году.
2. Зарубежным покупателям было отгружено товаров на 28 млн. руб., которые были сразу оплачены в 2026 году и подтверждены соответствующими документами.
3. На начало года на складе хранились 2000 единиц металлических изделий по 12 000 рублей за единицу. В начале года была закуплена партия из 10 000 единиц по 13 000 рублей за единицу. Затем была продана партия из 9 000 единиц.
4. На начало года остатки затрат на транспортировку товаров до склада Логики М составили 600 тыс. рублей без НДС. В течение года затраты на транспортировку составили 15 млн. руб. без НДС.
5. Для своих торговых представителей ЛогикиМ приобрела 20 легковых автомобилей в ноябре 2025 года за 3 600 000 рублей каждый. В декабре 2025 года ввела их все в эксплуатацию со сроком полезного использования 15 лет. Мощность автомобиля - 165 л.с.
6. Персонал Логики М состоит из 25 торговых представителей с заработной платой 200 тыс. руб/мес. и генерального директора с заработной платой 450 тыс. рублей.
7. Логика М 01.10.2025 приобрела земельный участок за 38 000 000 рублей. Кадастровая стоимость которого - 18 000 000 рублей.
Задание: Рассчитайте налоговую базу по налогу на прибыль ООО "ЛогикаМ" за 2026 год.`,
          tableType: "single",
          fields: [
            { label: "Выручка в РФ (руб.)", correct: 245000000, points: 1 },
            { label: "Экспорт (руб.)", correct: 28000000, points: 1 },
            { label: "Себестоимость продажи 1 партии (руб.)", correct: 96250000, points: 1 },
            { label: "Расходы на транспортировку (руб.)", correct: 11700000, points: 1 },
            { label: "Амортизационная премия (руб.)", correct: 42000000, points: 1 },
            { label: "Амортизация автомобилей (руб.)", correct: 2716009, points: 1 },
            { label: "Заработная плата персонала (руб.)", correct: 65400000, points: 1 },
            { label: "Страховые взносы (руб.)", correct: 19226491, points: 1 },
            { label: "Земельный налог (руб.)", correct: 67500, points: 1 },
            { label: "Транспортный налог (руб.)", correct: 6500, points: 1 },
            { label: "Налоговая база по налогу на прибыль за 2026 год (руб.)", correct: 35623500, points: 10 }
          ] }
    ];

    let state = {
        name: "",
        registered: false,
        secondsLeft: 3 * 3600,
        timerInterval: null,
        activeTab: "A",
        currentQuestionIdx: 0,
        currentCaseIdx: 0,
        answersA: new Array(25).fill(null),
        answersB: [],
        examFinished: false
    };
    for (let i = 0; i < CASES.length; i++) {
        let fieldsCount = CASES[i].fields.length;
        state.answersB.push(new Array(fieldsCount).fill(null));
    }
    for (let i = 0; i < 25; i++) state.answersA[i] = [];

    function saveState() { localStorage.setItem("examState", JSON.stringify(state)); }
    function loadState() {
        let saved = localStorage.getItem("examState");
        if (saved) {
            try {
                let s = JSON.parse(saved);
                if (s.registered) {
                    state.name = s.name;
                    state.registered = s.registered;
                    state.secondsLeft = s.secondsLeft;
                    state.activeTab = s.activeTab;
                    state.currentQuestionIdx = s.currentQuestionIdx;
                    state.currentCaseIdx = s.currentCaseIdx;
                    state.answersA = s.answersA;
                    state.answersB = s.answersB;
                    state.examFinished = s.examFinished;
                    if (!state.examFinished && state.secondsLeft > 0) startTimer();
                }
            } catch(e) {}
        }
    }

    function startTimer() {
        if (state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
            if (state.secondsLeft <= 0) {
                clearInterval(state.timerInterval);
                finishExam();
            } else {
                state.secondsLeft--;
                saveState();
                updateTimerDisplay();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        let h = Math.floor(state.secondsLeft / 3600);
        let m = Math.floor((state.secondsLeft % 3600) / 60);
        let s = state.secondsLeft % 60;
        let timers = document.querySelectorAll(".timer");
        timers.forEach(t => t.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`);
    }

    function finishExam() {
        if (state.examFinished) return;
        state.examFinished = true;
        if (state.timerInterval) clearInterval(state.timerInterval);
        saveState();
        renderResults();
    }

    function renderRegistration() {
        return `
            <div class="register-card">
                <h2>Регистрация</h2>
                <input type="text" id="userName" placeholder="Фамилия Имя">
                <div class="timer" style="margin:1rem 0">03:00:00</div>
                <button class="btn btn-primary" id="startExamBtn">Начать экзамен</button>
            </div>
        `;
    }

    function renderResults() {
        let totalA = 0;
        for (let i = 0; i < QUESTIONS.length; i++) {
            let user = state.answersA[i];
            if (!user || user.length === 0) continue;
            let correct = QUESTIONS[i].correct;
            if (user.length === correct.length && user.every(v => correct.includes(v))) totalA += 2;
        }
        let totalB = 0;
        for (let c = 0; c < CASES.length; c++) {
            for (let f = 0; f < CASES[c].fields.length; f++) {
                let userVal = state.answersB[c][f];
                if (userVal === null) continue;
                let field = CASES[c].fields[f];
                let correctVal = field.correctOpt !== undefined ? field.correctOpt : field.correct;
                if (field.type === "choice") {
                    if (userVal === correctVal) totalB += field.points;
                } else {
                    if (Math.abs(parseFloat(userVal) - correctVal) < 0.5) totalB += field.points;
                }
            }
        }
        let total = totalA + totalB;
        let passed = total >= 50;
        
        let comments = `Фамилия Имя: ${state.name}\nБаллы: ${total} (часть А: ${totalA}, часть Б: ${totalB})\nРезультат: ${passed ? "Экзамен сдан" : "Экзамен не сдан"}\n\n`;
        comments += "=== ПОЯСНЕНИЯ К ПРАВИЛЬНЫМ ОТВЕТАМ ===\n\n";
        for (let i = 0; i < QUESTIONS.length; i++) {
            comments += `Вопрос ${i+1}: ${QUESTIONS[i].explanation}\n`;
            let user = state.answersA[i];
            if (user) {
                let userText = user.map(idx => QUESTIONS[i].options[idx]).join(", ");
                comments += `  Ваш ответ: ${userText}\n`;
            } else {
                comments += `  Ваш ответ: не дан\n`;
            }
            comments += "\n";
        }
        comments += "\nЧАСТЬ Б (кейсы)\n";
        for (let c = 0; c < CASES.length; c++) {
            comments += `\n${CASES[c].title}\n`;
            for (let f = 0; f < CASES[c].fields.length; f++) {
                let userVal = state.answersB[c][f];
                let field = CASES[c].fields[f];
                let correctVal = field.correctOpt !== undefined ? field.options[field.correctOpt] : field.correct;
                comments += `  ${field.label}: правильный ответ = ${correctVal}, ваш ответ = ${userVal !== null ? (field.type === "choice" ? field.options[userVal] : userVal) : "не заполнено"}\n`;
            }
        }
        
        const blob = new Blob([comments], {type: "text/plain"});
        const url = URL.createObjectURL(blob);
        return `
            <div class="register-card">
                <h2>Результаты экзамена</h2>
                <p>${state.name}, вы набрали ${total} баллов (из 100)</p>
                <p>${passed ? "✅ Экзамен сдан" : "❌ Экзамен не сдан"}</p>
                <a href="${url}" download="comments.txt" class="btn">Скачать комментарии к ответам</a>
                <button class="btn" id="restartBtn">Пройти заново</button>
            </div>
        `;
    }

    function renderExam() {
        let progressA = state.answersA.filter(a => a && a.length > 0).length;
        let totalB = CASES.reduce((s,c) => s + c.fields.length, 0);
        let progressB = state.answersB.flat().filter(a => a !== null).length;
        return `
            <div class="exam-container">
                <div class="question-card">
                    <div class="question-header">
                        <span class="question-number" id="questionNumber">Вопрос 1</span>
                        <div class="timer">${formatTime(state.secondsLeft)}</div>
                    </div>
                    <div class="tab-buttons">
                        <button class="tab-btn ${state.activeTab === 'A' ? 'active' : ''}" data-tab="A">Часть А (${progressA}/25)</button>
                        <button class="tab-btn ${state.activeTab === 'B' ? 'active' : ''}" data-tab="B">Часть Б (${progressB}/${totalB})</button>
                    </div>
                    <div id="tabContent"></div>
                    <div class="nav-buttons">
                        <button class="btn" id="prevBtn">← Назад</button>
                        <button class="btn btn-primary" id="nextBtn">Далее →</button>
                    </div>
                    <button class="btn" id="finishExamBtn" style="margin-top:1rem; width:100%;">Завершить экзамен</button>
                </div>
                <div class="sidebar">
                    <div class="sidebar-title">Все вопросы</div>
                    <div class="questions-grid" id="questionsGrid"></div>
                    <div class="sidebar-title">Справочные материалы</div>
                    <div class="info-text">Налоговый кодекс РФ</div>
                    <div class="progress-badge" id="progressBadge">Решено: ${progressA} / 25</div>
                </div>
            </div>
        `;
    }

    function formatTime(sec) {
        let h = Math.floor(sec / 3600);
        let m = Math.floor((sec % 3600) / 60);
        let s = sec % 60;
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function renderPartA() {
        const q = QUESTIONS[state.currentQuestionIdx];
        const saved = state.answersA[state.currentQuestionIdx] || [];
        let optsHtml = q.options.map((opt, idx) => `
            <div class="option-item">
                <span class="option-text">${opt}</span>
                <input type="checkbox" class="option-checkbox" data-opt-index="${idx}" ${saved.includes(idx) ? 'checked' : ''}>
            </div>
        `).join('');
        return `<div class="question-text">${q.text}</div><div class="options-list" id="optionsList">${optsHtml}</div>`;
    }

    function renderPartB() {
        const caseData = CASES[state.currentCaseIdx];
        let fieldsHtml = '<table class="case-table">';
        
        if (caseData.tableType === "choice") {
            fieldsHtml += '<tr><th>Показатель</th><th>Выберите вариант</th></tr>';
            for (let i = 0; i < caseData.fields.length; i++) {
                let saved = state.answersB[state.currentCaseIdx][i];
                let optsHtml = '';
                caseData.fields[i].options.forEach((opt, idx) => {
                    let checked = (saved === idx) ? 'checked' : '';
                    optsHtml += `<label style="display:block; margin:0.2rem 0;"><input type="radio" name="field_${i}" value="${idx}" ${checked}> ${opt}</label>`;
                });
                fieldsHtml += `
                    <tr>
                        <td>${caseData.fields[i].label}</td>
                        <td>${optsHtml}</td>
                    </tr>
                `;
            }
        } else {
            fieldsHtml += '<tr><th>Показатель</th><th>Сумма (руб.)</th></tr>';
            for (let i = 0; i < caseData.fields.length; i++) {
                let saved = state.answersB[state.currentCaseIdx][i];
                fieldsHtml += `
                    <tr>
                        <td>${caseData.fields[i].label}</td>
                        <td><input type="number" class="case-field" data-field-idx="${i}" value="${saved !== null ? saved : ''}" style="width:100%; padding:0.3rem; border-radius:20px; border:1px solid #cbd5e1;"></td>
                    </tr>
                `;
            }
        }
        fieldsHtml += '</table>';
        let casesNav = CASES.map((c, idx) => `<div class="q-num ${state.answersB[idx].some(a=>a!==null) ? 'answered':''} ${idx===state.currentCaseIdx ? 'current':''}" data-caseidx="${idx}">${idx+1}</div>`).join('');
        return `
            <div><strong>Кейсы:</strong> <div class="questions-grid" style="margin-top:0.5rem">${casesNav}</div></div>
            <div class="case-card">
                <h3>${caseData.title}</h3>
                <div style="white-space:pre-line; font-size:0.85rem; margin-bottom:0.8rem; background:#f0f7fe; padding:0.8rem; border-radius:16px;">${caseData.description}</div>
                ${fieldsHtml}
                <button class="btn" id="saveCaseAnswersBtn" style="margin-top:0.8rem">Сохранить все ответы кейса</button>
            </div>
        `;
    }

    function attachEvents() {
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                state.activeTab = btn.dataset.tab;
                saveState();
                renderMain();
            });
        });
        document.querySelectorAll(".q-num[data-idx]").forEach(el => {
            el.addEventListener("click", () => {
                state.currentQuestionIdx = parseInt(el.dataset.idx);
                saveState();
                renderMain();
            });
        });
        document.querySelectorAll(".q-num[data-caseidx]").forEach(el => {
            el.addEventListener("click", () => {
                state.currentCaseIdx = parseInt(el.dataset.caseidx);
                saveState();
                renderMain();
            });
        });
        document.querySelectorAll('.option-checkbox').forEach(cb => {
            cb.addEventListener('change', (e) => {
                let optIdx = parseInt(e.target.dataset.optIndex);
                let current = state.answersA[state.currentQuestionIdx] || [];
                if (e.target.checked) {
                    if (!current.includes(optIdx)) current.push(optIdx);
                } else {
                    current = current.filter(i => i !== optIdx);
                }
                state.answersA[state.currentQuestionIdx] = current;
                saveState();
                renderMain();
            });
        });
        let prevBtn = document.getElementById("prevBtn");
        let nextBtn = document.getElementById("nextBtn");
        if (prevBtn) prevBtn.addEventListener("click", () => {
            if (state.activeTab === "A") {
                if (state.currentQuestionIdx > 0) state.currentQuestionIdx--;
                else alert("Это первый вопрос");
            } else {
                if (state.currentCaseIdx > 0) state.currentCaseIdx--;
                else alert("Это первый кейс");
            }
            saveState();
            renderMain();
        });
        if (nextBtn) {
            nextBtn.addEventListener("click", () => {
                if (state.activeTab === "A") {
                    if (state.currentQuestionIdx + 1 < 25) state.currentQuestionIdx++;
                    else {
                        state.activeTab = "B";
                        state.currentCaseIdx = 0;
                    }
                } else {
                    if (state.currentCaseIdx + 1 < CASES.length) state.currentCaseIdx++;
                }
                saveState();
                renderMain();
            });
        }
        let saveCase = document.getElementById("saveCaseAnswersBtn");
        if (saveCase) {
            saveCase.addEventListener("click", () => {
                let caseData = CASES[state.currentCaseIdx];
                if (caseData.tableType === "choice") {
                    for (let i = 0; i < caseData.fields.length; i++) {
                        let selected = document.querySelector(`input[name="field_${i}"]:checked`);
                        if (selected) {
                            state.answersB[state.currentCaseIdx][i] = parseInt(selected.value);
                        }
                    }
                } else {
                    let inputs = document.querySelectorAll(".case-field");
                    for (let inp of inputs) {
                        let idx = parseInt(inp.dataset.fieldIdx);
                        let val = parseFloat(inp.value);
                        if (!isNaN(val)) {
                            state.answersB[state.currentCaseIdx][idx] = val;
                        }
                    }
                }
                saveState();
                renderMain();
            });
        }
        let finish = document.getElementById("finishExamBtn");
        if (finish) finish.addEventListener("click", () => {
            finishExam();
        });
    }

    function renderMain() {
        const app = document.getElementById("app");
        if (!state.registered) {
            app.innerHTML = renderRegistration();
            document.getElementById("startExamBtn").addEventListener("click", () => {
                let nameInput = document.getElementById("userName");
                if (nameInput.value.trim()) {
                    state.name = nameInput.value.trim();
                    state.registered = true;
                    startTimer();
                    saveState();
                    renderMain();
                } else alert("Введите Фамилию и Имя");
            });
            updateTimerDisplay();
        } else if (state.examFinished) {
            app.innerHTML = renderResults();
            document.getElementById("restartBtn")?.addEventListener("click", () => { localStorage.clear(); location.reload(); });
        } else {
            app.innerHTML = renderExam();
            updateTimerDisplay();
            let tabContent = document.getElementById("tabContent");
            if (state.activeTab === "A") {
                tabContent.innerHTML = renderPartA();
                let gridHtml = '';
                for (let i = 0; i < 25; i++) {
                    let answered = state.answersA[i] && state.answersA[i].length > 0;
                    gridHtml += `<div class="q-num ${answered ? 'answered' : ''} ${i === state.currentQuestionIdx ? 'current' : ''}" data-idx="${i}">${i+1}</div>`;
                }
                document.getElementById("questionsGrid").innerHTML = gridHtml;
                document.getElementById("progressBadge").textContent = `Решено: ${state.answersA.filter(a => a && a.length > 0).length} / 25`;
            } else {
                tabContent.innerHTML = renderPartB();
                let gridHtml = '';
                for (let i = 0; i < CASES.length; i++) {
                    let answered = state.answersB[i].some(a => a !== null);
                    gridHtml += `<div class="q-num ${answered ? 'answered' : ''} ${i === state.currentCaseIdx ? 'current' : ''}" data-caseidx="${i}">${i+1}</div>`;
                }
                document.getElementById("questionsGrid").innerHTML = gridHtml;
                let totalB = CASES.reduce((s,c) => s + c.fields.length, 0);
                let progressB = state.answersB.flat().filter(a => a !== null).length;
                document.getElementById("progressBadge").textContent = `Решено: ${progressB} / ${totalB}`;
            }
            attachEvents();
        }
    }

    loadState();
    renderMain();
</script>
</body>
</html>
