<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>НДФЛ: дарение недвижимости</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #d9dfe6;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .trainer {
            max-width: 600px;
            width: 100%;
            background: #f0f3f7;
            border-radius: 28px;
            padding: 0.9rem;
            border: 1px solid #cbd5e1;
        }

        .title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1f3a4b;
            margin-bottom: 0.1rem;
        }

        .sub {
            font-size: 0.65rem;
            color: #4a627a;
            margin-bottom: 0.7rem;
            border-left: 3px solid #7f8c9a;
            padding-left: 0.6rem;
        }

        .carousel-container {
            background: white;
            border-radius: 24px;
            padding: 0.8rem;
        }

        .carousel {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cards-wrapper {
            flex: 1;
            overflow: hidden;
            border-radius: 18px;
        }

        .cards-track {
            display: flex;
            transition: transform 0.25s ease;
        }

        .scenario-card {
            flex: 0 0 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 0.8rem;
            border: 1px solid #e2e8f0;
        }

        .fact-block {
            background: #f5f7fa;
            border-radius: 16px;
            padding: 0.5rem 0.7rem;
            margin-bottom: 0.8rem;
        }

        .fact-item {
            display: flex;
            gap: 6px;
            margin: 4px 0;
            font-size: 0.8rem;
            color: #1e2f3d;
            line-height: 1.3;
        }

        .fact-marker {
            min-width: 18px;
            color: #5b6e82;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 8px 0 4px;
        }

        .option {
            background: #f8fafc;
            border-radius: 50px;
            padding: 6px 12px;
            border: 1.5px solid #cdd9ed;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.8rem;
            color: #1e3a4d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option:hover:not(.disabled) {
            background: #eef3fc;
            border-color: #9bb1c7;
        }

        .option.selected-correct {
            background: #d9ede0;
            border-color: #2f7355;
            color: #1b4a38;
        }

        .option.selected-incorrect {
            background: #f3dfdb;
            border-color: #b3432e;
            color: #6a2415;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.8;
        }

        .option-letter {
            background: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7rem;
            color: #2c577a;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin: 8px 0 2px;
        }

        .btn {
            background: white;
            border: 1px solid #bdcad9;
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            color: #2c577a;
            flex: 1;
            text-align: center;
        }

        .btn-primary {
            background: #2c577a;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #1f4563;
        }

        .explain-card {
            background: #eef2f8;
            border-radius: 14px;
            padding: 6px 10px;
            margin-top: 8px;
            border-left: 4px solid #5b6e82;
            font-size: 0.75rem;
            color: #1f3a4b;
            line-height: 1.3;
        }

        .arrow-btn {
            background: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            border: 1px solid #cbdae9;
            cursor: pointer;
            color: #2c577a;
            flex-shrink: 0;
        }

        .counter {
            text-align: center;
            margin-top: 6px;
            font-size: 0.7rem;
            color: #4a627a;
            font-weight: 500;
        }

        .footer-note {
            font-size: 0.6rem;
            text-align: center;
            color: #6b7f95;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="trainer">
    <div class="title">Дарение недвижимости</div>
    <div class="sub">тренажер</div>

    <div class="carousel-container">
        <div class="carousel">
            <button class="arrow-btn" id="prevBtn">←</button>
            <div class="cards-wrapper" id="cardsWrapper">
                <div class="cards-track" id="cardsTrack"></div>
            </div>
            <button class="arrow-btn" id="nextBtn">→</button>
        </div>
        <div class="counter" id="counter">1 / 5</div>
        <div class="explain-card" id="explanationBox" style="display: none;"></div>
        <div class="btn-row">
            <button class="btn btn-primary" id="submitBtn">Проверить</button>
            <button class="btn btn-outline" id="resetBtn">Сбросить</button>
        </div>
        <div class="footer-note">ст. 217 НК, ст. 214.10 НК</div>
    </div>
</div>

<script>
    const scenarios = [
        {
            facts: [
                'Даритель: родной брат отца',
                'Одаряемый — не иноагент',
                'Кадастровая стоимость = 4 200 000 руб.'
            ],
            options: [
                'НДФЛ = 0 (близкий родственник)',
                'НДФЛ 13% = 546 000 руб.',
                'НДФЛ = 0 (член семьи)'
            ],
            correct: 1,
            explanation: 'Родной брат отца (дядя) не входит в перечень близких родственников. НДФЛ 13% с кадастровой стоимости.'
        },
        {
            facts: [
                'Даритель: родная сестра',
                'Недвижимость передана в 2023',
                'Кадастровая стоимость = 3 100 000 руб.'
            ],
            options: [
                'Налог = 0 (сестра — близкий родственник)',
                'Налог = 403 000 руб.',
                'Освобождение только при сроке владения'
            ],
            correct: 0,
            explanation: 'Родная сестра — близкий родственник (ст. 14 СК). Дарение не облагается НДФЛ.'
        },
        {
            facts: [
                'Дар от двоюродного брата',
                'Кадастр = 5 000 000 руб.',
                'Одаряемый — гражданин РФ'
            ],
            options: [
                'Налог = 0 руб.',
                'НДФЛ = 650 000 руб.',
                'Налог только при продаже'
            ],
            correct: 1,
            explanation: 'Двоюродный брат не является близким родственником. Налог 13% = 650 000 руб.'
        },
        {
            facts: [
                'Квартира подарена бабушкой внуку в 2022',
                'Кадастр = 2 800 000 руб.',
                'Внук продал квартиру в 2026'
            ],
            options: [
                'Налог при дарении = 0 (бабушка — близкий родственник)',
                'Налог с дарения = 364 000 руб.',
                'Освобождение только через 5 лет'
            ],
            correct: 0,
            explanation: 'Бабушка — близкий родственник (ст. 14 СК). При дарении налог не возникает.'
        },
        {
            facts: [
                'Подарок от работодателя',
                'Кадастр = 6 500 000 руб.',
                'Сотрудник не иноагент'
            ],
            options: [
                'НДФЛ 13% = 845 000 руб.',
                'Освобождение (дарение от юрлица)',
                'Налог только если даритель — иноагент'
            ],
            correct: 0,
            explanation: 'Дарение от юридического лица облагается НДФЛ по ставке 13% с кадастровой стоимости.'
        }
    ];

    let currentIndex = 0;
    let selectedOption = null;
    let submitted = false;

    const track = document.getElementById('cardsTrack');
    const counterEl = document.getElementById('counter');
    const explanationBox = document.getElementById('explanationBox');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderAllCards() {
        let htmlStr = '';
        scenarios.forEach((s, idx) => {
            const isActive = (idx === currentIndex);
            let optsHtml = '';
            const letters = ['А', 'Б', 'В'];
            s.options.forEach((opt, optIdx) => {
                let addClass = 'option';
                if (!isActive) addClass += ' disabled';
                if (isActive && submitted) {
                    if (optIdx === s.correct) addClass += ' selected-correct';
                    else if (optIdx === selectedOption && optIdx !== s.correct) addClass += ' selected-incorrect';
                } else if (isActive && !submitted && optIdx === selectedOption) {
                    addClass += ' selected-correct';
                }
                optsHtml += `
                    <div class="${addClass}" data-opt-index="${optIdx}">
                        <span class="option-letter">${letters[optIdx]}</span>
                        <span>${escapeHtml(opt)}</span>
                    </div>
                `;
            });

            htmlStr += `
                <div class="scenario-card">
                    <div class="fact-block">
                        ${s.facts.map(f => `<div class="fact-item"><span class="fact-marker">•</span><span>${escapeHtml(f)}</span></div>`).join('')}
                    </div>
                    <div class="options">
                        ${optsHtml}
                    </div>
                </div>
            `;
        });
        track.innerHTML = htmlStr;
        updateTrackPosition();
        attachOptionListeners();
        updateCounter();
        if (!submitted) explanationBox.style.display = 'none';
    }

    function updateTrackPosition() {
        const firstCard = track.firstElementChild;
        if (firstCard && firstCard.offsetWidth) {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
        } else {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
    }

    function updateCounter() {
        counterEl.innerText = `${currentIndex+1} / ${scenarios.length}`;
    }

    function attachOptionListeners() {
        const activeCard = track.children[currentIndex];
        if (!activeCard) return;
        const opts = activeCard.querySelectorAll('.option');
        opts.forEach(opt => {
            opt.removeEventListener('click', optionClickHandler);
            if (!submitted) {
                opt.addEventListener('click', optionClickHandler);
            }
        });
    }

    function optionClickHandler(e) {
        if (submitted) return;
        const target = e.currentTarget;
        const optIdx = parseInt(target.dataset.optIndex);
        const parentCard = target.closest('.scenario-card');
        if (!parentCard) return;
        parentCard.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected-correct'));
        target.classList.add('selected-correct');
        selectedOption = optIdx;
    }

    function handleSubmit() {
        if (submitted) return;
        if (selectedOption === null) {
            alert('Выберите вариант');
            return;
        }
        submitted = true;
        renderAllCards();
        const s = scenarios[currentIndex];
        const isCorrect = (selectedOption === s.correct);
        explanationBox.style.display = 'block';
        explanationBox.style.borderLeftColor = isCorrect ? '#2f7355' : '#b3432e';
        explanationBox.innerHTML = `<strong>${isCorrect ? 'Верно' : 'Ошибка'}</strong><br>${s.explanation}`;
    }

    function resetCard() {
        selectedOption = null;
        submitted = false;
        explanationBox.style.display = 'none';
        renderAllCards();
    }

    function goToIndex(newIndex) {
        if (newIndex < 0) newIndex = scenarios.length - 1;
        if (newIndex >= scenarios.length) newIndex = 0;
        currentIndex = newIndex;
        selectedOption = null;
        submitted = false;
        explanationBox.style.display = 'none';
        renderAllCards();
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    submitBtn.addEventListener('click', handleSubmit);
    resetBtn.addEventListener('click', resetCard);
    prevBtn.addEventListener('click', () => goToIndex(currentIndex - 1));
    nextBtn.addEventListener('click', () => goToIndex(currentIndex + 1));
    window.addEventListener('resize', () => updateTrackPosition());
    renderAllCards();
</script>
</body>
</html>
