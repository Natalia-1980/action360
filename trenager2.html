<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Что могут запросить на камералке | Тренажер</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: 'Inter', sans-serif;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quiz-container {
            max-width: 360px;
            width: 100%;
            background: white;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin: 0 auto;
        }

        .quiz-header {
            background: #0f2c38;
            padding: 0.7rem 1rem;
            color: white;
        }

        .quiz-header h1 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.15rem;
            letter-spacing: -0.2px;
        }

        .quiz-header p {
            font-size: 0.65rem;
            opacity: 0.85;
        }

        .progress {
            height: 3px;
            background: #e2edf2;
            margin: 0;
        }

        .progress-fill {
            height: 100%;
            background: #e67e22;
            width: 0%;
            transition: width 0.25s ease;
        }

        .quiz-content {
            padding: 0.8rem;
        }

        .case-card {
            background: #ffffff;
        }

        .case-text {
            background: #fef8e8;
            padding: 0.7rem;
            border-radius: 0.8rem;
            margin-bottom: 0.9rem;
            font-size: 0.7rem;
            line-height: 1.4;
            border-left: 3px solid #e67e22;
            color: #2c3e2f;
            word-break: break-word;
            hyphens: auto;
        }

        .fill-blank-section {
            background: #f8fafc;
            border-radius: 0.9rem;
            padding: 0.7rem;
            margin-bottom: 0.7rem;
            border: 1px solid #e2edf2;
        }

        .fill-question {
            font-weight: 600;
            font-size: 0.7rem;
            color: #1f4e6e;
            margin-bottom: 0.6rem;
            background: #f1f6fa;
            padding: 0.4rem 0.7rem;
            border-radius: 0.7rem;
            word-break: break-word;
        }

        .sentence {
            background: white;
            padding: 0.7rem;
            border-radius: 0.8rem;
            line-height: 1.5;
            font-size: 0.75rem;
            border: 1px solid #e0eaf0;
            margin-bottom: 0.5rem;
            word-break: break-word;
            hyphens: auto;
        }

        .sentence span {
            white-space: normal;
            word-break: break-word;
        }

        .blank-select {
            width: 100%;
            background: #fff7e5;
            border: 2px solid #e67e22;
            border-radius: 2rem;
            padding: 0.45rem 0.8rem;
            font-weight: 600;
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            color: #b45f1b;
            cursor: pointer;
            margin: 0.3rem 0 0.2rem;
            display: block;
            word-break: normal;
            text-overflow: ellipsis;
        }

        .blank-select:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 0 2px rgba(230,126,34,0.2);
        }

        .selected-doc-block {
            margin: 0.4rem 0 0.2rem;
        }

        .selected-doc-badge {
            display: inline-block;
            background: #f1f3f5;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.7rem;
            word-break: break-word;
        }

        .badge-result {
            display: inline-block;
            background: #eef2f7;
            font-size: 0.6rem;
            padding: 0.15rem 0.5rem;
            border-radius: 1rem;
            font-weight: 600;
            margin-left: 0.4rem;
        }

        .correct-answer-hint {
            margin-top: 0.6rem;
            font-size: 0.65rem;
            background: #fff3e8;
            padding: 0.4rem 0.6rem;
            border-radius: 0.7rem;
            color: #b45f1b;
            word-break: break-word;
        }

        .result-area {
            margin-top: 0.8rem;
            padding: 0.6rem;
            border-radius: 0.8rem;
            font-weight: 500;
            font-size: 0.65rem;
            border-left: 3px solid;
            background: #fef5e8;
            word-break: break-word;
        }

        .result-correct {
            background: #e0f2e9;
            border-left-color: #2b7a4b;
            color: #1a5a3a;
        }

        .result-wrong {
            background: #fee8e6;
            border-left-color: #e67e22;
            color: #ac4e2a;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 0.6rem;
        }

        .btn-action {
            background: #1f566b;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
            transition: 0.15s;
            text-align: center;
        }

        .btn-action:hover {
            background: #0e3b4b;
        }

        .btn-next {
            background: #2b7a4b;
        }

        .btn-next:hover {
            background: #1e5a3a;
        }

        .btn-skip {
            background: #8a9ba8;
        }

        .btn-skip:hover {
            background: #6c7e8c;
        }

        .score {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: #2c5a6e;
            background: #f0f5f9;
            padding: 0.4rem;
            border-radius: 1.5rem;
            word-break: break-word;
        }

        @media (max-width: 400px) {
            .quiz-container {
                max-width: 340px;
            }
            .sentence {
                font-size: 0.7rem;
                padding: 0.6rem;
            }
            .blank-select {
                font-size: 0.65rem;
                padding: 0.4rem 0.6rem;
            }
            .case-text {
                font-size: 0.65rem;
            }
            .btn-action {
                font-size: 0.7rem;
                padding: 0.5rem 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizFillBlank">
    <div class="quiz-header">
        <h1>📋 Что могут запросить на камералке</h1>
        <p>Выберите верный документ в каждом кейсе</p>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFillBlank"></div></div>
    <div class="quiz-content" id="quizBlankContent"></div>
</div>

<script>
    // ========== ТРЕНАЖЕР: ЗАПЯТЫЕ ПЕРЕД ПРОПУСКОМ, КНОПКА "ПРОПУСТИТЬ" ==========
    // Для кейса 3 (индекс 3) исправлено: убрана лишняя запятая после "является"
    
    const fillBlankCases = [
        {
            situation: "ИТ-компания получила требование: выписка из реестра, договоры, счета-фактуры, акты, расшифровка доходов, а также согласие на раскрытие налоговой тайны.",
            beforeBlank: "Налоговая инспекция не вправе требовать от компании, ",
            afterBlank: "так как этот документ относится к добровольному раскрытию, а не к обязательным.",
            options: ["Выписку из реестра", "Согласие на раскрытие налоговой тайны", "Договоры с заказчиками", "Расшифровку доходов"],
            correctIndex: 1,
            explanation: "Согласие на раскрытие налоговой тайны — право, а не обязанность. Инспекция не может его требовать."
        },
        {
            situation: "Резидент ОЭЗ получил требование: бухотчетность, регистры, расшифровки, расчет пропорции 90%, расчет ТВмакс.",
            beforeBlank: "Из перечня документов ключевым для подтверждения лимита выручки является, ",
            afterBlank: "его обязан представить каждый резидент ОЭЗ или ТОР.",
            options: ["Только бухотчетность", "Расчет ТВмакс", "Регистры налогового учета", "Расшифровки по контрагентам"],
            correctIndex: 1,
            explanation: "Расчет ТВмакс (максимальный размер выручки) — специфический документ для резидентов ОЭЗ, ТОР и СПВ."
        },
        {
            situation: "Медицинская клиника (освобождение от НДС). Налоговая запросила: лицензию, договоры, протоколы, медкарты, штатное расписание и сертификаты специалистов.",
            beforeBlank: "При проверке освобождения от НДС клиника не обязана представлять, ",
            afterBlank: "так как эти документы относятся к налогу на прибыль, а не к условиям льготы по НДС.",
            options: ["Лицензию и протоколы", "Медицинские карты", "Штатное расписание и сертификаты специалистов", "Договоры с пациентами"],
            correctIndex: 2,
            explanation: "Штатное расписание и сертификаты важны для налога на прибыль, но для освобождения от НДС их требование необоснованно."
        },
        {
            situation: "Резидент СПВ (территория опережающего развития). Запросили: бухотчетность, платежки, договоры, акты, штатное расписание и приказы о создании рабочих мест.",
            beforeBlank: "Для подтверждения статуса СПВ ключевым документом, который налоговая проверяет в первую очередь, является ",
            afterBlank: ".",
            options: ["Бухотчетность", "Платежные поручения", "Приказы о создании новых рабочих мест", "Договоры с контрагентами"],
            correctIndex: 2,
            explanation: "Для резидентов СПВ важно подтвердить создание новых рабочих мест. Приказы о создании рабочих мест — отличительная черта."
        },
        {
            situation: "Образовательная организация (льгота по НДС). Получила требование: лицензия, договоры, программы, акты, реестры учеников, журналы и расчет ТВмакс.",
            beforeBlank: "Среди документов явно ошибочным, не относящимся к проверке льготы по НДС, является, ",
            afterBlank: "так как он используется только для преференциальных территорий (ОЭЗ, ТОР, СПВ).",
            options: ["Программы обучения", "Журналы занятий", "Расчет ТВмакс", "Реестры обучающихся"],
            correctIndex: 2,
            explanation: "Расчет ТВмакс (порог выручки) не связан с освобождением образовательных услуг от НДС, его запрос неправомерен."
        },
        {
            situation: "Компания совмещает облагаемую и льготную деятельность по НДС, раздельный учет не ведется. Налоговая запросила методику распределения.",
            beforeBlank: "Запрос методики распределения входного НДС при совмещении операций, ",
            afterBlank: "так как налогоплательщик обязан вести раздельный учет и закрепить способ в учетной политике.",
            options: ["неправомерен — методика не обязательна", "правомерен, инспекция вправе проверить обоснованность распределения", "правомерен только при сумме НДС больше 1 млн руб.", "не требуется, если нет раздельного учета"],
            correctIndex: 1,
            explanation: "Налоговая вправе запросить учетную политику и методику распределения НДС. Отсутствие раздельного учета — нарушение."
        },
        {
            situation: "Строительная компания (резидент инвестпроекта). Запросили: регистры доходов, акты КС-2, КС-3, выписку из реестра дисквалифицированных лиц и внутреннюю переписку по email.",
            beforeBlank: "Документом, который инспекция не вправе требовать при камеральной проверке, является, ",
            afterBlank: "так как это выходит за рамки налогового контроля.",
            options: ["регистры учета доходов", "акты КС-2, КС-3", "выписку из реестра дисквалифицированных лиц", "внутреннюю переписку по электронной почте"],
            correctIndex: 3,
            explanation: "Внутренняя переписка сотрудников не относится к первичным или налоговым документам, ее истребование незаконно."
        }
    ];

    let userAnswers = new Array(fillBlankCases.length).fill(null);
    let currentIndex = 0;
    const totalCases = fillBlankCases.length;

    function updateProgress() {
        const answeredCount = userAnswers.filter(a => a !== null).length;
        const percent = (answeredCount / totalCases) * 100;
        const progressFill = document.getElementById("progressFillBlank");
        if (progressFill) progressFill.style.width = `${percent}%`;
    }

    function skipCurrentCase() {
        // Отмечаем как неправильный ответ (null не подходит, чтобы не мешать прогрессу, но пропуск = засчитываем как ошибку?)
        // Логика: пропуск — значит пользователь не выбрал ответ, но кейс считается пройденным без правильного ответа.
        // Чтобы не блокировать прохождение, просто записываем фиктивный неверный ответ (например, -1).
        if (userAnswers[currentIndex] === null) {
            // Отмечаем как неправильный (индекс -1, которого нет в options)
            userAnswers[currentIndex] = -1;
            updateProgress();
            // Переходим к следующему кейсу или завершаем
            if (currentIndex + 1 < totalCases) {
                currentIndex++;
                renderCurrentCase();
            } else {
                const totalCorrect = userAnswers.filter((ans, idx) => ans === fillBlankCases[idx].correctIndex).length;
                let message = `🏁 Тренировка завершена!\n✅ Правильных ответов: ${totalCorrect} из ${totalCases}\n\n`;
                if (totalCorrect === totalCases) {
                    message += "Отлично! Вы отлично разбираетесь в документах при камеральной проверке.";
                } else {
                    message += "Рекомендуем повторить пояснения и пройти тренажер еще раз.";
                }
                alert(message);
            }
        }
    }

    function renderCurrentCase() {
        const container = document.getElementById("quizBlankContent");
        if (!container) return;
        const caseData = fillBlankCases[currentIndex];
        const isAnswered = userAnswers[currentIndex] !== null;
        const selectedIdx = userAnswers[currentIndex];
        const isCorrect = (selectedIdx !== null && selectedIdx === caseData.correctIndex);
        
        const beforeText = caseData.beforeBlank;
        const afterText = caseData.afterBlank;
        
        let selectOrDisplayHtml = "";
        
        if (!isAnswered) {
            selectOrDisplayHtml = `
                <select id="dynamicSelect" class="blank-select">
                    <option value="" disabled selected>— Выберите документ —</option>
                    ${caseData.options.map((opt, idx) => `<option value="${idx}">${opt}</option>`).join('')}
                </select>
            `;
        } else {
            let chosenText = "";
            let statusIcon = "";
            let statusText = "";
            if (selectedIdx === -1) {
                chosenText = "Пропущено";
                statusIcon = "⏭️";
                statusText = "Пропуск";
            } else {
                chosenText = caseData.options[selectedIdx];
                statusIcon = isCorrect ? "✅" : "❌";
                statusText = isCorrect ? "Верно" : "Неверно";
            }
            selectOrDisplayHtml = `
                <div class="selected-doc-block">
                    <span class="selected-doc-badge">${chosenText}</span>
                    <span class="badge-result">${statusIcon} ${statusText}</span>
                </div>
            `;
        }
        
        const sentenceHtml = `
            <span>${beforeText}</span>
            ${selectOrDisplayHtml}
            <span>${afterText}</span>
        `;
        
        let wrongAnswerHint = "";
        if (isAnswered && !isCorrect && selectedIdx !== -1) {
            const correctText = caseData.options[caseData.correctIndex];
            wrongAnswerHint = `
                <div class="correct-answer-hint">
                    <strong>Правильный ответ:</strong> ${correctText}
                </div>
            `;
        }
        
        let resultHtml = "";
        if (isAnswered && selectedIdx !== -1) {
            resultHtml = `
                <div class="result-area ${isCorrect ? 'result-correct' : 'result-wrong'}">
                    <div style="font-weight:700; margin-bottom:4px;">${isCorrect ? '✔️ Верно' : '⚠️ Ошибка'}</div>
                    <div>💡 ${caseData.explanation}</div>
                </div>
            `;
        } else if (isAnswered && selectedIdx === -1) {
            resultHtml = `
                <div class="result-area result-wrong">
                    <div style="font-weight:700; margin-bottom:4px;">⏭️ Пропущено</div>
                    <div>💡 ${caseData.explanation}</div>
                </div>
            `;
        }
        
        const buttonText = isAnswered ? "Следующий кейс →" : "Проверить ответ";
        const buttonClass = isAnswered ? "btn-action btn-next" : "btn-action";
        
        const correctCount = userAnswers.filter((ans, idx) => ans !== null && ans !== -1 && ans === fillBlankCases[idx].correctIndex).length;
        const progressText = `${currentIndex+1} / ${totalCases}  |  Правильных: ${correctCount}`;
        
        container.innerHTML = `
            <div class="case-card">
                <div class="case-text">
                    📋 <strong>Ситуация</strong><br>${caseData.situation}
                </div>
                <div class="fill-blank-section">
                    <div class="fill-question">
                        📌 Выберите вариант, чтобы заполнить пропуск:
                    </div>
                    <div class="sentence">
                        ${sentenceHtml}
                        ${wrongAnswerHint}
                    </div>
                    ${resultHtml}
                </div>
                <div class="button-group">
                    <button class="btn-action ${buttonClass}" id="mainActionBtn">${buttonText}</button>
                    ${!isAnswered ? '<button class="btn-action btn-skip" id="skipBtn">Пропустить</button>' : ''}
                </div>
                <div class="score">🏆 ${progressText}</div>
            </div>
        `;
        
        if (!isAnswered) {
            const actionBtn = document.getElementById("mainActionBtn");
            if (actionBtn) {
                const newBtn = actionBtn.cloneNode(true);
                actionBtn.parentNode.replaceChild(newBtn, actionBtn);
                newBtn.addEventListener("click", () => {
                    const selectEl = document.getElementById("dynamicSelect");
                    let selectedValue = null;
                    if (selectEl && selectEl.value && selectEl.value !== "") {
                        selectedValue = parseInt(selectEl.value);
                    }
                    if (selectedValue === null || isNaN(selectedValue)) {
                        alert("Пожалуйста, выберите документ из списка.");
                        return;
                    }
                    userAnswers[currentIndex] = selectedValue;
                    updateProgress();
                    renderCurrentCase();
                });
            }
            
            const skipBtn = document.getElementById("skipBtn");
            if (skipBtn) {
                const newSkipBtn = skipBtn.cloneNode(true);
                skipBtn.parentNode.replaceChild(newSkipBtn, skipBtn);
                newSkipBtn.addEventListener("click", () => {
                    skipCurrentCase();
                });
            }
        } else {
            const actionBtn = document.getElementById("mainActionBtn");
            if (actionBtn) {
                const newBtn = actionBtn.cloneNode(true);
                actionBtn.parentNode.replaceChild(newBtn, actionBtn);
                newBtn.addEventListener("click", () => {
                    if (currentIndex + 1 < totalCases) {
                        currentIndex++;
                        renderCurrentCase();
                    } else {
                        const totalCorrect = userAnswers.filter((ans, idx) => ans !== null && ans !== -1 && ans === fillBlankCases[idx].correctIndex).length;
                        let message = `🏁 Тренировка завершена!\n✅ Правильных ответов: ${totalCorrect} из ${totalCases}\n\n`;
                        if (totalCorrect === totalCases) {
                            message += "Отлично! Вы отлично разбираетесь в документах при камеральной проверке.";
                        } else {
                            message += "Рекомендуем повторить пояснения и пройти тренажер еще раз.";
                        }
                        alert(message);
                    }
                    updateProgress();
                });
            }
        }
    }
    
    function init() {
        renderCurrentCase();
        updateProgress();
    }
    
    init();
</script>
</body>
</html>
