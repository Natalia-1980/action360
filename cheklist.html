<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <style>

        body {
            background: #eef2f6;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .main-tabs {
            display: flex;
            gap: 0;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 24px;
        }
        .main-tab {
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #5a6e7c;
            transition: 0.2s;
        }
        .main-tab.active {
            color: #1d8f7a;
            border-bottom: 2px solid #1d8f7a;
        }
        .two-columns {
            display: flex;
        }
        .sidebar {
            width: 260px;
            background: #fafcff;
            border-right: 1px solid #e9edf2;
            padding: 16px 0;
        }
        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: #8ba0b0;
            padding: 0 20px 10px 20px;
        }
        .cat-list {
            display: flex;
            flex-direction: column;
        }
        .cat-item {
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: #2c5a77;
            background: transparent;
            border: none;
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .cat-item:hover {
            background: #eef3fa;
        }
        .cat-item.active {
            background: #e3f5f0;
            color: #107a66;
            font-weight: 600;
            border-left: 3px solid #1d8f7a;
        }
        .content-area {
            flex: 1;
            padding: 16px;
            background: white;
        }
        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid #eef2f8;
            padding-bottom: 10px;
        }
        .sub-tab {
            background: #f0f4f9;
            padding: 5px 14px;
            border-radius: 32px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #2a577b;
            cursor: pointer;
            transition: 0.2s;
        }
        .sub-tab.active {
            background: #1d8f7a;
            color: white;
        }
        .info-card {
            background: #f9fdfb;
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid #e2efe9;
        }
        .checklist-items {
            list-style: none;
        }
        .checklist-items li {
            margin-bottom: 6px;
            font-size: 0.75rem;
            line-height: 1.4;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .checklist-items li:last-child {
            margin-bottom: 0;
        }
        .checklist-items li::before {
            content: "✓";
            background: #2b7a4b;
            color: white;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }
        @media (max-width: 750px) {
            .two-columns { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e9edf2; padding: 10px 0; }
            .sidebar-title { padding: 0 16px 8px 16px; }
            .cat-item { padding: 8px 16px; }
            .main-tabs { padding: 0 12px; }
            .main-tab { padding: 10px 16px; font-size: 0.85rem; }
            .content-area { padding: 12px; }
            .info-card { padding: 12px; }
        }
    </style>
</head>

            </div>
            <div id="territoryContent"></div>
        </div>
    </div>
</div>

    // Состояние
    let activeMainTab = 'industry';
    let activeIndustryCat = 'it';
    let activeIndustrySub = 'benefit';
    let activeTerritoryCat = 'tor';
    let activeTerritorySub = 'status';

    // Построение левого меню для отраслей
    function buildIndustrySidebar() {
        const sidebar = document.getElementById('industrySidebar');
        sidebar.innerHTML = Object.entries(industriesData).map(([key, val]) => 
            `<button class="cat-item ${key === activeIndustryCat ? 'active' : ''}" data-cat="${key}">${val.name}</button>`
        ).join('');
        sidebar.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', () => {
                activeIndustryCat = btn.dataset.cat;
                refreshIndustry();
            });
        });
    }

    // Построение левого меню для территорий
    function buildTerritorySidebar() {
        const sidebar = document.getElementById('territorySidebar');
        sidebar.innerHTML = Object.entries(territoriesData).map(([key, val]) => 
            `<button class="cat-item ${key === activeTerritoryCat ? 'active' : ''}" data-cat="${key}">${val.name}</button>`
        ).join('');
        sidebar.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', () => {
                activeTerritoryCat = btn.dataset.cat;
                refreshTerritory();
            });
        });
    }

    // Обновление правой панели для отраслей
    function refreshIndustry() {
        const ind = industriesData[activeIndustryCat];
        const contentDiv = document.getElementById('industryContent');
        
        if (activeIndustrySub === 'benefit') {
            contentDiv.innerHTML = `
                <div class="info-card">
                    <ul class="checklist-items">${ind.benefitChecks.map(item => `<li>${item}</li>`).join('')}</ul>
                </div>
            `;
        } else {
            contentDiv.innerHTML = `
                <div class="info-card">
                    <ul class="checklist-items">${ind.licenseChecks.map(item => `<li>${item}</li>`).join('')}</ul>
                </div>
            `;
        }
        
        document.querySelectorAll('#industrySidebar .cat-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === activeIndustryCat);
        });
    }

    // Обновление правой панели для территорий
    function refreshTerritory() {
        const terr = territoriesData[activeTerritoryCat];
        const contentDiv = document.getElementById('territoryContent');
        
        if (activeTerritorySub === 'status') {
            contentDiv.innerHTML = `
                <div class="info-card">
                    <ul class="checklist-items">${terr.statusChecks.map(item => `<li>${item}</li>`).join('')}</ul>
                </div>
            `;
        } else {
            contentDiv.innerHTML = `
                <div class="info-card">
                    <ul class="checklist-items">${terr.reportChecks.map(item => `<li>${item}</li>`).join('')}</ul>
                </div>
            `;
        }
        
        document.querySelectorAll('#territorySidebar .cat-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === activeTerritoryCat);
        });
    }

    // Переключение между основными вкладками
    function switchMainTab(tabId) {
        activeMainTab = tabId;
        document.querySelectorAll('.main-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mainTab === tabId);
        });
        
        const industryPanel = document.getElementById('industryPanel');
        const territoryPanel = document.getElementById('territoryPanel');
        
        if (tabId === 'industry') {
            industryPanel.style.display = 'flex';
            territoryPanel.style.display = 'none';
            refreshIndustry();
        } else {
            industryPanel.style.display = 'none';
            territoryPanel.style.display = 'flex';
            refreshTerritory();
        }
    }

    // Инициализация
    function init() {
        buildIndustrySidebar();
        buildTerritorySidebar();
        
        // Подвкладки для отраслей
        document.querySelectorAll('#industrySubTabs .sub-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                activeIndustrySub = btn.dataset.sub;
                document.querySelectorAll('#industrySubTabs .sub-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                refreshIndustry();
            });
        });
        
        // Подвкладки для территорий
        document.querySelectorAll('#territorySubTabs .sub-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                activeTerritorySub = btn.dataset.sub;
                document.querySelectorAll('#territorySubTabs .sub-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                refreshTerritory();
            });
        });
        
        // Верхние вкладки
        document.querySelectorAll('.main-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                switchMainTab(btn.dataset.mainTab);
            });
        });
        
        refreshIndustry();
    }
    
    init();
</script>
</body>
</html>
