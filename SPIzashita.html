<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Защита СПИ · ФСБУ 6/2020</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #d5d9df;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 12px;
    }
    .frame {
      width: 650px;
      height: 650px;
      background: #f7f8f9;
      border-radius: 40px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.3);
      padding: 22px 24px 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid #d0d5dc;
      overflow: hidden;
    }
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      margin-bottom: 4px;
    }
    .badge {
      background: #5a6068;
      color: #f0f2f4;
      font-weight: 600;
      font-size: 0.65rem;
      letter-spacing: 0.3px;
      padding: 4px 16px;
      border-radius: 30px;
    }
    .slide-counter {
      font-weight: 500;
      color: #3d434a;
      background: #dde1e6;
      padding: 2px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
    }
    .progress-track {
      width: 100%;
      height: 3px;
      background: #d0d5dc;
      border-radius: 20px;
      margin: 8px 0 12px;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 3px;
      background: #6a7078;
      border-radius: 20px;
      width: 20%;
      transition: width 0.3s ease;
    }
    .slide-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 6px;
      scrollbar-width: thin;
    }
    .slide-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .slide-scroll::-webkit-scrollbar-thumb {
      background: #b0b6be;
      border-radius: 20px;
    }
    .slide-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #23272b;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .slide-sub {
      color: #4a5057;
      font-size: 0.85rem;
      font-weight: 400;
      border-left: 3px solid #8a9098;
      padding-left: 14px;
      background: #edf0f3;
      border-radius: 0 8px 8px 0;
      line-height: 1.3;
      margin-bottom: 16px;
      padding: 6px 14px;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 6px 0 10px;
    }
    .card {
      background: #f0f2f4;
      border-radius: 20px;
      padding: 16px 14px;
      border: 1px solid #d5d9df;
    }
    .card h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #2d3238;
      margin-bottom: 8px;
      border-bottom: 1px dashed #c5cad0;
      padding-bottom: 6px;
    }
    .card ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .card li {
      padding-left: 18px;
      position: relative;
      margin-bottom: 8px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #3a3f45;
    }
    .card li::before {
      content: "—";
      color: #6a7078;
      font-weight: 600;
      position: absolute;
      left: 2px;
    }
    .highlight-badge {
      background: #d5d9df;
      padding: 1px 10px;
      border-radius: 20px;
      color: #2d3238;
      font-weight: 500;
      font-size: 0.7rem;
      display: inline-block;
      margin-right: 4px;
    }
    .chip-icon {
      display: inline-block;
      background: #6a7078;
      color: #f0f2f4;
      border-radius: 30px;
      padding: 0 12px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      line-height: 22px;
    }
    .info-block {
      background: #e8ebef;
      border-radius: 30px;
      padding: 8px 16px;
      border: 1px solid #d0d5dc;
      font-size: 0.8rem;
      color: #2d3238;
      margin: 4px 0 6px;
      font-weight: 450;
    }
    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 2px;
    }
    .pill-icon {
      background: #e4e7eb;
      border-radius: 30px;
      padding: 3px 14px;
      font-size: 0.7rem;
      border: 1px solid #c5cad0;
      color: #3d434a;
    }
    .footer-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      margin-top: 4px;
      gap: 16px;
      padding: 6px 0 2px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #f0f2f4;
      border: 1px solid #c5cad0;
      padding: 6px 28px;
      border-radius: 40px;
      font-weight: 500;
      color: #3a3f45;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      background: #edf0f3;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .btn-primary {
      background: #5a6068;
      border: 1px solid #5a6068;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }
    .btn-primary:hover {
      background: #4a4f55;
      border-color: #4a4f55;
    }
    .btn-outline:hover {
      background: #e2e6eb;
      border-color: #a8aeb6;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .fade-enter {
      animation: fadeSlide 0.4s ease;
    }
    @keyframes fadeSlide {
      0% { opacity: 0.5; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 680px) {
      .frame { width: 100%; height: 650px; padding: 16px; }
      .grid-2col { grid-template-columns: 1fr; gap: 12px; }
      .slide-title { font-size: 1.3rem; }
    }
    .example-text {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #3a3f45;
      padding: 6px 0 0 0;
      margin: 0;
    }
    .bottom-note {
      background: #e4e7eb;
      border-radius: 30px;
      padding: 6px 16px;
      display: inline-block;
      margin-top: 4px;
      font-size: 0.8rem;
      color: #2d3238;
    }
  </style>
</head>
<body>
<div class="frame">
  <div class="nav-header">
    <span class="badge">Защита СПИ · ФСБУ 6/2020</span>
    <span class="slide-counter" id="slideCounter">1 / 4</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width: 25%;"></div>
  </div>

  <div class="slide-scroll" id="slideScroll">
    <div id="slideContent" class="fade-enter"></div>
  </div>

  <div class="footer-actions">
    <div class="btn-group">
      <button class="btn btn-outline" id="prevBtn">Назад</button>
      <button class="btn btn-primary" id="nextBtn">Вперед</button>
    </div>
  </div>
</div>

<script>
  (function(){
    const slides = [
      {
        title: 'Авторитетная комиссия',
        subtitle: 'Устанавливает и защищает СПИ.',
        content: `
          <div class="grid-2col">
            <div class="card">
              <h4>Состав комиссии</h4>
              <ul>
                <li>Штатные специалисты — инженеры, технологи, эксплуатационники.</li>
                <li>Привлеченные эксперты — проектировщики, оценщики, отраслевые консультанты.</li>
                <li><span class="highlight-badge">кворум</span> коллегиальное решение, руководитель утверждает протокол.</li>
                <li>Квалификация и стаж подтверждает компетенции.</li>
              </ul>
            </div>
            <div class="card">
              <h4>Документальная база</h4>
              <ul>
                <li>Проектная и техническая документация (паспорта, схемы).</li>
                <li>Бюджеты, планы производства, лицензии, разрешения на эксплуатацию.</li>
                <li>Обоснованные прогнозы периода получения экономических выгод.</li>
                <li><span class="chip-icon">архив</span> все материалы систематизируются и хранятся.</li>
              </ul>
            </div>
          </div>
          <div class="info-block">Основание для СПИ — не произвольное решение, а объективный анализ выгод и ограничений.</div>
        `
      },
      {
        title: 'Ежегодный пересмотр СПИ',
        subtitle: 'Обязательная процедура, а не формальность.',
        content: `
          <div class="grid-2col">
            <div class="card">
              <h4>Причины пересмотра</h4>
              <ul>
                <li>Физический износ — режим работы, сменность, агрессивная среда.</li>
                <li>Моральное устаревание — изменение технологий, рыночного спроса.</li>
                <li>Планы руководства — модернизация, реконструкция, замена ОС.</li>
                <li>Изменение нормативных или договорных ограничений.</li>
              </ul>
            </div>
            <div class="card">
              <h4>Процедура и фиксация</h4>
              <ul>
                <li>Та же комиссия проводит проверку ежегодно (в конце отчетного года).</li>
                <li>Оформляется протокол с датой, выводами и решениями.</li>
                <li>При изменении СПИ — корректировка амортизации перспективно (без пересчета прошлых лет).</li>
                <li><span class="highlight-badge">доказательство</span> протоколы хранятся в инвентарных делах.</li>
              </ul>
            </div>
          </div>
          <div class="flex-row">
            <span class="pill-icon">По итогам проверки протокол.</span>
            <span class="pill-icon">СПИ корректируется, если есть основания.</span>
          </div>
        `
      },
      {
        title: 'Документальная экспертиза и инвентаризация',
        subtitle: 'Регулярный контроль обоснованности СПИ.',
        content: `
          <div class="grid-2col">
            <div class="card">
              <h4>Инвентаризация ОС</h4>
              <ul>
                <li>Плановые и внеплановые проверки состояния объектов.</li>
                <li>Сверка фактического износа с прогнозным.</li>
                <li>Выявление объектов с измененными условиями эксплуатации.</li>
                <li>Акты инвентаризации — первичная база для пересмотра.</li>
              </ul>
            </div>
            <div class="card">
              <h4>Экспертиза и архивы</h4>
              <ul>
                <li>Технические паспорта, заключения экспертов, акты осмотра.</li>
                <li>Систематизация документов по каждому инвентарному объекту.</li>
                <li>Хранение минимум 5 лет после выбытия ОС.</li>
                <li>Документация — главная защита при налоговых спорах.</li>
              </ul>
            </div>
          </div>
          <div class="info-block">При выявлении ошибок — оперативная корректировка расчетов с оформлением исправлений.</div>
        `
      },
      {
        title: 'Методика СПИ: бухгалтерский и налоговый учет',
        subtitle: 'Разница обоснована и закреплена в учетной политике.',
        content: `
          <div class="grid-2col">
            <div class="card">
              <h4>Бухгалтерский учет</h4>
              <ul>
                <li>Учитываются: планы модернизации, моральный износ, физическое состояние.</li>
                <li>Методика закрепляется в учетной политике.</li>
                <li><span class="highlight-badge">пример</span></li>
              </ul>
              <div class="example-text">
                Для налогового учета СПИ фрезерного станка — 85 месяцев, для бухучета — 36 месяцев. СПИ разные, так как фрезерный станок специально приобретен для производства продукции по договору с заказчиком АО «Альфа». Договор заключен на три года. В дальнейшем станок будет реализован.
              </div>
            </div>
            <div class="card">
              <h4>Налоговый учет</h4>
              <ul>
                <li>СПИ по Классификации ОС (Постановление № 1) — амортизационные группы.</li>
                <li>Изменение СПИ в налоговом учете ограничено (только при модернизации и т.п.).</li>
                <li>Разницы учитываются по ПБУ 18/02.</li>
                <li><span class="chip-icon">важно</span> разные методики допустимы, если обоснованы целями учета.</li>
              </ul>
            </div>
          </div>
          <div class="bottom-note">
            Комиссия должна устанавливать и пересматривать СПИ по методике в учетной политике.
          </div>
        `
      }
    ];

    let current = 0;
    const contentEl = document.getElementById('slideContent');
    const counterEl = document.getElementById('slideCounter');
    const progressEl = document.getElementById('progressFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function render(index) {
      const data = slides[index];
      contentEl.classList.remove('fade-enter');
      void contentEl.offsetWidth;
      contentEl.innerHTML = `
        <div class="slide-title">${data.title}</div>
        <div class="slide-sub">${data.subtitle}</div>
        ${data.content}
      `;
      contentEl.classList.add('fade-enter');

      counterEl.textContent = `${index+1} / ${slides.length}`;
      progressEl.style.width = `${((index+1)/slides.length)*100}%`;
      prevBtn.disabled = (index === 0);
      prevBtn.style.opacity = (index === 0) ? '0.4' : '1';
      nextBtn.textContent = 'Вперед';
    }

    function next() {
      if (current < slides.length - 1) {
        current++;
      } else {
        current = 0;
      }
      render(current);
    }

    function prev() {
      if (current > 0) {
        current--;
        render(current);
      }
    }

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        next();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prev();
      }
    });
    render(0);
  })();
</script>
</body>
</html>
