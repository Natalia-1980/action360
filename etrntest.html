<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ЭТрН · тренажёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 650px;
            max-width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 1.5rem 1.2rem;
            border: 1px solid #dee6f0;
            max-height: 90vh;
            overflow-y: auto;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.75rem;
            color: #5e7290;
            font-weight: 500;
        }

        .situation-card {
            background: #f9fcff;
            border-radius: 24px;
            padding: 1rem;
            border: 2px solid #e1eaf5;
            margin: 1rem 0;
        }

        .situation-title {
            font-weight: 700;
            color: #1d3b5e;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }

        .situation-text {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #0a2942;
            margin-bottom: 1rem;
            background: #f6faff;
            padding: 0.8rem;
            border-radius: 18px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e3b5c;
        }
        .option-btn:hover {
            background: #f0f7ff;
            border-color: #8da9cc;
        }
        .option-btn.selected-wrong {
            background: #ffe0e0;
            border-color: #cc5555;
            box-shadow: 0 0 0 1px #ffb3b3;
        }
        .option-btn.selected-correct {
            background: #d9f0e0;
            border-color: #2b8c4a;
            box-shadow: 0 0 0 1px #9ad0aa;
        }
        .option-btn input {
            margin: 0;
            width: 18px;
            height: 18px;
            accent-color: #1e6bb8;
            pointer-events: none;
        }
        .option-btn label {
            flex: 1;
            cursor: pointer;
            font-weight: 500;
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .btn {
            background: white;
            border: 2px solid #1e3b5c;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e3b5c;
            cursor: pointer;
            box-shadow: 0 2px 0 #b0c4dd;
            transition: 0.07s linear;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b0c4dd;
        }
        .btn.primary {
            background: #1e3b5c;
            color: white;
            border-color: #0e2b44;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .feedback {
            background: #f2f8fd;
            border-radius: 18px;
            padding: 0.8rem 1rem;
            border: 2px solid #b9d3f0;
            margin: 1rem 0 0.5rem;
            font-size: 0.85rem;
            line-height: 1.45;
            transition: 0.1s;
        }
        .feedback.correct {
            border-color: #2b8c4a;
            background: #eefaee;
        }
        .feedback.incorrect {
            border-color: #b13e3e;
            background: #fff2f2;
        }
        .feedback-text {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .icon {
            font-size: 1.3rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .result-block {
            background: #eef3fa;
            border-radius: 24px;
            padding: 1.2rem;
            margin-top: 1rem;
            text-align: center;
            border: 1px solid #cbdbe0;
        }
        .result-score {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1e3b5c;
            margin-bottom: 6px;
        }
        .result-message {
            margin-top: 12px;
            padding: 10px;
            background: #ffffffcc;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #0f3b5c;
        }
    </style>
</head>
<body>
<div class="card" id="app"></div>

<script>
    // --------------------------------------------------------------
    // БАЗА СИТУАЦИЙ (12 штук) с верным ответом (0,1,2)
    // 0 -> "ЭТрН оформлять не нужно"
    // 1 -> "Транспортную накладную можно оформить на бумаге"
    // 2 -> "ЭТрН обязательно оформлять в электронном виде"
    // КОММЕНТАРИЙ — ТОЛЬКО МОЙ ТЕКСТ (без изменений, без добавок)
    // --------------------------------------------------------------
        const SITUATIONS_RAW = [
        { // 1
            text: "ООО «Магнит» имеет свой автопарк и самостоятельно доставляет товары в магазины. Отдельная плата за доставку не взимается, стоимость включена в цену товара.",
            correct: 0,
            explanation: "При доставке собственным транспортом (свои машины, свои водители) договор перевозки не возникает, так как нет двух разных лиц — грузовладельца и перевозчика. Единое лицо владеет грузом и перемещает его. В этом случае оформляются только путевые листы. Обязательности по переходу на ЭТрН для таких перевозок закон № 140-ФЗ не устанавливает."
        },
        { // 2
            text: "ЗАО «НефтеПродукт» перевозит опасный груз (бензин) на собственном бензовозе для своих нужд. Транспорт арендован у другого ООО без экипажа (только машина).",
            correct: 0,
            explanation: "Транспортная накладная обязательна только при заключении договора перевозки с привлечением стороннего перевозчика. В данной ситуации груз перевозят собственным транспортом для собственных нужд (ЗАО «НефтеПродукт»). Договора перевозки между разными лицами нет. Есть договор аренды имущества и трудовой договор с водителем. Договор аренды транспортного средства без экипажа означает, что машина используется силами вашей организации, а не сторонней транспортной компанией. Так как груз является опасным (бензин), водитель обязан иметь при себе комплект документов в соответствии с правилами ДОПОГ, а именно: транспортный документ на опасный груз, специальное разрешение на движение по автомобильным дорогам (при превышении разрешенных объемов или класса опасности груза повышенной опасности), свидетельство ДОПОГ о подготовке водителя, свидетельство о допуске транспортного средства к перевозке опасных грузов, письменные инструкции для водителя (аварийная карточка), путевой лист."
        },
        { // 3
            text: "Фермерское хозяйство перевозит на своем комбайне (спецтехника) зерно с поля на собственный ток. В поле нет интернета.",
            correct: 0,
            explanation: "Здесь действует принцип внутрихозяйственной (технологической) перевозки. Зерно — собственность фермера. Комбайн — собственность фермера. Движение происходит в пределах хозяйства (даже если выезд на дорогу общего пользования между полем и током, это технологически единый процесс). Отсутствует главный признак коммерческой перевозки: нет заказчика, нет перевозчика как отдельного лица, нет платы за перевозку. Поэтому оформлять ЭТрН не нужно. Оформляется путевой лист тракториста-машиниста. Отсутствие интернета здесь вообще не является аргументом, так как ЭТрН в принципе не требуется по существу правоотношений."
        },
        { // 4 группа 2
            text: "АО «Оборонпоставка» перевозит вещевое имущество для нужд Министерства обороны РФ. Контракт заключен с военным ведомством.",
            correct: 1,
            explanation: "Пункт 1 Приказа Минтранса № 262: перевозки грузов военного назначения, в том числе в интересах Министерства обороны РФ, оформляют на бумажном носителе. Это сделано для защиты государственной тайны (электронная система потенциально более уязвима) и из-за особенностей документооборота в военных структурах, где не всегда есть доступ к коммерческим операторам ЭДО. Обратите внимание: речь именно о грузах, заказанных военными. Если бы АО «Оборонпоставка» перевозило коммерческий груз для гражданского заказчика — требовалась бы ЭТрН."
        },
        { // 5
            text: " ООО «Цветы» заказало перевозку крупной партии роз от подмосковной теплицы до своего салона. Водитель — наемный ИП на Газели.",
            correct: 1,
            explanation: " Это классический самовывоз силами Покупателя. При самовывозе получатель забирает товар наемным транспортом. В данном случае грузоотправитель и грузополучатель совпадают, поэтому транспортную накладную оформляют на бумаге (п. 7 приказа Минтранса от 01.06.2026 № 262)."
        },

        { // 6
            text: "ООО «Ромашка» (Россия) заказало импортное оборудование у компании из Казахстана (страна ЕАЭС). Казахстанский перевозчик везет товар через границу и доставляет на склад в Москве.",
            correct: 1,
            explanation: "При международной перевозке грузов автомобильным транспортом в сообщении с государствами — членами ЕАЭС (Казахстан, Беларусь, Армения, Киргизия) транспортную накладную оформляют на бумажном носителе (п. 3 Приказа Минтранса № 262). Это сделано, чтобы не создавать барьеров для иностранных перевозчиков, у которых может не быть доступа к российским операторам ЭДО. Российский грузоотправитель или получатель не вправе требовать от казахстанского перевозчика ЭТрН, если тот хочет работать с бумагой."
        },
        { // 7
            text: "ООО «Мебель» продает товар частному лицу и заказывает доставку силами стороннего грузового такси (перевозчик — ИП на Газели до 3,5 тонн).",
            correct: 1,
            explanation: " При доставке товара сторонним перевозчиком для физического лица транспортную накладную оформляют на бумаге. По закону использование ЭТрН обязательно, но Минтранс утвердил исключения. Одно из них — оказание транспортных услуг для личных нужд, не связанных с бизнесом, если грузоотправитель или грузополучатель – физическое лицо."
        },

        { // 8
            text: "Иностранная компания (резидент Германии, неаккредитованная в РФ) отправляет партию станков со своего склада во Владивостоке российскому покупателю. Перевозчик — российская ТК.",
            correct: 1,
            explanation: "Пункт 2 Приказа Минтранса № 262: если грузоотправителем или грузополучателем является иностранное юридическое лицо, не аккредитованное на территории Российской Федерации, транспортная накладная оформляется на бумажном носителе. Российский перевозчик в этом случае не обязан внедрять ЭТрН для такой разовой перевозки. Иностранная компания из Германии (не ЕАЭС, не аккредитована в РФ) не может подписать ЭТрН электронной подписью, признаваемой в России, поэтому закон разрешает бумагу."
        },
        { // 9
            text: "ООО «Розничная сеть» заказывает доставку товаров из распределительного центра в 50 магазинов. Перевозчик — сторонняя транспортная компания ТК «Быстро». Плата за доставку выделена в счете отдельной строкой.",
            correct: 2,
            explanation: "Здесь есть все признаки договора перевозки: разная сторона заказчика (ООО «Розничная сеть») и перевозчика (ТК «Быстро»), услуга оплачивается отдельно. ЭТрН обязательна независимо от того, выделена доставка в документах отдельно или нет (но здесь выделена — сомнений нет). Ошибка, которую часто совершают: думают, что если доставка «включена в цену товара», то ЭТрН не нужна. Это миф. Нужна, если перевозчик — третье лицо."
        },
        { // 10
            text: "Производственное предприятие отгружает продукцию заказчику в другой город. Для этого нанимают стороннего перевозчика. Доставка входит в цену товара и не выделена отдельной строкой.",
            correct: 2,
            explanation: "В этой связке производственное предприятие выступает в роли грузоотправителя. Именно грузоотправитель (или по договоренности с ним перевозчик) формирует ЭТрН и запускает ее в оборот. С 1 сентября 2026 года для коммерческих перевозок с участием третьего лица-перевозчика электронная форма обязательна. Ни одно из исключений Приказа № 262 (военные грузы, иностранцы, личные нужды физлица) здесь не работает. Тот факт, что транспортные услуги не выделены отдельной строкой и включены в стоимость товара, не освобождает организацию от участия в электронном документообороте, если доставку осуществляет сторонний перевозчик, нанятый поставщиком."
        },
        { // 11
            text: "Грузоотправитель (ООО «Завод») и Перевозчик (ИП «Водитель») работают по разовой заявке на перевозку металлопроката. Оба не подключились к ЭДО, у них нет электронной подписи, но перевозка коммерческая.",
            correct: 2,
            explanation: "Приказ Минтранса № 262 не содержит такого основания, как «отсутствие договора с оператором ЭДО» или «нет квалифицированной подписи». Закон № 140-ФЗ обязывает использовать ЭТрН для коммерческих перевозок с 01.09.2026. Штраф за отсутствие ЭТрН в системе ГИС ЭПД для юрлиц — до 300 000 рублей (ст. 11.14.3 КоАП)."
        },
        { // 12
            text: "Пивоваренная компания передает свою продукцию дистрибьютору. Поставка идет на арендованном транспорте, водитель — работник компании-арендодателя (ТС с экипажем).",
            correct: 2,
            explanation: "Здесь договор аренды транспортного средства с экипажем. Водитель является работником арендодателя, а не арендатора (пивоваренной компании). Следовательно, лицо, управляющее транспортом (арендодатель), и лицо, владеющее грузом (арендатор-пивоварня), — это разные субъекты. Возникает договор перевозки, даже если он замаскирован под договор аренды. Пивоваренная компания заказывает услугу (перевезти товар), арендодатель с водителем ее оказывает. ЭТрН обязательна. Путевой лист оформляет арендодатель на своего водителя, а ЭТрН оформляется в электронном виде между грузоотправителем, перевозчиком и грузополучателем."
        }

    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let quizCompleted = false;
    let answersHistory = [];

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        let shuffled = [...SITUATIONS_RAW];
        shuffled = shuffleArray(shuffled);
        currentQuestions = shuffled.map((item, idx) => ({
            id: idx,
            text: item.text,
            correct: item.correct,
            explanation: item.explanation,
            userAnswer: null,
            isChecked: false,
        }));
        currentIndex = 0;
        quizCompleted = false;
        answersHistory = [];
        render();
    }

    function selectAnswer(questionIdx, answerValue) {
        if (quizCompleted) return;
        const q = currentQuestions[questionIdx];
        if (q.isChecked) return;
        q.userAnswer = answerValue;
        render();
    }

    function checkAnswer() {
        if (quizCompleted) return;
        const q = currentQuestions[currentIndex];
        if (q.userAnswer === null) return;
        if (q.isChecked) return;
        q.isChecked = true;
        const isCorrect = (q.userAnswer === q.correct);
        answersHistory.push({ correct: isCorrect });
        render();
    }

    function nextQuestion() {
        if (quizCompleted) return;
        const currentQ = currentQuestions[currentIndex];
        if (!currentQ.isChecked) return;
        if (currentIndex + 1 < currentQuestions.length) {
            currentIndex++;
            render();
        } else {
            quizCompleted = true;
            render();
        }
    }

    function restartQuiz() {
        initQuiz();
    }

    function getResultMessage(correctCount) {
        if (correctCount >= 10) {
            return 'Поздравляем! Вы отлично разбираетесь в правилах оформления ЭТрН.';
        } else if (correctCount >= 7) {
            return 'Неплохой результат, но есть пробелы. Рекомендуем повторить материал.';
        } else {
            return 'Стоит серьезно изучить правила оформления ЭТрН и исключения.';
        }
    }

    function render() {
        const app = document.getElementById('app');
        if (!app) return;
        if (quizCompleted) {
            const total = currentQuestions.length;
            const correctTotal = answersHistory.filter(h => h.correct).length;
            const levelMessage = getResultMessage(correctTotal);
            app.innerHTML = `
                <div class="result-block">
                    <div class="result-score">${correctTotal} / ${total} верных</div>
                    <div style="font-size:0.9rem; margin-bottom: 8px;">✅ Правильных ответов: ${correctTotal}</div>
                    <div class="result-message">${levelMessage}</div>
                    <div style="margin-top: 20px;">
                        <button class="btn primary" id="restartBtn">🔄 Пройти заново</button>
                    </div>
                </div>
            `;
            const restartBtn = document.getElementById('restartBtn');
            if (restartBtn) restartBtn.addEventListener('click', () => restartQuiz());
            return;
        }

        const q = currentQuestions[currentIndex];
        const total = currentQuestions.length;
        const currentNum = currentIndex + 1;
        const options = [
            "ЭТрН оформлять не нужно",
            "Транспортную накладную можно оформить на бумаге",
            "ЭТрН обязательно оформлять в электронном виде"
        ];

        let optionsHtml = '';
        for (let optIdx = 0; optIdx < options.length; optIdx++) {
            let additionalClass = '';
            let isSelected = (q.userAnswer !== null && q.userAnswer === optIdx);
            if (isSelected && q.isChecked) {
                const isCorrectChoice = (optIdx === q.correct);
                additionalClass = isCorrectChoice ? 'selected-correct' : 'selected-wrong';
            }
            optionsHtml += `
                <div class="option-btn ${additionalClass}" data-opt="${optIdx}">
                    <input type="radio" name="questionOption" id="opt_${optIdx}" value="${optIdx}" ${isSelected ? 'checked' : ''} ${q.isChecked ? 'disabled' : ''}>
                    <label for="opt_${optIdx}">${options[optIdx]}</label>
                </div>
            `;
        }

        let feedbackHtml = '';
        if (q.isChecked) {
            const isUserCorrect = (q.userAnswer === q.correct);
            const feedbackClass = isUserCorrect ? 'correct' : 'incorrect';
            const iconSymbol = isUserCorrect ? '✅' : '❌';
            const verdictTextLocal = isUserCorrect ? 'Верно' : 'Неверно';
            const commentText = q.explanation;
            feedbackHtml = `
                <div class="feedback ${feedbackClass}">
                    <div class="feedback-text">
                        <span class="icon">${iconSymbol}</span>
                        <span><strong>${verdictTextLocal}</strong><br>${commentText}</span>
                    </div>
                </div>
            `;
        }

        const isChecked = q.isChecked;
        const isAnswerSelected = (q.userAnswer !== null);
        const isLast = currentIndex === total - 1;
        const nextButtonText = isLast ? "Завершить" : "Далее →";

        const html = `
            <div class="progress-bar">
                <span>Вопрос ${currentNum} из ${total}</span>
                <span>⚡ ЭТрН тренажёр</span>
            </div>
            <div class="situation-card">
                <div class="situation-title">📋 Ситуация №${currentNum}</div>
                <div class="situation-text">${escapeHtml(q.text)}</div>
                <div class="options" id="optionsContainer">
                    ${optionsHtml}
                </div>
                ${feedbackHtml}
                <div class="button-row">
                    <button class="btn" id="checkBtn" ${isChecked || !isAnswerSelected ? 'disabled' : ''}>Проверить ответ</button>
                    <button class="btn primary" id="nextBtn" ${!isChecked ? 'disabled' : ''}>${nextButtonText}</button>
                </div>
            </div>
            <div style="margin-top: 8px; text-align: right; font-size:12px; color:#859dbb;">
                Выберите вариант, затем нажмите «Проверить ответ»
            </div>
        `;

        app.innerHTML = html;

        if (!q.isChecked) {
            const optionDivs = document.querySelectorAll('.option-btn');
            optionDivs.forEach(div => {
                const optVal = parseInt(div.getAttribute('data-opt'));
                div.addEventListener('click', (e) => {
                    if (currentQuestions[currentIndex].isChecked) return;
                    selectAnswer(currentIndex, optVal);
                });
                const radio = div.querySelector('input');
                if (radio) {
                    radio.addEventListener('change', (e) => {
                        e.stopPropagation();
                        if (currentQuestions[currentIndex].isChecked) return;
                        selectAnswer(currentIndex, parseInt(radio.value));
                    });
                }
            });
        }

        const checkBtn = document.getElementById('checkBtn');
        if (checkBtn) {
            checkBtn.addEventListener('click', () => checkAnswer());
        }
        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) {
            nextBtn.addEventListener('click', () => nextQuestion());
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    initQuiz();
</script>
</body>
</html>
