<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Налоговые ставки · практикум</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            max-width: 650px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 1.8rem 1.5rem;
            border: 1px solid #dee6f0;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: #f0f5fc;
            border-radius: 60px;
            padding: 0.3rem;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.7rem 0.5rem;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #2a4d70;
            cursor: pointer;
            transition: 0.1s;
        }
        .tab-btn.active {
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #1a344c;
            font-weight: 600;
        }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .question-block {
            background: #f9fcff;
            border-radius: 24px;
            padding: 1.2rem;
            border: 2px solid #e1eaf5;
            margin: 0.5rem 0;
        }

        .question-title {
            font-weight: 600;
            color: #1d3b5e;
            margin-bottom: 1rem;
            font-size: 1.05rem;
            text-align: center;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            margin: 0.8rem 0;
            flex-wrap: wrap;
        }
        .input-row label {
            font-weight: 500;
            color: #1e3b5c;
            font-size: 0.9rem;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .input-wrapper input {
            width: 80px;
            padding: 0.5rem 0.8rem;
            border: 2px solid #cbd5e1;
            border-radius: 40px;
            font-size: 0.9rem;
            text-align: center;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #1e6bb8;
        }
        .input-wrapper span {
            font-weight: 500;
            color: #1e3b5c;
            font-size: 0.9rem;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.2rem 0 0.5rem;
        }
        .btn {
            background: white;
            border: 2px solid #1e3b5c;
            border-radius: 40px;
            padding: 0.5rem 1.8rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3b5c;
            cursor: pointer;
            box-shadow: 0 3px 0 #b0c4dd;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b0c4dd;
        }
        .btn.primary {
            background: #1e3b5c;
            color: white;
            border-color: #0e2b44;
        }

        .feedback {
            background: #f2f8fd;
            border-radius: 18px;
            padding: 1rem;
            border: 2px solid #b9d3f0;
            margin-top: 1rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .feedback.correct {
            border-color: #2b8c4a;
            background: #eefaee;
        }
        .feedback.incorrect {
            border-color: #b13e3e;
            background: #fff2f2;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            gap: 0.5rem;
        }
        .nav-btn {
            background: white;
            border: 2px solid #1e3b5c;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3b5c;
            cursor: pointer;
            box-shadow: 0 2px 0 #b0c4dd;
            transition: 0.1s;
        }
        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b0c4dd;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .final-message {
            text-align: center;
            margin-top: 1rem;
            font-size: 1rem;
            color: #2b8c4a;
        }
        .hidden {
            display: none;
        }

        @media (max-width: 500px) {
            .card { padding: 1.2rem; }
            .input-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="tab1">💰 Дивиденды</button>
            <button class="tab-btn" data-tab="tab2">📈 Продажа акций</button>
        </div>

        <!-- Содержимое вкладки 1: Дивиденды -->
        <div id="tab1" class="tab-content active">
            <div class="question-block">
                <div class="question-title">Дивиденды</div>
                <div class="input-row">
                    <label>В федеральный бюджет:</label>
                    <div class="input-wrapper">
                        <input type="number" id="fedDiv" placeholder="">
                        <span>%</span>
                    </div>
                </div>
                <div class="input-row">
                    <label>В региональный бюджет:</label>
                    <div class="input-wrapper">
                        <input type="number" id="regDiv" placeholder="">
                        <span>%</span>
                    </div>
                </div>
                <div class="button-row">
                    <button class="btn" id="checkDivBtn">Проверить</button>
                </div>
                <div id="feedbackDiv" class="feedback hidden"></div>
            </div>
        </div>

        <!-- Содержимое вкладки 2: Продажа акций -->
        <div id="tab2" class="tab-content">
            <div class="question-block">
                <div class="question-title">Продажа акций</div>
                <div class="input-row">
                    <label>В федеральный бюджет:</label>
                    <div class="input-wrapper">
                        <input type="number" id="fedSale" placeholder="">
                        <span>%</span>
                    </div>
                </div>
                <div class="input-row">
                    <label>В региональный бюджет:</label>
                    <div class="input-wrapper">
                        <input type="number" id="regSale" placeholder="">
                        <span>%</span>
                    </div>
                </div>
                <div class="button-row">
                    <button class="btn" id="checkSaleBtn">Проверить</button>
                </div>
                <div id="feedbackSale" class="feedback hidden"></div>
            </div>
        </div>

        <!-- Кнопки навигации между вкладками -->
        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn" disabled>← Назад</button>
            <button class="nav-btn" id="resetBtn">Сбросить всё</button>
            <button class="nav-btn" id="nextBtn">Вперёд →</button>
        </div>
        <div id="finalMessage" class="final-message hidden"></div>
    </div>

    <script>
        (function() {
            // Правильные ответы
            const correctFedDiv = 13;
            const correctRegDiv = null;  // дивиденды только в федеральный
            
            const correctFedSale = 8;
            const correctRegSale = 17;
            
            // Состояние
            let divAnswered = false;
            let saleAnswered = false;
            let currentTab = 'tab1';
            
            // DOM элементы
            const tab1 = document.getElementById('tab1');
            const tab2 = document.getElementById('tab2');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            const fedDivInput = document.getElementById('fedDiv');
            const regDivInput = document.getElementById('regDiv');
            const fedSaleInput = document.getElementById('fedSale');
            const regSaleInput = document.getElementById('regSale');
            
            const checkDivBtn = document.getElementById('checkDivBtn');
            const checkSaleBtn = document.getElementById('checkSaleBtn');
            
            const feedbackDiv = document.getElementById('feedbackDiv');
            const feedbackSale = document.getElementById('feedbackSale');
            const finalMessage = document.getElementById('finalMessage');
            
            // Тексты пояснений
            const fullDivExplanation = `
                <strong>✅ Верно!</strong><br><br>
                <strong>Шаг 1.</strong> Вид налоговой базы: дивиденды.<br>
                <strong>Шаг 2.</strong> Статус налогоплательщика: обычная российская организация.<br>
                <strong>Шаг 3.</strong> Дополнительные условия: доля участия — 15% (менее 50%), срок владения — 2 года (менее 365 дней). Страна не офшор, но для нулевой ставки нужно 50% + 365 дней.<br>
                <strong>Шаг 4.</strong> Ставка: нулевая ставка не применяется. Для российских организаций, не подпадающих под льготу, ставка 13% в федеральный бюджет (подп. 2 п. 3 ст. 284 НК). В региональный бюджет налог с дивидендов не зачисляется.
            `;
            const incorrectDivExplanation = `
                <strong>❌ Неверно.</strong><br><br>
                Правильные ответы: федеральный бюджет — <strong>13%</strong>, региональный бюджет — не заполняется (налог только в федеральный бюджет).<br><br>
                <strong>Шаг 1.</strong> Вид налоговой базы: дивиденды.<br>
                <strong>Шаг 2.</strong> Статус налогоплательщика: обычная российская организация.<br>
                <strong>Шаг 3.</strong> Дополнительные условия: доля участия — 15% (менее 50%), срок владения — 2 года (менее 365 дней). Страна не офшор, но для нулевой ставки нужно 50% + 365 дней.<br>
                <strong>Шаг 4.</strong> Ставка: нулевая ставка не применяется. Для российских организаций, не подпадающих под льготу, ставка 13% в федеральный бюджет (подп. 2 п. 3 ст. 284 НК). В региональный бюджет налог с дивидендов не зачисляется.
            `;
            
            const fullSaleExplanation = `
                <strong>✅ Верно!</strong><br><br>
                <strong>Шаг 1.</strong> Вид налоговой базы: доход от выбытия акций (не дивиденды).<br>
                <strong>Шаг 2.</strong> Статус налогоплательщика: обычная российская организация.<br>
                <strong>Шаг 3.</strong> Дополнительные условия: срок владения — 4 года (менее 5 лет, требуемых для нулевой ставки по п. 4.1 ст. 284). Доля недвижимости в активах — 10% (менее 50%, но это не спасает, так как не хватает срока). Акции не относятся к обращающимся на организованном рынке (по условию).<br>
                <strong>Шаг 4.</strong> Ставка: льгот нет → применяется общая ставка для обычной прибыли: федеральный бюджет — 8%, региональный бюджет — 17%.
            `;
            const incorrectSaleExplanation = `
                <strong>❌ Неверно.</strong><br><br>
                Правильные ответы: федеральный бюджет — <strong>8%</strong>, региональный бюджет — <strong>17%</strong>.<br><br>
                <strong>Шаг 1.</strong> Вид налоговой базы: доход от выбытия акций (не дивиденды).<br>
                <strong>Шаг 2.</strong> Статус налогоплательщика: обычная российская организация.<br>
                <strong>Шаг 3.</strong> Дополнительные условия: срок владения — 4 года (менее 5 лет, требуемых для нулевой ставки по п. 4.1 ст. 284). Доля недвижимости в активах — 10% (менее 50%, но это не спасает, так как не хватает срока). Акции не относятся к обращающимся на организованном рынке (по условию).<br>
                <strong>Шаг 4.</strong> Ставка: льгот нет → применяется общая ставка для обычной прибыли: федеральный бюджет — 8%, региональный бюджет — 17%.
            `;
            
            function updateTabs() {
                tab1.classList.remove('active');
                tab2.classList.remove('active');
                tabBtns.forEach(btn => btn.classList.remove('active'));
                
                if (currentTab === 'tab1') {
                    tab1.classList.add('active');
                    document.querySelector('.tab-btn[data-tab="tab1"]').classList.add('active');
                    prevBtn.disabled = true;
                    nextBtn.disabled = false;
                } else {
                    tab2.classList.add('active');
                    document.querySelector('.tab-btn[data-tab="tab2"]').classList.add('active');
                    prevBtn.disabled = false;
                    nextBtn.disabled = true;
                }
            }
            
            function switchToTab(tabId) {
                currentTab = tabId;
                updateTabs();
            }
            
            function resetAll() {
                fedDivInput.value = '';
                regDivInput.value = '';
                fedSaleInput.value = '';
                regSaleInput.value = '';
                
                divAnswered = false;
                saleAnswered = false;
                
                feedbackDiv.classList.add('hidden');
                feedbackSale.classList.add('hidden');
                finalMessage.classList.add('hidden');
            }
            
            function checkDividends() {
                if (divAnswered) return;
                
                const fedVal = parseFloat(fedDivInput.value.trim());
                const regValRaw = regDivInput.value.trim();
                
                let fedCorrect = false;
                let regCorrect = false;
                
                if (!isNaN(fedVal) && Math.abs(fedVal - correctFedDiv) < 0.01) {
                    fedCorrect = true;
                }
                const regEmptyOk = (regValRaw === '' || regValRaw === null || regValRaw === '0');
                if (regEmptyOk) {
                    regCorrect = true;
                } else if (!isNaN(parseFloat(regValRaw)) && Math.abs(parseFloat(regValRaw) - 0) < 0.01) {
                    regCorrect = true;
                }
                
                const overallCorrect = fedCorrect && regCorrect;
                
                feedbackDiv.classList.remove('hidden', 'correct', 'incorrect');
                if (overallCorrect) {
                    feedbackDiv.classList.add('correct');
                    feedbackDiv.innerHTML = fullDivExplanation;
                    divAnswered = true;
                } else {
                    feedbackDiv.classList.add('incorrect');
                    feedbackDiv.innerHTML = incorrectDivExplanation;
                }
                
                checkCompletion();
            }
            
            function checkSale() {
                if (saleAnswered) return;
                
                const fedVal = parseFloat(fedSaleInput.value.trim());
                const regVal = parseFloat(regSaleInput.value.trim());
                
                const fedCorrect = !isNaN(fedVal) && Math.abs(fedVal - correctFedSale) < 0.01;
                const regCorrect = !isNaN(regVal) && Math.abs(regVal - correctRegSale) < 0.01;
                const overallCorrect = fedCorrect && regCorrect;
                
                feedbackSale.classList.remove('hidden', 'correct', 'incorrect');
                if (overallCorrect) {
                    feedbackSale.classList.add('correct');
                    feedbackSale.innerHTML = fullSaleExplanation;
                    saleAnswered = true;
                } else {
                    feedbackSale.classList.add('incorrect');
                    feedbackSale.innerHTML = incorrectSaleExplanation;
                }
                
                checkCompletion();
            }
            
            function checkCompletion() {
                if (divAnswered && saleAnswered) {
                    finalMessage.classList.remove('hidden');
                    finalMessage.innerHTML = '✅ Все задания выполнены! Спасибо за работу!';
                } else {
                    finalMessage.classList.add('hidden');
                }
            }
            
            // Обработчики вкладок
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.getAttribute('data-tab');
                    switchToTab(tabId);
                });
            });
            
            // Кнопки навигации
            prevBtn.addEventListener('click', () => {
                if (currentTab === 'tab2') {
                    switchToTab('tab1');
                }
            });
            nextBtn.addEventListener('click', () => {
                if (currentTab === 'tab1') {
                    switchToTab('tab2');
                }
            });
            
            checkDivBtn.addEventListener('click', checkDividends);
            checkSaleBtn.addEventListener('click', checkSale);
            resetBtn.addEventListener('click', resetAll);
            
            updateTabs();
        })();
    </script>
</body>
</html>
