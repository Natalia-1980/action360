<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Чек-лист: статья 54.1 НК</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            max-width: 650px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            padding: 1.5rem 1.2rem;
            border: 1px solid #dee6f0;
            max-height: 90vh;
            overflow-y: auto;
        }

        h2 {
            font-weight: 500;
            font-size: 1.3rem;
            color: #1a344c;
            margin-bottom: 1rem;
            border-left: 4px solid #2e7ab3;
            padding-left: 0.8rem;
        }

        .block {
            background: #f9fcff;
            border-radius: 24px;
            border: 1px solid #c7daf5;
            margin-bottom: 1.2rem;
            overflow: hidden;
        }

        .block-header {
            background: #e2ecfe;
            padding: 0.8rem 1rem;
            font-weight: 600;
            color: #0d2f4e;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .block-header .indicator {
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .block-header.collapsed .indicator {
            transform: rotate(-90deg);
        }
        .block-content {
            padding: 0.8rem 1rem;
            border-top: 1px solid #d8e2f2;
            display: none;
        }
        .block-content.open {
            display: block;
        }

        .checklist-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .checklist-table td {
            padding: 0.6rem 0.3rem;
            border-bottom: 1px solid #e2eaf5;
            vertical-align: middle;
        }
        .checklist-table tr:last-child td {
            border-bottom: none;
        }
        .checklist-table td:first-child {
            width: 30px;
            text-align: center;
            font-weight: 500;
            color: #1a344c;
        }
        .checklist-table td:nth-child(2) {
            font-weight: 500;
            color: #1e3b5c;
        }
        .checklist-table td:last-child {
            text-align: center;
            width: 100px;
        }

        .yes-no-group {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }
        .yes-no-group label {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e3b5c;
        }
        .yes-no-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1e6bb8;
        }

        .explanation-block {
            background: #f0f7fe;
            border-radius: 20px;
            padding: 1rem;
            margin: 1rem 0;
            border-left: 4px solid #2e7ab3;
        }
        .explanation-block h4 {
            font-weight: 600;
            color: #0d2f4e;
            margin-bottom: 0.5rem;
        }
        .explanation-item {
            margin: 0.5rem 0;
            padding-left: 0.5rem;
            border-left: 2px solid #b9d3f0;
        }
        .explanation-item strong {
            color: #1e3b5c;
        }

        .result-box {
            background: #eefaee;
            border-radius: 20px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
            border: 1px solid #2b8c4a;
        }
        .result-box.high-risk {
            background: #fff2f2;
            border-color: #b13e3e;
        }
        .result-text {
            font-weight: 600;
            font-size: 1rem;
        }

        .button-row {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0 1rem;
        }
        .btn {
            background: white;
            border: 2px solid #1e3b5c;
            border-radius: 40px;
            padding: 0.6rem 2rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e3b5c;
            cursor: pointer;
            box-shadow: 0 3px 0 #b0c4dd;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b0c4dd;
        }
        .btn.primary {
            background: #1e3b5c;
            color: white;
            border-color: #0e2b44;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin: 1rem 0;
        }
        .nav-btn {
            background: white;
            border: 2px solid #1e3b5c;
            border-radius: 40px;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e3b5c;
            cursor: pointer;
            box-shadow: 0 2px 0 #b0c4dd;
        }
        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b0c4dd;
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {
            .card { padding: 1rem; }
            .yes-no-group label { font-size: 0.75rem; }
            .checklist-table td { padding: 0.5rem 0.2rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📋 Чек-лист: статья 54.1 НК</h2>
        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn" disabled>← Назад</button>
            <span style="font-weight:500; color:#1e3b5c;">Блок <span id="blockCounter">1</span>/3</span>
            <button class="nav-btn" id="nextBtn">Вперёд →</button>
        </div>

        <!-- Контейнер для текущего блока -->
        <div id="blockContainer"></div>

        <!-- Блок с пояснениями и результатом -->
        <div id="resultArea" class="hidden"></div>
    </div>

    <script>
        (function() {
            // Данные вопросов по блокам
            const blocks = [
                {
                    title: "✅ Блок 1. До заключения сделки (плановая проверка)",
                    items: [
                        "У сделки есть реальная деловая цель (не налоговая экономия)?",
                        "Вы можете чётко сказать, какой экономический результат хотите получить (прибыль, расширение, закупка, услуга)?",
                        "Налоговая экономия не является главной или единственной причиной сделки?",
                        "Вы рассматривали обычные рыночные альтернативы (не только схемы с низкими налогами)?",
                        "Контрагент реально существует (проверен по ЕГРЮЛ / ЕГРИП)?"
                    ]
                },
                {
                    title: "✅ Блок 2. Во время исполнения сделки (реальность операций)",
                    items: [
                        "Операция действительно произошла (товар отгружен, услуга оказана, работа выполнена)?",
                        "Вы не искажали реальные факты хозяйственной жизни?",
                        "Объекты налогообложения (доходы, расходы, имущество) отражены точно, без искажений?",
                        "Условия сделки исполнены реально (вами или тем, кому вы передали исполнение)?",
                        "Если исполнял не сам контрагент, а третье лицо — у него были законные полномочия?"
                    ]
                },
                {
                    title: "✅ Блок 3. Оформление документов (форма против содержания)",
                    items: [
                        "Содержание сделки соответствует её юридической форме (не притворная и не мнимая)?",
                        "Нет фиктивных операций (оплата без поставки, поставка без оплаты, акт без услуги)?",
                        "Все документы подписаны уполномоченными лицами (не неизвестными и не дисквалифицированными)?",
                        "У вас есть подтверждение реального исполнения (акты, накладные, платёжки, переписка)?",
                        "Вы можете объяснить налоговой, почему выбрали именно этого контрагента и такие условия?"
                    ]
                }
            ];

            let currentBlock = 0;
            let answers = { 0: [], 1: [], 2: [] };
            let blockCompleted = [false, false, false];

            // Инициализация ответов (все false)
            for (let i = 0; i < blocks.length; i++) {
                for (let j = 0; j < blocks[i].items.length; j++) {
                    if (answers[i][j] === undefined) answers[i][j] = null;
                }
            }

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const blockCounterSpan = document.getElementById('blockCounter');
            const blockContainer = document.getElementById('blockContainer');
            const resultArea = document.getElementById('resultArea');

            function renderBlock() {
                const block = blocks[currentBlock];
                blockCounterSpan.textContent = currentBlock + 1;
                
                let html = `<div class="block">
                    <div class="block-header">
                        <span>${block.title}</span>
                        <span class="indicator">▼</span>
                    </div>
                    <div class="block-content open">
                        <table class="checklist-table">
                `;
                
                block.items.forEach((item, idx) => {
                    const isChecked = answers[currentBlock][idx];
                    html += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${item}</td>
                            <td>
                                <div class="yes-no-group">
                                    <label><input type="radio" name="q${idx}" value="yes" ${isChecked === true ? 'checked' : ''}> Да</label>
                                    <label><input type="radio" name="q${idx}" value="no" ${isChecked === false ? 'checked' : ''}> Нет</label>
                                </div>
                            </td>
                         </tr>
                    `;
                });
                
                html += `</table>
                        <div class="button-row">
                            <button class="btn" id="checkBlockBtn">Сохранить блок</button>
                        </div>
                        <div id="blockFeedback" class="feedback hidden"></div>
                    </div>
                </div>`;
                
                blockContainer.innerHTML = html;
                
                // Сохраняем ответы при изменении
                for (let i = 0; i < block.items.length; i++) {
                    const radiosYes = document.querySelector(`input[name="q${i}"][value="yes"]`);
                    const radiosNo = document.querySelector(`input[name="q${i}"][value="no"]`);
                    if (radiosYes) {
                        radiosYes.addEventListener('change', (e) => {
                            if (e.target.checked) {
                                answers[currentBlock][i] = true;
                                if (blockCompleted[currentBlock]) {
                                    blockCompleted[currentBlock] = false;
                                    document.getElementById('blockFeedback').classList.add('hidden');
                                    document.getElementById('checkBlockBtn').textContent = 'Сохранить блок';
                                }
                            }
                        });
                    }
                    if (radiosNo) {
                        radiosNo.addEventListener('change', (e) => {
                            if (e.target.checked) {
                                answers[currentBlock][i] = false;
                                if (blockCompleted[currentBlock]) {
                                    blockCompleted[currentBlock] = false;
                                    document.getElementById('blockFeedback').classList.add('hidden');
                                    document.getElementById('checkBlockBtn').textContent = 'Сохранить блок';
                                }
                            }
                        });
                    }
                }
                
                document.getElementById('checkBlockBtn').addEventListener('click', () => {
                    saveBlock();
                });
                
                updateNavButtons();
            }
            
            function saveBlock() {
                const block = blocks[currentBlock];
                let allAnswered = true;
                for (let i = 0; i < block.items.length; i++) {
                    if (answers[currentBlock][i] === null) {
                        allAnswered = false;
                        break;
                    }
                }
                
                if (!allAnswered) {
                    alert('Ответьте на все вопросы блока');
                    return;
                }
                
                blockCompleted[currentBlock] = true;
                const feedbackDiv = document.getElementById('blockFeedback');
                feedbackDiv.classList.remove('hidden');
                feedbackDiv.classList.add('correct');
                feedbackDiv.innerHTML = '✅ Блок сохранён! Переходите к следующему.';
                
                updateNavButtons();
                
                // Проверяем, все ли блоки завершены
                const allCompleted = blockCompleted.every(v => v === true);
                if (allCompleted) {
                    showResult();
                }
            }
            
            function showResult() {
                // Подсчитываем количество "Нет"
                let hasNo = false;
                for (let b = 0; b < blocks.length; b++) {
                    for (let i = 0; i < blocks[b].items.length; i++) {
                        if (answers[b][i] === false) {
                            hasNo = true;
                            break;
                        }
                    }
                    if (hasNo) break;
                }
                
                const isLowRisk = !hasNo;
                
                let resultHtml = `
                    <div class="explanation-block">
                        <h4>❌ Что НЕ является нарушением (даже если налоговая на это укажет)</h4>
                        <div class="explanation-item">
                            <strong>Договор подписан неустановленным лицом</strong><br>
                            «Мы проверили полномочия на момент подписания, вот подтверждение»
                        </div>
                        <div class="explanation-item">
                            <strong>Контрагент не платит налоги</strong><br>
                            «Мы не обязаны отвечать за налоговую дисциплину контрагента»
                        </div>
                        <div class="explanation-item">
                            <strong>Тот же результат можно было получить другой сделкой</strong><br>
                            «Закон не запрещает выбор структуры сделки»
                        </div>
                    </div>
                `;
                
                if (isLowRisk) {
                    resultHtml += `
                        <div class="result-box">
                            <div class="result-text">✅ Результат чек-листа: риск низкий</div>
                            <div style="margin-top:0.3rem; font-size:0.85rem;">Вы действуете добросовестно. Все ответы «Да» в блоках 1–3.</div>
                        </div>
                    `;
                } else {
                    resultHtml += `
                        <div class="result-box high-risk">
                            <div class="result-text">⚠️ Результат чек-листа: высокий риск</div>
                            <div style="margin-top:0.3rem; font-size:0.85rem;">Хотя бы один ответ «Нет». Нужно пересмотреть сделку или документы.</div>
                        </div>
                    `;
                }
                
                resultArea.innerHTML = resultHtml;
                resultArea.classList.remove('hidden');
                blockContainer.classList.add('hidden');
                nextBtn.classList.add('hidden');
                prevBtn.classList.add('hidden');
            }
            
            function updateNavButtons() {
                prevBtn.disabled = (currentBlock === 0);
                if (currentBlock === blocks.length - 1) {
                    nextBtn.textContent = 'Завершить';
                } else {
                    nextBtn.textContent = 'Вперёд →';
                }
            }
            
            function goToBlock(delta) {
                const newBlock = currentBlock + delta;
                if (newBlock >= 0 && newBlock < blocks.length) {
                    currentBlock = newBlock;
                    renderBlock();
                } else if (newBlock === blocks.length) {
                    // Проверяем, все ли блоки завершены
                    const allCompleted = blockCompleted.every(v => v === true);
                    if (allCompleted) {
                        showResult();
                    } else {
                        alert('Пожалуйста, завершите текущий блок (нажмите «Сохранить блок»).');
                    }
                }
            }
            
            prevBtn.addEventListener('click', () => goToBlock(-1));
            nextBtn.addEventListener('click', () => goToBlock(1));
            
            renderBlock();
        })();
    </script>
</body>
</html>
