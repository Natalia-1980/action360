<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Памятка | Как стать резидентом и отчетность</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #e6e9ef;
            font-family: 'Inter', sans-serif;
            padding: 0.8rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrapper {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
        }
        .header {
            background: #3a4a55;
            padding: 0.7rem 1rem;
            color: white;
        }
        .header h1 {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .badge {
            background: #6c7a89;
            color: #ffffff;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            font-size: 0.55rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 0.2rem;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem 0.7rem 0.8rem;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        .nav-btn {
            background: #5a6e7c;
            border: none;
            color: white;
            font-size: 0.9rem;
            width: 30px;
            height: 30px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            transition: 0.15s;
        }
        .nav-btn:hover {
            background: #3a4a55;
        }
        .dots-group {
            display: flex;
            gap: 5px;
            background: #eef2f6;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #b9c4ce;
            border-radius: 6px;
            transition: 0.2s;
            cursor: pointer;
        }
        .dot.active {
            background: #5a6e7c;
            width: 18px;
        }
        .counter {
            font-size: 0.6rem;
            font-weight: 600;
            color: #5a6e7c;
        }
        .tab-content {
            padding: 1rem 0.9rem;
            background: #ffffff;
        }
        .section {
            margin-bottom: 1rem;
            border-left: 3px solid #8a9ba8;
            padding-left: 0.8rem;
        }
        .section-title {
            font-weight: 800;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            color: #4a5b68;
        }
        .list {
            list-style: none;
            padding-left: 0;
        }
        .list li {
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            line-height: 1.35;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }
        .list li::before {
            content: "•";
            font-weight: 800;
            color: #6c7a89;
        }
        .subnote {
            font-size: 0.65rem;
            background: #f0f3f7;
            padding: 0.35rem 0.7rem;
            border-radius: 20px;
            margin-top: 0.5rem;
            color: #4a5b68;
        }
        .territory-name {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #eef2f6;
            padding: 0.35rem 0.7rem;
            border-radius: 30px;
            margin-bottom: 0.8rem;
            font-weight: 700;
            font-size: 0.8rem;
            color: #2c3e47;
        }
        hr {
            margin: 0.8rem 0;
            border: none;
            height: 1px;
            background: #e2e8f0;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="header">
            <h1>📋 Как стать резидентом</h1>
            <div class="badge">ТОР / ОЭЗ / СПВ / Сколково</div>
        </div>
        <div id="contentContainer" class="tab-content"></div>
        <div class="nav-bar" id="navBar"></div>
    </div>
</div>

<script>
    const territories = [
        {
            name: "ТОР и МТОР",
            icon: "🏭",
            items: [
                "Регистрация юрлица или ИП на территории ТОР/МТОР (кроме гос/мун унитарных предприятий).",
                "Инвестиции: от 500 тыс. руб. (стандарт) до 500 млн руб. (для моногородов/МТОР за 3 года).",
                "Запрещены: добыча нефти/газа, подакцизные товары (кроме авто), трейдинг.",
                "Подача заявки онлайн через КРДВ (или УК). Решение за 15 рабочих дней.",
                "Статус резидента — с даты внесения записи в реестр (п.12 ст.13 №473-ФЗ)."
            ],
            report: "Ежеквартально: отчет УК о выполнении соглашения (инвестиции, рабочие места). Ежегодно: расчет капвложений и НИОКР. В ФНС: декларации по налогу на прибыль, НДС, зарплатная отчетность, персведения в общем порядке. В СФР: раздел 2 ЕФС-1."
        },
        {
            name: "ОЭЗ",
            icon: "🏗️",
            items: [
                "Типы: ППТ (инвестиции от 150 млн руб.), ТВТ (от 1 млн), ТРТ (от 5 млн), портовая (от 5 млн).",
                "Подача заявки в Минэкономразвития / региональную УК.",
                "Бизнес-план с оценкой ≥150 баллов (экспертный совет).",
                "Заключение соглашения на срок до 49 лет (ОЭЗ создается на 49 лет).",
                "Запрещена добыча полезных ископаемых (кроме минеральных вод и лечебных ресурсов)."
            ],
            report: "Стандартные налоговые отчеты + раздельный учет доходов/расходов в ОЭЗ. Ежегодно: подтверждение пропорции доходов (≥90% от основного вида). Отчет в УК до 1 апреля."
        },
        {
            name: "СПВ",
            icon: "🚢",
            items: [
                "Регистрация в одном из 22 муниципалитетов (Приморье, Камчатка, Хабаровский край, Сахалин, Чукотка).",
                "Инвестиции: от 500 тыс. руб. за 3 года.",
                "Запрещены: добыча нефти/газа, подакцизные товары (кроме авто/топливо).",
                "Онлайн-заявка через КРДВ. Решение за 15 рабочих дней. Статус — с даты внесения в реестр (п.12 ст.11 №212-ФЗ).",
                "Новые резиденты (после 1.04.2026) должны соблюдать соотношение капвложений и налоговой экономии (ТВмакс). Переходный период — 3 года."
            ],
            report: "Ежеквартальный отчет УК (КРДВ) — до 20 числа следующего месяца. Годовой отчет до 1 апреля. В ФНС: декларации по налогу на прибыль, НДС, зарплатная отчетность, персведения в общем порядке. В СФР: раздел 2 ЕФС-1."
        },
        {
            name: "Сколково",
            icon: "⚡",
            items: [
                "Подача заявки на сайте Фонда «Сколково» (sk.ru). Требования: юрлицо с ОКВЭД 72.",
                "Экспертиза инновационности, научно-техническая экспертиза.",
                "Решение в течение 10 дней (для МТК — 6 дней). Включение в реестр участников.",
                "Статус дается на 10 лет. Обязательство соблюдать лимит выручки: не более 1 млрд руб. в год."
            ],
            report: "Ежегодная отчетность в Фонд (НИОКР, результаты, финсостояние). Квартальные/полугодовые отчеты. В ФНС: нет деклараций по НДС и налогу на прибыль, зарплатная отчетность в общем порядке."
        },
        {
            name: "Отчетность по ст. 56.1 НК",
            icon: "📊",
            items: [
                "Резиденты ТОР, ОЭЗ, СПВ, Сколково обязаны ежегодно сдавать в ИФНС расчет налоговой экономии (ТВмакс).",
                "Срок подачи — не позднее 25 марта года, следующего за отчетным.",
                "В расчете сравниваются: налог по общим ставкам минус фактический налог по льготным ставкам.",
                "Крупнейшие налогоплательщики сдают по месту регистрации в качестве крупнейшего.",
                "Без расчета ТВмакс налоговые льготы могут быть приостановлены."
            ],
            report: "Расчет ТВмакс + бухотчетность с отметкой налоговиков (для ТОР/СПВ)."
        }
    ];

    let currentIdx = 0;
    const contentContainer = document.getElementById("contentContainer");
    const navBar = document.getElementById("navBar");

    function renderContent() {
        const t = territories[currentIdx];
        const itemsHtml = t.items.map(item => `<li>${item}</li>`).join('');
        
        let specialNote = "";
        if (t.name === "СПВ") specialNote = `<div class="subnote" style="background:#fff0e6;">⚠️ Важно: для резидентов СПВ после 1.04.2026 — контроль соотношения капвложений и налоговой экономии (ТВмакс). Переходный период 3 года.</div>`;
        if (t.name === "Сколково") specialNote = `<div class="subnote" style="background:#fff0e6;">⚠️ Важно: лимит выручки 1 млрд руб. Превышение → потеря льгот.</div>`;
        if (t.name === "Отчетность по ст. 56.1 НК") specialNote = `<div class="subnote" style="background:#e8f3ed;">📌 Новое требование с 2026 года. Несдача расчета → риск приостановления льгот.</div>`;

        const html = `
            <div class="territory-name"><span>${t.icon}</span> ${t.name}</div>
            <div class="section">
                <div class="section-title">📌 Условия получения статуса</div>
                <ul class="list">${itemsHtml}</ul>
            </div>
            <div class="section">
                <div class="section-title">📊 Отчетность</div>
                <ul class="list"><li>${t.report}</li></ul>
            </div>
            ${specialNote}
            <div class="subnote">💡 Ведите раздельный учет операций по льготной территории. Храните документы 5 лет.</div>
        `;
        contentContainer.innerHTML = html;
        updateDots();
    }

    function updateDots() {
        const dotsContainer = document.getElementById("dotsGroup");
        if (!dotsContainer) return;
        dotsContainer.innerHTML = territories.map((_, i) => `<div class="dot ${i === currentIdx ? 'active' : ''}" data-idx="${i}"></div>`).join('');
        document.querySelectorAll("#dotsGroup .dot").forEach(dot => {
            dot.addEventListener("click", (e) => {
                const idx = parseInt(e.currentTarget.getAttribute("data-idx"));
                if (!isNaN(idx) && idx !== currentIdx) { currentIdx = idx; renderContent(); }
            });
        });
        const counterSpan = document.getElementById("counterSpan");
        if (counterSpan) counterSpan.innerText = `${currentIdx+1}/${territories.length}`;
    }

    function setupNav() {
        navBar.innerHTML = `
            <button class="nav-btn" id="prevBtn">←</button>
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="dots-group" id="dotsGroup"></div>
                <span class="counter" id="counterSpan"></span>
            </div>
            <button class="nav-btn" id="nextBtn">→</button>
        `;
        document.getElementById("prevBtn")?.addEventListener("click", () => {
            currentIdx = (currentIdx - 1 + territories.length) % territories.length;
            renderContent();
        });
        document.getElementById("nextBtn")?.addEventListener("click", () => {
            currentIdx = (currentIdx + 1) % territories.length;
            renderContent();
        });
        renderContent();
    }

    setupNav();
</script>
</body>
</html>
